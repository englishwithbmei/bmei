voc:[["next week","ph","/nekst wiːk/","tuần sau","I'm busy next week.","Tuần sau mình bận."],["next month","ph","/nekst mʌnθ/","tháng sau","We're moving next month.","Tháng sau bọn mình chuyển nhà."],["schedule","n","/ˈskedʒuːl/","lịch trình","My schedule is full this week.","Tuần này lịch của mình kín rồi."],["free time","ph","/ˌfriː ˈtaɪm/","thời gian rảnh","What do you do in your free time?","Lúc rảnh bạn làm gì?"],["calendar","n","/ˈkæləndɚ/","lịch","I write my plans on a calendar.","Mình ghi kế hoạch lên lịch."],["arrange","v","/əˈreɪndʒ/","sắp xếp","Let's arrange a meeting.","Hãy sắp xếp một buổi gặp."],["organize","v","/ˈɔːrɡənaɪz/","tổ chức","We're organizing a party.","Bọn mình đang tổ chức một bữa tiệc."],["cancel","v","/ˈkænsəl/","hủy","They canceled the trip.","Họ đã hủy chuyến đi."],["postpone","v","/poʊstˈpoʊn/","hoãn lại","The meeting was postponed.","Cuộc họp bị hoãn."],["expect","v","/ɪkˈspekt/","mong đợi","I expect to finish by Friday.","Mình mong xong trước thứ Sáu."],["intend","v","/ɪnˈtend/","dự định","I intend to study abroad.","Mình dự định đi du học."],["wish","v","/wɪʃ/","ước","I wish you good luck.","Chúc bạn may mắn."],["if","conj","/ɪf/","nếu","If it rains, I'll stay home.","Nếu trời mưa, mình sẽ ở nhà."],["unless","conj","/ənˈles/","trừ khi, nếu không","Unless you hurry, you'll be late.","Nếu không nhanh lên, bạn sẽ muộn."],["definitely","adv","/ˈdefɪnətli/","chắc chắn","I'll definitely come.","Mình chắc chắn sẽ đến."],["perhaps","adv","/pɚˈhæps/","có lẽ","Perhaps we'll go to Da Lat.","Có lẽ bọn mình sẽ đi Đà Lạt."],["someday","adv","/ˈsʌmdeɪ/","một ngày nào đó","Someday I'll visit Japan.","Một ngày nào đó mình sẽ đi Nhật."],["retire","v","/rɪˈtaɪɚ/","nghỉ hưu","My father will retire next year.","Bố mình sẽ nghỉ hưu năm sau."],["move","v","/muːv/","chuyển (nhà, chỗ ở)","We plan to move to Da Nang.","Bọn mình định chuyển đến Đà Nẵng."],["business","n","/ˈbɪznɪs/","việc kinh doanh","She wants to start her own business.","Cô ấy muốn tự kinh doanh."],["own","adj","/oʊn/","của riêng","I want my own house.","Mình muốn có nhà riêng."],["license","n","/ˈlaɪsəns/","giấy phép, bằng (lái)","I'm going to get a driver's license.","Mình sẽ thi bằng lái xe."],["course","n","/kɔːrs/","khóa học","I signed up for an English course.","Mình đã đăng ký một khóa tiếng Anh."],["achieve","v","/əˈtʃiːv/","đạt được","You can achieve your goal.","Bạn có thể đạt được mục tiêu."],["succeed","v","/səkˈsiːd/","thành công","If you work hard, you'll succeed.","Nếu chăm chỉ, bạn sẽ thành công."],["fail","v","/feɪl/","thất bại, trượt","Don't be afraid to fail.","Đừng sợ thất bại."],["pass","v","/pæs/","đỗ, vượt qua","I hope I pass the test.","Mình mong sẽ đỗ bài thi."],["decision","n","/dɪˈsɪʒən/","quyết định","It was a hard decision.","Đó là một quyết định khó khăn."],["chance","n","/tʃæns/","cơ hội","This is a great chance for you.","Đây là cơ hội tuyệt vời cho bạn."],["save money","ph","/seɪv ˈmʌni/","tiết kiệm tiền","I'm trying to save money.","Mình đang cố tiết kiệm tiền."]],
gr:{t:"Câu điều kiện loại 1",e:"Dùng cho điều <b>có thể xảy ra</b> ở hiện tại hoặc tương lai. Mệnh đề <b>If</b> dùng <b>hiện tại đơn</b>, mệnh đề chính dùng <b>will + V</b>. Lỗi người Việt hay sai: dùng will trong mệnh đề If (If it will rain ✗).",f:["If + S + V (hiện tại đơn), S + will + V","If it rains, I will stay home.","Mệnh đề If có thể đứng sau (không cần dấu phẩy): I will call you if I have time.","unless = if … not → Unless you study, you will fail.","Sai: If it will rain… → Đúng: If it rains…"],s:[["If I have time this weekend, I will visit my grandparents.","Nếu cuối tuần có thời gian, mình sẽ về thăm ông bà."],["If you study every day, you will pass the IELTS test.","Nếu học mỗi ngày, bạn sẽ đỗ IELTS."],["I won't go out if it rains.","Nếu trời mưa mình sẽ không ra ngoài."],["Unless we leave now, we will miss the bus.","Nếu không đi ngay, chúng ta sẽ lỡ xe buýt."]]},
col:[["make plans","lên kế hoạch","Let's make plans for the summer."],["have plans","có hẹn, có kế hoạch","Sorry, I have plans tonight."],["change your mind","đổi ý","If you change your mind, call me."],["take a course","học một khóa","I'm going to take an English course."],["achieve a goal","đạt mục tiêu","Work hard to achieve your goal."],["set a goal","đặt mục tiêu","I set a goal to learn 30 words a day."]],
q:[["If it ___ tomorrow, we will stay home.",["rains","will rain","rained"],0,"Mệnh đề If dùng hiện tại đơn."],["If you study hard, you ___ pass.",["would","will","are"],1,"Mệnh đề chính: will + V."],["___ you hurry, you'll be late.",["If","Unless","When"],1,"Unless = if not."],["“Đổi ý” là…",["change your idea","change your mind","turn your mind"],1,"change your mind."],["Từ nào có âm /uː/ dài?",["full","pool","look"],1,"pool /puːl/."],["I ___ call you if I finish early.",["will","am","do"],0,"Mệnh đề chính: will + V."]]},

{t:"Ngày lễ & lễ hội",goal:"Kể về Tết, sinh nhật và các lễ hội; đặt câu hỏi Wh- để hỏi chuyện.",
snd:{t:"Âm /θ/ và /t/",tip:"/θ/: đặt đầu lưỡi giữa hai răng rồi thổi hơi (three, thank). /t/: đầu lưỡi chạm lợi trên rồi bật ra (tree, tank). Người Việt hay đọc three thành “tree” — chú ý đưa lưỡi ra nhé.",p:[["thank","tank"],["three","tree"],["thin","tin"],["thought","taught"],["both","boat"],["path","pat"]]},
voc:[["celebrate","v","/ˈseləbreɪt/","ăn mừng, tổ chức","We celebrate Tet with our family.","Bọn mình đón Tết cùng gia đình."],["festival","n","/ˈfestɪvəl/","lễ hội","Hue has a famous festival.","Huế có một lễ hội nổi tiếng."],["Lunar New Year","ph","/ˌluːnɚ nuː ˈjɪr/","Tết Nguyên Đán","Lunar New Year is in January or February.","Tết Nguyên Đán rơi vào tháng Một hoặc tháng Hai."],["lucky money","ph","/ˈlʌki ˈmʌni/","tiền lì xì","Kids love getting lucky money.","Trẻ con thích được lì xì."],["red envelope","ph","/red ˈenvəloʊp/","bao lì xì","The money is in a red envelope.","Tiền được để trong bao lì xì."],["fireworks","n","/ˈfaɪɚwɝːks/","pháo hoa","We watched fireworks at midnight.","Bọn mình xem pháo hoa lúc nửa đêm."],["decorate","v","/ˈdekəreɪt/","trang trí","We decorate the house with flowers.","Bọn mình trang trí nhà bằng hoa."],["decoration","n","/ˌdekəˈreɪʃən/","đồ trang trí","The decorations look beautiful.","Đồ trang trí trông rất đẹp."],["tradition","n","/trəˈdɪʃən/","truyền thống","It's a family tradition.","Đó là truyền thống gia đình."],["traditional","adj","/trəˈdɪʃənəl/","thuộc truyền thống","Banh chung is a traditional food.","Bánh chưng là món ăn truyền thống."],["custom","n","/ˈkʌstəm/","phong tục","Every country has its own customs.","Mỗi nước có phong tục riêng."],["gift","n","/ɡɪft/","món quà","Thank you for the gift!","Cảm ơn món quà nhé!"],["party","n","/ˈpɑːrti/","bữa tiệc","Are you coming to the party?","Bạn có đến bữa tiệc không?"],["birthday","n","/ˈbɝːθdeɪ/","sinh nhật","When is your birthday?","Sinh nhật bạn là khi nào?"],["cake","n","/keɪk/","bánh ngọt","Mom made a birthday cake.","Mẹ làm bánh sinh nhật."],["candle","n","/ˈkændəl/","cây nến","Blow out the candles!","Thổi nến đi!"],["guest","n","/ɡest/","khách","We invited thirty guests.","Bọn mình mời ba mươi khách."],["wedding","n","/ˈwedɪŋ/","đám cưới","My cousin's wedding is next month.","Đám cưới chị họ mình vào tháng sau."],["anniversary","n","/ˌænɪˈvɝːsəri/","ngày kỷ niệm","Today is our wedding anniversary.","Hôm nay là kỷ niệm ngày cưới của bọn mình."],["Christmas","n","/ˈkrɪsməs/","Giáng sinh","The streets are beautiful at Christmas.","Đường phố rất đẹp vào dịp Giáng sinh."],["Mid-Autumn Festival","ph","/ˌmɪd ˈɑːtəm ˌfestɪvəl/","Tết Trung thu","Children love the Mid-Autumn Festival.","Trẻ em thích Tết Trung thu."],["lantern","n","/ˈlæntɚn/","đèn lồng","The kids carry colorful lanterns.","Bọn trẻ cầm đèn lồng nhiều màu."],["mooncake","n","/ˈmuːnkeɪk/","bánh trung thu","We eat mooncakes and drink tea.","Bọn mình ăn bánh trung thu và uống trà."],["ancestor","n","/ˈænsestɚ/","tổ tiên","We pray to our ancestors at Tet.","Tết, bọn mình cúng tổ tiên."],["special","adj","/ˈspeʃəl/","đặc biệt","Tet is a special time for families.","Tết là dịp đặc biệt của các gia đình."],["exciting","adj","/ɪkˈsaɪtɪŋ/","thú vị, sôi động","The festival was really exciting.","Lễ hội thật sôi động."],["when","adv","/wen/","khi nào","When do you celebrate Tet?","Bạn đón Tết khi nào?"],["where","adv","/wer/","ở đâu","Where did you go last Tet?","Tết vừa rồi bạn đi đâu?"],["why","adv","/waɪ/","tại sao","Why do you like Tet?","Tại sao bạn thích Tết?"],["how","adv","/haʊ/","như thế nào","How do you celebrate your birthday?","Bạn tổ chức sinh nhật thế nào?"]],
gr:{t:"Câu hỏi Wh-",e:"Câu hỏi Wh- dùng để hỏi thông tin. Trật tự: <b>Wh- + trợ động từ (do/does/did/is/are…) + chủ ngữ + động từ</b>. Câu hỏi Wh- thường <b>xuống giọng</b> ↘ ở cuối.",f:["What (cái gì) · Where (ở đâu) · When (khi nào) · Who (ai) · Why (tại sao) · How (thế nào)","Wh- + do/does + S + V? → What do you do at Tet?","Wh- + did + S + V? (quá khứ) → Where did you go last Tet?","Wh- + be + S? → When is your birthday?","How long / How much / How many / How often → How often do you visit your grandparents?"],s:[["What do Vietnamese people do at Tet?","Người Việt làm gì vào dịp Tết?"],["Where did you celebrate your last birthday?","Sinh nhật vừa rồi bạn tổ chức ở đâu?"],["Why do children love the Mid-Autumn Festival?","Tại sao trẻ em thích Tết Trung thu?"],["How much lucky money did you get?","Bạn nhận được bao nhiêu tiền lì xì?"]]},
col:[["celebrate a birthday","tổ chức sinh nhật","We celebrated her birthday at home."],["give lucky money","lì xì","Grandparents give lucky money to kids."],["make a wish","ước điều gì","Blow out the candles and make a wish!"],["throw a party","tổ chức tiệc","Let's throw a party for Mom."],["watch fireworks","xem pháo hoa","We watched fireworks on New Year's Eve."],["visit relatives","thăm họ hàng","At Tet, we visit relatives."]],
q:[["___ is your birthday? – In May.",["Where","When","Who"],1,"Hỏi thời gian → When."],["___ did you go last Tet? – To Hue.",["Where","What","Why"],0,"Hỏi nơi chốn → Where."],["What ___ you do at Tet?",["does","do","are"],1,"What + do + you + V?"],["“Ước điều gì” là…",["do a wish","make a wish","take a wish"],1,"make a wish."],["Từ nào có âm /θ/?",["tank","tree","three"],2,"three /θriː/."],["___ often do you visit your grandparents?",["What","How","When"],1,"How often = bao lâu một lần."]]},

{t:"Kỷ niệm & trải nghiệm",goal:"Kể kỷ niệm tuổi thơ và trải nghiệm đã qua bằng Quá khứ đơn và Quá khứ tiếp diễn.",
snd:{t:"Âm /ɝː/ và /ɑːr/ (giọng Mỹ)",tip:"/ɝː/: miệng mở vừa, cong lưỡi lên như đọc “ơ” kèm r (bird, heard). /ɑːr/: mở to miệng “a” rồi mới cong lưỡi (bard, hard). Cả hai đều phải nghe rõ âm r — đặc trưng giọng Mỹ.",p:[["heard","hard"],["bird","bard"],["fur","far"],["firm","farm"],["curt","cart"],["burn","barn"]]},
voc:[["memory","n","/ˈmeməri/","kỷ niệm; trí nhớ","I have many happy memories.","Mình có nhiều kỷ niệm vui."],["remember","v","/rɪˈmembɚ/","nhớ","I remember my first day at school.","Mình nhớ ngày đầu tiên đi học."],["forget","v","/fɚˈɡet/","quên","I'll never forget that day.","Mình sẽ không bao giờ quên ngày đó."],["childhood","n","/ˈtʃaɪldhʊd/","tuổi thơ","I had a happy childhood.","Mình có một tuổi thơ hạnh phúc."],["moment","n","/ˈmoʊmənt/","khoảnh khắc","It was a special moment.","Đó là một khoảnh khắc đặc biệt."],["happen","v","/ˈhæpən/","xảy ra","What happened yesterday?","Hôm qua đã xảy ra chuyện gì?"],["accident","n","/ˈæksɪdənt/","tai nạn","He had an accident on his way home.","Anh ấy gặp tai nạn trên đường về."],["suddenly","adv","/ˈsʌdənli/","đột nhiên","Suddenly, it started to rain.","Đột nhiên trời đổ mưa."],["while","conj","/waɪl/","trong khi","While I was cooking, the phone rang.","Khi mình đang nấu ăn thì điện thoại reo."],["during","prep","/ˈdʊrɪŋ/","trong suốt","I visited Hue during the summer.","Mình đi Huế trong mùa hè."],["once","adv","/wʌns/","một lần; đã từng","I once saw a famous singer.","Mình từng gặp một ca sĩ nổi tiếng."],["used to","ph","/ˈjuːst tə/","đã từng (thói quen cũ)","I used to live in the countryside.","Mình từng sống ở quê."],["grow up","ph","/ɡroʊ ʌp/","lớn lên","I grew up in Nam Dinh.","Mình lớn lên ở Nam Định."],["primary school","ph","/ˈpraɪmeri skuːl/","trường tiểu học","My primary school was near my house.","Trường tiểu học của mình gần nhà."],["village","n","/ˈvɪlɪdʒ/","ngôi làng","My grandparents live in a small village.","Ông bà mình sống ở một ngôi làng nhỏ."],["neighborhood","n","/ˈneɪbɚhʊd/","khu phố","There were many kids in my neighborhood.","Khu phố mình có nhiều trẻ con."],["scared","adj","/skerd/","sợ hãi","I was scared of dogs.","Mình từng sợ chó."],["embarrassed","adj","/ɪmˈberəst/","xấu hổ","I was so embarrassed when I fell.","Mình xấu hổ lắm khi bị ngã."],["excited","adj","/ɪkˈsaɪtɪd/","hào hứng","I was excited about my first flight.","Mình rất hào hứng với chuyến bay đầu tiên."],["nervous","adj","/ˈnɝːvəs/","hồi hộp, lo lắng","I was nervous before the exam.","Mình hồi hộp trước kỳ thi."],["unforgettable","adj","/ˌʌnfɚˈɡetəbəl/","khó quên","It was an unforgettable trip.","Đó là một chuyến đi khó quên."],["fall → fell","v","/fɑːl/ → /fel/","ngã → đã ngã","I fell off my bike.","Mình bị ngã xe đạp."],["break → broke","v","/breɪk/ → /broʊk/","làm vỡ, gãy → đã làm vỡ","I broke my mom's favorite cup.","Mình làm vỡ cái cốc mẹ thích nhất."],["lose → lost","v","/luːz/ → /lɑːst/","làm mất → đã làm mất","I lost my wallet last year.","Năm ngoái mình làm mất ví."],["find → found","v","/faɪnd/ → /faʊnd/","tìm thấy → đã tìm thấy","Luckily, I found it the next day.","May là hôm sau mình tìm thấy."],["ride","v","/raɪd/","đi (xe đạp, xe máy)","I learned to ride a bike at six.","Mình học đi xe đạp lúc 6 tuổi."],["bicycle","n","/ˈbaɪsɪkəl/","xe đạp","My first bicycle was red.","Chiếc xe đạp đầu tiên của mình màu đỏ."],["photo album","ph","/ˈfoʊtoʊ ˌælbəm/","album ảnh","We looked at the old photo album.","Bọn mình xem lại album ảnh cũ."],["kite","n","/kaɪt/","con diều","We made a kite from paper.","Bọn mình làm diều bằng giấy."],["rice field","ph","/ˈraɪs fiːld/","cánh đồng lúa","We played in the rice fields.","Bọn mình chơi ngoài đồng lúa."]],
gr:{t:"Thì Quá khứ tiếp diễn",e:"Dùng cho hành động <b>đang diễn ra</b> tại một thời điểm trong quá khứ, hoặc đang diễn ra thì có hành động khác <b>xen vào</b>. Hành động xen vào dùng Quá khứ đơn. Xem thêm Module 3 trong sách sơ đồ tư duy.",f:["S + was/were + V-ing → I was watching TV at 8 p.m.","I / He / She / It → was · You / We / They → were","QKTD + when + QKĐ → I was riding my bike when I fell.","While + QKTD, QKĐ → While we were playing, it started to rain.","Dấu hiệu: at 8 p.m. yesterday, at that time, while, when"],s:[["At eight o'clock last night, I was watching TV.","Lúc 8 giờ tối qua, mình đang xem TV."],["I was riding my bicycle when I fell.","Mình đang đạp xe thì bị ngã."],["While we were playing in the rice field, it started to rain.","Khi bọn mình đang chơi ngoài đồng thì trời đổ mưa."],["What were you doing at this time yesterday?","Giờ này hôm qua bạn đang làm gì?"]]},
col:[["bring back memories","gợi lại kỷ niệm","This song brings back memories."],["have a good memory","có trí nhớ tốt","My grandma has a good memory."],["fly a kite","thả diều","We used to fly kites in summer."],["grow up in","lớn lên ở","I grew up in a small village."],["have an accident","gặp tai nạn","He had an accident last year."],["at that time","vào lúc đó","At that time, I was only ten."]],

{t:"Tình huống thực tế",goal:"Giao tiếp ở nhà hàng, sân bay, khách sạn, quán cà phê bằng câu đề nghị lịch sự.",

voc:[["restaurant","n","/ˈrestərɑːnt/","nhà hàng","Let's try that new restaurant.","Thử nhà hàng mới đó đi."],["waiter","n","/ˈweɪtɚ/","nhân viên phục vụ","The waiter brought our food.","Phục vụ mang đồ ăn ra."],["reserve","v","/rɪˈzɝːv/","đặt trước","I'd like to reserve a table.","Tôi muốn đặt bàn trước."],["reservation","n","/ˌrezɚˈveɪʃən/","sự đặt chỗ","I have a reservation for two.","Tôi đã đặt chỗ cho hai người."],["airport","n","/ˈerpɔːrt/","sân bay","We arrived at the airport early.","Bọn mình đến sân bay sớm."],["passport","n","/ˈpæspɔːrt/","hộ chiếu","Don't forget your passport.","Đừng quên hộ chiếu."],["flight","n","/flaɪt/","chuyến bay","Our flight is at ten.","Chuyến bay của bọn mình lúc 10 giờ."],["boarding pass","ph","/ˈbɔːrdɪŋ pæs/","thẻ lên máy bay","Here's your boarding pass.","Đây là thẻ lên máy bay của anh/chị."],["gate","n","/ɡeɪt/","cửa ra máy bay","Please go to gate 12.","Vui lòng đến cửa số 12."],["luggage","n","/ˈlʌɡɪdʒ/","hành lý","How much luggage do you have?","Anh/chị có bao nhiêu hành lý?"],["check in","ph","/tʃek ɪn/","làm thủ tục; nhận phòng","We need to check in two hours early.","Phải làm thủ tục trước hai tiếng."],["check out","ph","/tʃek aʊt/","trả phòng","Check-out time is at noon.","Giờ trả phòng là 12 giờ trưa."],["receptionist","n","/rɪˈsepʃənɪst/","lễ tân","The receptionist was very helpful.","Lễ tân rất nhiệt tình."],["single room","ph","/ˈsɪŋɡəl ruːm/","phòng đơn","I'd like a single room, please.","Cho tôi một phòng đơn."],["double room","ph","/ˈdʌbəl ruːm/","phòng đôi","Is there a double room available?","Còn phòng đôi không?"],["key card","ph","/ˈkiː kɑːrd/","thẻ phòng","Here's your key card.","Đây là thẻ phòng của anh/chị."],["café","n","/kæˈfeɪ/","quán cà phê","Let's meet at the café.","Gặp nhau ở quán cà phê nhé."],["iced coffee","ph","/ˌaɪst ˈkɑːfi/","cà phê đá","One iced coffee with milk, please.","Cho một cà phê sữa đá."],["to go","ph","/tə ɡoʊ/","mang đi","Two coffees to go, please.","Cho hai cà phê mang đi."],["receipt","n","/rɪˈsiːt/","biên lai, hóa đơn","Can I have a receipt?","Cho tôi xin hóa đơn."],["cash","n","/kæʃ/","tiền mặt","I'll pay in cash.","Tôi trả tiền mặt."],["credit card","ph","/ˈkredɪt kɑːrd/","thẻ tín dụng","Do you take credit cards?","Ở đây có nhận thẻ tín dụng không?"],["change","n","/tʃeɪndʒ/","tiền thừa","Here's your change.","Tiền thừa của anh/chị đây."],["would like","ph","/wʊd laɪk/","muốn (lịch sự)","I would like some water.","Tôi muốn một ít nước."],["May I","ph","/meɪ aɪ/","tôi có thể … không? (xin phép)","May I sit here?","Tôi ngồi đây được không?"],["excuse me","int","/ɪkˈskjuːz miː/","xin lỗi (khi gọi ai, hỏi đường)","Excuse me, where is the restroom?","Xin lỗi, nhà vệ sinh ở đâu?"],["available","adj","/əˈveɪləbəl/","còn trống, có sẵn","Is this seat available?","Ghế này còn trống không?"],["recommend","v","/ˌrekəˈmend/","gợi ý, giới thiệu","What do you recommend?","Anh/chị gợi ý món gì?"],["delay","n","/dɪˈleɪ/","sự chậm trễ","There's a two-hour delay.","Chuyến bay bị trễ hai tiếng."],["seat","n","/siːt/","chỗ ngồi","Can I have a window seat?","Cho tôi ghế cạnh cửa sổ được không?"]],
gr:{t:"Câu đề nghị & xin phép lịch sự",e:"Khi đi nhà hàng, sân bay, khách sạn, dùng <b>Could / May / Would</b> sẽ lịch sự hơn Can / want. Thêm <b>please</b> ở cuối câu và lên giọng ↗ cho câu nhờ.",f:["Could you + V, please? → Could you bring the menu, please?","Can I / May I + V? → May I see your passport?","I'd like + N / to V → I'd like an iced coffee. I'd like to check in.","Would you like + N / to V? → Would you like some water? – Yes, please.","Trả lời: Sure. / Of course. / Certainly. / Sorry, …"],s:[["Could I have the bill, please?","Cho mình tính tiền nhé."],["I'd like to book a table for two at seven.","Tôi muốn đặt bàn cho hai người lúc 7 giờ."],["May I see your passport, please?","Cho tôi xem hộ chiếu của anh/chị."],["Would you like your coffee hot or iced?","Anh/chị muốn cà phê nóng hay đá?"]]},
col:[["book a table","đặt bàn","I'd like to book a table for four."],["check in online","làm thủ tục trực tuyến","You can check in online."],["pay by card","trả bằng thẻ","Can I pay by card?"],["keep the change","giữ lại tiền thừa","Thanks, keep the change."],["miss a flight","lỡ chuyến bay","Hurry, or we'll miss our flight!"],["for here or to go","ăn tại chỗ hay mang đi","For here or to go?"]],
q:[["___ I have the menu, please?",["Could","Would","Should"],0,"Xin phép / đề nghị: Could I…?"],["I'd ___ an iced coffee, please.",["like","want to","liking"],0,"I'd like + N."],["___ you like some water?",["Do","Would","Could"],1,"Lời mời: Would you like…?"],["“Trả bằng thẻ” là…",["pay with card","pay by card","pay on card"],1,"pay by card."],["Giọng Mỹ, từ nào có âm /r/ cuối?",["saw","law","door"],2,"door /dɔːr/."],["“Lễ tân khách sạn” là…",["waiter","receptionist","guest"],1,"receptionist."]]},

voc:[["because","conj","/bɪˈkɑːz/","bởi vì","I'm learning English because I want to travel.","Mình học tiếng Anh vì muốn đi du lịch."],["so","conj","/soʊ/","vì vậy","It was raining, so I stayed home.","Trời mưa nên mình ở nhà."],["but","conj","/bʌt/","nhưng","It's cheap but good.","Nó rẻ nhưng tốt."],["and","conj","/ænd/","và","I like tea and coffee.","Mình thích trà và cà phê."],["or","conj","/ɔːr/","hoặc","Tea or coffee?","Trà hay cà phê?"],["although","conj","/ɑːlˈðoʊ/","mặc dù","Although it was late, we kept talking.","Dù đã muộn, bọn mình vẫn nói chuyện."],["however","adv","/haʊˈevɚ/","tuy nhiên","It's expensive. However, it's worth it.","Nó đắt. Tuy nhiên, rất đáng."],["also","adv","/ˈɑːlsoʊ/","cũng","I also like reading.","Mình cũng thích đọc sách."],["first","adv","/fɝːst/","đầu tiên","First, wash your hands.","Đầu tiên, rửa tay."],["then","adv","/ðen/","sau đó","Then, cut the vegetables.","Sau đó, thái rau."],["finally","adv","/ˈfaɪnəli/","cuối cùng","Finally, we arrived.","Cuối cùng bọn mình cũng đến nơi."],["for example","ph","/fɚ ɪɡˈzæmpəl/","ví dụ","I like fruit, for example, mangoes.","Mình thích trái cây, ví dụ như xoài."],["in my opinion","ph","/ɪn maɪ əˈpɪnjən/","theo ý kiến của tôi","In my opinion, Hue is the most beautiful city.","Theo mình, Huế là thành phố đẹp nhất."],["I think","ph","/aɪ θɪŋk/","tôi nghĩ","I think it's a good idea.","Mình nghĩ đó là ý hay."],["actually","adv","/ˈæktʃuəli/","thật ra","Actually, I've never been there.","Thật ra mình chưa bao giờ đến đó."],["especially","adv","/ɪˈspeʃəli/","đặc biệt là","I love fruit, especially mangoes.","Mình mê trái cây, đặc biệt là xoài."],["really","adv","/ˈriːəli/","thật sự","I really like this song.","Mình thật sự thích bài này."],["quite","adv","/kwaɪt/","khá","It's quite cold today.","Hôm nay trời khá lạnh."],["very","adv","/ˈveri/","rất","She is very kind.","Cô ấy rất tốt bụng."],["a lot","ph","/ə lɑːt/","nhiều","Thanks a lot!","Cảm ơn nhiều!"],["a little","ph","/ə ˈlɪtəl/","một chút","I speak a little English.","Mình nói được chút tiếng Anh."],["of course","ph","/əv ˈkɔːrs/","tất nhiên","Of course, I can help you.","Tất nhiên mình giúp được."],["I agree","ph","/aɪ əˈɡriː/","tôi đồng ý","I agree with you.","Mình đồng ý với bạn."],["I'm not sure","ph","/aɪm nɑːt ʃʊr/","tôi không chắc","I'm not sure about that.","Mình không chắc về chuyện đó."],["it depends","ph","/ɪt dɪˈpendz/","còn tùy","It depends on the weather.","Còn tùy thời tiết."],["what about","ph","/wʌt əˈbaʊt/","còn … thì sao?","I'm from Hanoi. What about you?","Mình ở Hà Nội. Còn bạn?"],["by the way","ph","/baɪ ðə weɪ/","nhân tiện","By the way, how's your mom?","Nhân tiện, mẹ bạn khỏe không?"],["pardon","int","/ˈpɑːrdən/","xin lỗi, bạn nói lại được không?","Pardon? Could you say that again?","Xin lỗi? Bạn nói lại được không?"],["anyway","adv","/ˈeniweɪ/","dù sao thì","Anyway, let's go home.","Dù sao thì mình về nhà thôi."],["let me think","ph","/let mi ˈθɪŋk/","để tôi nghĩ đã","Hmm, let me think.","Ừm, để mình nghĩ đã."]],
gr:{t:"Ôn tập ngữ pháp Giai đoạn 1",e:"Đọc lại từng công thức, nói to câu ví dụ, rồi làm bài kiểm tra 12 câu ở phần cuối. Câu nào sai, em mở lại ngày học tương ứng để ôn nhé. Đúng từ <b>10/12</b> là em đã sẵn sàng lên Giai đoạn 2!",f:["Ngày 1–10: to be · tính từ sở hữu · a/an/the · hiện tại đơn · đếm được · tính từ/trạng từ · hiện tại tiếp diễn · giới từ · quá khứ đơn · will/going to","So sánh (Ngày 11): colder than · the hottest · more beautiful than","should / must (12) · can / could (13)","Hiện tại hoàn thành (14): I have known her for 10 years.","V-ing / to V (15) · Điều kiện loại 1 (16): If it rains, I will stay home.","Câu hỏi Wh- (17) · Quá khứ tiếp diễn (18) · Đề nghị lịch sự (19): Could I…? I'd like…"],s:[["Although it was raining, we went out.","Mặc dù trời mưa, bọn mình vẫn ra ngoài."],["I think English is useful because it helps me find a better job.","Mình nghĩ tiếng Anh hữu ích vì nó giúp mình tìm việc tốt hơn."],["First, I review the words. Then, I do the exercises.","Đầu tiên mình ôn từ, sau đó làm bài tập."],["In my opinion, the best way to learn is to practice every day.","Theo mình, cách học tốt nhất là luyện tập mỗi ngày."]]},

q:[["Hanoi is ___ than Saigon in winter.",["cold","colder","coldest"],1,"So sánh hơn (Ngày 11)."],["You ___ see a doctor. You look sick.",["should","mustn't","can't"],0,"Lời khuyên → should (Ngày 12)."],["I ___ ride a bike when I was six.",["can","could","must"],1,"Quá khứ → could (Ngày 13)."],["We have been friends ___ 2010.",["for","since","ago"],1,"since + mốc (Ngày 14)."],["I enjoy ___ to music.",["listen","listening","to listen"],1,"enjoy + V-ing (Ngày 15)."],["If it ___, I will stay home.",["rains","will rain","rain"],0,"Điều kiện loại 1 (Ngày 16)."],["___ did you go last weekend?",["What","Where","Who"],1,"Hỏi nơi chốn (Ngày 17)."],["I ___ cooking when he called.",["was","were","am"],0,"I → was + V-ing (Ngày 18)."],["___ I have the bill, please?",["Could","Would","Should"],0,"Đề nghị lịch sự (Ngày 19)."],["___ it was cold, we went swimming.",["Because","Although","So"],1,"Hai ý trái ngược → Although."],["Từ nào có âm /θ/?",["tree","three","tea"],1,"three /θriː/."],["“Mắc lỗi” là…",["do a mistake","make a mistake","have a mistake"],1,"make a mistake."]]},

voc:[["job","n","/dʒɑːb/","công việc","She has a new job.","Cô ấy có công việc mới."],["career","n","/kəˈrɪr/","sự nghiệp","He wants a career in medicine.","Anh ấy muốn theo sự nghiệp y khoa."],["employee","n","/ɪmˈplɔɪiː/","nhân viên","The company has 200 employees.","Công ty có 200 nhân viên."],["employer","n","/ɪmˈplɔɪɚ/","người sử dụng lao động","My employer is very fair.","Chủ của mình rất công bằng."],["colleague","n","/ˈkɑːliːɡ/","đồng nghiệp","I have lunch with my colleagues.","Mình ăn trưa với đồng nghiệp."],["manager","n","/ˈmænɪdʒɚ/","quản lý","My manager gave me a new task.","Quản lý giao cho mình việc mới."],["salary","n","/ˈsæləri/","lương","Nurses deserve a higher salary.","Y tá xứng đáng được lương cao hơn."],["experience","n","/ɪkˈspɪriəns/","kinh nghiệm","Do you have any work experience?","Bạn có kinh nghiệm làm việc không?"],["skill","n","/skɪl/","kỹ năng","Communication is an important skill.","Giao tiếp là một kỹ năng quan trọng."],["interview","n","/ˈɪntɚvjuː/","buổi phỏng vấn","I have a job interview tomorrow.","Mai mình có buổi phỏng vấn xin việc."],["apply","v","/əˈplaɪ/","nộp đơn","I applied for three jobs last week.","Tuần trước mình nộp đơn ba chỗ."],["application","n","/ˌæplɪˈkeɪʃən/","đơn xin","Send your application by Friday.","Gửi đơn trước thứ Sáu."],["hire","v","/haɪɚ/","thuê, tuyển","They hired two new nurses.","Họ tuyển hai y tá mới."],["quit","v","/kwɪt/","nghỉ việc","He quit his job to start a business.","Anh ấy nghỉ việc để khởi nghiệp."],["retire","v","/rɪˈtaɪɚ/","nghỉ hưu","My father retired last year.","Bố mình nghỉ hưu năm ngoái."],["promotion","n","/prəˈmoʊʃən/","sự thăng chức","She got a promotion in May.","Cô ấy được thăng chức hồi tháng Năm."],["responsible","adj","/rɪˈspɑːnsəbəl/","chịu trách nhiệm","I'm responsible for ten patients.","Mình phụ trách mười bệnh nhân."],["full-time","adj","/ˌfʊlˈtaɪm/","toàn thời gian","I have a full-time job.","Mình làm toàn thời gian."],["part-time","adj","/ˌpɑːrtˈtaɪm/","bán thời gian gr:{t:"Hiện tại hoàn thành và Quá khứ đơn",e:"Quá khứ đơn: việc đã xong, có <b>thời điểm rõ</b> (yesterday, in 2020, ago). Hiện tại hoàn thành: việc <b>không nói rõ lúc nào</b> hoặc <b>kéo dài đến nay</b> (for, since, ever, never, so far). Trong IELTS Speaking, hỏi bằng Hiện tại hoàn thành, kể chi tiết bằng Quá khứ đơn.",f:["Quá khứ đơn: S + V2/ed + mốc thời gian → I started this job in 2022.","Hiện tại hoàn thành: S + have/has + V3 → I have worked here for three years.","Have you ever + V3? → Have you ever had a part-time job? – Yes. I worked in a café in 2019.","so far / recently / up to now → I've learned a lot so far.","Sai: I have worked there in 2019. → Đúng: I worked there in 2019."],s:[["I have worked as a nurse for five years.","Mình làm y tá được năm năm rồi."],["Before that, I worked in a clinic in my hometown.","Trước đó, mình làm ở một phòng khám ở quê."],["Have you ever had a job interview in English?","Bạn đã bao giờ phỏng vấn xin việc bằng tiếng Anh chưa?"],["My company hired ten new employees last month.","Công ty mình tuyển mười nhân viên mới tháng trước."]]},

voc:[["healthy","adj","/ˈhelθi/","khỏe mạnh, lành mạnh","She has a healthy lifestyle.","Cô ấy có lối sống lành mạnh."],["diet","n","/ˈdaɪət/","chế độ ăn","A good diet keeps you strong.","Chế độ ăn tốt giúp bạn khỏe."],["exercise","v","/ˈeksɚsaɪz/","tập thể dục","I exercise every morning.","Sáng nào mình cũng tập thể dục."],["fit","adj","/fɪt/","cân đối, khỏe","He's very fit for his age.","So với tuổi, ông ấy rất khỏe."],["habit","n","/ˈhæbɪt/","thói quen","Smoking is a bad habit.","Hút thuốc là thói quen xấu."],["stress","n","/stres/","căng thẳng","Yoga helps me reduce stress.","Yoga giúp mình giảm căng thẳng."],["relax","v","/rɪˈlæks/","thư giãn","I relax by listening to music.","Mình thư giãn bằng cách nghe nhạc."],["balanced","adj","/ˈbælənst/","cân bằng","Eat a balanced diet.","Hãy ăn uống cân bằng."],["junk food","n","/ˈdʒʌŋk fuːd/","đồ ăn vặt, đồ ăn nhanh","Kids love junk food.","Trẻ con mê đồ ăn vặt."],["vegetable","n","/ˈvedʒtəbəl/","rau củ","Eat more green vegetables.","Ăn nhiều rau xanh hơn."],["sugar","n","/ˈʃʊɡɚ/","đường","Too much sugar is bad for you.","Quá nhiều đường không tốt."],["weight","n","/weɪt/","cân nặng","She is trying to lose weight.","Cô ấy đang cố giảm cân."],["lose weight","ph","/ˌluːz ˈweɪt/","giảm cân","Walking helps you lose weight.","Đi bộ giúp giảm cân."],["gain weight","ph","/ˌɡeɪn ˈweɪt/","tăng cân","I gained weight during Tet.","Mình tăng cân dịp Tết."],["illness","n","/ˈɪlnəs/","bệnh tật","She recovered from a long illness.","Cô ấy khỏi một trận ốm dài."],["disease","n","/dɪˈziːz/","bệnh","Heart disease is very common.","Bệnh tim rất phổ biến."],["headache","n","/ˈhedeɪk/","đau đầu","I have a terrible headache.","Mình đau đầu kinh khủng."],["medicine","n","/ˈmedɪsən/","thuốc","Take this medicine twice a day.","Uống thuốc này ngày hai lần."],["recover","v","/rɪˈkʌvɚ/","hồi phục","He recovered quickly after surgery.","Anh ấy hồi phục nhanh sau phẫu thuật."],["injury","n","/ˈɪndʒəri/","chấn thương","He had a knee injury.","Anh ấy bị chấn thương đầu gối."],["mental health","ph","/ˌmentəl ˈhelθ/","sức khỏe tinh thần","Sleep is important for mental health.","Giấc ngủ quan trọng với sức khỏe tinh thần."],["energy","n","/ˈenɚdʒi/","năng lượng","I have more energy in the morning.","Buổi sáng mình nhiều năng lượng hơn."],["regularly","adv","/ˈreɡjəlɚli/","thường xuyên, đều đặn","Exercise regularly.","Tập thể dục đều đặn."],["avoid","v","/əˈvɔɪd/","tránh","Avoid eating late at night.","Tránh ăn khuya."],["benefit","n","/ˈbenɪfɪt/","lợi ích","Swimming has many benefits.","Bơi có nhiều lợi ích."],["lifestyle","n","/ˈlaɪfstaɪl/","lối sống","City life is a busy lifestyle.","Sống ở thành phố là lối sống bận rộn."],["work out","ph","/ˌwɝːk ˈaʊt/","tập luyện (gym)","I work out three times a week.","Mình tập ba lần một tuần."],["lately","adv","/ˈleɪtli/","dạo gần đây","I've been sleeping badly lately.","Dạo này mình ngủ không ngon."],["sleepy","adj","/ˈsliːpi/","buồn ngủ","I feel sleepy after lunch.","Ăn trưa xong mình buồn ngủ."],["checkup","n","/ˈtʃekʌp/","khám sức khỏe định kỳ","I have a checkup every year.","Mình khám sức khỏe mỗi năm."]],
gr:{t:"Hiện tại hoàn thành tiếp diễn",e:"Dùng cho việc <b>bắt đầu trong quá khứ, kéo dài đến bây giờ</b> và có thể vẫn tiếp tục. Nhấn mạnh <b>quá trình, thời lượng</b>. Rất hợp để trả lời câu hỏi How long…? trong IELTS.",f:["S + have/has been + V-ing → I have been exercising for two months.","How long have you been + V-ing? → How long have you been learning English?","for + khoảng thời gian · since + mốc · lately / recently / all day","Động từ trạng thái (know, like, have = sở hữu) không dùng dạng này → I have known her for years.","Kết quả còn thấy được: I'm tired because I've been running."],s:[["I have been going to the gym three times a week.","Mình đi tập gym ba lần một tuần dạo gần đây."],["She has been eating more vegetables since January.","Cô ấy ăn nhiều rau hơn từ tháng Một."],["How long have you been feeling like this?","Bạn cảm thấy như thế này bao lâu rồi?"],["I'm tired because I've been working all day.","Mình mệt vì làm việc cả ngày."]]},

voc:[["technology","n","/tekˈnɑːlədʒi/","công nghệ","Technology changes very fast.","Công nghệ thay đổi rất nhanh."],["device","n","/dɪˈvaɪs/","thiết bị","Turn off all devices before bed.","Tắt mọi thiết bị trước khi ngủ."],["smartphone","n","/ˈsmɑːrtfoʊn/","điện thoại thông minh","Almost everyone has a smartphone.","Hầu như ai cũng có điện thoại thông minh."],["app","n","/æp/","ứng dụng","This app helps me learn words.","Ứng dụng này giúp mình học từ."],["software","n","/ˈsɔːftwer/","phần mềm","Update your software regularly.","Cập nhật phần mềm thường xuyên."],["online","adv","/ˌɑːnˈlaɪn/","trực tuyến","I buy most things online.","Mình mua hầu hết đồ trên mạng."],["social media","ph","/ˌsoʊʃəl ˈmiːdiə/","mạng xã hội","She spends hours on social media.","Cô ấy dành hàng giờ trên mạng xã hội."],["website","n","/ˈwebsaɪt/","trang web","Check the website for details.","Xem chi tiết trên trang web."],["download","v","/ˈdaʊnloʊd/","tải xuống","Download the file here.","Tải tệp ở đây."],["upload","v","/ˈʌploʊd/","tải lên","I uploaded the photos last night.","Tối qua mình đã tải ảnh lên."],["password","n","/ˈpæswɝːd/","mật khẩu","Never share your password.","Đừng bao giờ chia sẻ mật khẩu."],["screen","n","/skriːn/","màn hình","My phone screen is broken.","Màn hình điện thoại mình bị vỡ."],["charge","v","/tʃɑːrdʒ/","sạc","I need to charge my laptop.","Mình cần sạc máy tính."],["battery","n","/ˈbætəri/","pin","My battery is almost dead.","Pin mình sắp hết."],["invent","v","/ɪnˈvent/","phát minh","Who invented the telephone?","Ai đã phát minh ra điện thoại?"],["invention","n","/ɪnˈvenʃən/","phát minh","The internet is a great invention.","Internet là một phát minh vĩ đại."],["develop","v","/dɪˈveləp/","phát triển","They developed a new app.","Họ đã phát triển một ứng dụng mới."],["digital","adj","/ˈdɪdʒɪtəl/","kỹ thuật số","We live in a digital world.","Chúng ta sống trong thế giới số."],["data","n","/ˈdeɪtə/","dữ liệu","Your data is stored safely.","Dữ liệu của bạn được lưu gr:{t:"Câu bị động (hiện tại đơn và quá khứ đơn)",e:"Dùng khi <b>hành động hoặc vật</b> quan trọng hơn người làm, hoặc không biết ai làm. Công thức luôn là <b>be + V3</b>, chỉ cần chia be theo thì. IELTS Writing Task 1 (quy trình) dùng bị động rất nhiều.",f:["Hiện tại đơn: am/is/are + V3 → Smartphones are used everywhere.","Quá khứ đơn: was/were + V3 → The first website was created in 1991.","Thêm by + người làm khi cần → The app was developed by students.","Phủ định / câu hỏi: isn't/wasn't + V3 · Is/Was + S + V3? → Was it made in Vietnam?","Chủ động → bị động: They make phones in this factory. → Phones are made in this factory."],s:[["Millions of photos are uploaded every day.","Hàng triệu bức ảnh được tải lên mỗi ngày."],["This app was designed for English learners.","Ứng dụng này được thiết kế cho người học tiếng Anh."],["Is your data protected by a strong password?","Dữ liệu của bạn có được bảo vệ bằng mật khẩu mạnh không?"],["Many jobs are now done by robots.","Nhiều công việc giờ được làm bởi robot."]]},

voc:[["environment","n","/ɪnˈvaɪrənmənt/","môi trường","We must protect the environment.","Chúng ta phải bảo vệ môi trường."],["pollution","n","/pəˈluːʃən/","sự ô nhiễm","Air pollution is a big problem in Hanoi.","Ô nhiễm không khí là vấn đề lớn ở Hà Nội."],["pollute","v","/pəˈluːt/","làm ô nhiễm","Factories pollute the rivers.","Nhà máy làm ô nhiễm sông."],["climate change","ph","/ˈklaɪmət tʃeɪndʒ/","biến đổi khí hậu","Climate change affects everyone.","Biến đổi khí hậu ảnh hưởng tới mọi người."],["global warming","ph","/ˌɡloʊbəl ˈwɔːrmɪŋ/","sự nóng lên toàn cầu","Global warming is melting the ice.","Trái đất nóng lên làm băng tan."],["plastic","n","/ˈplæstɪk/","nhựa","Say no to plastic bags.","Nói không với túi nhựa."],["waste","n","/weɪst/","rác thải","The city produces tons of waste.","Thành phố thải ra hàng tấn rác."],["recycle","v","/riːˈsaɪkəl/","tái chế","We recycle paper and bottles.","Nhà mình tái chế giấy và chai."],["reduce","v","/rɪˈduːs/","giảm","Reduce the amount of plastic you use.","Giảm lượng nhựa bạn dùng."],["reuse","v","/ˌriːˈjuːz/","tái sử dụng","Reuse your shopping bags.","Dùng lại túi mua sắm."],["protect","v","/prəˈtekt/","bảo vệ","Laws protect wild animals.","Luật pháp bảo vệ động vật hoang dã."],["renewable energy","ph","/rɪˌnuːəbəl ˈenɚdʒi/","năng lượng tái tạo","Wind is a renewable energy source.","Gió là nguồn năng lượng tái tạo."],["solar power","ph","/ˌsoʊlɚ ˈpaʊɚ/","năng lượng mặt trời","Our school uses solar power.","Trường mình dùng năng lượng mặt trời."],["forest","n","/ˈfɔːrɪst/","rừng","Forests are home to many animals.","Rừng là nhà của nhiều loài vật."],["flood","n","/flʌd/","lũ lụt","The flood destroyed many houses.","Trận lũ phá hủy nhiều ngôi nhà."],["drought","n","/draʊt/","hạn hán","Farmers suffer during a drought.","Nông dân khổ sở khi hạn hán."],["temperature","n","/ˈtemprətʃɚ/","nhiệt độ","The temperature is rising.","Nhiệt độ đang tăng."],["natural resources","ph","/ˌnætʃərəl ˈriːsɔːrsɪz/","tài nguyên thiên nhiên","We are using up natural resources.","Chúng ta đang cạn kiệt tài nguyên thiên nhiên."],["wildlife","n","/ˈwaɪldlaɪf/","động vật hoang dã","The park protects local wildlife.","Công viên bảo vệ động vật hoang dã địa phương."],["endangered","adj","/ɪnˈdeɪndʒɚd/","có nguy cơ tuyệt chủng","Tigers are endangered.","Hổ đang có nguy cơ tuyệt chủng."],["species","n","/ˈspiːʃiːz/","loài","Many species are disappearing.","Nhiều loài đang biến mất."],["save","v","/seɪv/","tiết kiệm; cứu","Turn off the lights to save electricity.","Tắt đèn để tiết kiệm điện."],["destroy","v","/dɪˈstrɔɪ/","phá hủy","Fires destroyed the forest.","Cháy rừng phá hủy cả khu rừng."],["harmful","adj","/ˈhɑːrmfəl/","có hại","Smoke is harmful to your lungs.","Khói có hại cho phổi."],["eco-friendly","adj","/ˌiːkoʊˈfrendli/","thân thiện với môi trường","Bamboo straws are eco-friendly.","Ống hút tre thân thiện với môi trường."],["public transportation","ph","/ˌpʌblɪk ˌtrænspɚˈteɪʃən/","phương tiện công cộng","Use public transportation more often.","Hãy đi phương tiện công cộng nhiều hơn."],["government","n","/ˈɡʌvɚnmənt/","chính phủ","The government made a new law.","Chính phủ ban hành luật mới."],["serious","adj","/ˈsɪriəs/","nghiêm trọng","Pollution is a serious problem.","Ô nhiễm là vấn đề nghiêm trọng."],["carbon footprint","ph","/ˌkɑːrbən ˈfʊtprɪnt/","lượng khí thải các-bon (của một người)","Cycling reduces your carbon footprint.","Đạp xe giảm lượng khí thải của bạn."],["ban","v","/bæn/","cấm","Some cities ban plastic bags.","Một số thành phố cấm túi nhựa."]],
gr:{t:"Câu điều kiện loại 2",e:"Dùng để nói về điều <b>không có thật hoặc khó xảy ra</b> ở hiện tại/tương lai, để tưởng tượng. Mệnh đề If lùi về quá khứ, vế kết quả dùng would + V. Trong IELTS, câu loại 2 giúp em đưa ra giải pháp: If governments…, …",f:["If + S + V2/ed, S + would + V → If I had a car, I would drive to work.","be → were cho mọi ngôi → If I were the mayor, I would ban plastic bags.","could / might thay cho would → If we recycled more, we could reduce waste.","Câu hỏi: What would you do if…? → What would you do if you won the lottery?","So sánh loại 1 (có thể xảy ra): If it rains, I will stay home."],s:[["If everyone used public transportation, the air would be cleaner.","Nếu ai cũng đi phương tiện công cộng, không khí sẽ sạch hơn."],["If I were rich, I would plant a forest.","Nếu mình giàu, mình sẽ trồng một khu rừng."],["What would happen if all the ice melted?","Điều gì sẽ xảy ra nếu toàn bộ băng tan?"],["We could save energy if we turned off the lights.","Chúng ta có thể tiết kiệm năng lượng nếu tắt đèn."]]},
col:[["protect the environment","bảo vệ môi trường","We must protect the environment."],["reduce waste","giảm rác thải","Reusable bags reduce waste."],["take action","hành động","The government needs to take action now."],["cause pollution","gây ô nhiễm","Cars cause air pollution."],["save energy","tiết kiệm năng lượng","Turn off the fan to save energy."],["raise awareness","nâng cao nhận thức","Schools should raise awareness about climate change."]],
q:[["If I ___ more time, I would learn to cook.",["have","had","will have"],1,"Loại 2: If + V2."],["If she were here, she ___ help us.",["will","would","is"],1,"Loại 2: would + V."],["If I ___ you, I'd recycle more.",["was","am","were"],2,"were cho mọi ngôi."],["“Nâng cao nhận thức” là…",["rise awareness","raise awareness","grow awareness"],1,"raise awareness."],["Từ nào bắt đầu bằng âm /f/?",["pan","fan","past"],1,"fan /fæn/."],["Loài có nguy cơ tuyệt chủng là…",["endangered species","wildlife","forest"],0,"endangered species."]]},

{t:"Giáo dục",goal:"Nói về việc học, trường lớp; dùng mệnh đề quan hệ để nói câu dài và rõ hơn.",
snd:{t:"Âm /ʌ/ và /ɑː/ (giọng Mỹ)",tip:"/ʌ/ ngắn, miệng mở vừa, giống “ắ” (cut, luck). /ɑː/ dài, mở to miệng như khi bác sĩ khám họng “aa” (cot, lock). Giọng Mỹ đọc chữ o trong hot, lock thành /ɑː/.",p:[["cut","cot"],["luck","lock"],["hut","hot"],["duck","dock"],["cup","cop"],["nut","not"]]},
voc:[["education","n","/ˌedʒəˈkeɪʃən/","giáo dục","Education is the key to success.","Giáo dục là chìa khóa thành công."],["subject","n","/ˈsʌbdʒekt/","môn học","My favorite subject was history.","Môn yêu thích của mình là lịch sử."],["university","n","/ˌjuːnɪˈvɝːsəti/","trường đại học","She studies at a university in Hue.","Cô ấy học đại học ở Huế."],["college","n","/ˈkɑːlɪdʒ/","trường cao đẳng; đại học (Mỹ)","He went to college in California.","Anh ấy học đại học ở California."],["degree","n","/dɪˈɡriː/","bằng cấp","She has a degree in nursing.","Cô ấy có bằng điều dưỡng."],["major","n","/ˈmeɪdʒɚ/","chuyên ngành","What's your major?","Chuyên ngành của bạn là gì?"],["graduate","v","/ˈɡrædʒueɪt/","tốt nghiệp","I graduated in 2018.","Mình tốt nghiệp năm 2018."],["lecture","n","/ˈlektʃɚ/","bài giảng","The lecture was too long.","Bài giảng dài quá."],["exam","n","/ɪɡˈzæm/","kỳ thi","The exam starts at eight.","Kỳ thi bắt đầu lúc tám giờ."],["pass","v","/pæs/","đỗ, qua","I passed my driving test!","Mình thi đỗ bằng lái rồi!"],["fail","v","/feɪl/","trượt","He failed the math exam.","Cậu ấy trượt môn toán."],["grade","n","/ɡreɪd/","điểm số","She always gets good grades.","Cô ấy luôn được điểm tốt."],["homework","n","/ˈhoʊmwɝːk/","bài tập về nhà","Did you finish your homework?","Con làm xong bài tập chưa?"],["scholarship","n","/ˈskɑːlɚʃɪp/","học bổng","She won a scholarship to study abroad.","Cô ấy giành học bổng du học."],["tuition","n","/tuˈɪʃən/","học phí","Tuition is very expensive in the US.","Học phí ở Mỹ rất đắt."],["knowledge","n","/ˈnɑːlɪdʒ/","kiến thức","Reading increases your knowledge.","Đọc sách tăng kiến thức."],["certificate","n","/sɚˈtɪfɪkət/","chứng chỉ","I need an IELTS certificate.","Mình cần chứng chỉ IELTS."],["course","n","/kɔːrs/","khóa học","I'm taking an online course.","Mình đang học một khóa trực tuyến."],["classmate","n","/ˈklæsmeɪt/","bạn cùng lớp","My classmates are very friendly.","Bạn cùng lớp mình rất thân thiện."],["library","n","/ˈlaɪbreri/","thư viện","I study in the library on Sundays.","Chủ nhật mình học ở thư viện."],["research","n","/ˈriːsɝːtʃ/","nghiên cứu","She's doing research on sleep.","Cô ấy đang nghiên cứu về giấc ngủ."],["review","v","/rɪˈvjuː/","ôn tập","Review your notes before the test.","Ôn lại ghi chép trước bài kiểm tra."],["memorize","v","/ˈmeməraɪz/","học thuộc","I memorize ten words a day.","Mỗi ngày mình học thuộc mười từ."],["concentrate","v","/ˈkɑːnsəntreɪt/","tập trung","I can't concentrate when it's noisy.","Mình không tập trung được khi ồn."],["strict","adj","/strɪkt/","nghiêm khắc","My math teacher was very strict.","Thầy dạy toán của mình rất nghiêm."],["motivated","adj","/ˈmoʊtɪveɪtɪd/","có động lực","Good teachers keep students motivated.","Giáo viên giỏi giúp học sinh có động lực."],["well-educated","adj","/ˌwelˈedʒəkeɪtɪd/","có học thức","She is a well-educated woman.","Cô ấy là người có học thức."],["lifelong learning","ph","/ˌlaɪflɔːŋ ˈlɝːnɪŋ/","học tập suốt đời","Lifelong learning keeps your mind young.","Học suốt đời giúp đầu óc trẻ trung."],["take notes","ph","/ˌteɪk ˈnoʊts/","ghi chép","Take notes during the lecture.","Ghi chép trong lúc nghe giảng."],["curriculum","n","/kəˈrɪkjələm/","chương trình học","The school changed its curriculum.","Trường đã đổi chương trình học."]],
gr:{t:"Mệnh đề quan hệ",e:"Dùng để <b>gộp hai câu</b> và giải thích thêm về một danh từ, giống “mà / người mà” trong tiếng Việt. Chọn đại từ quan hệ theo danh từ đứng trước.",f:["who → người: The teacher who taught me English was very patient.","which → vật: This is the book which helped me most.","that → người hoặc vật (mệnh đề xác định): The course that I took was free.","where → nơi chốn: This is the school where I studied.","whose → của ai: She's the student whose essay won the prize."],s:[["A teacher who loves her job can change your life.","Một giáo viên yêu nghề có thể thay đổi cuộc đời bạn."],["I want to study at a university which has a good library.","Mình muốn học ở trường đại học có thư viện tốt."],["This is the café where I usually do my homework.","Đây là quán cà phê nơi mình hay làm bài tập."],["He's the classmate whose notes are always perfect.","Đó là bạn cùng lớp có vở ghi lúc nào cũng hoàn hảo."]]},
col:[["take an exam","đi thi","I'm taking the IELTS exam in June."],["pass an exam","thi đỗ","She passed the exam with a high score."],["get a degree","lấy bằng","He got a degree in economics."],["do homework","làm bài tập về nhà","I do my homework after dinner."],["make progress","tiến bộ","You're making great progress!"],["attend classes","đi học, dự lớp","Students must attend classes regularly."]],
q:[["The woman ___ lives next door is a teacher.",["which","who","where"],1,"Người → who."],["This is the phone ___ I bought yesterday.",["who","which","where"],1,"Vật → which."],["That's the school ___ my mom works.",["which","where","who"],1,"Nơi chốn → where."],["“Thi đỗ” là…",["pass an exam","win an exam","get an exam"],0,"pass an exam."],["Từ nào có âm /ʌ/?",["cot","cut","lock"],1,"cut /kʌt/."],["Học bổng là…",["scholarship","tuition","degree"],0,"scholarship."]]},

{t:"Du lịch",goal:"Kể một chuyến đi đáng nhớ theo đúng thứ tự thời gian với Quá khứ hoàn thành.",
snd:{t:"Âm /ʊ/ và /uː/",tip:"/ʊ/ ngắn, môi hơi tròn và thả lỏng (full, pull, look). /uː/ dài, môi tròn và chu ra (fool, pool). Kéo dài /uː/ gấp đôi /ʊ/.",p:[["full","fool"],["pull","pool"],["look","Luke"],["would","wooed"],["could","cooed"],["should","shoed"]]},
voc:[["tourism","n","/ˈtʊrɪzəm/","ngành du lịch","Tourism is important for Vietnam.","Du lịch quan trọng với Việt Nam."],["tourist","n","/ˈtʊrɪst/","khách du lịch","Hoi An is full of tourists.","Hội An đầy khách du lịch."],["destination","n","/ˌdestɪˈneɪʃən/","điểm đến","Da Lat is a popular destination.","Đà Lạt là điểm đến nổi tiếng."],["journey","n","/ˈdʒɝːni/","hành trình","The journey took ten hours.","Hành trình mất mười tiếng."],["trip","n","/trɪp/","chuyến đi","We had a great trip.","Bọn mình có một chuyến đi tuyệt vời."],["abroad","adv","/əˈbrɔːd/","ở nước ngoài","I've never been abroad.","Mình chưa từng ra nước ngoài."],["sightseeing","n","/ˈsaɪtsiːɪŋ/","tham quan","We spent the day sightseeing.","Bọn mình đi tham quan cả ngày."],["attraction","n","/əˈtrækʃən/","điểm tham quan","The bridge is the main attraction.","Cây cầu là điểm tham quan chính."],["landmark","n","/ˈlændmɑːrk/","địa danh","The temple is a famous landmark.","Ngôi chùa là một địa danh nổi tiếng."],["culture","n","/ˈkʌltʃɚ/","văn hóa","I love learning about other cultures.","Mình thích tìm hiểu các nền văn hóa khác."],["local","adj","/ˈloʊkəl/","địa phương","Try the local food.","Hãy thử món ăn địa phương."],["souvenir","n","/ˌsuːvəˈnɪr/","quà lưu niệm","I bought a souvenir for my mom.","Mình mua quà lưu niệm cho mẹ."],["accommodation","n","/əˌkɑːməˈdeɪʃən/","chỗ ở","Accommodation is cheap there.","Chỗ ở ở đó rẻ."],["book","v","/bʊk/","đặt trước","I booked the tickets online.","Mình đặt vé trên mạng."],["backpacker","n","/ˈbækpækɚ/","khách du lịch ba lô","Many backpackers visit Ha Giang.","Nhiều khách ba lô đến Hà Giang."],["tour guide","n","/ˈtʊr ɡaɪd/","hướng dẫn viên","Our tour guide spoke great English.","Hướng dẫn viên nói tiếng Anh rất giỏi."],["itinerary","n","/aɪˈtɪnəreri/","lịch trình","Let's plan our itinerary.","Lên lịch trình đi."],["budget","n","/ˈbʌdʒɪt/","ngân sách","We have a small budget.","Bọn mình có ngân sách nhỏ."],["currency","n","/ˈkɝːrənsi/","tiền tệ","What currency do they use in Thailand?","Thái Lan dùng tiền tệ gì?"],["visa","n","/ˈviːzə/","thị thực","Do I need a visa for Japan?","Đi Nhật có cần visa không?"],["delay","v","/dɪˈleɪ/","hoãn, trễ","Our flight was delayed.","Chuyến bay của bọn mình bị hoãn."],["cancel","v","/ˈkænsəl/","hủy","They canceled the tour because of rain.","Họ hủy tour vì mưa."],["crowded","adj","/ˈkraʊdɪd/","đông đúc","The beach was very crowded.","Bãi biển rất đông."],["breathtaking","adj","/ˈbreθteɪkɪŋ/","ngoạn mục","The view was breathtaking.","Khung cảnh thật ngoạn mục."],["explore","v","/ɪkˈsplɔːr/","khám phá","We explored the old town.","Bọn mình khám phá phố cổ."],["scenery","n","/ˈsiːnəri/","phong cảnh","The scenery in Sa Pa is amazing.","Phong cảnh Sa Pa tuyệt đẹp."],["homestay","n","/ˈhoʊmsteɪ/","nhà nghỉ ở cùng người dân","We stayed at a homestay.","Bọn mình ở homestay."],["jet lag","n","/ˈdʒet læɡ/","mệt do lệch múi giờ","I had terrible jet lag.","Mình bị lệch múi giờ rất mệt."],["round trip","ph","/ˌraʊnd ˈtrɪp/","khứ hồi","A round trip ticket is cheaper.","Vé khứ hồi rẻ hơn."],["pack","v","/pæk/","đóng gói hành lý","Have you packed your suitcase?","Bạn đã xếp va li chưa?"]],
gr:{t:"Thì Quá khứ hoàn thành",e:"Khi kể chuyện quá khứ có <b>hai việc</b>, việc xảy ra <b>trước</b> dùng had + V3, việc xảy ra sau dùng Quá khứ đơn. Giúp câu chuyện IELTS Speaking Part 2 rõ thứ tự.",f:["S + had + V3 → When we arrived, the train had left.","before / after / by the time / already → By the time I got there, the shop had closed.","Phủ định: hadn't + V3 → I hadn't seen the sea before that trip.","Câu hỏi: Had you ever + V3 before…? → Had you ever been abroad before 2020?","So sánh: When I arrived, she left (sau khi mình đến). / When I arrived, she had left (đi trước khi mình đến)."],s:[["When we got to the airport, our flight had already left.","Khi bọn mình đến sân bay thì chuyến bay đã cất cánh rồi."],["I had never seen the sea before that trip.","Trước chuyến đi đó mình chưa từng thấy biển."],["By the time the tour started, it had stopped raining.","Lúc chuyến tham quan bắt đầu thì trời đã tạnh mưa."],["She was tired because she had walked all day.","Cô ấy mệt vì đã đi bộ cả ngày."]]},

  <div class="row exp" style="margin:0;gap:4px 14px">${PH.map((p,k)=>p.skip?"":`<span><b style="color:${p.c}">■</b> GĐ${k+1}</span>`).join("")}</div>
  <div class="note" style="margin-top:14px"><b>Mục tiêu đề xuất: IELTS 5.5 (cố gắng 6.0).</b> Từ trình độ A1–A2, học đều mỗi ngày trong khoảng 7 tháng thì 5.0–5.5 là thực tế. Muốn chạm 6.0, em cần tăng lên khoảng 2 giờ mỗi ngày từ tháng 4 và gửi bài viết, bài nói cho cô chữa thường xuyên.</div>
  ${PH.map((p,k)=>{if(p.skip)return `<div class="phase" style="opacity:.75"><h3 style="color:${p.c}">GĐ${k+1} · ${esc(p.n)}</h3><p class="exp" style="margin:4px 0 0">✓ Em đã vượt qua giai đoạn này theo bài test xếp lớp.</p></div>`;const dn=p.ms.filter((m,j)=>S.ms[k+"-"+j]).length;return `<div class="phase ${k===cur?"now":""}"><div class="row" style="justify-content:space-between"><h3 style="color:${p.c}">GĐ${k+1} · ${esc(p.n)}</h3>${k===cur?`<span class="pill r">Em đang ở đây</span>`:""}</div>
  <div class="meta"><span class="pill">${fd(p.a)} → ${p.b?fd(p.b):"ngày thi"}</span><span class="pill">${esc(p.d)}</span><span class="pill">${esc(p.lv)}</span><span class="pill">${esc(p.tm)}</span></div>
  <p style="margin:0">${esc(p.goal)}</p><dl>${p.f.map(f=>`<dt>${esc(f[0])}</dt><dd>${esc(f[1])}</dd>`).join("")}</dl>
  <div class="ms"><b>Cột mốc (${dn}/${p.ms.length})</b>${p.ms.map((m,j)=>`<label><input type="checkbox" id="ms-${k}-${j}" data-ms="${k}-${j}" ${S.ms[k+"-"+j]?"checked":""}><span>${esc(m)}</span></label>`).join("")}</div></div>`}).join("")}
  <div class="card"><b>Tài liệu dùng xuyên suốt</b><ul style="margin:6px 0 0;padding-left:20px"><li>App này (10 ngày nền tảng) và bài cô gửi mỗi tối</li><li>Sách <i>Sơ đồ tư duy ngữ pháp tiếng Anh</i> (HALO) — ngữ pháp và phát âm</li><li><i>1000 English Collocations</i> — cụm từ tự nhiên cho Speaking và Writing</li><li>BBC Learning English · 6 Minute English — luyện nghe hằng ngày</li><li>Bộ <i>Cambridge IELTS</i> 15–19 — đề thi chính thức để luyện từ giai đoạn 3</li></ul></div>`;
}
function hero(){
  const PH=phases();
  const t=new Date(),now=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  const N=Math.max(1,Math.round((now-pd(START()))/864e5)+1);
  const ex=pd(/^\d{4}-\d{2}-\d{2}$/.test(S.exam||"")?S.exam:"2027-06-15");const left=Math.max(0,Math.round((ex-now)/864e5));
  const ph=PH.findIndex(p=>!p.skip&&now>=pd(p.a)&&now<=(p.b?pd(p.b):ex));const nx=D.findIndex((d,i)=>!S.done.includes(i));
  const h=t.getHours(),hi=h<11?"Chào buổi sáng":h<14?"Chào buổi trưa":h<18?"Chào buổi chiều":"Chào buổi tối";
  $("#hero").innerHTML=`<div style="position:relative;z-index:1"><div class="eb">${ph>=0?"Giai đoạn "+(ph+1)+" · "+esc(PH[ph].n):"Lộ trình IELTS"}</div><h1>${hi}, em! Hôm nay mình học ngày ${N} nhé.</h1><p>${nx>=0?"Bài tiếp theo trong app: <b>Ngày "+(nx+1)+" · "+esc(D[nx].t)+"</b>. Mỗi bài có 30 từ mới và 10 phút shadowing.":"Em đã học xong 10 bài trong app. Học tiếp theo bài cô gửi mỗi tối nhé!"}</p><div class="row" style="gap:8px"><button class="go" id="heroGo">${nx>=0?"Học tiếp Ngày "+(nx+1)+" →":"Xem lộ trình →"}</button><button class="go ghost" id="heroSh">🎧 Shadowing hôm nay</button></div></div>
  <div class="stats"><div class="stat"><div class="sv">${N}</div><div class="sl">ngày học</div></div><div class="stat"><div class="sv">${S.done.length}/${D.length}</div><div class="sl">bài trong app đã xong</div></div><div class="stat"><div class="sv">${left}</div><div class="sl">ngày đến kỳ thi</div></div></div>`;
  $("#heroSh").onclick=()=>{S.view="lesson";go(nx>=0?nx:S.day,SECS.findIndex(x=>x[0]==="sh"))};
  $("#heroGo").onclick=()=>{if(nx>=0){S.view="lesson";go(nx,0);document.querySelector("#lesson").scrollIntoView()}else{S.view="road";save();render()}};
}
document.addEventListener("click",e=>{const b=e.target.closest("#lv [data-go],#vocab [data-go]");if(!b)return;S.view=b.dataset.go;if(S.view==="grammar")S.grP=b.closest("#vocab")?GR.findIndex(p=>p.t.startsWith("Bổ trợ")):null;save();render();scrollTo({top:0})});
function render(){
  const VIEWS=["home","lesson","shlib","flash","road","ipa","lv","test","vocab","grammar","dict","pic"];const v=VIEWS.includes(S.view)?S.view:"home";S.view=v;
  ["home","lv","ipa","shlib","road","flash","test","vocab","grammar","dict","pic"].forEach(id=>$("#"+id).hidden=v!==id);
  $("#lesson").hidden=v!=="lesson";$("#days").hidden=v!=="lesson";$("#prog").hidden=v!=="lesson";
  if(v!=="shlib")$("#shlib").innerHTML="";if(v!=="lesson")$("#sec").innerHTML="";
  const tabOf={home:"vHome",lesson:"vLesson",shlib:"vSh",flash:"vFlash",road:"vRoad",ipa:"vHome",lv:"vHome",test:"vHome",vocab:"vFlash",grammar:"vLesson",dict:"vSh",pic:"vFlash"};
  document.querySelectorAll(".tabbar button").forEach(b=>{b.classList.toggle("on",b.id===tabOf[v]);b.setAttribute("aria-current",b.id===tabOf[v]?"page":"false")});
  xpChip();shStop();
  if(v==="home"){renderHome();return}
  if(v==="road"){renderRoad();bind();return}
  if(v==="lv"){renderLv();return}
  if(v==="ipa"){renderIpa();return}
  if(v==="shlib"){renderShLib();return}
  if(v==="flash"){renderFlash();return}
  if(v==="test"){renderTest();return}
  if(v==="vocab"){renderVocab();return}
  if(v==="grammar"){renderGrammar();return}
  if(v==="dict"){renderDict();return}
  if(v==="pic"){renderPic();return}
  const d=D[S.day];
  $("#title").textContent=`Ngày ${S.day+1} · ${d.t}`;$("#goal").textContent="Mục tiêu: "+d.goal;
  days();tt();
  $("#sec").innerHTML=R[SECS[S.sec][0]](d,S.day);
  $("#prev").disabled=S.day===0&&S.sec===0;
  $("#next").textContent=S.sec===SECS.length-1?"Ngày tiếp →":"Phần tiếp →";
  resetTimer();bind();
}
let tm=null,left=0;
function resetTimer(){clearInterval(tm);tm=null;left=SECS[S.sec][2]*60;showT();$("#tbtn").textContent="Bắt đầu hẹn giờ";$("#tlabel").textContent=`Phần ${S.sec+1}/${SECS.length}: ${SECS[S.sec][1]}`}
function showT(){$("#clock").textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0")}
function markSec(){const k=S.day+"";S.secDone[k]=S.secDone[k]||[];if(!S.secDone[k].includes(S.sec)){S.secDone[k].push(S.sec);addXp(10)}save();tt()}
$("#tbtn").onclick=()=>{
  if(tm){clearInterval(tm);tm=null;$("#tbtn").textContent="Tiếp tục";return}
  $("#tbtn").textContent="Tạm dừng";
  tm=setInterval(()=>{left--;showT();if(left<=0){clearInterval(tm);tm=null;markSec();toast("Hết giờ phần này! Bấm “Phần tiếp” để học tiếp.");$("#tbtn").textContent="Xong ✓"}},1000);
};
function go(day,sec){S.day=day;S.sec=sec;save();render();const b=document.querySelector("#days .on");if(b){const st=b.parentNode;st.scrollLeft=b.offsetLeft-st.clientWidth/2+b.clientWidth/2}const L=document.querySelector("#lesson");if(L&&!L.hidden)L.scrollIntoView()}
$("#next").onclick=()=>{markSec();if(S.sec<SECS.length-1)go(S.day,S.sec+1);else if(S.day<D.length-1)go(S.day+1,0);else toast("Em đã học hết 10 ngày! Cô sẽ gửi thêm bài mới.")};
$("#prev").onclick=()=>{if(S.sec>0)go(S.day,S.sec-1);else if(S.day>0)go(S.day-1,SECS.length-1)};
$("#days").onclick=e=>{const b=e.target.closest("[data-day]");if(b){S.view="lesson";go(+b.dataset.day,0)}};
$("#vLesson").onclick=()=>{S.view="lesson";save();render();scrollTo({top:0})};
$("#vHome").onclick=$("#brandHome").onclick=()=>{S.view="home";save();render();scrollTo({top:0})};
$("#vFlash").onclick=()=>{tvQ=null;S.view="vocab";save();render();scrollTo({top:0})};
$("#vRoad").onclick=()=>{S.view="road";save();render();scrollTo({top:0})};
const SHI=SECS.findIndex(x=>x[0]==="sh");
$("#vSh").onclick=()=>{S.view="shlib";save();render();scrollTo({top:0})};
$("#vIpa").onclick=()=>{S.view="ipa";save();render();scrollTo({top:0})};
$("#vLv").onclick=()=>{S.view="lv";save();render();scrollTo({top:0})};
$("#tt").onclick=e=>{const b=e.target.closest("[data-sec]");if(b)go(S.day,+b.dataset.sec)};
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-say]");if(b){speak(b.dataset.say);return}
  const m=e.target.closest(".hide .mean");if(m)m.style.filter="none";
});
let unsubs=[];const onF=h=>unsubs.push(DIC.onFinal(h)),onSt=h=>unsubs.push(DIC.onState(h));
function bind(){
  unsubs.forEach(f=>{try{f()}catch(e){}});unsubs=[];
  const d=D[S.day];
  document.querySelectorAll("[data-retest]").forEach(b=>b.onclick=()=>{S.view="test";save();render();scrollTo({top:0})});
  const exI=$("#exam");if(exI)exI.onchange=()=>{if(/^\d{4}-\d{2}-\d{2}$/.test(exI.value)){S.exam=exI.value;if(S.prof)S.prof.exam=exI.value;save();render()}};
  document.querySelectorAll("[data-ms]").forEach(c=>c.onchange=()=>{S.ms[c.dataset.ms]=c.checked;save();renderRoad();bind()});
  const rs=$("#shRate");if(rs)rs.onclick=e=>{const b=e.target.closest("[data-r]");if(!b)return;S.shRate=+b.dataset.r;save();rs.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b))};
  const sa=$("#shAuto");if(sa)sa.onclick=()=>{if(sa.textContent.startsWith("■"))shStop();else shAuto()};
  const sall=$("#shAll");if(sall)sall.onclick=()=>{shStop();sayP(CURSH.map(l=>plain(l[0])).join(". "),S.shRate).catch(()=>{})};
  document.querySelectorAll("[data-shk]").forEach(b=>b.onclick=()=>{shStop();sayP(plain(CURSH[+b.dataset.shk][0]),S.shRate).catch(()=>{})});
  if(DIC&&document.querySelector("[data-mick]")){let k=-1,txt="";
    onF(({text})=>{if(k<0)return;txt+=" "+text;const c=document.querySelector('.shc[data-k="'+k+'"] .st');if(!c)return;const a=plain(CURSH[k][0]).toLowerCase().replace(/[^a-z' ]/g,"").split(/\s+/).filter(Boolean),h=txt.toLowerCase().replace(/[^a-z' ]/g,"").split(/\s+/);const pc=Math.round(a.filter(w=>h.includes(w)).length/a.length*100);c.textContent=`Cô nghe: “${txt.trim()}” — khớp ${pc}%`+(pc>=80?" 👏":" · thử lại nhé")});
    onSt(({state})=>{document.querySelectorAll("[data-mick]").forEach(b=>b.textContent=(state==="listening"&&+b.dataset.mick===k)?"■ Dừng":"🎤 Nói thử")});
    document.querySelectorAll("[data-mick]").forEach(b=>b.onclick=()=>{if(b.textContent.startsWith("■")){DIC.stop().catch(()=>{});return}k=+b.dataset.mick;txt="";DIC.start().catch(err=>{if(err&&err.code==="not_granted")document.querySelectorAll("[data-mick]").forEach(x=>x.remove())})});
  }
  const f=$("#flip");if(f)f.onclick=()=>{S.hide=!S.hide;save();render()};
  const vf=$("#vf");if(vf)vf.onclick=e=>{const b=e.target.closest("[data-vf]");if(!b)return;S.vf=b.dataset.vf;save();render()};
  const n=$("#notes");if(n)n.oninput=()=>{S.notes[S.day]=n.value;save()};
  const pl=$("#play");
  if(pl){let cur=null;pl.onclick=()=>{const p=d.snd.p[Math.floor(Math.random()*d.snd.p.length)];const k=Math.random()<.5?0:1;cur=p[k];speak(cur);$("#gres").textContent="";$("#gopts").innerHTML=p.map(w=>`<button data-g="${esc(w)}">${esc(w)}${pipa(w)}</button>`).join("");$("#gopts").onclick=e=>{const g=e.target.closest("[data-g]");if(!g)return;const ok=g.dataset.g===cur;g.classList.add(ok?"right":"wrong");$("#gres").textContent=ok?"Chính xác! Bấm Phát để chơi tiếp.":"Chưa đúng — từ vừa đọc là “"+cur+"”. Nghe lại nhé.";if(!ok)speak(cur)}}}
  const mic=$("#mic");
  if(mic&&DIC){let txt="";const tgt=d.gr.s[0][0];
    onF(({text})=>{txt+=" "+text;const a=tgt.toLowerCase().replace(/[^a-z' ]/g,"").split(/\s+/).filter(Boolean),h=txt.toLowerCase().replace(/[^a-z' ]/g,"").split(/\s+/);const hit=a.filter(w=>h.includes(w)).length;const pc=Math.round(hit/a.length*100);$("#heard").textContent=`Cô nghe: “${txt.trim()}” — khớp ${pc}%`+(pc>=80?" 👏":" · thử lại chậm hơn nhé")});
    onSt(({state})=>{mic.textContent=state==="listening"?"■ Dừng":"🎤 Bấm và nói"});
    mic.onclick=()=>{if(mic.textContent.startsWith("■")){DIC.stop().catch(()=>{});return}txt="";DIC.start().catch(err=>{if(err&&err.code==="not_granted")mic.remove()})};
  }
  document.querySelectorAll(".q").forEach(q=>{q.onclick=e=>{const b=e.target.closest("[data-o]");if(!b||q.dataset.a)return;const k=+q.dataset.q,qq=d.q[k],j=+b.dataset.o;q.dataset.a=j===qq[2]?"1":"0";if(j===qq[2])addXp(5);q.querySelectorAll("[data-o]")[qq[2]].classList.add("right");if(j!==qq[2])b.classList.add("wrong");q.querySelector(".exp").textContent=(j===qq[2]?"✓ Đúng! ":"✗ Chưa đúng. ")+qq[3];const all=[...document.querySelectorAll(".q")];const got=all.filter(x=>x.dataset.a==="1").length;if(all.every(x=>x.dataset.a)){S.scores[S.day]=got;save();$("#score").textContent=`Điểm: ${got}/${all.length} `+(got===all.length?"— Xuất sắc!":got>=4?"— Tốt lắm!":"— Ôn lại phần ngữ pháp nhé")}else $("#score").textContent=`Điểm: ${got}/${all.length}`}});
  const fin=$("#finish");if(fin)fin.onclick=()=>{if(!S.done.includes(S.day)){S.done.push(S.day);addXp(30)}markSec();save();toast("Tuyệt vời! Em đã xong ngày "+(S.day+1)+". Mai học tiếp nhé!");if(S.day<D.length-1)setTimeout(()=>go(S.day+1,0),1200);else render()};
}
if(S.day>=D.length)S.day=0;if(S.sec>=SECS.length)S.sec=0;if(!S.ms)S.ms={};S.act=S.act||{};S.shp=S.shp||{};S.fk=S.fk||{};S.xp=S.xp||0;S.view="home";
render();
}
</script>
</body>
