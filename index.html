<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>englishwithbmei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Lexend:wght@500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
<style>
/* Layout: sticky site bar · hero "today" panel · day cards strip · lesson with side section rail (desktop) / chip row (phone) */
:root{
--bg:#fbf6fb;--paper:#ffffff;--ink:#2e2a4d;--mut:#6c6890;--grid:#ece5f4;--soft:#f5f0fb;
--line:#2e2a4d;--gridl:rgba(106,88,211,.07);--blue:#6a58d3;--blue-soft:#eeeaff;--hero:#ebe6ff;--blob1:#ffd6e7;--blob2:#d3f3e6;--stat:rgba(255,255,255,.7);--red:#d2477d;--red-soft:#ffe6f0;
--ok:#2b9468;--okb:#def6ea;--bad:#cf4757;--badb:#fde7ea;--shadow:0 1px 2px rgba(80,60,140,.06),0 10px 28px rgba(120,90,190,.08);
--f-head:"Be Vietnam Pro",system-ui,sans-serif;--f-body:"Be Vietnam Pro",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1829;--paper:#242036;--ink:#efebfa;--mut:#aca6c8;--grid:#363050;--soft:#2c2743;--line:#8c83b8;--gridl:rgba(182,171,255,.05);--blue:#b6abff;--blue-soft:#352e5a;--hero:#2f2852;--blob1:#4a2c47;--blob2:#1f4038;--stat:rgba(255,255,255,.07);--red:#ff9fc4;--red-soft:#45283d;--ok:#7fe0b2;--okb:#1d3b30;--bad:#ff9aa4;--badb:#45232b;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1829;--paper:#242036;--ink:#efebfa;--mut:#aca6c8;--grid:#363050;--soft:#2c2743;--line:#8c83b8;--gridl:rgba(182,171,255,.05);--blue:#b6abff;--blue-soft:#352e5a;--hero:#2f2852;--blob1:#4a2c47;--blob2:#1f4038;--stat:rgba(255,255,255,.07);--red:#ff9fc4;--red-soft:#45283d;--ok:#7fe0b2;--okb:#1d3b30;--bad:#ff9aa4;--badb:#45232b;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--gridl) 1px,transparent 1px),linear-gradient(90deg,var(--gridl) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font:16px/1.6 var(--f-body);overflow-x:clip}
h1,h2,h3{font-family:var(--f-head);font-weight:600;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
/* site bar */
.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--grid)}
.site .in{max-width:1120px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--blue);color:var(--paper);display:grid;place-items:center;font:700 18px var(--f-head)}
.brand b{display:block;font:600 17px/1.2 var(--f-head)}
.brand small{color:var(--mut);font-size:12.5px}
.views{display:flex;gap:4px;background:var(--soft);border-radius:999px;padding:4px}
.views{overflow-x:auto;max-width:100%;scrollbar-width:none}
.views button{white-space:nowrap;flex:none;border:0;background:transparent;border-radius:999px;padding:8px 16px;min-height:40px;font-weight:600;font-size:14.5px;color:var(--mut)}
.views button.on{background:var(--paper);color:var(--blue);box-shadow:var(--shadow)}
.wrap{max-width:1120px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px));display:grid;gap:18px}
/* hero */
.hero{background:var(--hero);color:var(--ink);border-radius:22px;padding:24px;display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:center;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:38%;bottom:-90px;width:200px;height:200px;border-radius:50%;background:var(--blob2)}
.hero::after{content:"";position:absolute;right:-50px;top:-70px;width:240px;height:240px;border-radius:50%;background:var(--blob1)}
.hero .eb{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);font-weight:700}
.hero h1{font-size:clamp(26px,4.4vw,38px);margin:6px 0 8px;color:var(--ink)}
.hero p{margin:0 0 16px;color:var(--mut);max-width:52ch}
.hero .go.ghost{background:var(--paper);color:var(--blue);border:1.5px solid var(--blue)}
.hero .go{border:1.5px solid var(--blue);background:var(--blue);color:var(--paper);border-radius:12px;padding:12px 20px;min-height:48px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative;z-index:1}
.stat{background:var(--stat);backdrop-filter:blur(6px);border-radius:16px;padding:14px 12px}
.stat .sv{color:var(--blue);font:700 30px/1 var(--f-head);font-variant-numeric:tabular-nums}
.stat .sl{font-size:12.5px;color:var(--mut);margin-top:6px;line-height:1.3}
.prog{color:var(--mut);font-size:14px;margin:-6px 2px -8px}
/* day cards */
.days{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory}
.days button{flex:none;width:150px;text-align:left;border:1.5px solid var(--grid);background:var(--paper);border-radius:16px;padding:12px 14px;scroll-snap-align:start;display:grid;gap:4px;position:relative}
.days .dn{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.days .dt{font-size:14px;font-weight:600;line-height:1.3}
.days button.on{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.days button.on .dn{color:var(--blue)}
.days button.done::after{content:"✓";position:absolute;top:10px;right:12px;width:22px;height:22px;border-radius:50%;background:var(--okb);color:var(--ok);font-size:13px;font-weight:700;display:grid;place-items:center}
/* page */
.page{background:var(--paper);border:1px solid var(--grid);border-radius:22px;box-shadow:var(--shadow);padding:24px}
.lh{padding-bottom:16px;border-bottom:1px solid var(--grid);margin-bottom:18px}
.lh h2{font-size:clamp(24px,4vw,32px);color:var(--ink)}
.goal{color:var(--mut);margin:6px 0 0;font-size:15px;max-width:65ch}
.lgrid{display:grid;grid-template-columns:230px 1fr;gap:28px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:grid;gap:14px}
.tt{display:grid;gap:4px}
.tt button{border:0;border-radius:12px;background:transparent;padding:10px 12px;text-align:left;display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;color:var(--ink)}
.tt button b{order:2;margin-left:auto;font-size:12px;font-weight:600;color:var(--mut)}
.tt button::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--grid);flex:none}
.tt button:hover{background:var(--soft)}
.tt button.on{background:var(--blue-soft);color:var(--blue);font-weight:700}
.tt button.on::before{border-color:var(--blue);background:var(--blue)}
.tt button.ok::before{border-color:var(--ok);background:var(--ok)}
.timer{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;background:var(--soft);border-radius:14px;padding:12px;font-size:13px;color:var(--mut)}
.timer #tlabel{grid-column:1/-1}
.clock{font:700 26px var(--f-head);color:var(--red);font-variant-numeric:tabular-nums}
.btn{border:1.5px solid var(--blue);background:var(--paper);color:var(--blue);border-radius:12px;padding:8px 16px;min-height:44px;font-weight:600}
.btn.solid{background:var(--blue);border-color:var(--blue);color:var(--paper)}
.btn:disabled{opacity:.4;cursor:default}
.sec h3{font-size:24px;color:var(--ink);margin:0 0 10px}
.sec>p{max-width:68ch}
.note{background:var(--blue-soft);border-radius:14px;padding:14px 16px;margin:12px 0}
.card{background:var(--paper);border:1px solid var(--grid);border-radius:14px;padding:14px 16px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.w{font:600 21px var(--f-head)}
.ipa{color:var(--mut);font-size:15px}
.tag{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 10px;color:#3a3358;white-space:nowrap}
.n{background:#d6e4ff}.v{background:#ffd9e6}.adj{background:#d4f3e2}.adv{background:#ffe8c8}.pron{background:#e8dcff}.prep{background:#cff1f3}.det{background:#e4e6ee}.int{background:#ffdcf3}.ph{background:#e1e4f5}.num{background:#e4e6ee}.conj{background:#e3f1d2}
.sp{border:0;background:var(--blue-soft);color:var(--blue);border-radius:50%;width:44px;height:44px;flex:none;display:inline-grid;place-items:center}
.sp:hover{background:var(--blue);color:var(--paper)}
.sp svg{width:20px;height:20px}
.sp.small{width:36px;height:36px}
.ex{display:flex;gap:10px;align-items:flex-start;margin-top:6px}
.ex i{color:var(--mut);font-style:normal;font-size:14px;display:block}
.hide .mean{filter:blur(6px);cursor:pointer}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:8px}
.pair{display:flex;justify-content:space-between;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--grid);border-radius:14px;padding:8px 10px}
.pair span{display:flex;align-items:center;gap:6px;font-weight:600}
.f{font:600 15.5px/1.6 var(--f-body);background:var(--soft);border-left:4px solid var(--red);padding:10px 14px;margin:6px 0;border-radius:0 10px 10px 0}
.q{margin:16px 0;padding-bottom:14px;border-bottom:1px solid var(--grid)}
.q p{margin:0 0 8px;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{border:1.5px solid var(--grid);background:var(--paper);border-radius:12px;padding:8px 16px;min-height:44px}
.opts button:hover{border-color:var(--blue)}
.opts button.right{background:var(--okb);border-color:var(--ok);color:var(--ok);font-weight:700}
.opts button.wrong{background:var(--badb);border-color:var(--bad);color:var(--bad)}
.exp{font-size:14px;color:var(--mut);margin-top:6px}
.fml{margin:6px 0 4px;padding:8px 12px;border-radius:12px;background:var(--blue-soft);font-weight:600;line-height:1.5}.grc .ex b{color:var(--blue)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--soft);border:1.5px solid var(--grid);padding:4px;border-radius:14px;margin:0 0 14px}.seg2 button{border:0;background:transparent;border-radius:11px;padding:9px 6px;font-weight:700;font-size:13.5px;color:var(--mut)}.seg2 button.on{background:var(--paper);color:var(--ink,inherit);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.dmodes{display:flex;gap:6px;overflow-x:auto;margin:10px 0}.dmodes button{flex:none;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 13px;font-weight:700;font-size:13.5px}.dmodes button.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.dcard{border:1.5px solid var(--line);border-radius:20px;overflow:hidden;background:var(--paper)}
.dplayer{display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg,#4caf6a,#62c27e);padding:12px}.dplayer button{width:42px;height:42px;border-radius:12px;border:0;background:rgba(255,255,255,.22);color:#fff;font-size:17px;font-weight:800}.dplayer #dPlay{margin-right:auto}.dplayer #dRep{margin-left:auto}.dcnt{color:#fff;font-weight:800;min-width:70px;text-align:center}
.dbody{padding:16px}.dhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.05em;color:var(--mut);margin-bottom:8px}.dhead select{font-size:13px;border:1.5px solid var(--line);border-radius:10px;padding:4px 8px;background:var(--paper);color:var(--bad)}
.dta{width:100%;box-sizing:border-box;border:2px solid var(--ink,#333);border-radius:14px;padding:12px;font:inherit;font-size:16px;resize:vertical;background:var(--paper);color:inherit}
.dmask{font-family:ui-monospace,Menlo,monospace;letter-spacing:.06em;line-height:1.9;margin:0 0 8px;color:var(--mut);word-break:break-word}.dm.on{color:var(--ok);font-weight:700}
.okbtn{background:var(--ok)!important;border-color:var(--ok)!important;color:var(--paper)!important}
.dverd{font-weight:800;margin:14px 0 8px}.dverd.ok{color:var(--ok)}.dverd.no{color:var(--bad)}
.dbox{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;line-height:2;font-size:17px;word-spacing:4px}.wg{color:var(--ok);font-weight:700}.wr{color:var(--bad);font-weight:700;text-decoration:underline wavy}
.dvi{margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--okb);line-height:1.55}
.dchips,.dans{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.dans{min-height:56px;align-items:center}.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 12px;font-weight:700;font-size:15px}.chip:disabled{opacity:.3}.chip.on{background:var(--blue-soft);border-color:var(--blue);opacity:1}.chip.g{background:var(--okb);border-color:var(--ok);color:var(--ok)}.chip.r{background:var(--badb);border-color:var(--bad);color:var(--bad)}
.subl{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:12px;cursor:pointer}.subl.on{background:var(--blue-soft)}.subl:hover{background:var(--blue-soft)}
#dict select{border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--paper);color:inherit;font:inherit;font-weight:600}
.picwrap{overflow-x:auto;border:1.5px solid var(--grid);border-radius:18px;background:#fffaf3;margin-top:10px}.picsvg{display:block;width:100%;min-width:720px;height:auto}
.picsvg *{stroke:#5b5470;stroke-width:2;stroke-linejoin:round}.picsvg .ns{stroke:none}
.picsvg text{stroke:#fff;stroke-width:4;paint-order:stroke;fill:#2e2a4d;font:700 14px Inter,system-ui,sans-serif;pointer-events:none}
.po{cursor:pointer;transition:filter .15s}.po:hover{filter:drop-shadow(0 0 3px #8b7cf6)}.po.sel{filter:drop-shadow(0 0 3px #6c5ce7) drop-shadow(0 0 6px #6c5ce7)}.po.bad{filter:drop-shadow(0 0 4px #e5484d) drop-shadow(0 0 7px #e5484d)}.po.got{filter:drop-shadow(0 0 3px #2fa86b)}
.picq{border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--paper);min-height:58px}
.vin{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;margin:0 0 8px;background:var(--paper);color:inherit}.tedbox{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--grid);border-radius:16px;padding:12px 14px;margin:0 0 10px;background:var(--paper)}.tedlogo{flex:none;background:#e62b1e;color:#fff;font-weight:900;font-size:15px;padding:6px 8px;border-radius:8px;letter-spacing:.02em}.tedlogo sup{font-size:10px}
.teach{margin:8px 0;line-height:1.65;font-size:15.5px}.tl{display:block;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin-bottom:2px}.tip2{margin-top:10px;padding:8px 12px;border-radius:12px;background:var(--okb);line-height:1.55;font-size:14.5px}
textarea{width:100%;min-height:120px;border:1.5px solid var(--grid);border-radius:14px;padding:12px;font:16px/1.5 var(--f-body);background:var(--paper);color:var(--ink)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--paper);border-top:1px solid var(--grid);display:flex;justify-content:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav .btn{flex:1;max-width:260px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;z-index:40}
.toast.show{opacity:1}
table{border-collapse:collapse;width:100%;font-size:15px}td,th{border-bottom:1px solid var(--grid);padding:6px 8px;text-align:left;vertical-align:top}
.abc{display:flex;flex-wrap:wrap;gap:6px}.abc button{width:54px;height:54px;border-radius:12px;border:1px solid var(--grid);background:var(--paper);font:700 18px/1 var(--f-head)}.abc button:hover{border-color:var(--blue);color:var(--blue)}.abc small{display:block;font:400 11px var(--f-body);color:var(--mut);margin-top:3px}
.score{font:700 30px var(--f-head);color:var(--blue);margin-bottom:10px}
/* shadowing */
.shl{display:grid;grid-template-columns:30px 1fr;gap:4px 12px;align-items:start}
.shl .k{width:30px;height:30px;border-radius:50%;background:var(--red-soft);color:var(--red);display:grid;place-items:center;font:700 14px var(--f-head)}
.shl .txt{font-size:18px;font-weight:500;line-height:1.55}
.shl .txt b{color:var(--blue);font-weight:700}
.shl .lk{color:var(--red);font-weight:700}
.shl .cut{color:var(--mut);margin:0 5px}
.shl .vi{color:var(--mut);font-size:14px}
.shl .ctl{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.mini.on{background:var(--blue);color:var(--paper);border-color:var(--blue)}
.mini{border:1px solid var(--grid);background:var(--paper);color:var(--blue);border-radius:999px;padding:4px 14px;min-height:36px;font-size:14px;font-weight:600}
.card.live{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.card.turn{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}
.st{font-size:13px;font-weight:700;color:var(--red)}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 14px;min-height:38px;font-size:14px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--paper);color:var(--blue);box-shadow:var(--shadow)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}
/* roadmap */
.phase{border:1px solid var(--grid);border-radius:18px;padding:18px 20px;margin:14px 0;background:var(--paper)}
.phase.now{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}
.phase h3{font-size:22px;margin:0}
.phase .meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--blue)}
.pill.r{background:var(--red);color:var(--paper)}
.phase dl{margin:10px 0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px}
.phase dt{font-weight:700;color:var(--red);font-size:14px}
.phase dd{margin:0;font-size:15px}
.ms{background:var(--soft);border-radius:14px;padding:10px 14px}
.ms label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:15px;cursor:pointer}
.ms input{width:20px;height:20px;margin-top:2px;accent-color:var(--blue);flex:none}
.cd{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end}
.cd .big{font:700 46px/1 var(--f-head);color:var(--red);font-variant-numeric:tabular-nums}
.cd input{font:inherit;border:1.5px solid var(--grid);border-radius:12px;padding:8px 10px;background:var(--paper);color:var(--ink);min-height:44px}
.bar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--grid);margin:16px 0 6px}
.bar i{display:block;height:100%;border-right:2px solid var(--paper)}
@media(max-width:860px){
.hero{grid-template-columns:1fr;padding:20px}
.lgrid{grid-template-columns:1fr;gap:16px}
.side{position:static}
.tt{display:flex;overflow-x:auto;gap:6px;padding-bottom:4px}
.tt button{flex:none;background:var(--soft);padding:8px 12px;font-size:14px}
.tt button b{margin-left:4px}
}
@media(max-width:560px){
.page{padding:18px 16px;border-radius:18px}
.brand small{display:none}
.site .in{gap:8px}
.views{width:100%}.views button{padding:7px 11px;font-size:13.5px}
.stat .sv{font-size:24px}

function phases(){
  if(!S.prof)return PH0;
  const lv=S.prof.lv,sp=[0,0,1,2,3][lv],base=[lv===1?10:20,55,59,45];
  const st=pd(S.prof.start),ex=pd(S.exam||S.prof.exam||"2027-06-15"),avail=Math.max(30,Math.round((ex-st)/864e5));
  let need=0;for(let k=sp;k<4;k++)need+=base[k];const f=Math.min(1,Math.max(.3,(avail-21)/need));
  let cur=new Date(st);const iso=d=>dk(d);
  return PH0.map((p,k)=>{if(k<sp)return Object.assign({},p,{skip:1});const q=Object.assign({},p);q.a=iso(cur);
    if(k<4){const len=Math.max(7,Math.round(base[k]*f));const e=new Date(cur);e.setDate(e.getDate()+len-1);q.b=iso(e);cur=new Date(e);cur.setDate(cur.getDate()+1)}else q.b="";
    q.d=k<4?"khoảng "+(Math.round((pd(q.b)-pd(q.a))/864e5)+1)+" ngày":"đến ngày thi";return q})}

}

{t:"Part 2 · A person you admire",s:[["I'd LIKE to TALK about my GRANDmother, / who I REALly adMIRE.","Mình muốn nói về bà của mình, người mình rất ngưỡng mộ."],["She's SEVenty-FIVE / and STILL LIVES in our HOMEtown / in the COUNtryside.","Bà 75 tuổi và vẫn sống ở quê."],["When she was YOUNG, / she WORKED HARD on a RICE FARM / to RAISE SIX CHILdren.","Hồi trẻ, bà làm ruộng vất vả để nuôi sáu người con."],["Even THOUGH LIFE was DIFficult, / she NEVer comPLAINED.","Dù cuộc sống khó khăn, bà chưa bao giờ than phiền."],["WHAT I adMIRE MOST / is her PAtience / and her KIND HEART.","Điều mình ngưỡng mộ nhất là sự kiên nhẫn và tấm lòng nhân hậu của bà."],["WHENever I FEEL STRESSED, / I CALL her / and she ALways CHEERS me UP.","Mỗi khi căng thẳng, mình gọi cho bà và bà luôn làm mình vui lên."],["She TAUGHT me / that HAPpiness COMES / from SIMple THINGS.","Bà dạy mình rằng hạnh phúc đến từ những điều giản dị."],["I HOPE I can be / as STRONG and GENerous as HER / one DAY.","Mình mong một ngày nào đó sẽ mạnh mẽ và rộng lượng như bà."]],

{t:"Part 2 · A place you visited",s:[["I'm GOing to deSCRIBE / a TRIP I TOOK to HOI AN / a COUple‿of YEARS‿aGO.","Mình sẽ kể về chuyến đi Hội An vài năm trước."],["It's an ANcient TOWN / in CENtral VIETnam, / FAmous for its COLourful LANterns.","Đó là một phố cổ ở miền Trung, nổi tiếng với những chiếc đèn lồng nhiều màu."],["I WENT there with my COLleagues / as PART‿of a COMpany HOLiday.","Mình đi cùng đồng nghiệp trong chuyến du lịch của công ty."],["We SPENT MOST‿of our TIME / WANdering aROUND the OLD STREETS / and TRYing LOcal DISHes.","Chúng mình dành phần lớn thời gian dạo quanh phố cổ và thử món địa phương."],["What STRUCK me the MOST / was how WELL / the traDItional ARchitecture had been preSERVED.","Điều làm mình ấn tượng nhất là kiến trúc cổ được giữ gìn rất tốt."],["In the EVEning, / the WHOLE TOWN LIT UP / with THOUsands‿of LANterns, / which was BREATHtaking.","Buổi tối, cả phố bừng sáng với hàng nghìn chiếc đèn lồng, đẹp đến nghẹt thở."],["I'd SAY it was ONE‿of the MOST MEMorable EXperiences / I've EVer HAD.","Mình nghĩ đó là một trong những trải nghiệm đáng nhớ nhất của mình."],["If I GET the CHANCE, / I'd DEFinitely GO BACK / and STAY a bit LONGer.","Nếu có dịp, mình chắc chắn sẽ quay lại và ở lâu hơn."]],

{t:"Part 3 · Technology",s:[["HOW has TECHnology CHANGED / the WAY PEOple comMUnicate? ↘","Công nghệ đã thay đổi cách con người giao tiếp như thế nào?"],["I'd SAY it has made comMUnication / MUCH FASTer and more conVEnient.","Mình nghĩ nó khiến việc giao tiếp nhanh và tiện hơn nhiều."],["THESE DAYS, / we can VIdeo-CALL our FAMily / on the OTHer SIDE‿of the WORLD / for FREE.","Ngày nay, mình có thể gọi video cho gia đình ở bên kia thế giới miễn phí."],["HOWever, / I THINK there are SOME DRAWbacks as WELL.","Tuy nhiên, mình nghĩ cũng có một số mặt trái."],["MANy PEOple SPEND so MUCH TIME / on their PHONES / that they RAREly TALK FACE to FACE.","Nhiều người dùng điện thoại nhiều đến mức hiếm khi nói chuyện trực tiếp."],["This can make reLAtionships / feel QUITE SUperficial.","Điều này có thể khiến các mối quan hệ trở nên khá hời hợt."],["PerHAPS the KEY‿is / to FIND a BALance / between ONline and REAL-LIFE interACtion.","Có lẽ điều quan trọng là cân bằng giữa giao tiếp trên mạng và ngoài đời."],["PERsonally, / I TRY to PUT my PHONE aWAY / during MEALS with my FAMily.","Bản thân mình cố cất điện thoại đi khi ăn cùng gia đình."]],
tip:["Khung Part 3: <b>ý kiến</b> (I'd say…) → <b>ví dụ</b> (These days…) → <b>mặt trái</b> (However…) → <b>kết luận</b> (Perhaps the key is…).","<b>so much… that…</b> = nhiều đến mức…","<b>side‿of the world</b>: d nối sang o → “sai-dəv”."]},
{t:"Part 3 · Environment",s:[["WHAT can indiVIDuals DO / to proTECT the enVIronment? ↘","Mỗi cá nhân có thể làm gì để bảo vệ môi trường?"],["I THINK there are QUITE a FEW SIMple THINGS / we can ALL DO.","Mình nghĩ có khá nhiều việc đơn giản mà ai cũng làm được."],["For exAMple, / we can reDUCE PLAStic WASTE / by BRINGing our OWN BAGS / and BOTtles.","Ví dụ, mình có thể giảm rác nhựa bằng cách mang túi và chai riêng."],["USing PUBlic TRANSport / inSTEAD of MOtorbikes / ALso HELPS to CUT‿air polLUtion.","Đi phương tiện công cộng thay vì xe máy cũng giúp giảm ô nhiễm không khí."],["On TOP‿of THAT, / SAVing ELECtricity at HOME / makes a REAL DIFference / in the LONG RUN.","Ngoài ra, tiết kiệm điện ở nhà tạo ra khác biệt thật sự về lâu dài."],["HOWever, / I beLIEVE / indiVIDuals aLONE CAN'T SOLVE the PROBlem.","Tuy nhiên, mình tin rằng một mình cá nhân không thể giải quyết vấn đề."],["GOVernments and BIG COMpanies / NEED to TAKE much STRONGer ACtion, / TOO.","Chính phủ và các công ty lớn cũng cần hành động mạnh mẽ hơn nhiều."],["IF EVeryone DOES their PART, / I'm SURE we can MAKE‿a DIFference.","Nếu ai cũng góp phần, mình tin chúng ta có thể tạo ra thay đổi."]],

{t:"L1 · Family",s:[["My immediate family is small: just my parents, my brother and me.","Gia đình ruột của mình nhỏ: chỉ có bố mẹ, anh trai và mình.","immediate family","gia đình ruột"],["At Tet, my whole extended family gets together at my grandparents' house.","Tết, cả đại gia đình tụ họp ở nhà ông bà.","extended family","đại gia đình"],["He isn't my uncle; he's just a distant relative on my father's side.","Ông ấy không phải chú mình, chỉ là họ hàng xa bên nội.","distant relative","họ hàng xa"],["We are a close-knit family, so we help each other a lot.","Gia đình mình rất gắn bó nên mọi người giúp nhau nhiều.","close-knit family","gia đình gắn bó"],["I had a carefree childhood in the countryside.","Mình có một tuổi thơ vô lo ở vùng quê.","carefree childhood","tuổi thơ vô lo"],["My aunt is a single mother, and she works very hard for her kids.","Dì mình là mẹ đơn thân và làm việc rất vất vả vì các con.","single mother","mẹ đơn thân"],["After the divorce, my friend's parents still stay on good terms.","Sau khi ly hôn, bố mẹ bạn mình vẫn giữ quan hệ tốt.","stay on good terms","giữ quan hệ tốt"],["The doctor said her due date is in early March.","Bác sĩ nói ngày dự sinh của chị ấy là đầu tháng Ba.","due date","ngày dự sinh"]]},
{t:"L2 · Relationships",s:[["When I moved to Hanoi, I only had a few casual acquaintances.","Khi mới chuyển ra Hà Nội, mình chỉ có vài người quen sơ.","casual acquaintances","người quen sơ"],["Over time, two of them became my close friends.","Dần dần, hai người trong số đó trở thành bạn thân của mình.","close friends","bạn thân"],["Do you believe in love at first sight?","Bạn có tin vào tình yêu sét đánh không?","love at first sight","tình yêu từ cái nhìn đầu tiên"],["My parents felt a strong chemistry when they first met.","Bố mẹ mình thấy rất hợp nhau ngay lần đầu gặp.","strong chemistry","sự hòa hợp mạnh mẽ"],["You can bring your significant other to the party.","Bạn có thể dẫn người yêu hoặc vợ/chồng đến bữa tiệc.","significant other","người yêu / vợ / chồng"],["She married her high school sweetheart after college.","Cô ấy cưới mối tình thời cấp ba sau khi học xong đại học.","high school sweetheart","người yêu thời cấp ba"],["We met through a mutual friend at a birthday party.","Bọn mình quen nhau qua một người bạn chung ở tiệc sinh nhật.","mutual friend","bạn chung"],["My grandparents have been happily married for fifty years.","Ông bà mình đã sống hạnh phúc bên nhau năm mươi năm.","happily married","hôn nhân hạnh phúc"]]},
{t:"L3 · Appearance",s:[["My best friend is absolutely gorgeous, with long jet-black hair.","Bạn thân mình cực kỳ xinh đẹp, với mái tóc dài đen tuyền.","absolutely gorgeous","cực kỳ xinh đẹp"],["She has pale blue eyes and a radiant complexion.","Cô ấy có đôi mắt xanh nhạt và làn da rạng rỡ.","radiant complexion","làn da rạng rỡ"],["My brother has an athletic build because he goes to the gym.","Anh mình có thân hình vạm vỡ vì hay đi tập gym.","athletic build","thân hình vạm vỡ"],["He also has broad shoulders and muscular arms.","Anh ấy còn có vai rộng và cánh tay săn chắc.","broad shoulders","vai rộng"],["My grandfather has bushy eyebrows and a thick mustache.","Ông mình có lông mày rậm và ria mép dày.","bushy eyebrows","lông mày rậm"],["She bears a striking resemblance to her mother.","Cô ấy trông giống mẹ như đúc.","bears a striking resemblance","trông cực kỳ giống"],["His hair looked unkempt, so I told him to comb his hair.","Tóc anh ấy rối bù nên mình bảo anh ấy chải tóc.","comb his hair","chải tóc"],["With a short haircut, he looks somewhat attractive.","Cắt tóc ngắn, anh ấy trông cũng khá thu hút.","somewhat attractive","khá thu hút"]]},
{t:"L4 · Character",s:[["When I was a teenager, I was painfully shy.","Hồi tuổi teen, mình nhút nhát kinh khủng.","painfully shy","cực kỳ nhút nhát"],["My little sister has a vivid imagination and loves drawing.","Em gái mình có trí tưởng tượng phong phú và rất thích vẽ.","vivid imagination","trí tưởng tượng phong phú"],["My best friend has an outgoing personality and talks to everyone.","Bạn thân mình có tính cách cởi mở và nói chuyện với mọi người.","outgoing personality","tính cách cởi mở"],["My dad has a good sense of humor, so dinner is always fun.","Bố mình rất có khiếu hài hước nên bữa tối lúc nào cũng vui.","a good sense of humor","khiếu hài hước"],["Sometimes she is brutally honest, and it hurts my feelings.","Đôi khi cô ấy thẳng thắn quá mức và làm mình tổn thương.","hurts my feelings","làm tổn thương"],["Joining the English club helped me come out of my shell.","Tham gia câu lạc bộ tiếng Anh giúp mình bớt rụt rè.","come out of my shell","bớt rụt rè, cởi mở hơn"],["Now I have a thicker skin, so criticism doesn't upset me.","Giờ mình mạnh mẽ hơn nên lời chê không làm mình buồn.","have a thicker skin","không dễ bị tổn thương"],["It's hard for me to swallow my pride and say sorry.","Mình thấy khó hạ cái tôi xuống để xin lỗi.","swallow my pride","hạ cái tôi"]]},
{t:"L5 · Feelings",s:[["I was ridiculously excited before my first trip abroad.","Mình hào hứng kinh khủng trước chuyến đi nước ngoài đầu tiên.","ridiculously excited","vô cùng hào hứng"],["When my son came home late, I was worried sick.","Khi con trai về muộn, mình lo phát ốm.","worried sick","lo phát ốm"],["She was visibly disappointed when she failed the test.","Cô ấy thất vọng thấy rõ khi trượt bài kiểm tra.","visibly disappointed","thất vọng thấy rõ"],["My mom prefers to bottle up her emotions.","Mẹ mình thường giấu kín cảm xúc trong lòng.","bottle up her emotions","giấu kín cảm xúc"],["I'm terribly sorry; I didn't mean to lose my temper.","Mình thật sự xin lỗi, mình không cố ý nổi nóng.","lose my temper","mất bình tĩnh, nổi nóng"],["I was pleasantly surprised by the birthday party.","Mình bất ngờ và vui lắm vì bữa tiệc sinh nhật.","pleasantly surprised","ngạc nhiên vui mừng"],["I'm immensely grateful for my teacher's help.","Mình vô cùng biết ơn sự giúp đỡ của cô giáo.","immensely grateful","vô cùng biết ơn"],["On my wedding day, I was overwhelmed with emotion.","Vào ngày cưới, mình xúc động nghẹn ngào.","overwhelmed with emotion","ngập tràn cảm xúc"]]},
{t:"L6 · Houses & Apartments",s:[["I'm sharing a two-bedroom apartment with my cousin.","Mình đang ở chung căn hộ hai phòng ngủ với chị họ.","two-bedroom apartment","căn hộ hai phòng ngủ"],["Our apartment has a balcony overlooking the river.","Căn hộ của mình có ban công nhìn ra sông.","balcony overlooking","ban công nhìn ra"],["From the top floor, we have a nice view of the city skyline.","Từ tầng trên cùng, mình nhìn thấy đường chân trời thành phố rất đẹp.","nice view of the city skyline","cảnh thành phố đẹp"],["The apartment was fully furnished, so we moved in quickly.","Căn hộ có đủ nội thất nên bọn mình dọn vào rất nhanh.","fully furnished","đầy đủ nội thất"],["The living room is spacious, but the bedrooms are rather cramped.","Phòng khách rộng nhưng phòng ngủ hơi chật.","rather cramped","khá chật chội"],["I feel like I'm throwing away money on rent every month.","Mình thấy như đang ném tiền qua cửa sổ vì tiền thuê nhà mỗi tháng.","throwing away money on rent","phí tiền thuê nhà"],["We're saving up for a down payment on a small house.","Bọn mình đang dành dụm tiền trả trước để mua một căn nhà nhỏ.","saving up for a down payment","tiết kiệm tiền đặt cọc"],["When we move into a new place, we'll have a housewarming party.","Khi chuyển nhà mới, bọn mình sẽ làm tiệc tân gia.","housewarming party","tiệc tân gia"]]},
{t:"L7 · Eating",s:[["I want to change my eating habits this year.","Năm nay mình muốn thay đổi thói quen ăn uống.","eating habits","thói quen ăn uống"],["I'm trying to cut down on junk food and processed foods.","Mình đang cố ăn ít đồ ăn vặt và đồ chế biến sẵn.","junk food","đồ ăn vặt không lành mạnh"],["A balanced diet includes vegetables, fruit, rice and fish.","Chế độ ăn cân bằng gồm rau, trái cây, cơm và cá.","a balanced diet","chế độ ăn cân bằng"],["My grandmother always cooks nourishing meals for the family.","Bà mình luôn nấu những bữa ăn bổ dưỡng cho cả nhà.","nourishing meals","bữa ăn bổ dưỡng"],["My mom stocks up on fresh produce at the market every Sunday.","Chủ nhật nào mẹ cũng mua trữ rau củ tươi ở chợ.","stocks up on fresh produce","trữ rau củ quả tươi"],["Doctors say we should eat in moderation.","Bác sĩ nói chúng ta nên ăn uống điều độ.","eat in moderation","ăn uống điều độ"],["After work, I'm usually in the mood for a home-cooked meal.","Sau giờ làm, mình thường thèm một bữa cơm nhà.","home-cooked meal","bữa cơm nhà nấu"],["Don't eat snacks now, or you'll spoil your appetite.","Đừng ăn vặt bây giờ, kẻo lát không ăn cơm được.","spoil your appetite","mất cảm giác thèm ăn"]]},

const SHG=()=>LV.map(l=>({c:l.c,n:l.n,col:l.col})).concat([{c:"Collocations",n:"1000 Collocations · cụm từ tự nhiên",col:"#0a8590"}]);
function autoHint(t,col){let h=esc(t).replace(/,\s*/g,', <span class="cut">/</span> ').replace(/;\s*/g,'; <span class="cut">/</span> ');h=h.replace(/([b-df-hj-np-tv-z])\s+(?=[aeiou])/gi,'$1<span class="lk">‿</span>');const c=esc(col);const i=h.toLowerCase().indexOf(c.toLowerCase());return i<0?h:h.slice(0,i)+"<b>"+h.slice(i,i+c.length)+"</b>"+h.slice(i+c.length)}
function hiCol(t,col){const e=esc(t),c=esc(col),i=e.toLowerCase().indexOf(c.toLowerCase());return i<0?e:e.slice(0,i)+'<mark class="colm">'+e.slice(i,i+c.length)+"</mark>"+e.slice(i+c.length)}
function shLib(k){if(k===LV.length)return COLL;if(k<2)return Array.from({length:10},(_,j)=>k*10+j).filter(di=>D[di]&&SH[di]).map(di=>({t:"Ngày "+(di+1)+" · "+D[di].t,s:SH[di].s,tip:SH[di].tip}));const ex=D.map((d,di)=>di).filter(di=>SH[di]&&curLvOf(di)===k).map(di=>({t:"Ngày "+(di+1)+" · "+D[di].t,s:SH[di].s,tip:SH[di].tip}));return SHX[LV[k].c].concat(ex)}
function curLvOf(di){const N=di+1;return N<=10?0:N<=20?1:N<=75?2:N<=134?3:4}
/* ===== XP · streak ===== */
const dk=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>dk(new Date());
function addXp(n){S.xp=(S.xp||0)+n;S.act=S.act||{};S.act[today()]=(S.act[today()]||0)+n;save();xpChip()}
function streak(){const d=new Date();if(!(S.act||{})[dk(d)])d.setDate(d.getDate()-1);let c=0;while((S.act||{})[dk(d)]){c++;d.setDate(d.getDate()-1)}return c}
function xpChip(){const el=$("#xpchip");if(el)el.innerHTML=`<span title="Chuỗi ngày học">🔥 ${streak()}</span><span title="Điểm kinh nghiệm">⭐ ${S.xp||0} XP</span>`}

const PROPER={"lan":"Lan","minh":"Minh","mai":"Mai","vietnam":"Vietnam","hanoi":"Hanoi","hue":"Hue","english":"English","ielts":"IELTS","tv":"TV","june":"June","monday":"Monday","sundays":"Sundays","mum":"Mum"};
const MULTI=[["ha long bay","Ha Long Bay"],["hoi an","Hoi An"],["da nang","Da Nang"],["ho chi minh city","Ho Chi Minh City"],["da lat","Da Lat"],["phu quoc","Phu Quoc"]];
function natural(m){let t=String(m).replace(/[↗↘]/g,"").replace(/\s*\/\s*/g," ").replace(/‿/g," ").replace(/\s+/g," ").trim().toLowerCase();
  MULTI.forEach(([a,b])=>t=t.split(a).join(b));t=t.replace(/\b[a-z]+\b/g,w=>PROPER[w]||w).replace(/\bi\b/g,"I").replace(/\bi('m|'ve|'d|'ll)\b/g,"I$1");
  return t.replace(/(^|[.!?]\s+)([a-z])/g,(x,p,c)=>p+c.toUpperCase())}

function renderHome(){
  const PH=phases();
  const t=new Date(),now=new Date(t.getFullYear(),t.getMonth(),t.getDate());const N=Math.max(1,Math.round((now-pd(START()))/864e5)+1);
  const ex=pd(/^\d{4}-\d{2}-\d{2}$/.test(S.exam||"")?S.exam:"2027-06-15"),left=Math.max(0,Math.round((ex-now)/864e5));

function renderPic(){

  <div class="dmodes">${PICT.map(t=>`<button data-pt="${t[0]}" class="${t[0]===id?"on":""}">${esc(t[2].split(" · ")[0])}</button>`).join("")}</div>
  <div class="seg" id="picMode" style="margin:4px 0 10px">${[["learn","👀 Xem nhãn"],["hide","🙈 Ẩn nhãn"],["quiz","🎯 Tìm đồ vật"]].map(m=>`<button data-pm="${m[0]}" class="${mode===m[0]?"on":""}">${m[1]}</button>`).join("")}</div>
  ${panel}

  <div class="row" style="gap:10px;margin:14px 0"><button class="btn solid grow" id="picFlash">🗂 Học bằng thẻ</button><button class="btn grow" id="picTest">✍️ Kiểm tra 10 câu</button></div>
  <h3 class="sect">${ws.length} từ trong tranh</h3><div class="dchips">${ws.map(x=>`<button class="chip ${x[0]===picSel?"on":""}" data-pw="${esc(x[0])}">${esc(x[0])}</button>`).join("")}</div>`;

    if(mode!=="quiz")return choose(k);if(!picQ||!picQ.t)return;
    if(k===picQ.t){if(!picQ.miss)picQ.first++;picQ.found.push(k);addXp(1);picSel=null;picBad=null;const rest=ws.map(x=>x[0]).filter(x=>!picQ.found.includes(x));picQ.t=rest.length?rest[Math.floor(Math.random()*rest.length)]:null;picQ.miss=false;picQ.hint=false;toast("Đúng rồi! 👏");renderPic();if(picQ.t)setTimeout(()=>speak(picQ.t),300)}
    else{picQ.miss=true;picBad=k;speak(k);renderPic();setTimeout(()=>{picBad=null;renderPic()},900)}});

  document.querySelectorAll("#pic [data-pt]").forEach(b=>b.onclick=()=>{S.picT=+b.dataset.pt;picSel=null;picQ=null;if(S.picMode==="quiz")picStart();save();renderPic()});

  const ag=$("#pqAgain");if(ag)ag.onclick=()=>{picStart();renderPic();setTimeout(()=>speak(picQ.t),200)};
  if(mode==="quiz"&&!picQ){picStart();renderPic();return}
  $("#picBack").onclick=()=>{S.view="vocab";save();render();scrollTo({top:0})};

  $("#picTest").onclick=()=>{S.view="vocab";S.tvT=id;tvQ=mkQuiz(id);save();render();scrollTo({top:0})};
}

let fFlip=false;
function renderFlash(){
  const TP=S.fTopic!=null&&TV[S.fTopic]?TV[S.fTopic].map(v=>({v,day:-1})):null;const ALL=TP||D.flatMap((d,i)=>d.voc.map(v=>({v,day:i})));const f=TP?-1:(S.fDay==null?-1:S.fDay);
  const pool=f<0?ALL:ALL.filter(x=>x.day===f),known=pool.filter(x=>S.fk[x.v[0]]).length,deck=pool.filter(x=>!S.fk[x.v[0]]);
  const allKnown=ALL.filter(x=>S.fk[x.v[0]]).length;if(S.fi==null||S.fi>=deck.length)S.fi=0;const c=deck[S.fi];
  $("#flash").innerHTML=`<p class="eyebrow">Ôn từ · Flashcards</p><h2 class="h2b">Ôn lại từ đã học</h2>
  
  <div class="row" style="gap:12px;margin:12px 0"><div class="xbar grow"><i style="width:${Math.round(allKnown/ALL.length*100)}%"></i></div><span class="exp" style="margin:0;white-space:nowrap">${allKnown}/${ALL.length} thẻ đã thuộc</span></div>
  ${TP?`<div class="row" style="gap:6px;margin-bottom:14px"><span class="tagp">Chủ đề: ${esc(tName(S.fTopic))}</span><button class="mini" id="fBackT">← Về chủ đề</button></div>`:""}<div class="row" style="gap:6px;margin-bottom:14px" ${TP?"hidden":""}><button class="mini ${f<0?"on":""}" data-fd="-1">Tất cả</button>${D.map((d,i)=>`<button class="mini ${f===i?"on":""}" data-fd="${i}">Ngày ${i+1}</button>`).join("")}</div>
  ${c?`<div class="fcard ${fFlip?"back":""}">
    <div class="row" style="justify-content:space-between"><span class="tagp">${c.day<0?esc(tName(S.fTopic)):"Ngày "+(c.day+1)} · còn ${deck.length} thẻ</span><span class="tag ${c.v[1]}">${TYPES[c.v[1]]} (${c.v[1]})</span></div>
    <p class="fw">${esc(c.v[0])}</p><p class="ipa" style="text-align:center;margin:0">${esc(c.v[2])}</p>
    <div style="display:flex;justify-content:center;margin-top:10px">${sp(c.v[0])}</div>
    ${fFlip?`<div class="fback"><p class="fm">${esc(c.v[3])}</p><div class="ex" style="justify-content:center">${sp(c.v[4],"small")}<div><b>${esc(c.v[4])}</b><i>${esc(c.v[5])}</i></div></div></div>`:`<button class="btn solid bigbtn" id="fFlip" style="margin-top:18px">Lật thẻ xem nghĩa</button>`}
  </div>
  ${fFlip?`<div class="row" style="gap:10px;margin-top:12px"><button class="btn grow" id="fNo">😕 Chưa nhớ</button><button class="btn solid grow" id="fYes">✓ Nhớ rồi</button></div>`:""}`
  :`<div class="fcard"><p class="fw" style="font-size:28px">🎉 Em đã thuộc hết ${pool.length} thẻ ${f<0?"":"của Ngày "+(f+1)}!</p><p class="exp" style="text-align:center">Đã thuộc ${known}/${pool.length}. Bấm “Học lại” để ôn từ đầu.</p><button class="btn solid bigbtn" id="fReset">Học lại các thẻ này</button></div>`}`;
  document.querySelectorAll("[data-fd]").forEach(b=>b.onclick=()=>{S.fDay=+b.dataset.fd;S.fi=0;fFlip=false;save();renderFlash()});
  const fbt=$("#fBackT");if(fbt)fbt.onclick=()=>{S.tvT=S.fTopic;S.view="vocab";save();render();scrollTo({top:0})};
  const fl=$("#fFlip");if(fl)fl.onclick=()=>{fFlip=true;renderFlash()};
  const y=$("#fYes");if(y)y.onclick=()=>{S.fk[c.v[0]]=1;addXp(2);fFlip=false;renderFlash()};
  const no=$("#fNo");if(no)no.onclick=()=>{addXp(1);S.fi=(S.fi+1)%Math.max(1,deck.length);fFlip=false;save();renderFlash()};
  const rs=$("#fReset");if(rs)rs.onclick=()=>{pool.forEach(x=>delete S.fk[x.v[0]]);S.fi=0;save();renderFlash()};
}

ẹo nhỏ ở cằm."],["forehead","n","/ˈfɔːrhed/","trán","She has a high forehead.","Cô ấy có vầng trán cao."],["eyebrow","n","/ˈaɪbraʊ/","lông mày","She raised her eyebrows.","Cô ấy nhướn mày."]],
201:[["want to","ph","/ˈwɑːnt tə/","muốn làm gì (want to + V)","I want to learn how to swim this summer.","Mình muốn học bơi vào hè này."],["prefer","ph","/prɪˈfɝː/","thích A hơn B (prefer A to B)","I prefer tea to coffee in the evening.","Buổi tối mình thích trà hơn cà phê."],["tend to","ph","/ˈtend tə/","có xu hướng, thường hay (tend to + V)","I tend to wake up early on weekdays.","Ngày thường mình hay dậy sớm."],["opt for","ph","/ˈɑːpt fɚ/","chọn (một phương án) (opt for + N)","We opted for the train because it was cheaper.","Bọn mình chọn đi tàu vì rẻ hơn."],["prioritise","ph","/praɪˈɔːrətaɪz/","ưu tiên (prioritise + N/V-ing)","This month I'm prioritising my IELTS speaking.","Tháng này mình ưu tiên phần nói IELTS."],["be inclined to","ph","/bi ɪnˈklaɪnd tə/","nghiêng về, có ý muốn (be inclined to + V)","I'm inclined to accept the job offer.","Mình đang nghiêng về nhận lời mời làm việc."]],
202:[["have time for","ph","/hæv ˈtaɪm fɚ/","có thời gian cho việc gì (have time for + N)","I don't have time for breakfast on Mondays.","Thứ Hai mình không có thời gian ăn sáng."],["have time to","ph","/hæv ˈtaɪm tə/","có thời gian để làm (have time to + V)","Do you have time to talk now?","Bây giờ bạn có thời gian nói chuyện không?"],["can afford","ph","/kən əˈfɔːrd/","đủ tiền / đủ khả năng (can afford + N / to V)","We can't afford a new car this year.","Năm nay nhà mình chưa đủ tiền mua xe mới."],["make time for","ph","/ˌmeɪk ˈtaɪm fɚ/","thu xếp thời gian cho (make time for + N)","Even when I'm busy, I make time for my family.","Dù bận, mình vẫn dành thời gian cho gia đình."],["have access to","ph","/hæv ˈækses tə/","được tiếp cận, sử dụng (have access to + N)","All students have access to the library online.","Mọi học sinh đều được dùng thư viện trực tuyến."],["be within reach","ph","/bi wɪˌðɪn ˈriːtʃ/","trong tầm tay, có thể đạt được","With more practice, band 6.0 is within reach.","Luyện thêm thì band 6.0 trong tầm tay."],["be out of reach","ph","/bi ˌaʊt əv ˈriːtʃ/","ngoài tầm với, ngoài khả năng","A house in the city center is out of reach for us.","Một căn nhà ở trung tâm thì ngoài khả năng của bọn mình."]],
203:[["find it difficult to","ph","/ˈfaɪnd ɪt ˈdɪfɪkəlt tə/","thấy khó làm gì (find it difficult to + V)","I find it difficult to understand fast speakers.","Mình thấy khó hiểu người nói nhanh."],["ask for help","ph","/ˌæsk fɚ ˈhelp/","nhờ giúp đỡ (ask someone for help)","Don't be afraid to ask your teacher for help.","Đừng ngại nhờ giáo viên giúp."],["struggle with","ph","/ˈstrʌɡəl wɪð/","vật lộn, gặp khó với (struggle with + N / struggle to V)","Many learners struggle with English pronunciation.","Nhiều người học gặp khó với phát âm tiếng Anh."],["deal with","ph","/ˈdiːl wɪð/","xử lý, đối phó với","How do you deal with stress at work?","Bạn đối phó với căng thẳng trong công việc thế nào?"],["address a problem","ph","/əˈdres ə ˈprɑːbləm/","giải quyết một vấn đề (address + a problem/an issue)","The school needs to address the problem of bullying.","Nhà trường cần giải quyết vấn đề bắt nạt."],["overcome an obstacle","ph","/ˌoʊvɚˈkʌm ən ˈɑːbstəkəl/","vượt qua trở ngại (overcome + an obstacle/a difficulty)","She overcame many obstacles to become a doctor.","Cô ấy đã vượt qua nhiều trở ngại để trở thành bác sĩ."]],
204:[["because of","ph","/bɪˈkʌz əv/","vì, do (because of + N/V-ing)","The flight was delayed because of the storm.","Chuyến bay bị hoãn vì bão."],["make someone happy","ph","/ˌmeɪk ˌsʌmwʌn ˈhæpi/","làm cho ai (vui…) (make + người/vật + adj)","Cooking for my family makes me happy.","Nấu ăn cho gia đình làm mình vui."],["lead to","ph","/ˈliːd tə/","dẫn đến (lead to + N/V-ing)","Too much screen time can lead to sleep problems.","Dùng màn hình quá nhiều có thể dẫn đến mất ngủ."],["result from","ph","/rɪˈzʌlt frəm/","là kết quả của, bắt nguồn từ (result from + N)","Many accidents result from careless driving.","Nhiều tai nạn bắt nguồn từ việc lái xe ẩu."],["result in","ph","/rɪˈzʌlt ɪn/","gây ra, dẫn đến (result in + N)","Heavy rain resulted in flooding in the city.","Mưa lớn gây ngập trong thành phố."],["contribute to","ph","/kənˈtrɪbjuːt tə/","góp phần vào (contribute to + N/V-ing)","Regular exercise contributes to better health.","Tập thể dục đều đặn góp phần cải thiện sức khỏe."],["be associated with","ph","/bi əˈsoʊʃieɪtɪd wɪð/","có liên quan đến (không khẳng định là nguyên nhân)","Fast food is often associated with weight gain.","Đồ ăn nhanh thường liên quan đến tăng cân."]],
205:[["get better","ph","/ˌɡet ˈbetɚ/","tốt lên, khá hơn","My English is getting better every week.","Tiếng Anh của mình tiến bộ hơn mỗi tuần."],["get worse","ph","/ˌɡet ˈwɝːs/","tệ đi","The traffic gets worse when it rains.","Trời mưa là giao thông tệ hơn."],["increase from A to B","ph","/ɪnˈkriːs frəm … tə …/","tăng từ A lên B","The price increased from 20,000 to 25,000 dong.","Giá tăng từ 20.000 lên 25.000 đồng."],["fall from A to B","ph","/ˈfɑːl frəm … tə …/","giảm từ A xuống B","The number of visitors fell from 500 to 300.","Lượng khách giảm từ 500 xuống 300."],["level off","ph","/ˌlevəl ˈɑːf/","chững lại, ổn định (sau khi tăng/giảm)","House prices rose quickly and then leveled off.","Giá nhà tăng nhanh rồi chững lại."],["give way to","ph","/ˌɡɪv ˈweɪ tə/","nhường chỗ cho, bị thay thế bởi (give way to + N)","Paper maps have given way to phone apps.","Bản đồ giấy đã nhường chỗ cho ứng dụng điện thoại."]],
206:[["the same as","ph","/ðə ˈseɪm əz/","giống với (the same as + N)","My phone is the same as yours.","Điện thoại mình giống của bạn."],["different from","ph","/ˈdɪfrənt frəm/","khác với (different from + N)","Life in Hanoi is very different from life in the countryside.","Cuộc sống ở Hà Nội rất khác ở quê."],["compared with","ph","/kəmˈperd wɪð/","so với (compared with + N)","Compared with last year, my speaking is much better.","So với năm ngoái, kỹ năng nói của mình khá hơn nhiều."],["unlike","ph","/ʌnˈlaɪk/","không giống như, khác với (unlike + N/đại từ)","Unlike my brother, I love vegetables.","Khác với anh mình, mình mê rau."],["outweigh","ph","/ˌaʊtˈweɪ/","có sức nặng hơn, lớn hơn (outweigh + N)","For me, the benefits of online learning outweigh the drawbacks.","Với mình, lợi ích của học trực tuyến lớn hơn bất lợi."],["be on a par with","ph","/bi ɑːn ə ˈpɑːr wɪð/","ngang bằng với (be on a par with + N)","This local brand is on a par with famous ones.","Thương hiệu nội địa này ngang với các hãng nổi tiếng."]],
207:[["learn to","ph","/ˈlɝːn tə/","học để làm được (learn to + V)","I'm learning to drive this year.","Năm nay mình đang học lái xe."],["get used to","ph","/ˌɡet ˈjuːst tə/","dần quen với (get used to + N/V-ing)","I'm getting used to getting up at six.","Mình đang dần quen với việc dậy lúc sáu giờ."],["keep up with","ph","/ˌkiːp ˈʌp wɪð/","theo kịp (keep up with + N)","It's hard to keep up with new technology.","Thật khó theo kịp công nghệ mới."],["put something into practice","ph","/ˈpʊt ˌsʌmθɪŋ ˌɪntə ˈpræktɪs/","áp dụng vào thực tế","Try to put new words into practice every day.","Hãy áp dụng từ mới vào thực tế mỗi ngày."],["develop an understanding of","ph","/dɪˈveləp ən ˌʌndɚˈstændɪŋ əv/","dần hiểu rõ về (develop an understanding of + N)","Reading the news helps me develop an understanding of the world.","Đọc tin tức giúp mình hiểu rõ hơn về thế giới."],["build on","ph","/ˈbɪld ɑːn/","phát triển tiếp dựa trên (build on + N)","Next week we will build on what we learned today.","Tuần sau mình sẽ học tiếp dựa trên bài hôm nay."]],
208:[["care about","ph","/ˈker əˌbaʊt/","quan tâm đến (care about + N)","She really cares about her students.","Cô ấy thật sự quan tâm đến học sinh."],["get on with","ph","/ˌɡet ˈɑːn wɪð/","hòa thuận với (get on with + người)","I get on well with my roommate.","Mình hòa hợp với bạn cùng phòng."],["rely on","ph","/rɪˈlaɪ ɑːn/","dựa vào, tin cậy vào (rely on + người/vật)","You can always rely on your family.","Bạn luôn có thể dựa vào gia đình."],["be responsible for","ph","/bi rɪˈspɑːnsəbəl fɚ/","chịu trách nhiệm về (be responsible for + N/V-ing)","I'm responsible for answering customer emails.","Mình phụ trách trả lời email khách hàng."],["take something for granted","ph","/ˌteɪk ˌsʌmθɪŋ fɚ ˈɡræntɪd/","coi là điều hiển nhiên, không trân trọng","Don't take your health for granted.","Đừng coi sức khỏe là điều hiển nhiên."],["take someone's needs into account","ph","/ˌteɪk ˌsʌmwʌnz ˈniːdz ˌɪntu əˈkaʊnt/","cân nhắc nhu cầu của ai","Good teachers take students' needs into account.","Giáo viên giỏi luôn cân nhắc nhu cầu của học sinh."],["look after","ph","/ˌlʊk ˈæftɚ/","chăm sóc, trông nom","My mother looks after my son when I'm at work.","Mẹ mình trông con giúp khi mình đi làm."]],
209:[["be useful for","ph","/bi ˈjuːsfəl fɚ/","hữu ích cho (be useful for + N/V-ing)","This app is useful for learning new words.","Ứng dụng này hữu ích cho việc học từ mới."],["be worth","ph","/bi ˈwɝːθ/","đáng (be worth + N/V-ing)","Hoi An is worth visiting.","Hội An rất đáng để ghé thăm."],["benefit from","ph","/ˈbenəfɪt frəm/","được hưởng lợi từ (benefit from + N/V-ing)","Children benefit from playing outside.","Trẻ em được lợi khi chơi ngoài trời."],["meet someone's needs","ph","/ˌmiːt ˌsʌmwʌnz ˈniːdz/","đáp ứng nhu cầu của ai","This course meets my needs perfectly.","Khóa học này đáp ứng đúng nhu cầu của mình."],["be effective in","ph","/bi ɪˈfektɪv ɪn/","có hiệu quả trong (be effective in + V-ing)","Shadowing is effective in improving pronunciation.","Shadowing có hiệu quả trong việc cải thiện phát âm."],["an efficient way to","ph","/ən ɪˈfɪʃənt ˈweɪ tə/","cách hiệu quả, ít tốn công sức (an efficient way to + V)","Cooking for the whole week is an efficient way to save time.","Nấu cho cả tuần là cách tiết kiệm thời gian hiệu quả."]],
210:[["I think that","ph","/aɪ ˈθɪŋk ðət/","tôi nghĩ rằng (I think (that) + mệnh đề)","I think that we should leave early.","Mình nghĩ chúng ta nên đi sớm."],["not be sure whether","ph","/nɑːt bi ˈʃʊr ˈweðɚ/","không chắc liệu (not be sure whether + mệnh đề)","I'm not sure whether she will come.","Mình không chắc cô ấy có đến không."],["seem to","ph","/ˈsiːm tə/","có vẻ như (seem to + V)","The new teacher seems to be very friendly.","Cô giáo mới có vẻ rất thân thiện."],["suggest that","ph","/səɡˈdʒest ðət/","cho thấy rằng (suggest that + mệnh đề)","The long queue suggests that the food is good.","Hàng dài cho thấy đồ ăn ngon."],["provide evidence for","ph","/prəˈvaɪd ˈevɪdəns fɚ/","đưa ra bằng chứng cho (provide evidence for + N)","The study provides evidence for the benefits of sleep.","Nghiên cứu đưa ra bằng chứng về lợi ích của giấc ngủ."],["rule out","ph","/ˌruːl ˈaʊt/","loại trừ (một khả năng) (rule out + N/V-ing)","We can't rule out the possibility of rain.","Chúng ta không thể loại trừ khả năng trời mưa."]],
301:[["fridge","n","/frɪdʒ/","tủ lạnh","Put the milk in the fridge.","Cất sữa vào tủ lạnh nhé."],["freezer","n","/ˈfriːzɚ/","ngăn đá, tủ đông","There's ice cream in the freezer.","Có kem trong ngăn đá."],["kitchen cabinet","n","/ˈkɪtʃən ˈkæbənət/","tủ bếp","The bowls are in the kitchen cabinet.","Bát ở trong tủ bếp."],["range hood","n","/ˈreɪndʒ hʊd/","máy hút mùi","Turn on the range hood when you cook.","Bật máy hút mùi khi nấu ăn."],["microwave","n","/ˈmaɪkroʊweɪv/","lò vi sóng","Heat the rice in the microwave.","Hâm cơm trong lò vi sóng."],["rice cooker","n","/ˈraɪs ˌkʊkɚ/","nồi cơm điện","Every Vietnamese kitchen has a rice cooker.","Bếp nhà người Việt nào cũng có nồi cơm điện."],["kettle","n","/ˈketəl/","ấm đun nước","I'll boil some water in the kettle.","Mình sẽ đun ít nước bằng ấm."],["stove","n","/stoʊv/","bếp nấu","Don't touch the stove. It's hot!","Đừng chạm vào bếp. Nóng đấy!"],["oven","n","/ˈʌvən/","lò nướng","The cake is in the oven.","Bánh đang ở trong lò."],["pot","n","/pɑːt/","nồi","She's making soup in a big pot.","Cô ấy đang nấu canh trong một cái nồi to."],["lid","n","/lɪd/","nắp, vung","Put the lid on the pot.","Đậy vung nồi lại."],["pan","n","/pæn/","chảo, xoong có cán","Heat some oil in a pan.","Làm nóng ít dầu trong chảo."],["frying pan","n","/ˈfraɪɪŋ pæn/","chảo rán","I fried two eggs in the frying pan.","Mình rán hai quả trứng bằng chảo."],["ladle","n","/ˈleɪdəl/","cái muôi, vá múc canh","Use the ladle to serve the soup.","Dùng muôi để múc canh."],["spatula","n","/ˈspætʃələ/","xẻng lật (chiên)","Turn the fish with a spatula.","Lật cá bằng xẻng."],["whisk","n","/wɪsk/","phới đánh trứng","Beat the eggs with a whisk.","Đánh trứng bằng phới."],["cutting board","n","/ˈkʌtɪŋ bɔːrd/","cái thớt","Cut the onions on the cutting board.","Thái hành trên thớt."],["knife","n","/naɪf/","con dao","Be careful. This knife is very sharp.","Cẩn thận nhé. Con dao này rất sắc."],["sink","n","/sɪŋk/","bồn rửa","The dirty dishes are in the sink.","Bát đĩa bẩn ở trong bồn rửa."],["faucet","n","/ˈfɔːsɪt/","vòi nước (Anh-Anh: tap)","Turn off the faucet, please.","Khóa vòi nước giúp mình nhé."],["sponge","n","/spʌndʒ/","miếng bọt biển rửa chén","I need a new sponge.","Mình cần miếng rửa chén mới."],["dish soap","n","/ˈdɪʃ soʊp/","nước rửa chén","We're out of dish soap.","Nhà mình hết nước rửa chén rồi."],["dish rack","n","/ˈdɪʃ ræk/","giá úp bát đĩa","Leave the plates on the dish rack to dry.","Để đĩa trên giá cho khô."],["dishwasher","n","/ˈdɪʃwɑːʃɚ/","máy rửa bát","Can you empty the dishwasher?","Bạn lấy bát ra khỏi máy rửa bát được không?"],["trash can","n","/ˈtræʃ kæn/","thùng rác (Anh-Anh: bin)","Throw it in the trash can.","Bỏ nó vào thùng rác."],["recycling bin","n","/riːˈsaɪklɪŋ bɪn/","thùng rác tái chế","Bottles go in the recycling bin.","Chai lọ bỏ vào thùng tái chế."],["drawer","n","/drɔːr/","ngăn kéo","The spoons are in the top drawer.","Thìa ở ngăn kéo trên cùng."],["plate","n","/pleɪt/","cái đĩa","Can you pass me a plate?","Đưa giúp mình cái đĩa được không?"],["bowl","n","/boʊl/","cái bát, tô","I eat a bowl of pho every morning.","Sáng nào mình cũng ăn một tô phở."],["cup","n","/kʌp/","cái tách, chén","Would you like a cup of tea?","Bạn uống một tách trà nhé?"],["glass","n","/ɡlæs/","cái cốc thủy tinh, ly","Can I have a glass of water?","Cho mình xin một ly nước nhé?"],["mug","n","/mʌɡ/","cốc có quai (to)","My favorite mug is blue.","Cái cốc yêu thích của mình màu xanh."],["spoon","n","/spuːn/","cái thìa, muỗng","Eat your soup with a spoon.","Ăn canh bằng thìa nhé."],["fork","n","/fɔːrk/","cái nĩa","Put the fork on the left of the plate.","Đặt nĩa bên trái đĩa."],["chopsticks","n","/ˈtʃɑːpstɪks/","đôi đũa","Can you use chopsticks?","Bạn dùng đũa được không?"]],
302:[["bed","n","/bed/","cái giường","I go to bed at eleven.","Mình đi ngủ lúc mười một giờ."],["pillow","n","/ˈpɪloʊ/","cái gối","This pillow is very soft.","Cái gối này rất mềm."],["blanket","n","/ˈblæŋkɪt/","cái chăn","It's cold. I need another blanket.","Lạnh quá. Mình cần thêm cái chăn."],["nightstand","n","/ˈnaɪtstænd/","tủ đầu giường","My phone is on the nightstand.","Điện thoại mình ở trên tủ đầu giường."],["lamp","n","/læmp/","đèn bàn, đèn ngủ","I read with the lamp on.","Mình đọc sách khi bật đèn."],["alarm clock","n","/əˈlɑːrm klɑːk/","đồng hồ báo thức","My alarm clock rings at six.","Đồng hồ báo thức của mình kêu lúc sáu giờ."],["closet","n","/ˈklɑːzɪt/","tủ quần áo (Anh-Anh: wardrobe)","Hang your jacket in the closet.","Treo áo khoác vào tủ quần áo."],["dresser","n","/ˈdresɚ/","tủ ngăn kéo đựng đồ","My T-shirts are in the dresser.","Áo phông của mình ở trong tủ ngăn kéo."],["mirror","n","/ˈmɪrɚ/","cái gương","She looked in the mirror.","Cô ấy soi gương."],["window","n","/ˈwɪndoʊ/","cửa sổ","Please open the window.","Mở cửa sổ giúp mình nhé."],["curtains","n","/ˈkɝːtənz/","rèm cửa","Close the curtains. It's too bright.","Kéo rèm lại đi. Chói quá."],["rug","n","/rʌɡ/","tấm thảm nhỏ","The cat is sleeping on the rug.","Con mèo đang ngủ trên thảm."],["poster","n","/ˈpoʊstɚ/","tranh áp phích","There's a poster on the wall.","Có một tấm áp phích trên tường."],["slippers","n","/ˈslɪpɚz/","dép đi trong nhà","Where are my slippers?","Dép của mình đâu rồi?"]],
303:[["shower","n","/ˈʃaʊɚ/","vòi hoa sen; tắm vòi sen","I take a shower every morning.","Sáng nào mình cũng tắm vòi sen."],["bathtub","n","/ˈbæθtʌb/","bồn tắm","The bathtub is full of water.","Bồn tắm đầy nước."],["shampoo","n","/ʃæmˈpuː/","dầu gội","This shampoo smells nice.","Dầu gội này thơm."],["towel","n","/ˈtaʊəl/","khăn tắm","Can I use this towel?","Mình dùng khăn này được không?"],["toilet","n","/ˈtɔɪlɪt/","bồn cầu; nhà vệ sinh","Don't forget to flush the toilet.","Đừng quên xả nước bồn cầu."],["toilet paper","n","/ˈtɔɪlɪt ˌpeɪpɚ/","giấy vệ sinh","We need more toilet paper.","Nhà mình cần thêm giấy vệ sinh."],["mirror","n","/ˈmɪrɚ/","cái gương","The mirror is foggy after a hot shower.","Gương mờ hơi nước sau khi tắm nước nóng."],["sink","n","/sɪŋk/","bồn rửa mặt","Wash your hands in the sink.","Rửa tay ở bồn rửa nhé."],["soap","n","/soʊp/","xà phòng","Wash your hands with soap.","Rửa tay bằng xà phòng."],["toothbrush","n","/ˈtuːθbrʌʃ/","bàn chải đánh răng","Change your toothbrush every three months.","Thay bàn chải ba tháng một lần."],["toothpaste","n","/ˈtuːθpeɪst/","kem đánh răng","Put a little toothpaste on your toothbrush.","Lấy một chút kem đánh răng lên bàn chải."],["bath mat","n","/ˈbæθ mæt/","thảm chùi chân phòng tắm","Stand on the bath mat after your shower.","Đứng lên thảm sau khi tắm."]],
304:[["couch","n","/kaʊtʃ/","ghế sofa (cũng nói sofa)","Let's sit on the couch and watch a movie.","Mình ngồi sofa xem phim đi."],["cushion","n","/ˈkʊʃən/","gối tựa","There are two cushions on the couch.","Có hai cái gối tựa trên sofa."],["armchair","n","/ˈɑːrmtʃer/","ghế bành","Grandpa sleeps in his armchair.","Ông ngủ trên ghế bành."],["coffee table","n","/ˈkɑːfi ˌteɪbəl/","bàn nước (thấp)","Put your cup on the coffee table.","Đặt cốc lên bàn nước nhé."],["remote control","n","/rɪˌmoʊt kənˈtroʊl/","điều khiển từ xa","Where's the remote control?","Cái điều khiển đâu rồi?"],["TV","n","/ˌtiːˈviː/","ti vi","What's on TV tonight?","Tối nay ti vi chiếu gì?"],["TV stand","n","/ˌtiːˈviː stænd/","kệ ti vi","The router is on the TV stand.","Cục phát wifi ở trên kệ ti vi."],["bookshelf","n","/ˈbʊkʃelf/","giá sách","My bookshelf is full of English books.","Giá sách của mình đầy sách tiếng Anh."],["floor lamp","n","/ˈflɔːr læmp/","đèn cây đứng","The floor lamp is next to the couch.","Đèn cây đứng cạnh sofa."],["clock","n","/klɑːk/","đồng hồ treo tường","The clock on the wall is slow.","Đồng hồ trên tường chạy chậm."],["picture frame","n","/ˈpɪktʃɚ freɪm/","khung ảnh","This picture frame has a family photo.","Khung ảnh này có ảnh gia đình."],["window","n","/ˈwɪndoʊ/","cửa sổ","The living room has a big window.","Phòng khách có cửa sổ lớn."],["plant","n","/plænt/","cây (cảnh)","Don't forget to water the plant.","Đừng quên tưới cây."],["rug","n","/rʌɡ/","tấm thảm","We bought a new rug for the living room.","Nhà mình mua thảm mới cho phòng khách."]],
305:[["whiteboard","n","/ˈwaɪtbɔːrd/","bảng trắng","The teacher writes on the whiteboard.","Cô giáo viết lên bảng trắng."],["marker","n","/ˈmɑːrkɚ/","bút lông viết bảng","This marker is out of ink.","Cây bút lông này hết mực rồi."],["map","n","/mæp/","bản đồ","Can you find Vietnam on the map?","Em tìm được Việt Nam trên bản đồ không?"],["bulletin board","n","/ˈbʊlətɪn bɔːrd/","bảng ghim thông báo","The test results are on the bulletin board.","Kết quả kiểm tra dán trên bảng thông báo."],["projector","n","/prəˈdʒektɚ/","máy chiếu","Please turn on the projector.","Bật máy chiếu giúp cô nhé."],["laptop","n","/ˈlæptɑːp/","máy tính xách tay","I do my homework on my laptop.","Mình làm bài tập trên máy tính xách tay."],["calculator","n","/ˈkælkjəleɪtɚ/","máy tính bỏ túi","You can't use a calculator in this test.","Bài kiểm tra này không được dùng máy tính."],["globe","n","/ɡloʊb/","quả địa cầu","Turn the globe and find Japan.","Xoay quả địa cầu và tìm Nhật Bản."],["desk","n","/desk/","bàn học, bàn làm việc","Put your books on your desk.","Đặt sách lên bàn."],["chair","n","/tʃer/","cái ghế","Please sit on the chair.","Mời ngồi lên ghế."],["backpack","n","/ˈbækpæk/","ba lô","My backpack is very heavy today.","Hôm nay ba lô của mình nặng lắm."],["notebook","n","/ˈnoʊtbʊk/","quyển vở","Write the new words in your notebook.","Ghi từ mới vào vở nhé."],["pencil","n","/ˈpensəl/","bút chì","Can I borrow a pencil?","Mình mượn cây bút chì được không?"],["eraser","n","/ɪˈreɪsɚ/","cục tẩy (Anh-Anh: rubber)","I made a mistake. Where's my eraser?","Mình viết sai rồi. Cục tẩy đâu nhỉ?"],["scissors","n","/ˈsɪzɚz/","cái kéo","Cut the paper with scissors.","Cắt giấy bằng kéo."],["ruler","n","/ˈruːlɚ/","thước kẻ","Draw a line with a ruler.","Kẻ một đường bằng thước."]],
306:[["shelf","n","/ʃelf/","kệ, giá hàng","The rice is on the bottom shelf.","Gạo ở kệ dưới cùng."],["bread","n","/bred/","bánh mì","I buy fresh bread every morning.","Sáng nào mình cũng mua bánh mì mới."],["cereal","n","/ˈsɪriəl/","ngũ cốc ăn sáng","My kids eat cereal with milk.","Các con mình ăn ngũ cốc với sữa."],["milk","n","/mɪlk/","sữa","We need two cartons of milk.","Mình cần hai hộp sữa."],["eggs","n","/eɡz/","trứng","A dozen eggs, please.","Cho mình một tá trứng."],["apples","n","/ˈæpəlz/","táo","These apples are sweet and fresh.","Mấy quả táo này ngọt và tươi."],["bananas","n","/bəˈnænəz/","chuối","Bananas are good for breakfast.","Chuối rất tốt cho bữa sáng."],["carrots","n","/ˈkerəts/","cà rốt","Rabbits love carrots.","Thỏ rất thích cà rốt."],["tomatoes","n","/təˈmeɪtoʊz/","cà chua","I need some tomatoes for the soup.","Mình cần ít cà chua để nấu canh."],["price tag","n","/ˈpraɪs tæɡ/","nhãn giá","Look at the price tag before you buy.","Xem nhãn giá trước khi mua."],["shopping cart","n","/ˈʃɑːpɪŋ kɑːrt/","xe đẩy mua sắm (Anh-Anh: trolley)","Let's get a shopping cart.","Mình lấy một xe đẩy đi."],["shopping basket","n","/ˈʃɑːpɪŋ ˌbæskɪt/","giỏ mua hàng","I only need a shopping basket today.","Hôm nay mình chỉ cần một giỏ."],["checkout","n","/ˈtʃekaʊt/","quầy thanh toán","There's a long line at the checkout.","Quầy thanh toán đang xếp hàng dài."],["cash register","n","/ˈkæʃ ˌredʒɪstɚ/","máy tính tiền","The cash register isn't working.","Máy tính tiền đang bị hỏng."],["cashier","n","/kæˈʃɪr/","nhân viên thu ngân","The cashier gave me my change.","Nhân viên thu ngân trả lại tiền thừa cho mình."],["shopping bag","n","/ˈʃɑːpɪŋ bæɡ/","túi mua sắm","Bring your own shopping bag.","Hãy mang theo túi mua sắm của bạn."]],
307:[["building","n","/ˈbɪldɪŋ/","tòa nhà","I work in that tall building.","Mình làm việc ở tòa nhà cao kia."],["tree","n","/triː/","cái cây","There's a big tree in front of my house.","Trước nhà mình có một cái cây to."],["bus stop","n","/ˈbʌs stɑːp/","trạm xe buýt","I'll wait for you at the bus stop.","Mình sẽ đợi bạn ở trạm xe buýt."],["streetlight","n","/ˈstriːtlaɪt/","đèn đường","The streetlights come on at six.","Đèn đường bật lúc sáu giờ."],["traffic light","n","/ˈtræfɪk laɪt/","đèn giao thông","Stop when the traffic light is red.","Dừng lại khi đèn giao thông màu đỏ."],["street sign","n","/ˈstriːt saɪn/","biển tên đường","Read the street sign to find the way.","Đọc biển tên đường để tìm đường."],["sidewalk","n","/ˈsaɪdwɔːk/","vỉa hè (Anh-Anh: pavement)","Please walk on the sidewalk.","Hãy đi trên vỉa hè."],["street","n","/striːt/","con đường, phố","My school is on this street.","Trường mình ở trên con phố này."],["crosswalk","n","/ˈkrɔːswɔːk/","vạch qua đường (Anh-Anh: zebra crossing)","Cross the street at the crosswalk.","Qua đường ở vạch dành cho người đi bộ."],["car","n","/kɑːr/","ô tô","My dad drives a red car.","Bố mình lái một chiếc ô tô màu đỏ."],["bus","n","/bʌs/","xe buýt","I go to work by bus.","Mình đi làm bằng xe buýt."],["motorbike","n","/ˈmoʊtɚbaɪk/","xe máy (cũng nói motorcycle)","Most people in Vietnam ride motorbikes.","Hầu hết người Việt đi xe máy."],["bicycle","n","/ˈbaɪsɪkəl/","xe đạp","I ride my bicycle to the park.","Mình đạp xe ra công viên."]],
308:[["grass","n","/ɡræs/","cỏ","Please keep off the grass.","Vui lòng không giẫm lên cỏ."],["tree","n","/triː/","cái cây","Let's sit under the tree.","Mình ngồi dưới gốc cây đi."],["kite","n","/kaɪt/","con diều","The children are flying a kite.","Bọn trẻ đang thả diều."],["swing","n","/swɪŋ/","cái xích đu","My daughter loves the swing.","Con gái mình rất thích xích đu."],["slide","n","/slaɪd/","cầu trượt","He went down the slide.","Cậu bé trượt xuống cầu trượt."],["seesaw","n","/ˈsiːsɔː/","bập bênh","You need two people for the seesaw.","Chơi bập bênh cần hai người."],["sandbox","n","/ˈsændbɑːks/","hố cát (Anh-Anh: sandpit)","The kids are building a castle in the sandbox.","Bọn trẻ đang xây lâu đài trong hố cát."],["bench","n","/bentʃ/","ghế dài","An old man is reading on the bench.","Một ông cụ đang đọc sách trên ghế dài."],["pond","n","/pɑːnd/","cái ao, hồ nhỏ","There are fish in the pond.","Có cá trong ao."],["duck","n","/dʌk/","con vịt","A duck is swimming in the pond.","Một con vịt đang bơi trong ao."],["flowers","n","/ˈflaʊɚz/","hoa","The flowers in the park are beautiful.","Hoa trong công viên đẹp quá."],["dog","n","/dɔːɡ/","con chó","She walks her dog every evening.","Tối nào cô ấy cũng dắt chó đi dạo."],["ball","n","/bɔːl/","quả bóng","Throw the ball to me!","Ném bóng cho mình nào!"]],
309:[["ceiling light","n","/ˈsiːlɪŋ laɪt/","đèn trần","The ceiling light is too bright.","Đèn trần sáng quá."],["chair","n","/tʃer/","cái ghế","Is this chair free?","Ghế này có ai ngồi chưa?"],["table","n","/ˈteɪbəl/","cái bàn","A table for two, please.","Cho mình một bàn hai người."],["tablecloth","n","/ˈteɪbəlklɔːθ/","khăn trải bàn","The tablecloth is white and clean.","Khăn trải bàn trắng và sạch."],["napkin","n","/ˈnæpkɪn/","khăn ăn","Could I have another napkin?","Cho mình xin thêm khăn ăn được không?"],["plate","n","/pleɪt/","cái đĩa","The plate is very hot.","Đĩa nóng lắm."],["glass","n","/ɡlæs/","cái ly","Can I have a glass of water?","Cho mình một ly nước nhé?"],["check","n","/tʃek/","hóa đơn (Anh-Anh: bill)","Could we have the check, please?","Cho chúng tôi xin hóa đơn."],["vase","n","/veɪs/","bình hoa","There's a small vase on every table.","Bàn nào cũng có một bình hoa nhỏ."],["waiter","n","/ˈweɪtɚ/","bồi bàn nam (nữ: waitress; chung: server)","The waiter brought our drinks.","Anh bồi bàn mang đồ uống ra."],["tray","n","/treɪ/","cái khay","He's carrying a tray of drinks.","Anh ấy đang bưng một khay đồ uống."],["menu","n","/ˈmenjuː/","thực đơn","Can I see the menu, please?","Cho mình xem thực đơn nhé?"]],

        <p class="qtext" style="font-size:30px;margin-bottom:4px">${esc(q.w[0])}</p><p class="ipa" style="margin:0 0 6px">${esc(q.w[2])} · ${TYPES[q.w[1]]||""}</p>${sp(q.w[0])}
        <div class="abcl" style="margin-top:14px">${q.o.map((o,j)=>`<button data-tq="${j}" class="${q.a==null?"":j===q.c?"right":j===q.a?"wrong":""}" ${q.a!=null?"disabled":""}><span class="lt">${"ABC"[j]}</span>${esc(o)}</button>`).join("")}</div>
        ${q.a!=null?`<p class="exp">${esc(q.w[4])} — ${esc(q.w[5])}</p><button class="btn solid" id="tqNext">${tvQ.i<tvQ.qs.length-1?"Câu tiếp →":"Xem kết quả"}</button>`:""}`;

  $("#tvOld").onclick=()=>{S.fTopic=null;S.view="flash";save();render();scrollTo({top:0})};

function mkQuiz(id){const ws=TV[id].slice(),all=Object.values(TV).flat();const pick=ws.sort(()=>Math.random()-.5).slice(0,Math.min(10,ws.length));
  return{i:0,ok:0,qs:pick.map(w=>{const pool=(ws.length>=4?ws:all).filter(x=>x[3]!==w[3]);const ds=pool.sort(()=>Math.random()-.5).slice(0,2).map(x=>x[3]);const o=[w[3],...ds].sort(()=>Math.random()-.5);return{w,o,c:o.indexOf(w[3]),a:null}})}}
