{t:"Quê hương & nơi ở",qs:[["Where is your hometown?","My hometown is Nam Dinh, a small city about two hours south of Hanoi. It's best known for its old churches and a very famous kind of pho.",["It's best known for …","about … south of …"]],["What do you like most about it?","I'd say the slow pace of life. People have time to chat with their neighbors, which is something I really miss now that I live in the capital.",["I'd say …","which is something I really miss"]],["Has it changed much in recent years?","Quite a lot, actually. There are more shopping malls and wider roads, but sadly some of the old buildings have been knocked down.",["Quite a lot, actually.","have been knocked down"]]],
card:{task:"Describe a place in your hometown that you like to visit.",b:["where it is","what it looks like","what you do there","and explain why you like it"],m:"I'd like to talk about a small lake near my parents' house in Nam Dinh. It's only about five minutes on foot from our front door, so I've been going there since I was a little girl.\n\nThe lake isn't very big, but it's surrounded by old trees, and there's a narrow path where people walk and jog. Early in the morning, you can see elderly people doing tai chi, and in the evening, families bring their kids to play.\n\nWhenever I go home, I usually walk around the lake with my mother after dinner. We chat about everything, from family news to my work in Hanoi. Sometimes I just sit on a bench and watch the sunset over the water.\n\nThe main reason I love this place is that it reminds me of my childhood. Life in Hanoi is so busy and noisy, but by the lake, everything slows down. It's the place where I feel most relaxed, and it always makes me feel that I'm really home."},
p3:[["Why do many young people leave their hometowns?","I think the main reason is job opportunities. Big cities offer higher salaries and more career options, especially in areas like technology and finance. In addition, young people are often attracted by the lifestyle in cities, such as entertainment and international culture. However, this can cause problems for smaller towns, which may be left with mostly elderly residents."],["What can local governments do to keep people in smaller towns?","One effective approach would be to attract businesses by offering tax benefits, so that more jobs are created locally. Improving public services, like hospitals and schools, is also essential, because families will not stay if their children cannot get a good education. Better internet connections could help too, since more people can now work remotely."]]},
{t:"Công việc",qs:[["What do you do?","I'm a nurse at a public hospital in Hanoi. I mainly work in the emergency department, so every day is different.",["I mainly work in …","so every day is different"]],["Why did you choose this job?","To be honest, my mother encouraged me at first, but over time I realized how rewarding it is to help people when they need it most.",["To be honest, …","over time I realized …"]],["Is there anything you dislike about your job?","The night shifts are tough. It's hard to keep a normal sleep pattern, and I sometimes miss family events.",["… are tough","keep a normal sleep pattern"]]],
card:{task:"Describe a time when you helped someone.",b:["who you helped","when and where it happened","what you did","and explain how you felt about it"],m:"I'd like to describe a time when I helped an elderly tourist who got lost in Hanoi last year.\n\nIt happened on a Sunday afternoon in the Old Quarter. I was buying coffee when I noticed a foreign woman in her seventies standing on the corner, looking confused and holding a paper map. I asked if she needed help, and she told me in English that she couldn't find her hotel and her phone battery was dead.\n\nI looked at the address on her hotel card, but the street names in that area are really confusing, so I decided to walk her there myself. It took about fifteen minutes, and on the way we chatted about her trip. She was from Canada and was traveling alone for the first time since her husband had passed away.\n\nWhen we finally reached the hotel, she thanked me so many times and even gave me a small maple leaf keyring. I felt really happy, not just because I'd helped her, but also because I'd been able to use my English in a real situation. It made me realize that small acts of kindness can mean a lot to someone far from home."},
p3:[["Do you think people today are less willing to help strangers?","In some ways, yes. In big cities, people are often busy and worried about safety, so they may hesitate to get involved. On the other hand, social media has made it easier to help others on a larger scale, for example by donating to charity campaigns. So I would say people still want to help, but the way they do it has changed."],["Should schools teach children to volunteer?","Absolutely. Volunteering teaches children empathy and responsibility, which are just as important as academic skills. For instance, cleaning a local park or visiting an elderly care home can show students how their actions affect the community. That said, it should be encouraged rather than forced, otherwise it might feel like just another task."]]},
{t:"Công nghệ",qs:[["How often do you use the internet?","Pretty much all day. I use it for work, for staying in touch with friends and, of course, for learning English.",["Pretty much all day.","staying in touch with …"]],["What do you mainly use your phone for?","Mostly messaging and watching short videos, if I'm being honest. I also use a couple of language apps on my way to work.",["if I'm being honest","on my way to work"]],["Do you think you spend too much time online?","Probably, yes. I've started turning off notifications in the evening, which has helped me sleep better.",["Probably, yes.","which has helped me …"]]],
card:{task:"Describe a piece of technology that you find useful.",b:["what it is","when you got it","how you use it","and explain why it is useful to you"],m:"The piece of technology I'd like to talk about is my e-reader, which is a small device for reading digital books.\n\nI got it as a birthday present from my husband about two years ago. Before that, I hardly ever read books because I didn't have time to go to bookstores, and paper books were too heavy to carry around.\n\nNow I take it with me almost everywhere. I read on the bus, during my lunch break and before I go to sleep. One feature I really love is the built-in dictionary. When I read in English and come across a new word, I just tap it and the meaning appears immediately. I can also highlight useful phrases and review them later.\n\nI find it incredibly useful because it has completely changed my reading habits. Last year, I finished about fifteen books, including several novels in English, which I never thought I could do. It's also much easier on my eyes than a phone screen. For me, it's the perfect combination of convenience and learning."},
p3:[["How has technology changed the way people communicate?","It has made communication much faster and cheaper. We can now video call someone on the other side of the world for free, which was unimaginable thirty years ago. However, some people argue that the quality of communication has declined, since many conversations happen through short messages rather than face-to-face."],["Do you think children should be allowed to use smartphones?","I believe it depends on their age and how the phone is used. For teenagers, a phone can be a useful tool for learning and staying safe. For young children, though, too much screen time may affect their sleep and their social skills, so parents should set clear limits."]]},
{t:"Ẩm thực",qs:[["What kind of food do you like?","I'm a big fan of Vietnamese street food, especially noodle dishes like pho and bun cha. They're cheap, quick and full of flavor.",["I'm a big fan of …","full of flavor"]],["Do you prefer eating at home or eating out?","During the week I usually eat out because I'm too tired to cook, but at weekends I love cooking for my family.",["During the week …, but at weekends …"]],["Has your diet changed since you were a child?","Yes, definitely. I eat far more fast food and sweet drinks than I used to, which is something I'm trying to cut down on.",["far more … than I used to","cut down on"]]],
card:{task:"Describe a memorable meal you had.",b:["where you had it","who you were with","what you ate","and explain why it was memorable"],m:"I'd like to talk about a meal I had on my wedding anniversary last spring.\n\nMy husband surprised me by booking a table at a small restaurant on the top floor of a building overlooking West Lake in Hanoi. I had no idea where we were going until we arrived, so it felt really special.\n\nWe had a set menu with five courses, mainly modern versions of traditional Vietnamese dishes. My favorite was the grilled fish with turmeric and dill, which was served with fresh herbs and rice noodles. For dessert, we had a mango cake that was light and not too sweet.\n\nThe meal was memorable for several reasons. First, the food was excellent, and the view of the lake at sunset was breathtaking. But more importantly, it was the first time in months that we had sat down and talked without our phones or our busy schedules getting in the way. It reminded me how important it is to make time for the people you love."},
p3:[["Why is fast food so popular nowadays?","The main reason is convenience. Many people work long hours and simply do not have time to cook, so fast food is an easy option. It is also relatively cheap and heavily advertised, particularly to young people. Delivery apps have made it even more accessible, since you can order a meal in just a few taps."],["Is traditional food losing its importance?","To some extent, yes, especially among young people in cities. However, I think traditional food still plays a central role in family life and festivals such as Tet. In fact, many young chefs are now reinventing traditional dishes, which could help to keep them popular."]]},
{t:"Học tập",qs:[["Are you working or studying?","I'm working full-time as a nurse, but I'm also studying English in the evenings because I'm preparing for the IELTS test.",["I'm working full-time as …","preparing for …"]],["What do you find most difficult about learning English?","Definitely listening to native speakers. They speak so fast and link words together, so I often miss the main idea.",["Definitely …","link words together"]],["How do you usually study?","I do a little every day, usually about an hour. I mix shadowing, vocabulary and writing so I don't get bored.",["I do a little every day","so I don't get bored"]]],
card:{task:"Describe a skill you would like to learn.",b:["what the skill is","how you would learn it","how long it would take","and explain why you want to learn it"],m:"A skill I'd really like to learn is swimming properly. I can float and move a little in the water, but I can't swim long distances, which is a bit embarrassing for someone who grew up near a river.\n\nI think the best way to learn would be to take lessons with a professional coach at a local pool. There's a sports center near my apartment that offers evening classes for adults, so it would fit around my work schedule. I'd also try to practice by myself at weekends.\n\nI imagine it would take around three months of regular lessons to swim confidently, although I'm sure it depends on how often I practice.\n\nThere are two main reasons why I want to learn. First, it's an important safety skill. Vietnam has a long coastline and lots of rivers, and I'd feel much more relaxed on beach holidays if I could swim well. Second, swimming is a great form of exercise that's gentle on your joints, so it's something I could continue doing for the rest of my life."},
p3:[["Is it better to learn new skills when you are young?","In many ways, yes. Children tend to pick up skills like languages and sports more quickly, and they often have more free time. However, adults have advantages too, such as stronger motivation and better study strategies. So while it may be easier when you are young, it is never too late to learn."],["Will online learning replace traditional classrooms?","I do not think it will replace them completely. Online learning is flexible and affordable, which makes it ideal for working adults. Nevertheless, classrooms offer face-to-face interaction and discipline that many students need, especially children. The most likely future is a combination of both."]]},
{t:"Sự kiện & lễ hội",qs:[["What's the most important festival in your country?","Without a doubt, Tet, the Lunar New Year. It's the time when families get together, and most people go back to their hometowns.",["Without a doubt, …","get together"]],["How do you usually celebrate it?","We clean and decorate the house, cook traditional dishes like banh chung, and visit relatives to wish them a happy new year.",["We clean and decorate …","wish them …"]],["Do you prefer big celebrations or quiet ones?","I'd go for quiet ones. Big parties can be fun, but I prefer spending time with a few close friends.",["I'd go for …","but I prefer …"]]],
card:{task:"Describe a celebration you enjoyed.",b:["what the celebration was","when and where it happened","who was there","and explain why you enjoyed it"],m:"I'd like to talk about my grandmother's eightieth birthday party, which took place in my hometown about a year ago.\n\nIt was held at my parents' house on a Sunday in March. Since turning eighty is considered a very special milestone in Vietnam, the whole family worked together to prepare it. My aunts spent two days cooking traditional dishes, and my cousins and I decorated the yard with red banners and flowers.\n\nAround fifty people came, including relatives from all over the country, some of whom I hadn't seen for years. There were also neighbors and my grandmother's old friends from her village.\n\nWhat I enjoyed most was the moment when all the grandchildren lined up to wish her a long and healthy life. She was so moved that she cried a little, and then she told us stories about her childhood that I had never heard before. It was a warm and emotional day, and it made me realize how lucky I am to have such a close family."},
p3:[["Why do people spend a lot of money on celebrations?","Partly because celebrations are seen as a way to show respect and gratitude, for example at weddings or important birthdays. There is also social pressure, since families may worry about what others think. In some cases, though, this leads people to spend more than they can afford, which can cause financial stress."],["Are traditional festivals still important to young people?","I would say they are, although the way young people celebrate is changing. Many still return home for Tet and value spending time with family. However, they may combine traditions with modern activities, such as traveling abroad during the holiday. I think this mix helps festivals stay relevant."]]}]];

[["Mình tên là Lan. Bạn có thể gọi mình là Lan.","Mình đến từ Nam Định, nhưng giờ mình sống ở Hà Nội.","Mình là y tá. Mình làm việc ở một bệnh viện trong thành phố.","Vì mình muốn đi du lịch và có công việc tốt hơn."],

["Mình sống trong một căn hộ. Nó ở tầng năm.","Có hai phòng ngủ, một bếp và một phòng khách.","Phòng mình thích nhất là bếp vì mình mê nấu ăn.","Không. Khá ồn, nhưng tiện."]],
[["Hè năm ngoái mình đi Đà Nẵng với gia đình. Bọn mình ở gần biển bốn ngày.","Sáng nào bọn mình cũng bơi, buổi tối thì thử rất nhiều hải sản. Tuyệt lắm.","Mình thích núi hơn vì mát và yên tĩnh hơn. Ví dụ, mình rất mê Sa Pa.","Mình rất muốn đi Nhật, vì mình muốn ngắm hoa anh đào."],

["Mình đi mua sắm khoảng hai lần một tháng, thường vào cuối tuần.","Mình thích mua online hơn vì rẻ hơn và làm ở nhà được. Nhưng mua giày thì mình ra cửa hàng.","Tuần trước mình mua một chiếc áo khoác mới vì trời đang lạnh dần.","Có. Chợ địa phương nhộn nhịp và đồ ăn tươi."],
["Hôm nay trời khá mát và nhiều mây. Mình nghĩ lát nữa có thể mưa.","Mình thích mùa thu vì thời tiết mát và bầu trời đẹp.","Mình thường ở nhà, uống trà và xem phim.","Không. Trời mưa cả cuối tuần nên bọn mình ở nhà."],
["Không nhiều, nhưng mình có ba người bạn thân từ hồi cấp ba.","Bọn mình thường gặp nhau uống cà phê và tám hàng giờ. Thỉnh thoảng bọn mình đi xem phim.","Cô ấy vui tính và rất tốt bụng. Cô ấy luôn lắng nghe chuyện của mình.","Bọn mình quen nhau ở trường năm mười lăm tuổi. Bọn mình ngồi cạnh nhau."],
["Mình định về thăm bố mẹ và phụ bố mẹ làm vườn.","Mình định thi IELTS và có thể đi nước ngoài.","Có thể. Mình muốn thử sống ở Úc vài năm.","Mình hy vọng sẽ là điều dưỡng trưởng ở một bệnh viện lớn."]],
[["Thật lòng thì lúc nào cũng dùng. Mình dùng để làm việc, nhắn tin với gia đình và học tiếng Anh. Chắc mình dùng khoảng năm tiếng một ngày, có lẽ là quá nhiều.","Mình nghĩ vậy. Nhiều người lướt hàng giờ mà không để ý. Ví dụ, khi mình đi xe buýt, gần như ai cũng nhìn điện thoại thay vì nói chuyện.","Chắc là Google Maps. Mình rất kém nhớ đường nên lần nào đến chỗ mới cũng dùng.","Phần lớn là có. Chúng ta có thể thanh toán, mua sắm và học online. Nhưng nó cũng khiến mình khó tách khỏi công việc hơn."],
["Mình cố đi bộ ba mươi phút mỗi ngày và ăn nhiều rau hơn. Mình cũng đã bỏ trà sữa, lúc đầu khó lắm.","Còn tùy. Giờ có bệnh viện tốt hơn, nhưng người ta ít vận động và ăn nhiều đồ ăn nhanh hơn, nên ở một số mặt thì kém khỏe hơn.","Mình thường nghe nhạc hoặc đi dạo. Nói chuyện với bạn bè cũng giúp rất nhiều.","Thật ra khá dễ. Chợ tươi có ở khắp nơi. Vấn đề là đồ ăn đường phố rẻ và hấp dẫn quá."],
["Mình thích đồ ăn và sự sôi động. Lúc nào cũng có chuyện để làm, kể cả đêm khuya.","Chắc chắn mình sẽ cải thiện giao thông công cộng. Giờ cao điểm kẹt xe kinh khủng và không khí khá ô nhiễm.","Có lẽ khi về già. Giờ mình cần ở thành phố vì công việc, nhưng một ngày nào đó mình muốn sống yên bình hơn.","Thay đổi nhiều lắm. Có nhiều tòa nhà mới và một tuyến metro, nhưng ít không gian xanh hơn trước."],
["Mình rất thích môn sinh vì mình tò mò về cơ thể người. Chắc vì thế mà mình làm y tá.","Ở một mức độ nào đó. Nó giúp học sinh luyện tập, nhưng quá nhiều bài tập có thể khiến các em căng thẳng và mệt.","Có, chắc chắn rồi. Đó là cơ hội tuyệt vời để cải thiện tiếng Anh và trải nghiệm một nền văn hóa mới.","Với mình, kết hợp là tốt nhất. Mình học từ vựng một mình, nhưng cần nhóm để luyện nói."],
["Chắc chắn là đi cùng người khác. Chia sẻ trải nghiệm vui hơn, mà cũng an toàn hơn.","Có lẽ là vịnh Hạ Long. Mình đến đó hai năm trước, cảnh nhìn từ thuyền thật ngoạn mục.","Mình đọc đánh giá trên mạng và lên kế hoạch đơn giản, nhưng luôn chừa thời gian để khám phá.","Có, khá nhiều. Giờ có nhiều khách sạn và quán cà phê hơn, tốt cho việc làm, nhưng cũng đông đúc hơn."],
["Mình cố gắng. Ở nhà mình phân loại chai nhựa và giấy, nhưng không phải lúc nào cũng dễ vì không có nhiều thùng tái chế.","Chắc chắn là ô nhiễm không khí. Có hôm bầu trời xám xịt và mọi người phải đeo khẩu trang ra ngoài.","Thật ra khá nhiều. Chúng ta có thể dùng ít nhựa hơn, đi phương tiện công cộng và tiết kiệm điện ở nhà.","Mình nghĩ vậy. Cá nhân có thể giúp, nhưng chỉ chính phủ mới tạo ra thay đổi lớn, như đầu tư vào năng lượng sạch."]],
[["Quê mình là Nam Định, một thành phố nhỏ cách Hà Nội khoảng hai tiếng về phía nam. Nơi đây nổi tiếng với những nhà thờ cổ và một loại phở rất nổi tiếng.","Mình nghĩ là nhịp sống chậm. Mọi người có thời gian trò chuyện với hàng xóm, đó là điều mình rất nhớ từ khi lên thủ đô sống.","Thật ra thay đổi khá nhiều. Có thêm trung tâm thương mại và đường rộng hơn, nhưng tiếc là một số tòa nhà cũ đã bị phá bỏ.",
"Mình muốn kể về một cái hồ nhỏ gần nhà bố mẹ ở Nam Định. Từ cửa nhà đi bộ chỉ năm phút, nên mình đã ra đó từ khi còn bé.\n\nHồ không lớn lắm, nhưng xung quanh có những hàng cây cổ thụ và một lối đi nhỏ cho người đi bộ, chạy bộ. Sáng sớm, các cụ già tập thái cực quyền, còn buổi tối các gia đình dẫn con ra chơi.\n\nMỗi lần về nhà, mình thường đi dạo quanh hồ với mẹ sau bữa tối. Hai mẹ con nói đủ chuyện, từ tin tức gia đình đến công việc của mình ở Hà Nội. Thỉnh thoảng mình chỉ ngồi trên ghế đá ngắm hoàng hôn trên mặt nước.\n\nLý do chính mình yêu nơi này là vì nó gợi nhớ tuổi thơ. Cuộc sống ở Hà Nội quá bận rộn và ồn ào, nhưng bên hồ mọi thứ chậm lại. Đó là nơi mình thấy thư thái nhất và luôn khiến mình cảm thấy thật sự được về nhà.",
"Mình nghĩ lý do chính là cơ hội việc làm. Thành phố lớn có lương cao hơn và nhiều lựa chọn nghề nghiệp hơn, nhất là công nghệ và tài chính. Ngoài ra, người trẻ thường bị cuốn hút bởi lối sống thành thị như giải trí và văn hóa quốc tế. Tuy nhiên, điều này có thể gây khó khăn cho các thị trấn nhỏ, nơi có thể chỉ còn lại chủ yếu người già.","Một cách hiệu quả là thu hút doanh nghiệp bằng ưu đãi thuế để tạo thêm việc làm tại địa phương. Cải thiện dịch vụ công như bệnh viện và trường học cũng rất cần thiết, vì các gia đình sẽ không ở lại nếu con cái không được học hành tốt. Internet tốt hơn cũng có thể giúp ích, vì giờ nhiều người có thể làm việc từ xa."],
["Mình là y tá ở một bệnh viện công tại Hà Nội. Mình chủ yếu làm ở khoa cấp cứu nên ngày nào cũng khác nhau.","Thật lòng thì lúc đầu mẹ mình khuyến khích, nhưng dần dần mình nhận ra giúp đỡ người khác lúc họ cần nhất ý nghĩa đến thế nào.","Trực đêm rất vất vả. Khó giữ giấc ngủ bình thường, và đôi khi mình lỡ những dịp sum họp gia đình.",
"Mình muốn kể về lần giúp một du khách lớn tuổi bị lạc ở Hà Nội năm ngoái.\n\nChuyện xảy ra vào một chiều Chủ nhật ở phố cổ. Mình đang mua cà phê thì thấy một bà cụ người nước ngoài khoảng bảy mươi tuổi đứng ở góc phố, trông bối rối và cầm tấm bản đồ giấy. Mình hỏi bà có cần giúp không, bà nói bằng tiếng Anh rằng không tìm được khách sạn và điện thoại đã hết pin.\n\nMình xem địa chỉ trên thẻ khách sạn, nhưng tên đường ở khu đó rất dễ nhầm, nên mình quyết định tự dẫn bà đến. Mất khoảng mười lăm phút, trên đường hai bà cháu trò chuyện về chuyến đi. Bà đến từ Canada và lần đầu đi du lịch một mình kể từ khi chồng mất.\n\nKhi đến khách sạn, bà cảm ơn mình rất nhiều lần và còn tặng mình một móc khóa hình lá phong. Mình thấy rất vui, không chỉ vì đã giúp được bà mà còn vì được dùng tiếng Anh trong tình huống thật. Nó khiến mình nhận ra những hành động tử tế nhỏ có thể rất ý nghĩa với một người xa nhà.",
"Ở một số mặt thì đúng vậy. Ở thành phố lớn, mọi người thường bận rộn và lo về an toàn nên có thể ngần ngại. Mặt khác, mạng xã hội giúp việc giúp đỡ người khác trên quy mô lớn dễ hơn, ví dụ quyên góp cho các chiến dịch từ thiện. Nên mình nghĩ mọi người vẫn muốn giúp, chỉ là cách giúp đã thay đổi.","Hoàn toàn nên. Tình nguyện dạy trẻ sự đồng cảm và trách nhiệm, quan trọng không kém kiến thức học thuật. Ví dụ, dọn dẹp công viên hay thăm viện dưỡng lão giúp học sinh thấy hành động của mình ảnh hưởng đến cộng đồng thế nào. Tuy vậy, nên khuyến khích chứ đừng ép buộc, nếu không nó sẽ chỉ như thêm một nhiệm vụ nữa."],
["Gần như cả ngày. Mình dùng để làm việc, giữ liên lạc với bạn bè và tất nhiên là học tiếng Anh.","Nói thật thì chủ yếu là nhắn tin và xem video ngắn. Mình cũng dùng vài ứng dụng học ngôn ngữ trên đường đi làm.","Chắc là có. Mình bắt đầu tắt thông báo vào buổi tối, điều đó giúp mình ngủ ngon hơn.",
"Thiết bị công nghệ mình muốn nói đến là máy đọc sách điện tử, một thiết bị nhỏ để đọc sách số.\n\nChồng mình tặng nó làm quà sinh nhật khoảng hai năm trước. Trước đó mình hầu như không đọc sách vì không có thời gian ra hiệu sách, và sách giấy thì nặng khi mang theo.\n\nGiờ mình mang nó gần như đi khắp nơi. Mình đọc trên xe buýt, giờ nghỉ trưa và trước khi ngủ. Tính năng mình rất thích là từ điển tích hợp. Khi đọc tiếng Anh gặp từ mới, mình chỉ cần chạm vào là nghĩa hiện ra ngay. Mình cũng có thể đánh dấu cụm từ hay để ôn lại sau.\n\nMình thấy nó vô cùng hữu ích vì đã thay đổi hoàn toàn thói quen đọc của mình. Năm ngoái mình đọc xong khoảng mười lăm cuốn, có cả vài tiểu thuyết tiếng Anh, điều mình chưa từng nghĩ là làm được. Nó cũng đỡ hại mắt hơn màn hình điện thoại nhiều. Với mình, đó là sự kết hợp hoàn hảo giữa tiện lợi và học tập.",
"Nó giúp giao tiếp nhanh hơn và rẻ hơn nhiều. Giờ chúng ta có thể gọi video miễn phí cho người ở bên kia thế giới, điều không thể tưởng tượng ba mươi năm trước. Tuy nhiên, một số người cho rằng chất lượng giao tiếp đã giảm, vì nhiều cuộc trò chuyện diễn ra qua tin nhắn ngắn thay vì gặp mặt.","Mình nghĩ còn tùy vào độ tuổi và cách dùng. Với thiếu niên, điện thoại có thể là công cụ hữu ích để học và giữ an toàn. Còn với trẻ nhỏ, dùng màn hình quá nhiều có thể ảnh hưởng đến giấc ngủ và kỹ năng xã hội, nên bố mẹ cần đặt giới hạn rõ ràng."],
["Mình rất mê đồ ăn đường phố Việt Nam, nhất là các món nước như phở và bún chả. Rẻ, nhanh và rất đậm đà.","Ngày thường mình hay ăn ngoài vì mệt quá không nấu nổi, nhưng cuối tuần mình rất thích nấu cho gia đình.","Có, chắc chắn rồi. Mình ăn đồ ăn nhanh và đồ uống ngọt nhiều hơn hồi trước nhiều, đó là điều mình đang cố giảm bớt.",
"Mình muốn kể về bữa ăn trong ngày kỷ niệm ngày cưới mùa xuân năm ngoái.\n\nChồng mình làm mình bất ngờ khi đặt bàn ở một nhà hàng nhỏ trên tầng thượng một tòa nhà nhìn ra Hồ Tây. Mình không biết sẽ đi đâu cho đến khi tới nơi, nên cảm thấy rất đặc biệt.\n\nBọn mình ăn set năm món, chủ yếu là các món truyền thống Việt Nam làm theo phong cách hiện đại. Món mình thích nhất là cá nướng nghệ thì là, ăn với rau thơm và bún. Tráng miệng là bánh xoài nhẹ, không quá ngọt.\n\nBữa ăn đáng nhớ vì nhiều lý do. Trước hết, đồ ăn rất ngon và cảnh hồ lúc hoàng hôn thật ngoạn mục. Nhưng quan trọng hơn, đó là lần đầu tiên sau nhiều tháng bọn mình ngồi xuống trò chuyện mà không có điện thoại hay lịch làm việc chen ngang. Nó nhắc mình rằng dành thời gian cho người mình yêu quan trọng đến thế nào.",
"Lý do chính là sự tiện lợi. Nhiều người làm việc nhiều giờ và đơn giản là không có thời gian nấu ăn, nên đồ ăn nhanh là lựa chọn dễ dàng. Nó cũng tương đối rẻ và được quảng cáo rầm rộ, đặc biệt nhắm vào người trẻ. Ứng dụng giao đồ ăn còn khiến nó dễ tiếp cận hơn, chỉ vài lần chạm là đặt được món.","Ở một mức độ nào đó thì có, nhất là với người trẻ ở thành phố. Tuy nhiên, mình nghĩ món ăn truyền thống vẫn giữ vai trò trung tâm trong đời sống gia đình và các dịp lễ như Tết. Thật ra, nhiều đầu bếp trẻ đang sáng tạo lại món truyền thống, điều đó có thể giúp chúng tiếp tục được yêu thích."],
["Mình đang đi làm toàn thời gian là y tá, nhưng buổi tối mình cũng học tiếng Anh vì đang chuẩn bị thi IELTS.","Chắc chắn là nghe người bản xứ nói. Họ nói rất nhanh và nối các từ với nhau nên mình hay bỏ lỡ ý chính.","Mỗi ngày mình học một chút, thường khoảng một tiếng. Mình kết hợp shadowing, từ vựng và viết để không thấy chán.",
"Một kỹ năng mình rất muốn học là bơi cho đúng cách. Mình nổi được và bơi được một chút, nhưng không bơi xa được, hơi ngại với người lớn lên gần sông.\n\nMình nghĩ cách tốt nhất là học với huấn luyện viên chuyên nghiệp ở bể bơi gần nhà. Gần căn hộ mình có một trung tâm thể thao mở lớp buổi tối cho người lớn, nên phù hợp với lịch làm việc. Mình cũng sẽ cố tự tập vào cuối tuần.\n\nMình đoán sẽ mất khoảng ba tháng học đều đặn để bơi tự tin, dù chắc còn tùy mình tập thường xuyên đến đâu.\n\nCó hai lý do chính khiến mình muốn học. Thứ nhất, đó là kỹ năng an toàn quan trọng. Việt Nam có bờ biển dài và nhiều sông, và mình sẽ thấy thoải mái hơn nhiều khi đi biển nếu bơi giỏi. Thứ hai, bơi là môn thể thao tuyệt vời mà nhẹ nhàng với khớp, nên mình có thể tập suốt đời.",
"Ở nhiều mặt thì đúng vậy. Trẻ em thường học các kỹ năng như ngôn ngữ và thể thao nhanh hơn, và thường có nhiều thời gian rảnh hơn. Tuy nhiên, người lớn cũng có lợi thế, như động lực mạnh hơn và phương pháp học tốt hơn. Nên dù học khi còn trẻ có thể dễ hơn, học lúc nào cũng không muộn.","Mình không nghĩ nó sẽ thay thế hoàn toàn. Học online linh hoạt và rẻ, rất phù hợp với người đi làm. Tuy nhiên, lớp học mang lại sự tương tác trực tiếp và tính kỷ luật mà nhiều học sinh cần, đặc biệt là trẻ em. Tương lai có khả năng nhất là kết hợp cả hai."],
["Chắc chắn là Tết Nguyên đán. Đó là dịp gia đình sum họp và hầu hết mọi người về quê.","Nhà mình dọn dẹp và trang trí nhà cửa, nấu các món truyền thống như bánh chưng, và đi thăm họ hàng để chúc năm mới.","Mình chọn kiểu nhẹ nhàng. Tiệc lớn có thể vui, nhưng mình thích dành thời gian với vài người bạn thân hơn.",
"Mình muốn kể về tiệc mừng thọ tám mươi tuổi của bà, tổ chức ở quê khoảng một năm trước.\n\nTiệc được tổ chức ở nhà bố mẹ mình vào một Chủ nhật tháng Ba. Vì tròn tám mươi tuổi được coi là cột mốc rất đặc biệt ở Việt Nam, cả gia đình cùng nhau chuẩn bị. Các dì nấu các món truyền thống suốt hai ngày, còn mình và các anh chị em họ trang trí sân bằng băng rôn đỏ và hoa.\n\nKhoảng năm mươi người đến, gồm họ hàng từ khắp nơi, có người mình đã nhiều năm không gặp. Còn có hàng xóm và bạn cũ của bà ở làng.\n\nĐiều mình thích nhất là lúc tất cả các cháu xếp hàng chúc bà sống lâu, mạnh khỏe. Bà xúc động đến rơi nước mắt, rồi kể cho bọn mình nghe chuyện thời thơ ấu mà mình chưa từng được nghe. Đó là một ngày ấm áp và xúc động, khiến mình nhận ra mình may mắn thế nào khi có một gia đình gắn bó như vậy.",
"Một phần vì lễ kỷ niệm được xem là cách thể hiện sự tôn trọng và biết ơn, ví dụ đám cưới hay sinh nhật quan trọng. Cũng có áp lực xã hội, vì các gia đình lo người khác nghĩ gì. Tuy nhiên, đôi khi điều này khiến người ta chi tiêu quá khả năng, gây căng thẳng về tài chính.","Mình nghĩ là vẫn quan trọng, dù cách người trẻ ăn mừng đang thay đổi. Nhiều người vẫn về quê ăn Tết và trân trọng thời gian bên gia đình. Tuy nhiên, họ có thể kết hợp truyền thống với hoạt động hiện đại, như đi du lịch nước ngoài trong kỳ nghỉ. Mình nghĩ sự kết hợp này giúp lễ hội luôn có ý nghĩa."]]];

{t:"Phim & âm nhạc",qs:[["What kind of movies do you like?","I like comedies because they make me laugh after a long day.",["I like … because …"],"Mình thích phim hài vì chúng làm mình cười sau một ngày dài."],["What's the last movie you watched?","I watched an animated movie with my son last weekend. It was really funny.",["I watched … last weekend.","It was …"],"Cuối tuần trước mình xem một bộ phim hoạt hình với con trai. Phim rất vui."],["Do you prefer watching movies at home or at the cinema?","At home, because it's cheaper and more comfortable. But for big action movies, the cinema is better.",["At home, because …","But for …, … is better."],"Ở nhà, vì rẻ hơn và thoải mái hơn. Nhưng phim hành động lớn thì xem rạp hay hơn."],["Who's your favorite singer?","I really like Adele. Her voice is amazing, and her songs are very emotional.",["I really like …","Her voice is …"],"Mình rất thích Adele. Giọng cô ấy tuyệt vời và các bài hát rất cảm xúc."]]},
{t:"Nhà hàng & gọi món",qs:[["How often do you eat out?","About once a week, usually on Saturday evenings with my family.",["About once a week, usually …"],"Khoảng một lần một tuần, thường vào tối thứ Bảy với gia đình."],["What do you usually order?","I usually order grilled fish or a noodle soup. I don't eat much meat.",["I usually order …"],"Mình thường gọi cá nướng hoặc một món nước. Mình không ăn nhiều thịt."],["Have you ever had a bad experience at a restaurant?","Yes. Once I waited an hour for my food, and it was cold when it arrived.",["Yes. Once I …","and it was … when …"],"Có. Một lần mình đợi đồ ăn cả tiếng, lúc mang ra thì nguội ngắt."],["Do you leave a tip?","Sometimes, if the service is really good. In Vietnam, it's not necessary.",["Sometimes, if …","it's not necessary"],"Thỉnh thoảng, nếu phục vụ thật sự tốt. Ở Việt Nam thì không bắt buộc."]]},

{t:"Công việc & sự nghiệp",qs:[["What would your dream job be?","I'd love to work as a nurse in an international hospital. It would let me use my English every day and meet people from different cultures.",["I'd love to work as …","It would let me …"],"Mình rất muốn làm y tá ở một bệnh viện quốc tế. Công việc đó cho mình dùng tiếng Anh hằng ngày và gặp người từ nhiều nền văn hóa."],["Is money the most important thing in a job?","Not for me. Of course a good salary matters, but I think enjoying your work and having nice colleagues are more important in the long run.",["Not for me.","Of course … matters, but …","in the long run"],"Với mình thì không. Tất nhiên lương tốt rất quan trọng, nhưng về lâu dài mình nghĩ yêu công việc và có đồng nghiệp tốt quan trọng hơn."],["Would you prefer to work for a big company or a small one?","Probably a big one, because there are more chances for training and promotion. Small companies can feel friendlier, though.",["Probably …, because …","…, though."],"Có lẽ là công ty lớn, vì có nhiều cơ hội đào tạo và thăng tiến hơn. Dù vậy, công ty nhỏ có thể thân thiện hơn."],["How do you deal with pressure at work?","I make a list of tasks and do the most urgent ones first. If I'm really stressed, I take a short walk to clear my head.",["I make a list of …","to clear my head"],"Mình lập danh sách công việc và làm việc gấp nhất trước. Nếu thật sự căng thẳng, mình đi dạo một chút cho đầu óc thoáng."]]},
{t:"Quảng cáo & mua sắm",qs:[["Do adverts influence what you buy?","Sometimes, even if I don't want to admit it. For example, I bought a skincare product after seeing it again and again on social media.",["even if I don't want to admit it","again and again"],"Đôi khi có, dù mình không muốn thừa nhận. Ví dụ, mình đã mua một sản phẩm chăm sóc da sau khi thấy nó lặp đi lặp lại trên mạng xã hội."],["Do you compare prices before buying something?","Yes, especially for expensive things like phones. I usually check two or three websites and read reviews first.",["especially for …","read reviews first"],"Có, nhất là đồ đắt như điện thoại. Mình thường xem hai ba trang web và đọc đánh giá trước."],["Have you ever regretted buying something?","Yes, an expensive pair of shoes. They looked great online, but they were really uncomfortable, so I hardly ever wear them.",["They looked great online, but …","hardly ever"],"Có, một đôi giày đắt tiền. Trên mạng trông rất đẹp nhưng đi rất khó chịu, nên mình gần như không bao giờ mang."],["Is shopping a good way to relax?","For some people, maybe. But for me, it can be stressful, especially in crowded malls. I prefer walking in a park.",["For some people, maybe.","especially in …"],"Với một số người thì có thể. Nhưng với mình nó có thể gây căng thẳng, nhất là ở trung tâm thương mại đông đúc. Mình thích đi dạo công viên hơn."]]},
{t:"Gia đình & các thế hệ",qs:[["Do you live with your family?","I live with my husband and son, and my parents-in-law live just around the corner, so we see them almost every day.",["just around the corner","almost every day"],"Mình sống với chồng và con trai, bố mẹ chồng ở ngay gần nhà nên gần như ngày nào cũng gặp."],["Is it common for three generations to live together in Vietnam?","It used to be very common, and it still is in the countryside. In cities, though, more young couples prefer to live on their own.",["It used to be …","prefer to live on their own"],"Trước đây rất phổ biến, và ở nông thôn vẫn vậy. Nhưng ở thành phố, nhiều cặp vợ chồng trẻ thích sống riêng hơn."],["What can young people learn from older people?","Quite a lot, I think. My grandmother taught me patience and how to cook traditional dishes, which I could never learn from the internet.",["Quite a lot, I think.","which I could never …"],"Mình nghĩ là rất nhiều. Bà dạy mình sự kiên nhẫn và cách nấu các món truyền thống, những điều mình không bao giờ học được trên mạng."],["Do you argue with your family?","Sometimes, mostly about small things like housework. But we always talk it through and make up quickly.",["mostly about small things like …","talk it through"],"Đôi khi, chủ yếu về chuyện nhỏ như việc nhà. Nhưng cả nhà luôn nói chuyện thẳng thắn và làm lành nhanh."]]},
{t:"Thể thao & giải trí",qs:[["Do you play any sports?","Not regularly, but I play badminton with my colleagues every Friday evening. It's a great way to relax after work.",["Not regularly, but …","It's a great way to …"],"Không thường xuyên, nhưng tối thứ Sáu nào mình cũng chơi cầu lông với đồng nghiệp. Đó là cách tuyệt vời để thư giãn sau giờ làm."],["Do you like watching sports on TV?","Only big events like the World Cup. The atmosphere is amazing when the whole country is watching the same match.",["Only big events like …","the whole country"],"Chỉ những sự kiện lớn như World Cup. Không khí tuyệt vời khi cả nước cùng xem một trận đấu."],["Why do some people not do any exercise?","I think the main reason is lack of time. Many people work long hours and feel too tired to exercise in the evening.",["I think the main reason is …","feel too tired to …"],"Mình nghĩ lý do chính là thiếu thời gian. Nhiều người làm việc nhiều giờ và quá mệt để tập vào buổi tối."],["Should schools have more PE lessons?","Yes, definitely. Kids spend too much time sitting in class and in front of screens, so they need more chances to move.",["Yes, definitely.","so they need more chances to …"],"Có, chắc chắn rồi. Trẻ em ngồi trong lớp và trước màn hình quá nhiều, nên cần thêm cơ hội vận động."]]}],

{t:"Sách & đọc",qs:[["Do you like reading?","Yes, I do, although I don't have as much time as I'd like. I mostly read on my phone or e-reader during my commute.",["although I don't have as much time as I'd like","during my commute"],"Có, dù mình không có nhiều thời gian như mong muốn. Mình chủ yếu đọc trên điện thoại hoặc máy đọc sách lúc đi làm."],["What kind of books do you enjoy?","I'm really into self-help books and short novels. I like stories that are easy to follow but still make me think.",["I'm really into …","make me think"],"Mình rất thích sách phát triển bản thân và tiểu thuyết ngắn. Mình thích những câu chuyện dễ theo dõi nhưng vẫn khiến mình suy ngẫm."],["Did you read a lot as a child?","Not really, to be honest. I preferred playing outside, but my mother used to read me fairy tales before bed.",["Not really, to be honest.","used to read me …"],"Thật lòng thì không nhiều. Mình thích chơi ngoài trời hơn, nhưng mẹ thường đọc truyện cổ tích cho mình trước khi ngủ."]],
card:{task:"Describe a book you have read that you found interesting.",b:["what the book was","when you read it","what it was about","and explain why you found it interesting"],m:"I'd like to talk about a book called Atomic Habits by James Clear, which I read about a year ago when I was trying to build better study habits.\n\nThe book is about how small changes in our daily routines can lead to big results over time. The author explains that instead of setting huge goals, we should focus on improving by just one percent every day. He also gives practical tips, such as linking a new habit to something you already do, or making bad habits harder to do.\n\nI found it interesting for a few reasons. First, it was very easy to read, with lots of real-life examples. But more importantly, it actually changed my behavior. For example, I started reviewing English vocabulary every morning while drinking my coffee, and after a few months I'd learned hundreds of new words without feeling stressed.\n\nWhat I liked most is that the book made me realize that motivation isn't enough. You need a system. I've recommended it to several friends, and I still read my notes from it whenever I feel lazy.",vi:"Mình muốn kể về cuốn sách Atomic Habits (Thói quen nguyên tử) của James Clear, mình đọc khoảng một năm trước khi đang cố xây dựng thói quen học tốt hơn.\n\nCuốn sách nói về việc những thay đổi nhỏ trong thói quen hằng ngày có thể tạo ra kết quả lớn theo thời gian. Tác giả giải thích rằng thay vì đặt mục tiêu quá lớn, ta nên tập trung tiến bộ chỉ một phần trăm mỗi ngày. Ông cũng đưa ra mẹo thực tế, như gắn thói quen mới với việc mình đã làm sẵn, hoặc khiến thói quen xấu khó thực hiện hơn.\n\nMình thấy nó thú vị vì vài lý do. Trước hết, sách rất dễ đọc với nhiều ví dụ thực tế. Nhưng quan trọng hơn, nó thật sự thay đổi hành vi của mình. Ví dụ, mình bắt đầu ôn từ vựng tiếng Anh mỗi sáng khi uống cà phê, và sau vài tháng đã học được hàng trăm từ mới mà không thấy áp lực.\n\nĐiều mình thích nhất là cuốn sách giúp mình nhận ra động lực thôi là chưa đủ, mình cần một hệ thống. Mình đã giới thiệu nó cho vài người bạn, và vẫn đọc lại ghi chép mỗi khi thấy lười."},
p3:[["Do you think people read less than in the past?","In terms of printed books, probably yes. However, people actually read a lot every day, such as news, messages and social media posts. The problem is that this kind of reading tends to be short and shallow, so many people find it harder to concentrate on a long book.","Nếu tính sách in thì có lẽ là đúng. Tuy nhiên, thật ra mọi người đọc rất nhiều mỗi ngày, như tin tức, tin nhắn và bài đăng mạng xã hội. Vấn đề là kiểu đọc này thường ngắn và hời hợt, nên nhiều người thấy khó tập trung vào một cuốn sách dài."],["How can parents encourage children to read?","The most effective way is probably to set a good example. If children see their parents reading regularly, they are more likely to copy them. Parents can also let children choose books about topics they love, such as animals or superheroes, so that reading feels like fun rather than homework.","Cách hiệu quả nhất có lẽ là làm gương. Nếu trẻ thấy bố mẹ đọc sách thường xuyên, chúng sẽ dễ bắt chước hơn. Bố mẹ cũng có thể để con tự chọn sách về chủ đề con thích, như động vật hay siêu anh hùng, để việc đọc giống như niềm vui chứ không phải bài tập."]]},
{t:"Người truyền cảm hứng",qs:[["Who do you admire most?","Probably my mother. She raised three children while working full-time, and she never complained.",["Probably …","She raised …"],"Có lẽ là mẹ mình. Mẹ nuôi ba đứa con trong khi đi làm toàn thời gian mà chưa bao giờ than phiền."],["Do you have a role model at work?","Yes, the head nurse in my department. She stays calm in every emergency, and she always takes time to teach younger staff.",["She stays calm in …","takes time to …"],"Có, điều dưỡng trưởng ở khoa mình. Chị ấy luôn bình tĩnh trong mọi ca cấp cứu và luôn dành thời gian hướng dẫn nhân viên trẻ."],["Are celebrities good role models?","Some are, but many aren't. A lot of famous people are known for their looks or money rather than their character.",["Some are, but many aren't.","rather than …"],"Có người là, nhưng nhiều người không. Nhiều người nổi tiếng được biết đến nhờ ngoại hình hay tiền bạc hơn là nhân cách."]],
card:{task:"Describe a person who has inspired you.",b:["who the person is","how you know them","what they have done","and explain why they inspired you"],m:"The person I'd like to talk about is my English teacher from high school, Ms. Hoa.\n\nShe taught me for three years when I was a teenager in my hometown. At that time, I was quite shy and really weak at English. I used to sit at the back of the class and hope she wouldn't ask me any questions.\n\nWhat made her special was the way she believed in every student. Instead of criticizing my mistakes, she encouraged me to speak, even if my sentences were wrong. She also started a small English club after school, where we watched movies and played games in English. She did all of this for free, in her own time.\n\nShe inspired me because she showed me that learning a language isn't about being perfect, it's about being brave. Thanks to her, I gained confidence, and even now, when I feel nervous about my IELTS exam, I remember her saying, “Mistakes mean you're trying.” I hope one day I can encourage other people the way she encouraged me.",vi:"Người mình muốn kể là cô giáo dạy tiếng Anh hồi cấp ba của mình, cô Hoa.\n\nCô dạy mình ba năm khi mình còn là học sinh ở quê. Hồi đó mình khá nhút nhát và rất yếu tiếng Anh. Mình thường ngồi cuối lớp và mong cô đừng gọi mình trả lời.\n\nĐiều đặc biệt ở cô là cách cô tin tưởng mọi học sinh. Thay vì chê lỗi sai, cô khuyến khích mình nói, dù câu của mình sai. Cô còn mở một câu lạc bộ tiếng Anh nhỏ sau giờ học, nơi bọn mình xem phim và chơi trò chơi bằng tiếng Anh. Cô làm tất cả miễn phí, bằng thời gian riêng của mình.\n\nCô truyền cảm hứng cho mình vì cô cho mình thấy học ngoại ngữ không phải là hoàn hảo, mà là dám can đảm. Nhờ cô, mình tự tin hơn, và đến giờ, mỗi khi hồi hộp về kỳ thi IELTS, mình lại nhớ câu cô nói: “Mắc lỗi nghĩa là em đang cố gắng.” Mình mong một ngày có thể động viên người khác như cô đã động viên mình."},
p3:[["What qualities make a good leader?","I think a good leader needs to be a good listener first of all. People work harder when they feel their opinions are valued. A leader should also be able to make difficult decisions quickly and take responsibility when things go wrong, rather than blaming others.","Mình nghĩ trước hết một người lãnh đạo giỏi cần biết lắng nghe. Mọi người làm việc chăm hơn khi thấy ý kiến của mình được coi trọng. Người lãnh đạo cũng cần đưa ra quyết định khó một cách nhanh chóng và chịu trách nhiệm khi có sai sót, thay vì đổ lỗi cho người khác."],["Who has more influence on young people today: parents or social media?","Unfortunately, I think social media is becoming more influential, especially for teenagers. They spend hours online and often compare themselves with influencers. That said, parents still play a crucial role in shaping children's values, particularly when they are young.","Đáng tiếc là mình nghĩ mạng xã hội đang ngày càng có ảnh hưởng hơn, nhất là với thiếu niên. Các em dành hàng giờ trên mạng và thường so sánh mình với người có ảnh hưởng. Dù vậy, bố mẹ vẫn đóng vai trò then chốt trong việc hình thành giá trị sống của con, đặc biệt khi con còn nhỏ."]]},
{t:"Môi trường",qs:[["Do you do anything to protect the environment?","I try to do small things, like bringing my own bag when I go shopping and turning off lights when I leave a room.",["I try to do small things, like …"],"Mình cố làm những việc nhỏ, như mang túi riêng khi đi mua sắm và tắt đèn khi ra khỏi phòng."],["Is pollution a big problem where you live?","Yes, air pollution is quite serious, especially in winter. Some mornings you can hardly see the buildings across the street.",["especially in winter","you can hardly see …"],"Có, ô nhiễm không khí khá nghiêm trọng, nhất là vào mùa đông. Có những buổi sáng gần như không nhìn thấy tòa nhà bên kia đường."],["Have you ever taken part in a clean-up?","Yes, once. My workplace organized a beach clean-up last year, and I was shocked by how much plastic we collected.",["I was shocked by how much …"],"Có, một lần. Năm ngoái cơ quan mình tổ chức dọn rác bãi biển, và mình sốc vì lượng nhựa nhặt được nhiều đến thế."]],
card:{task:"Describe something you do to help the environment.",b:["what you do","when you started doing it","how difficult it is","and explain why you do it"],m:"One thing I do to help the environment is avoid single-use plastic as much as possible.\n\nI started doing this about two years ago after watching a documentary about plastic in the ocean. There was a scene of a sea turtle with a plastic straw stuck in its nose, and it really upset me. After that, I decided to change some of my daily habits.\n\nNow I always carry a reusable water bottle and a cloth shopping bag in my backpack. When I buy coffee, I bring my own cup, and I've stopped using plastic straws completely. At home, I also buy soap and shampoo in bars rather than in plastic bottles.\n\nTo be honest, it was difficult at first. I often forgot my bag, and some shops looked at me strangely when I handed them my cup. But after a few months, it became a habit, and now I don't even think about it.\n\nI do it because I believe small actions add up. If millions of people make little changes, it can make a real difference. It also feels good to know that I'm doing something positive for the planet that my son will grow up in.",vi:"Một việc mình làm để bảo vệ môi trường là hạn chế tối đa đồ nhựa dùng một lần.\n\nMình bắt đầu khoảng hai năm trước sau khi xem một phim tài liệu về rác nhựa trong đại dương. Có cảnh một con rùa biển bị ống hút nhựa mắc trong mũi, khiến mình rất buồn. Sau đó, mình quyết định thay đổi một số thói quen hằng ngày.\n\nGiờ mình luôn mang bình nước dùng lại và túi vải trong ba lô. Khi mua cà phê, mình mang cốc riêng, và đã bỏ hẳn ống hút nhựa. Ở nhà, mình cũng mua xà phòng và dầu gội dạng bánh thay vì chai nhựa.\n\nThật lòng thì lúc đầu khá khó. Mình hay quên túi, và có cửa hàng nhìn mình lạ lùng khi mình đưa cốc riêng. Nhưng sau vài tháng, nó thành thói quen và giờ mình không cần nghĩ đến nữa.\n\nMình làm vậy vì tin rằng những hành động nhỏ sẽ cộng dồn lại. Nếu hàng triệu người cùng thay đổi một chút, điều đó có thể tạo khác biệt thật sự. Mình cũng thấy vui khi biết mình đang làm điều tích cực cho hành tinh nơi con trai mình sẽ lớn lên."},
p3:[["Who should be responsible for protecting the environment: individuals or governments?","I believe it is a shared responsibility, but governments have the greatest power. Individuals can reduce waste and save energy, yet only governments can introduce laws, such as banning certain plastics or taxing pollution. Large companies also need to be held accountable, since they produce a huge proportion of emissions.","Mình tin đây là trách nhiệm chung, nhưng chính phủ có quyền lực lớn nhất. Cá nhân có thể giảm rác và tiết kiệm năng lượng, nhưng chỉ chính phủ mới ban hành được luật, như cấm một số loại nhựa hay đánh thuế ô nhiễm. Các công ty lớn cũng cần chịu trách nhiệm, vì họ thải ra một tỷ lệ khí thải rất lớn."],["Will environmental problems get better or worse in the future?","It is hard to say. On the one hand, renewable energy is becoming cheaper, and young people are more aware of environmental issues than ever before. On the other hand, the global population and consumption are still growing. I am cautiously optimistic, but only if countries take action quickly.","Khó nói lắm. Một mặt, năng lượng tái tạo ngày càng rẻ, và người trẻ hiểu biết về vấn đề môi trường hơn bao giờ hết. Mặt khác, dân số và mức tiêu thụ toàn cầu vẫn đang tăng. Mình lạc quan một cách thận trọng, nhưng chỉ khi các nước hành động nhanh chóng."]]}]];

SKADD.forEach((a,l)=>SKP[l].push(...a));
let skRec=null,skOpen={},skBusy=null,skTimer=null,skT=0;
function skItems(P,l,ti){const it=P.qs.map((q,i)=>({id:"q"+i,lab:(P.card?"Part 1 · ":"Câu ")+(i+1),q:q[0],m:q[1],ch:q[2],vi:q[3]}));
  if(P.card)it.push({id:"c",lab:"Part 2 · Thẻ đề",q:P.card.task,b:P.card.b,m:P.card.m,card:1,vi:P.card.vi});
  (P.p3||[]).forEach((q,i)=>it.push({id:"p"+i,lab:"Part 3 · "+(i+1),q:q[0],m:q[1],vi:q[2]}));
  const V=(SKVI[l]||[])[ti]||[];it.forEach((o,j)=>{if(!o.vi&&V[j])o.vi=V[j]});return it}
function renderSpeak(){
  S.skA=S.skA||{};S.skF=S.skF||{};S.skSel=S.skSel||{};
  const l=S.skL!=null?S.skL:[0,1,2,3,3][curLv()];S.skL=l;
  const ti=wrToday(l)%SKP[l].length,i=S.skSel[l]!=null?S.skSel[l]:ti,P=SKP[l][i],L=SKL[l],base="s"+l+"-"+i+"-",items=skItems(P,l,i);
  unsubs.forEach(f=>{try{f()}catch(e){}});unsubs=[];
  $("#speak").innerHTML=`<p class="eyebrow">Speaking mỗi ngày · ${esc(L.c)} · ${esc(L.n)}</p><h2 class="h2b">Luyện nói mỗi ngày</h2>
  <div class="seg" style="margin:10px 0">${SKL.map((x,j)=>`<button data-skl="${j}" class="${j===l?"on":""}">${x.c}</button>`).join("")}</div>
  <select id="skSel" aria-label="Chọn chủ đề" style="width:100%;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--paper);color:inherit;font:inherit;margin-bottom:10px">${SKP[l].map((p,j)=>`<option value="${j}" ${j===i?"selected":""}>${j===ti?"⭐ Chủ đề hôm nay · ":""}${esc(p.t)}</option>`).join("")}</select>
  <details class="card"><summary style="cursor:pointer;font-weight:700">💡 Cách nói tự nhiên · ${esc(L.c)}</summary><div style="display:grid;gap:10px;margin-top:10px">${L.tips.map(t=>`<div><b style="color:var(--blue)">${esc(t[0])}</b><div>${t[1]}</div></div>`).join("")}</div></details>
  ${items.map(o=>{const k=base+o.id,ans=S.skA[k]||"",fb=S.skF[k],open=skOpen[k];return `<div class="card" id="sk-${o.id}">
   <div class="row" style="justify-content:space-between;gap:8px"><span class="tag ${o.card?"v":"ph"}">${esc(o.lab)}</span>${sp(o.q)}</div>
   <p style="font-weight:700;font-size:17px;margin:8px 0 ${o.b?"4px":"10px"}">${esc(o.q)}</p>
   ${o.b?`<p class="exp" style="margin:0">You should say:</p><ul style="margin:4px 0 10px;padding-left:20px">${o.b.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
   <div class="row" style="gap:8px;flex-wrap:wrap">${DIC?`<button class="btn solid" data-skm="${o.id}">${skRec===k?"■ Dừng":"🎤 Trả lời"}</button>`:""}
    ${o.card?`<button class="btn" id="skTimer">${skTimer?skTimerLab():"⏱ 1′ chuẩn bị + 2′ nói"}</button>`:""}
    <button class="btn" data-sko="${o.id}">${open?"Ẩn câu mẫu":"Xem câu mẫu"}</button></div>
   <textarea class="dta" rows="${o.card?6:3}" data-ska="${o.id}" style="margin-top:10px" placeholder="${DIC?"Bấm 🎤 rồi nói, chữ sẽ hiện ở đây (em cũng có thể gõ)":"Gõ câu trả lời của em (hoặc nói to rồi so với câu mẫu)"}">${esc(ans)}</textarea>
   ${SAMPLE&&wcount(ans)>=6?`<div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn solid" data-skf="${o.id}" ${skBusy===k?"disabled":""}>${skBusy===k?"Cô đang nghe…":"✨ Cô nhận xét"}</button></div>`:""}
   ${fb?wrFbHtml(fb,"Câu trả lời tự nhiên hơn"):""}
   ${open?`<div class="dvi" style="margin-top:10px"><div class="row" style="justify-content:space-between;gap:8px"><b>Câu mẫu</b>${sp(o.m.replace(/\n+/g," "))}</div><p style="white-space:pre-wrap;line-height:1.7;margin:6px 0 0">${esc(o.m)}</p>${o.vi?`<p style="white-space:pre-wrap;line-height:1.6;margin:8px 0 0;padding-top:8px;border-top:1px dashed var(--line);color:var(--mut)"><b style="color:var(--ink)">Nghĩa:</b> ${esc(o.vi)}</p>`:""}${o.ch&&o.ch.length?`<div class="dchips" style="margin:8px 0 0">${o.ch.map(c=>`<button class="chip" data-say="${esc(c.replace(/…/g,""))}">${esc(c)}</button>`).join("")}</div>`:""}</div>`:""}
  </div>`}).join("")}`;
  document.querySelectorAll("#speak [data-skl]").forEach(b=>b.onclick=()=>{S.skL=+b.dataset.skl;skOpen={};save();renderSpeak()});
  $("#skSel").onchange=e=>{S.skSel[l]=+e.target.value;skOpen={};save();renderSpeak()};
  document.querySelectorAll("#speak [data-sko]").forEach(b=>b.onclick=()=>{const k=base+b.dataset.sko;skOpen[k]=!skOpen[k];renderSpeak()});
  document.querySelectorAll("#speak [data-ska]").forEach(t=>t.oninput=()=>{S.skA[base+t.dataset.ska]=t.value;save()});
  if(DIC){onF(({text})=>{if(!skRec)return;S.skA[skRec]=((S.skA[skRec]||"")+" "+text).trim();save();const t=document.querySelector(`#speak [data-ska="${skRec.slice(base.length)}"]`);if(t)t.value=S.skA[skRec]});
    onSt(({state})=>{if(state!=="listening"&&skRec){skRec=null;renderSpeak()}});
    document.querySelectorAll("#speak [data-skm]").forEach(b=>b.onclick=()=>{const k=base+b.dataset.skm;if(skRec===k){DIC.stop().catch(()=>{});return}
      shStop();skRec=k;b.textContent="■ Dừng";DIC.start().catch(err=>{skRec=null;b.textContent="🎤 Trả lời";if(err&&err.code==="not_granted")toast("Em chưa cho phép micro, em gõ câu trả lời vào ô nhé.")})})}

let fFlip=false;
function renderFlash(){
  const TP=S.fTopic!=null&&TV[S.fTopic]?TV[S.fTopic].map(v=>({v,day:-1})):null;const ALL=TP||D.flatMap((d,i)=>d.voc.map(v=>({v,day:i})));const f=TP?-1:(S.fDay==null?-1:S.fDay);
  const pool=f<0?ALL:ALL.filter(x=>x.day===f),known=pool.filter(x=>S.fk[x.v[0]]).length,deck=pool.filter(x=>!S.fk[x.v[0]]);
  const allKnown=ALL.filter(x=>S.fk[x.v[0]]).length;if(S.fi==null||S.fi>=deck.length)S.fi=0;const c=deck[S.fi];
  $("#flash").innerHTML=`<p class="eyebrow">Ôn từ · Flashcards</p><h2 class="h2b">Ôn lại từ đã học</h2>
  
  <div class="row" style="gap:12px;margin:12px 0"><div class="xbar grow"><i style="width:${Math.round(allKnown/ALL.length*100)}%"></i></div><span class="exp" style="margin:0;white-space:nowrap">${allKnown}/${ALL.length} thẻ đã thuộc</span></div>
  ${TP?`<div class="row" style="gap:6px;margin-bottom:14px"><span class="tagp">Chủ đề: ${esc(tName(S.fTopic))}</span><button class="mini" id="fBackT">← Về chủ đề</button></div>`:""}<div class="row" style="gap:6px;margin-bottom:14px" ${TP?"hidden":""}><button class="mini ${f<0?"on":""}" data-fd="-1">Tất cả</button>${D.map((d,i)=>`<button class="mini ${f===i?"on":""}" data-fd="${i}">Ngày ${i+1}</button>`).join("")}</div>
  ${c?`<div class="fcard ${fFlip?"back":""}">
    <div class="row" style="justify-content:space-between"><span class="tagp">${c.day<0?esc(tName(S.fTopic)):"Ngày "+(c.day+1)} · còn ${deck.length} thẻ</span><span class="tag ${c.v[1]}">${TYPES[c.v[1]]} (${c.v[1]})</span></div>
    <p class="fw">${esc(c.v[0])}</p><p class="ipa" style="text-align:center;margin:0">${esc(c.v[2])}</p>
    <div style="display:flex;justify-content:center;margin-top:10px">${sp(c.v[0])}</div>
    ${fFlip?`<div class="fback"><p class="fm">${esc(c.v[3])}</p><div class="ex" style="justify-content:center">${sp(c.v[4],"small")}<div><b>${esc(c.v[4])}</b><i>${esc(c.v[5])}</i></div></div></div>`:`<button class="btn solid bigbtn" id="fFlip" style="margin-top:18px">Lật thẻ xem nghĩa</button>`}
  </div>
  ${fFlip?`<div class="row" style="gap:10px;margin-top:12px"><button class="btn grow" id="fNo">😕 Chưa nhớ</button><button class="btn solid grow" id="fYes">✓ Nhớ rồi</button></div>`:""}`
  :`<div class="fcard"><p class="fw" style="font-size:28px">🎉 Em đã thuộc hết ${pool.length} thẻ ${f<0?"":"của Ngày "+(f+1)}!</p><p class="exp" style="text-align:center">Đã thuộc ${known}/${pool.length}. Bấm “Học lại” để ôn từ đầu.</p><button class="btn solid bigbtn" id="fReset">Học lại các thẻ này</button></div>`}`;
  document.querySelectorAll("[data-fd]").forEach(b=>b.onclick=()=>{S.fDay=+b.dataset.fd;S.fi=0;fFlip=false;save();renderFlash()});
  const fbt=$("#fBackT");if(fbt)fbt.onclick=()=>{S.tvT=S.fTopic;S.view="vocab";save();render();scrollTo({top:0})};
  const fl=$("#fFlip");if(fl)fl.onclick=()=>{fFlip=true;renderFlash()};
  const y=$("#fYes");if(y)y.onclick=()=>{S.fk[c.v[0]]=1;addXp(2);fFlip=false;renderFlash()};
  const no=$("#fNo");if(no)no.onclick=()=>{addXp(1);S.fi=(S.fi+1)%Math.max(1,deck.length);fFlip=false;save();renderFlash()};
  const rs=$("#fReset");if(rs)rs.onclick=()=>{pool.forEach(x=>delete S.fk[x.v[0]]);S.fi=0;save();renderFlash()};
}
