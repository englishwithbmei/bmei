<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>englishwithbmei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Lexend:wght@500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
<style>
/* Layout: sticky site bar · hero "today" panel · day cards strip · lesson with side section rail (desktop) / chip row (phone) */
:root{
--bg:#fbf6fb;--paper:#ffffff;--ink:#2e2a4d;--mut:#6c6890;--grid:#ece5f4;--soft:#f5f0fb;
--line:#2e2a4d;--gridl:rgba(106,88,211,.07);--blue:#6a58d3;--blue-soft:#eeeaff;--hero:#ebe6ff;--blob1:#ffd6e7;--blob2:#d3f3e6;--stat:rgba(255,255,255,.7);--red:#d2477d;--red-soft:#ffe6f0;
--ok:#2b9468;--okb:#def6ea;--bad:#cf4757;--badb:#fde7ea;--shadow:0 1px 2px rgba(80,60,140,.06),0 10px 28px rgba(120,90,190,.08);
--f-head:"Be Vietnam Pro",system-ui,sans-serif;--f-body:"Be Vietnam Pro",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1829;--paper:#242036;--ink:#efebfa;--mut:#aca6c8;--grid:#363050;--soft:#2c2743;--line:#8c83b8;--gridl:rgba(182,171,255,.05);--blue:#b6abff;--blue-soft:#352e5a;--hero:#2f2852;--blob1:#4a2c47;--blob2:#1f4038;--stat:rgba(255,255,255,.07);--red:#ff9fc4;--red-soft:#45283d;--ok:#7fe0b2;--okb:#1d3b30;--bad:#ff9aa4;--badb:#45232b;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1829;--paper:#242036;--ink:#efebfa;--mut:#aca6c8;--grid:#363050;--soft:#2c2743;--line:#8c83b8;--gridl:rgba(182,171,255,.05);--blue:#b6abff;--blue-soft:#352e5a;--hero:#2f2852;--blob1:#4a2c47;--blob2:#1f4038;--stat:rgba(255,255,255,.07);--red:#ff9fc4;--red-soft:#45283d;--ok:#7fe0b2;--okb:#1d3b30;--bad:#ff9aa4;--badb:#45232b;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--gridl) 1px,transparent 1px),linear-gradient(90deg,var(--gridl) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font:16px/1.6 var(--f-body);overflow-x:clip}
h1,h2,h3{font-family:var(--f-head);font-weight:600;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
/* site bar */
.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--grid)}
.site .in{max-width:1120px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--blue);color:var(--paper);display:grid;place-items:center;font:700 18px var(--f-head)}
.brand b{display:block;font:600 17px/1.2 var(--f-head)}
.brand small{color:var(--mut);font-size:12.5px}
.views{display:flex;gap:4px;background:var(--soft);border-radius:999px;padding:4px}
.views{overflow-x:auto;max-width:100%;scrollbar-width:none}
.views button{white-space:nowrap;flex:none;border:0;background:transparent;border-radius:999px;padding:8px 16px;min-height:40px;font-weight:600;font-size:14.5px;color:var(--mut)}
.views button.on{background:var(--paper);color:var(--blue);box-shadow:var(--shadow)}
.wrap{max-width:1120px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px));display:grid;gap:18px}
/* hero */
.hero{background:var(--hero);color:var(--ink);border-radius:22px;padding:24px;display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:center;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:38%;bottom:-90px;width:200px;height:200px;border-radius:50%;background:var(--blob2)}
.hero::after{content:"";position:absolute;right:-50px;top:-70px;width:240px;height:240px;border-radius:50%;background:var(--blob1)}
.hero .eb{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);font-weight:700}
.hero h1{font-size:clamp(26px,4.4vw,38px);margin:6px 0 8px;color:var(--ink)}
.hero p{margin:0 0 16px;color:var(--mut);max-width:52ch}
.hero .go.ghost{background:var(--paper);color:var(--blue);border:1.5px solid var(--blue)}
.hero .go{border:1.5px solid var(--blue);background:var(--blue);color:var(--paper);border-radius:12px;padding:12px 20px;min-height:48px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative;z-index:1}
.stat{background:var(--stat);backdrop-filter:blur(6px);border-radius:16px;padding:14px 12px}
.stat .sv{color:var(--blue);font:700 30px/1 var(--f-head);font-variant-numeric:tabular-nums}
.stat .sl{font-size:12.5px;color:var(--mut);margin-top:6px;line-height:1.3}
.prog{color:var(--mut);font-size:14px;margin:-6px 2px -8px}
/* day cards */
.days{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory}
.days button{flex:none;width:150px;text-align:left;border:1.5px solid var(--grid);background:var(--paper);border-radius:16px;padding:12px 14px;scroll-snap-align:start;display:grid;gap:4px;position:relative}
.days .dn{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.days .dt{font-size:14px;font-weight:600;line-height:1.3}
.days button.on{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.days button.on .dn{color:var(--blue)}
.days button.done::after{content:"✓";position:absolute;top:10px;right:12px;width:22px;height:22px;border-radius:50%;background:var(--okb);color:var(--ok);font-size:13px;font-weight:700;display:grid;place-items:center}
/* page */
.page{background:var(--paper);border:1px solid var(--grid);border-radius:22px;box-shadow:var(--shadow);padding:24px}
.lh{padding-bottom:16px;border-bottom:1px solid var(--grid);margin-bottom:18px}
.lh h2{font-size:clamp(24px,4vw,32px);color:var(--ink)}
.goal{color:var(--mut);margin:6px 0 0;font-size:15px;max-width:65ch}
.lgrid{display:grid;grid-template-columns:230px 1fr;gap:28px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:grid;gap:14px}
.tt{display:grid;gap:4px}
.tt button{border:0;border-radius:12px;background:transparent;padding:10px 12px;text-align:left;display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;color:var(--ink)}
.tt button b{order:2;margin-left:auto;font-size:12px;font-weight:600;color:var(--mut)}
.tt button::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--grid);flex:none}
.tt button:hover{background:var(--soft)}
.tt button.on{background:var(--blue-soft);color:var(--blue);font-weight:700}
.tt button.on::before{border-color:var(--blue);background:var(--blue)}
.tt button.ok::before{border-color:var(--ok);background:var(--ok)}
.timer{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;background:var(--soft);border-radius:14px;padding:12px;font-size:13px;color:var(--mut)}
.timer #tlabel{grid-column:1/-1}
.clock{font:700 26px var(--f-head);color:var(--red);font-variant-numeric:tabular-nums}
.btn{border:1.5px solid var(--blue);background:var(--paper);color:var(--blue);border-radius:12px;padding:8px 16px;min-height:44px;font-weight:600}
.btn.solid{background:var(--blue);border-color:var(--blue);color:var(--paper)}
.btn:disabled{opacity:.4;cursor:default}
.sec h3{font-size:24px;color:var(--ink);margin:0 0 10px}
.sec>p{max-width:68ch}
.note{background:var(--blue-soft);border-radius:14px;padding:14px 16px;margin:12px 0}
.card{background:var(--paper);border:1px solid var(--grid);border-radius:14px;padding:14px 16px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.w{font:600 21px var(--f-head)}
.ipa{color:var(--mut);font-size:15px}
.tag{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 10px;color:#3a3358;white-space:nowrap}
.n{background:#d6e4ff}.v{background:#ffd9e6}.adj{background:#d4f3e2}.adv{background:#ffe8c8}.pron{background:#e8dcff}.prep{background:#cff1f3}.det{background:#e4e6ee}.int{background:#ffdcf3}.ph{background:#e1e4f5}.num{background:#e4e6ee}.conj{background:#e3f1d2}
.sp{border:0;background:var(--blue-soft);color:var(--blue);border-radius:50%;width:44px;height:44px;flex:none;display:inline-grid;place-items:center}
.sp:hover{background:var(--blue);color:var(--paper)}
.sp svg{width:20px;height:20px}
.sp.small{width:36px;height:36px}
.ex{display:flex;gap:10px;align-items:flex-start;margin-top:6px}
.ex i{color:var(--mut);font-style:normal;font-size:14px;display:block}
.hide .mean{filter:blur(6px);cursor:pointer}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:8px}
.pair{display:flex;justify-content:space-between;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--grid);border-radius:14px;padding:8px 10px}
.pair span{display:flex;align-items:center;gap:6px;font-weight:600}
.f{font:600 15.5px/1.6 var(--f-body);background:var(--soft);border-left:4px solid var(--red);padding:10px 14px;margin:6px 0;border-radius:0 10px 10px 0}
.q{margin:16px 0;padding-bottom:14px;border-bottom:1px solid var(--grid)}
.q p{margin:0 0 8px;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{border:1.5px solid var(--grid);background:var(--paper);border-radius:12px;padding:8px 16px;min-height:44px}
.opts button:hover{border-color:var(--blue)}
.opts button.right{background:var(--okb);border-color:var(--ok);color:var(--ok);font-weight:700}
.opts button.wrong{background:var(--badb);border-color:var(--bad);color:var(--bad)}
.exp{font-size:14px;color:var(--mut);margin-top:6px}
.fml{margin:6px 0 4px;padding:8px 12px;border-radius:12px;background:var(--blue-soft);font-weight:600;line-height:1.5}.grc .ex b{color:var(--blue)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--soft);border:1.5px solid var(--grid);padding:4px;border-radius:14px;margin:0 0 14px}.seg2 button{border:0;background:transparent;border-radius:11px;padding:9px 6px;font-weight:700;font-size:13.5px;color:var(--mut)}.seg2 button.on{background:var(--paper);color:var(--ink,inherit);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.dmodes{display:flex;gap:6px;overflow-x:auto;margin:10px 0}.dmodes button{flex:none;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 13px;font-weight:700;font-size:13.5px}.dmodes button.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.dcard{border:1.5px solid var(--line);border-radius:20px;overflow:hidden;background:var(--paper)}
.dplayer{display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg,#4caf6a,#62c27e);padding:12px}.dplayer button{width:42px;height:42px;border-radius:12px;border:0;background:rgba(255,255,255,.22);color:#fff;font-size:17px;font-weight:800}.dplayer #dPlay{margin-right:auto}.dplayer #dRep{margin-left:auto}.dcnt{color:#fff;font-weight:800;min-width:70px;text-align:center}
.dbody{padding:16px}.dhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.05em;color:var(--mut);margin-bottom:8px}.dhead select{font-size:13px;border:1.5px solid var(--line);border-radius:10px;padding:4px 8px;background:var(--paper);color:var(--bad)}
.dta{width:100%;box-sizing:border-box;border:2px solid var(--ink,#333);border-radius:14px;padding:12px;font:inherit;font-size:16px;resize:vertical;background:var(--paper);color:inherit}
.dmask{font-family:ui-monospace,Menlo,monospace;letter-spacing:.06em;line-height:1.9;margin:0 0 8px;color:var(--mut);word-break:break-word}.dm.on{color:var(--ok);font-weight:700}
.okbtn{background:var(--ok)!important;border-color:var(--ok)!important;color:var(--paper)!important}
.dverd{font-weight:800;margin:14px 0 8px}.dverd.ok{color:var(--ok)}.dverd.no{color:var(--bad)}
.dbox{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;line-height:2;font-size:17px;word-spacing:4px}.wg{color:var(--ok);font-weight:700}.wr{color:var(--bad);font-weight:700;text-decoration:underline wavy}
.dvi{margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--okb);line-height:1.55}
.dchips,.dans{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.dans{min-height:56px;align-items:center}.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 12px;font-weight:700;font-size:15px}.chip:disabled{opacity:.3}.chip.on{background:var(--blue-soft);border-color:var(--blue);opacity:1}.chip.g{background:var(--okb);border-color:var(--ok);color:var(--ok)}.chip.r{background:var(--badb);border-color:var(--bad);color:var(--bad)}
.subl{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:12px;cursor:pointer}.subl.on{background:var(--blue-soft)}.subl:hover{background:var(--blue-soft)}
#dict select{border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--paper);color:inherit;font:inherit;font-weight:600}
.picwrap{overflow-x:auto;border:1.5px solid var(--grid);border-radius:18px;background:#fffaf3;margin-top:10px}.picsvg{display:block;width:100%;min-width:720px;height:auto}
.picsvg *{stroke:#5b5470;stroke-width:2;stroke-linejoin:round}.picsvg .ns{stroke:none}
.picsvg text{stroke:#fff;stroke-width:4;paint-order:stroke;fill:#2e2a4d;font:700 14px Inter,system-ui,sans-serif;pointer-events:none}
.po{cursor:pointer;transition:filter .15s}.po:hover{filter:drop-shadow(0 0 3px #8b7cf6)}.po.sel{filter:drop-shadow(0 0 3px #6c5ce7) drop-shadow(0 0 6px #6c5ce7)}.po.bad{filter:drop-shadow(0 0 4px #e5484d) drop-shadow(0 0 7px #e5484d)}.po.got{filter:drop-shadow(0 0 3px #2fa86b)}
.picq{border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--paper);min-height:58px}
.vin{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;margin:0 0 8px;background:var(--paper);color:inherit}.tedbox{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--grid);border-radius:16px;padding:12px 14px;margin:0 0 10px;background:var(--paper)}.tedlogo{flex:none;background:#e62b1e;color:#fff;font-weight:900;font-size:15px;padding:6px 8px;border-radius:8px;letter-spacing:.02em}.tedlogo sup{font-size:10px}
.teach{margin:8px 0;line-height:1.65;font-size:15.5px}.tl{display:block;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin-bottom:2px}.tip2{margin-top:10px;padding:8px 12px;border-radius:12px;background:var(--okb);line-height:1.55;font-size:14.5px}
textarea{width:100%;min-height:120px;border:1.5px solid var(--grid);border-radius:14px;padding:12px;font:16px/1.5 var(--f-body);background:var(--paper);color:var(--ink)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--paper);border-top:1px solid var(--grid);display:flex;justify-content:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav .btn{flex:1;max-width:260px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;z-index:40}
.toast.show{opacity:1}
table{border-collapse:collapse;width:100%;font-size:15px}td,th{border-bottom:1px solid var(--grid);padding:6px 8px;text-align:left;vertical-align:top}
.abc{display:flex;flex-wrap:wrap;gap:6px}.abc button{width:54px;height:54px;border-radius:12px;border:1px solid var(--grid);background:var(--paper);font:700 18px/1 var(--f-head)}.abc button:hover{border-color:var(--blue);color:var(--blue)}.abc small{display:block;font:400 11px var(--f-body);color:var(--mut);margin-top:3px}
.score{font:700 30px var(--f-head);color:var(--blue);margin-bottom:10px}
/* shadowing */
.shl{display:grid;grid-template-columns:30px 1fr;gap:4px 12px;align-items:start}
.shl .k{width:30px;height:30px;border-radius:50%;background:var(--red-soft);color:var(--red);display:grid;place-items:center;font:700 14px var(--f-head)}
.shl .txt{font-size:18px;font-weight:500;line-height:1.55}
.shl .txt b{color:var(--blue);font-weight:700}
.shl .lk{color:var(--red);font-weight:700}
.shl .cut{color:var(--mut);margin:0 5px}
.shl .vi{color:var(--mut);font-size:14px}
.shl .ctl{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.mini.on{background:var(--blue);color:var(--paper);border-color:var(--blue)}
.mini{border:1px solid var(--grid);background:var(--paper);color:var(--blue);border-radius:999px;padding:4px 14px;min-height:36px;font-size:14px;font-weight:600}
.card.live{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.card.turn{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}
.st{font-size:13px;font-weight:700;color:var(--red)}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 14px;min-height:38px;font-size:14px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--paper);color:var(--blue);box-shadow:var(--shadow)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}
/* roadmap */
.phase{border:1px solid var(--grid);border-radius:18px;padding:18px 20px;margin:14px 0;background:var(--paper)}
.phase.now{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}
.phase h3{font-size:22px;margin:0}
.phase .meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--blue)}
.pill.r{background:var(--red);color:var(--paper)}
.phase dl{margin:10px 0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px}
.phase dt{font-weight:700;color:var(--red);font-size:14px}
.phase dd{margin:0;font-size:15px}
.ms{background:var(--soft);border-radius:14px;padding:10px 14px}
.ms label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:15px;cursor:pointer}
.ms input{width:20px;height:20px;margin-top:2px;accent-color:var(--blue);flex:none}
.cd{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end}
.cd .big{font:700 46px/1 var(--f-head);color:var(--red);font-variant-numeric:tabular-nums}
.cd input{font:inherit;border:1.5px solid var(--grid);border-radius:12px;padding:8px 10px;background:var(--paper);color:var(--ink);min-height:44px}
.bar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--grid);margin:16px 0 6px}
.bar i{display:block;height:100%;border-right:2px solid var(--paper)}
@media(max-width:860px){
.hero{grid-template-columns:1fr;padding:20px}
.lgrid{grid-template-columns:1fr;gap:16px}
.side{position:static}
.tt{display:flex;overflow-x:auto;gap:6px;padding-bottom:4px}
.tt button{flex:none;background:var(--soft);padding:8px 12px;font-size:14px}
.tt button b{margin-left:4px}
}
@media(max-width:560px){
.page{padding:18px 16px;border-radius:18px}
.brand small{display:none}
.site .in{gap:8px}
.views{width:100%}.views button{padding:7px 11px;font-size:13.5px}
.stat .sv{font-size:24px}

{t:"L1 · Family",s:[["My immediate family is small: just my parents, my brother and me.","Gia đình ruột của mình nhỏ: chỉ có bố mẹ, anh trai và mình.","immediate family","gia đình ruột"],["At Tet, my whole extended family gets together at my grandparents' house.","Tết, cả đại gia đình tụ họp ở nhà ông bà.","extended family","đại gia đình"],["He isn't my uncle; he's just a distant relative on my father's side.","Ông ấy không phải chú mình, chỉ là họ hàng xa bên nội.","distant relative","họ hàng xa"],["We are a close-knit family, so we help each other a lot.","Gia đình mình rất gắn bó nên mọi người giúp nhau nhiều.","close-knit family","gia đình gắn bó"],["I had a carefree childhood in the countryside.","Mình có một tuổi thơ vô lo ở vùng quê.","carefree childhood","tuổi thơ vô lo"],["My aunt is a single mother, and she works very hard for her kids.","Dì mình là mẹ đơn thân và làm việc rất vất vả vì các con.","single mother","mẹ đơn thân"],["After the divorce, my friend's parents still stay on good terms.","Sau khi ly hôn, bố mẹ bạn mình vẫn giữ quan hệ tốt.","stay on good terms","giữ quan hệ tốt"],["The doctor said her due date is in early March.","Bác sĩ nói ngày dự sinh của chị ấy là đầu tháng Ba.","due date","ngày dự sinh"]]},
{t:"L2 · Relationships",s:[["When I moved to Hanoi, I only had a few casual acquaintances.","Khi mới chuyển ra Hà Nội, mình chỉ có vài người quen sơ.","casual acquaintances","người quen sơ"],["Over time, two of them became my close friends.","Dần dần, hai người trong số đó trở thành bạn thân của mình.","close friends","bạn thân"],["Do you believe in love at first sight?","Bạn có tin vào tình yêu sét đánh không?","love at first sight","tình yêu từ cái nhìn đầu tiên"],["My parents felt a strong chemistry when they first met.","Bố mẹ mình thấy rất hợp nhau ngay lần đầu gặp.","strong chemistry","sự hòa hợp mạnh mẽ"],["You can bring your significant other to the party.","Bạn có thể dẫn người yêu hoặc vợ/chồng đến bữa tiệc.","significant other","người yêu / vợ / chồng"],["She married her high school sweetheart after college.","Cô ấy cưới mối tình thời cấp ba sau khi học xong đại học.","high school sweetheart","người yêu thời cấp ba"],["We met through a mutual friend at a birthday party.","Bọn mình quen nhau qua một người bạn chung ở tiệc sinh nhật.","mutual friend","bạn chung"],["My grandparents have been happily married for fifty years.","Ông bà mình đã sống hạnh phúc bên nhau năm mươi năm.","happily married","hôn nhân hạnh phúc"]]},
{t:"L3 · Appearance",s:[["My best friend is absolutely gorgeous, with long jet-black hair.","Bạn thân mình cực kỳ xinh đẹp, với mái tóc dài đen tuyền.","absolutely gorgeous","cực kỳ xinh đẹp"],["She has pale blue eyes and a radiant complexion.","Cô ấy có đôi mắt xanh nhạt và làn da rạng rỡ.","radiant complexion","làn da rạng rỡ"],["My brother has an athletic build because he goes to the gym.","Anh mình có thân hình vạm vỡ vì hay đi tập gym.","athletic build","thân hình vạm vỡ"],["He also has broad shoulders and muscular arms.","Anh ấy còn có vai rộng và cánh tay săn chắc.","broad shoulders","vai rộng"],["My grandfather has bushy eyebrows and a thick mustache.","Ông mình có lông mày rậm và ria mép dày.","bushy eyebrows","lông mày rậm"],["She bears a striking resemblance to her mother.","Cô ấy trông giống mẹ như đúc.","bears a striking resemblance","trông cực kỳ giống"],["His hair looked unkempt, so I told him to comb his hair.","Tóc anh ấy rối bù nên mình bảo anh ấy chải tóc.","comb his hair","chải tóc"],["With a short haircut, he looks somewhat attractive.","Cắt tóc ngắn, anh ấy trông cũng khá thu hút.","somewhat attractive","khá thu hút"]]},
{t:"L4 · Character",s:[["When I was a teenager, I was painfully shy.","Hồi tuổi teen, mình nhút nhát kinh khủng.","painfully shy","cực kỳ nhút nhát"],["My little sister has a vivid imagination and loves drawing.","Em gái mình có trí tưởng tượng phong phú và rất thích vẽ.","vivid imagination","trí tưởng tượng phong phú"],["My best friend has an outgoing personality and talks to everyone.","Bạn thân mình có tính cách cởi mở và nói chuyện với mọi người.","outgoing personality","tính cách cởi mở"],["My dad has a good sense of humor, so dinner is always fun.","Bố mình rất có khiếu hài hước nên bữa tối lúc nào cũng vui.","a good sense of humor","khiếu hài hước"],["Sometimes she is brutally honest, and it hurts my feelings.","Đôi khi cô ấy thẳng thắn quá mức và làm mình tổn thương.","hurts my feelings","làm tổn thương"],["Joining the English club helped me come out of my shell.","Tham gia câu lạc bộ tiếng Anh giúp mình bớt rụt rè.","come out of my shell","bớt rụt rè, cởi mở hơn"],["Now I have a thicker skin, so criticism doesn't upset me.","Giờ mình mạnh mẽ hơn nên lời chê không làm mình buồn.","have a thicker skin","không dễ bị tổn thương"],["It's hard for me to swallow my pride and say sorry.","Mình thấy khó hạ cái tôi xuống để xin lỗi.","swallow my pride","hạ cái tôi"]]},
{t:"L5 · Feelings",s:[["I was ridiculously excited before my first trip abroad.","Mình hào hứng kinh khủng trước chuyến đi nước ngoài đầu tiên.","ridiculously excited","vô cùng hào hứng"],["When my son came home late, I was worried sick.","Khi con trai về muộn, mình lo phát ốm.","worried sick","lo phát ốm"],["She was visibly disappointed when she failed the test.","Cô ấy thất vọng thấy rõ khi trượt bài kiểm tra.","visibly disappointed","thất vọng thấy rõ"],["My mom prefers to bottle up her emotions.","Mẹ mình thường giấu kín cảm xúc trong lòng.","bottle up her emotions","giấu kín cảm xúc"],["I'm terribly sorry; I didn't mean to lose my temper.","Mình thật sự xin lỗi, mình không cố ý nổi nóng.","lose my temper","mất bình tĩnh, nổi nóng"],["I was pleasantly surprised by the birthday party.","Mình bất ngờ và vui lắm vì bữa tiệc sinh nhật.","pleasantly surprised","ngạc nhiên vui mừng"],["I'm immensely grateful for my teacher's help.","Mình vô cùng biết ơn sự giúp đỡ của cô giáo.","immensely grateful","vô cùng biết ơn"],["On my wedding day, I was overwhelmed with emotion.","Vào ngày cưới, mình xúc động nghẹn ngào.","overwhelmed with emotion","ngập tràn cảm xúc"]]},
{t:"L6 · Houses & Apartments",s:[["I'm sharing a two-bedroom apartment with my cousin.","Mình đang ở chung căn hộ hai phòng ngủ với chị họ.","two-bedroom apartment","căn hộ hai phòng ngủ"],["Our apartment has a balcony overlooking the river.","Căn hộ của mình có ban công nhìn ra sông.","balcony overlooking","ban công nhìn ra"],["From the top floor, we have a nice view of the city skyline.","Từ tầng trên cùng, mình nhìn thấy đường chân trời thành phố rất đẹp.","nice view of the city skyline","cảnh thành phố đẹp"],["The apartment was fully furnished, so we moved in quickly.","Căn hộ có đủ nội thất nên bọn mình dọn vào rất nhanh.","fully furnished","đầy đủ nội thất"],["The living room is spacious, but the bedrooms are rather cramped.","Phòng khách rộng nhưng phòng ngủ hơi chật.","rather cramped","khá chật chội"],["I feel like I'm throwing away money on rent every month.","Mình thấy như đang ném tiền qua cửa sổ vì tiền thuê nhà mỗi tháng.","throwing away money on rent","phí tiền thuê nhà"],["We're saving up for a down payment on a small house.","Bọn mình đang dành dụm tiền trả trước để mua một căn nhà nhỏ.","saving up for a down payment","tiết kiệm tiền đặt cọc"],["When we move into a new place, we'll have a housewarming party.","Khi chuyển nhà mới, bọn mình sẽ làm tiệc tân gia.","housewarming party","tiệc tân gia"]]},
{t:"L7 · Eating",s:[["I want to change my eating habits this year.","Năm nay mình muốn thay đổi thói quen ăn uống.","eating habits","thói quen ăn uống"],["I'm trying to cut down on junk food and processed foods.","Mình đang cố ăn ít đồ ăn vặt và đồ chế biến sẵn.","junk food","đồ ăn vặt không lành mạnh"],["A balanced diet includes vegetables, fruit, rice and fish.","Chế độ ăn cân bằng gồm rau, trái cây, cơm và cá.","a balanced diet","chế độ ăn cân bằng"],["My grandmother always cooks nourishing meals for the family.","Bà mình luôn nấu những bữa ăn bổ dưỡng cho cả nhà.","nourishing meals","bữa ăn bổ dưỡng"],["My mom stocks up on fresh produce at the market every Sunday.","Chủ nhật nào mẹ cũng mua trữ rau củ tươi ở chợ.","stocks up on fresh produce","trữ rau củ quả tươi"],["Doctors say we should eat in moderation.","Bác sĩ nói chúng ta nên ăn uống điều độ.","eat in moderation","ăn uống điều độ"],["After work, I'm usually in the mood for a home-cooked meal.","Sau giờ làm, mình thường thèm một bữa cơm nhà.","home-cooked meal","bữa cơm nhà nấu"],["Don't eat snacks now, or you'll spoil your appetite.","Đừng ăn vặt bây giờ, kẻo lát không ăn cơm được.","spoil your appetite","mất cảm giác thèm ăn"]]},
{t:"L8 · Movies & Books",s:[["I'm a huge fan of Korean movies.","Mình là fan cuồng phim Hàn.","a huge fan of","fan cuồng của"],["I watched the trailer, and now I'm counting down the days.","Mình xem trailer rồi và giờ đang đếm từng ngày.","counting down the days","đếm từng ngày"],["The film is based on a true story.","Bộ phim dựa trên một câu chuyện có thật.","based on a true story","dựa trên chuyện có thật"],["The actress who plays the leading role is amazing.","Nữ diễn viên đóng vai chính diễn rất tuyệt.","leading role","vai chính"],["The movie was a box-office hit in Vietnam last year.","Bộ phim là một hiện tượng phòng vé ở Việt Nam năm ngoái.","box-office hit","phim ăn khách"],["Last night I was so engrossed in a book that I forgot to sleep.","Tối qua mình mải đọc sách đến quên cả ngủ.","engrossed in a book","đắm chìm trong sách"],["I usually borrow books from the library near my house.","Mình thường mượn sách ở thư viện gần nhà.","borrow books from the library","mượn sách thư viện"],["I didn't finish it, so I had to renew it for another week.","Mình chưa đọc xong nên phải gia hạn thêm một tuần.","renew it for another week","gia hạn thêm một tuần"]]},
{t:"L9 · Music",s:[["My sister is musically gifted; she can play three instruments.","Chị mình có năng khiếu âm nhạc, chơi được ba nhạc cụ.","musically gifted","có năng khiếu âm nhạc"],["In the evening, I like strumming a guitar on the balcony.","Buổi tối, mình thích gảy đàn guitar ngoài ban công.","strumming a guitar","gảy đàn guitar"],["I learn new words by reading song lyrics.","Mình học từ mới bằng cách đọc lời bài hát.","song lyrics","lời bài hát"],["The band is going to record their debut album next year.","Ban nhạc sẽ thu âm album đầu tay vào năm sau.","record their debut album","thu album đầu tay"],["This song has a catchy tune and an upbeat tempo.","Bài hát này có giai điệu bắt tai và nhịp sôi động.","catchy tune","giai điệu bắt tai"],["Their new album will be released in December.","Album mới của họ sẽ phát hành vào tháng Mười Hai.","will be released","sẽ được phát hành"],["Everyone was singing along at the concert.","Mọi người đều hát theo ở buổi hòa nhạc.","singing along","hát theo"],["I love karaoke, but I always sing off-key.","Mình mê karaoke nhưng toàn hát lệch tông.","sing off-key","hát lạc giọng"]]},
{t:"L10 · Sports",s:[["My father plays golf every Saturday morning.","Bố mình chơi golf mỗi sáng thứ Bảy.","plays golf","chơi golf"],["I do exercise for thirty minutes every day.","Mình tập thể dục ba mươi phút mỗi ngày.","do exercise","tập thể dục"],["My brother lifts weights at the gym after work.","Anh mình tập tạ ở phòng gym sau giờ làm.","lifts weights","tập tạ"],["Our team won the game in the last minute.","Đội mình thắng trận ở phút cuối.","won the game","thắng trận"],["They were losing, but they made a comeback in the second half.","Họ đang thua nhưng đã lội ngược dòng ở hiệp hai.","made a comeback","lội ngược dòng"],["She entered a competition and won first place.","Cô ấy tham gia một cuộc thi và giành giải nhất.","won first place","giành hạng nhất"],["I finally achieved a personal best in the 5K race.","Cuối cùng mình đã đạt thành tích tốt nhất ở cự ly 5 km.","achieved a personal best","đạt thành tích cá nhân tốt nhất"],["He hurt his leg and had to withdraw from the competition.","Anh ấy bị đau chân và phải rút khỏi cuộc thi.","withdraw from the competition","rút khỏi cuộc thi"]]},
{t:"L11 · Health",s:[["Small lifestyle changes can improve your overall health.","Thay đổi lối sống nhỏ có thể cải thiện sức khỏe tổng thể.","lifestyle changes","thay đổi lối sống"],["My uncle quit smoking last year.","Chú mình bỏ thuốc lá từ năm ngoái.","quit smoking","bỏ thuốc lá"],["To reduce stress, I go for a walk after dinner.","Để giảm căng thẳng, mình đi dạo sau bữa tối.","reduce stress","giảm căng thẳng"],["Try to get plenty of sleep before the exam.","Cố gắng ngủ đủ giấc trước kỳ thi nhé.","get plenty of sleep","ngủ đủ giấc"],["Doctors recommend that we exercise regularly.","Bác sĩ khuyên chúng ta nên tập thể dục đều đặn.","exercise regularly","tập thể dục thường xuyên"],["I think I'm catching a cold; my throat hurts.","Hình như mình sắp bị cảm, cổ họng đau quá.","catching a cold","bị cảm lạnh"],["I took some medicine to relieve the pain.","Mình đã uống thuốc để giảm đau.","relieve the pain","giảm đau"],["Luckily, he only suffered minor injuries in the accident.","May mắn là anh ấy chỉ bị thương nhẹ trong vụ tai nạn.","minor injuries","chấn thương nhẹ"]]},
{t:"L12 · Computers",s:[["Every morning, I turn on my laptop and check my email.","Sáng nào mình cũng bật laptop và kiểm tra email.","check my email","kiểm tra email"],["Could you reply to the email by Friday?","Bạn trả lời email trước thứ Sáu được không?","reply to the email","trả lời email"],["Don't forget to attach the file before you send it.","Đừng quên đính kèm tệp trước khi gửi nhé.","attach the file","đính kèm tệp"],["I tried to log into my bank account, but the website was down.","Mình thử đăng nhập tài khoản ngân hàng nhưng trang web bị lỗi.","the website was down","trang web bị sập"],["I use a search engine to look up new words.","Mình dùng công cụ tìm kiếm để tra từ mới.","search engine","công cụ tìm kiếm"],["I spend too much time on social media.","Mình dành quá nhiều thời gian cho mạng xã hội.","social media","mạng xã hội"],["My computer froze, so I had to restart it.","Máy tính bị treo nên mình phải khởi động lại.","computer froze","máy tính bị treo"],["Always back up your files in case the computer crashes.","Luôn sao lưu dữ liệu phòng khi máy tính hỏng.","back up your files","sao lưu dữ liệu"]]},
{t:"L13 · Study",s:[["I want to apply to universities in Australia.","Mình muốn nộp đơn vào các trường đại học ở Úc.","apply to universities","nộp đơn vào đại học"],["She got good grades and was awarded a scholarship.","Cô ấy đạt điểm cao và được trao học bổng.","awarded a scholarship","được nhận học bổng"],["During the lecture, I always take notes.","Trong giờ giảng, mình luôn ghi chép.","take notes","ghi chép"],["Tomorrow I have to give a presentation in English.","Ngày mai mình phải thuyết trình bằng tiếng Anh.","give a presentation","thuyết trình"],["Please hand in your work before Friday.","Các em nộp bài trước thứ Sáu nhé.","hand in your work","nộp bài"],["The teacher graded our essays and gave us feedback.","Cô giáo chấm bài luận và nhận xét cho bọn mình.","gave us feedback","nhận xét, góp ý"],["If you study hard, you'll pass the test.","Nếu học chăm, bạn sẽ đỗ bài kiểm tra.","pass the test","đỗ bài kiểm tra"],["My brother graduated from college last summer.","Anh mình tốt nghiệp đại học hè năm ngoái.","graduated from college","tốt nghiệp đại học"]]},
{t:"L15 · Work",s:[["After university, I started with an entry-level job.","Sau đại học, mình bắt đầu với một công việc mới vào nghề.","entry-level job","công việc cho người mới"],["My boss says I'm a good team player.","Sếp nói mình là người làm việc nhóm tốt.","a good team player","người làm việc nhóm tốt"],["If I work hard, I might get a promotion next year.","Nếu chăm chỉ, năm sau mình có thể được thăng chức.","get a promotion","được thăng chức"],["I have a heavy workload this month.","Tháng này mình có khối lượng công việc rất nặng.","heavy workload","khối lượng công việc nặng"],["I often work overtime before the holidays.","Mình thường làm thêm giờ trước kỳ nghỉ lễ.","work overtime","làm thêm giờ"],["My friend wants a career change; she's tired of sales.","Bạn mình muốn đổi nghề vì đã chán làm bán hàng.","career change","đổi nghề"],["I'm updating my resume to apply for a new job.","Mình đang cập nhật CV để nộp đơn xin việc mới.","apply for a new job","nộp đơn xin việc"],["One day, I hope to find my dream job.","Mình mong một ngày nào đó tìm được công việc mơ ước.","dream job","công việc mơ ước"]]},
{t:"L17 · Money",s:[["I make money by teaching kids on weekends.","Mình kiếm tiền bằng cách dạy trẻ con vào cuối tuần.","make money","kiếm tiền"],["Don't waste your money on things you don't need.","Đừng phí tiền vào những thứ bạn không cần.","waste your money","phí tiền"],["Money is tight this month, so I'm eating at home.","Tháng này tiền eo hẹp nên mình ăn ở nhà.","money is tight","tiền eo hẹp"],["I make a budget and try to stick to it.","Mình lập ngân sách và cố gắng làm theo.","make a budget","lập ngân sách"],["At the end of the month, I'm always broke.","Cuối tháng là mình lại cháy túi.","broke","cháy túi, hết tiền"],["Everyone should have an emergency fund.","Ai cũng nên có một quỹ dự phòng khẩn cấp.","emergency fund","quỹ dự phòng"],["I set aside some money every month for my IELTS course.","Mỗi tháng mình để dành một ít tiền cho khóa IELTS.","set aside some money","để dành tiền"],["Our class raised money for poor children in the mountains.","Lớp mình quyên góp tiền cho trẻ em nghèo vùng núi.","raised money","quyên góp, gây quỹ"]]},
{t:"L18 · Travel",s:[["Last year, I went on a business trip to Singapore.","Năm ngoái mình đi công tác ở Singapore.","business trip","chuyến công tác"],["The travel agency made all the travel arrangements.","Công ty du lịch lo hết mọi sắp xếp cho chuyến đi.","travel arrangements","sắp xếp chuyến đi"],["The plane was overbooked, so I took a later flight.","Chuyến bay bị bán quá số ghế nên mình phải đi chuyến sau.","overbooked","bán vé quá số chỗ"],["It was a bumpy flight, and I felt sick.","Chuyến bay rung lắc nhiều làm mình buồn nôn.","bumpy flight","chuyến bay rung lắc"],["I had a five-hour layover in Bangkok.","Mình quá cảnh năm tiếng ở Bangkok.","layover","thời gian quá cảnh"],["I only took a carry-on bag, so I didn't check any luggage.","Mình chỉ mang hành lý xách tay nên không ký gửi gì.","carry-on bag","hành lý xách tay"],["We checked into a hotel near the beach.","Bọn mình nhận phòng một khách sạn gần biển.","checked into a hotel","nhận phòng khách sạn"],["Unfortunately, the airline lost my luggage.","Không may, hãng bay làm thất lạc hành lý của mình.","lost my luggage","làm mất hành lý"]]},

const SHG=()=>LV.map(l=>({c:l.c,n:l.n,col:l.col})).concat([{c:"Collocations",n:"1000 Collocations · cụm từ tự nhiên",col:"#0a8590"}]);
function autoHint(t,col){let h=esc(t).replace(/,\s*/g,', <span class="cut">/</span> ').replace(/;\s*/g,'; <span class="cut">/</span> ');h=h.replace(/([b-df-hj-np-tv-z])\s+(?=[aeiou])/gi,'$1<span class="lk">‿</span>');const c=esc(col);const i=h.toLowerCase().indexOf(c.toLowerCase());return i<0?h:h.slice(0,i)+"<b>"+h.slice(i,i+c.length)+"</b>"+h.slice(i+c.length)}
function hiCol(t,col){const e=esc(t),c=esc(col),i=e.toLowerCase().indexOf(c.toLowerCase());return i<0?e:e.slice(0,i)+'<mark class="colm">'+e.slice(i,i+c.length)+"</mark>"+e.slice(i+c.length)}
function shLib(k){if(k===LV.length)return COLL;if(k<2)return Array.from({length:10},(_,j)=>k*10+j).filter(di=>D[di]&&SH[di]).map(di=>({t:"Ngày "+(di+1)+" · "+D[di].t,s:SH[di].s,tip:SH[di].tip}));const ex=D.map((d,di)=>di).filter(di=>SH[di]&&curLvOf(di)===k).map(di=>({t:"Ngày "+(di+1)+" · "+D[di].t,s:SH[di].s,tip:SH[di].tip}));return SHX[LV[k].c].concat(ex)}
function curLvOf(di){const N=di+1;return N<=10?0:N<=20?1:N<=75?2:N<=134?3:4}
/* ===== XP · streak ===== */
const dk=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>dk(new Date());
function addXp(n){S.xp=(S.xp||0)+n;S.act=S.act||{};S.act[today()]=(S.act[today()]||0)+n;save();xpChip()}
function streak(){const d=new Date();if(!(S.act||{})[dk(d)])d.setDate(d.getDate()-1);let c=0;while((S.act||{})[dk(d)]){c++;d.setDate(d.getDate()-1)}return c}
function xpChip(){const el=$("#xpchip");if(el)el.innerHTML=`<span title="Chuỗi ngày học">🔥 ${streak()}</span><span title="Điểm kinh nghiệm">⭐ ${S.xp||0} XP</span>`}

const PROPER={"lan":"Lan","minh":"Minh","mai":"Mai","vietnam":"Vietnam","hanoi":"Hanoi","hue":"Hue","english":"English","ielts":"IELTS","tv":"TV","june":"June","monday":"Monday","sundays":"Sundays","mum":"Mum"};
const MULTI=[["ha long bay","Ha Long Bay"],["hoi an","Hoi An"],["da nang","Da Nang"],["ho chi minh city","Ho Chi Minh City"],["da lat","Da Lat"],["phu quoc","Phu Quoc"]];
function natural(m){let t=String(m).replace(/[↗↘]/g,"").replace(/\s*\/\s*/g," ").replace(/‿/g," ").replace(/\s+/g," ").trim().toLowerCase();
  MULTI.forEach(([a,b])=>t=t.split(a).join(b));t=t.replace(/\b[a-z]+\b/g,w=>PROPER[w]||w).replace(/\bi\b/g,"I").replace(/\bi('m|'ve|'d|'ll)\b/g,"I$1");
  return t.replace(/(^|[.!?]\s+)([a-z])/g,(x,p,c)=>p+c.toUpperCase())}

function picLabel(k,x,y){return `<text x="${x}" y="${y}" text-anchor="middle">${k.split("\n").map((t,i)=>`<tspan x="${x}" dy="${i?15:0}">${esc(t)}</tspan>`).join("")}</text>`}
function renderPic(){
  const id=S.picT&&PIC[S.picT]?S.picT:301,P=PIC[id],ws=TV[id],W=k=>ws.find(w=>w[0]===k),mode=S.picMode||"learn";S.picT=id;
  const found=picQ?picQ.found:[];
  const showLab=k=>mode==="learn"||k===picSel||found.includes(k);
  const lab=k=>({"kitchen cabinet":"kitchen\ncabinet","rice cooker":"rice\ncooker","trash can":"trash\ncan","recycling bin":"recycling\nbin","bulletin board":"bulletin\nboard","shopping basket":"shopping\nbasket","check-in counter":"check-in\ncounter","departures board":"departures\nboard","control tower":"control\ntower"}[k]||k);
  const svg=`<svg viewBox="0 0 820 470" class="picsvg" role="img" aria-label="Tranh ${esc(PICT.find(t=>t[0]===id)[2])}">${P.bg}${P.o.map(o=>`<g class="po ${o[0]===picSel?"sel":""} ${o[0]===picBad?"bad":""} ${found.includes(o[0])?"got":""}" data-po="${esc(o[0])}">${o[1]}</g>`).join("")}${P.o.filter(o=>showLab(o[0])).map(o=>picLabel(lab(o[0]),o[2],o[3])).join("")}</svg>`;
  const w=picSel&&W(picSel);
  let panel="";
  if(mode==="quiz"){const t=picQ&&picQ.t;
    panel=t?`<div class="picq"><span class="exp" style="margin:0">Tìm đồ vật · ${found.length}/${ws.length}</span><div class="row" style="gap:10px;margin-top:4px">${sp(t)}<b style="font-size:26px">${esc(t)}</b><span class="ipa">${esc(W(t)[2])}</span></div><p class="exp" style="margin:4px 0 0">${picQ.hint?esc(W(t)[3]):'<button class="lnk" id="pqHint" style="padding:0">Xem nghĩa tiếng Việt</button>'} · Bấm vào đồ vật đó trong tranh</p></div>`
      :`<div class="picq"><b style="font-size:20px">🎉 Em tìm đủ ${ws.length} đồ vật!</b><p class="exp">Đúng ngay lần đầu: ${picQ.first}/${ws.length}</p><button class="btn solid" id="pqAgain">Chơi lại</button></div>`}
  else if(w){panel=`<div class="picq"><div class="row" style="gap:10px;flex-wrap:wrap">${sp(w[0])}<b style="font-size:26px">${esc(w[0])}</b><span class="ipa">${esc(w[2])}</span><span class="tag ${w[1]}">${TYPES[w[1]]||w[1]} (${w[1]})</span></div><div style="font-weight:700;margin:6px 0 2px">${esc(w[3])}</div><div class="ex">${sp(w[4],"small")}<div>${esc(w[4])}<i>${esc(w[5])}</i></div></div></div>`}

let slQ=null;
function renderSlang(){
  const all=SLANG.flatMap((g,gi)=>g[1].map((x,i)=>({x,g:gi,id:gi+"-"+i}))),tot=all.length;S.slOk=S.slOk||{};
  const q=(S.slQ||"").trim().toLowerCase(),gi=S.slG==null?-1:S.slG;
  const list=all.filter(o=>(gi<0||o.g===gi)&&(!q||(o.x[0]+" "+o.x[1]).toLowerCase().includes(q)));
  const known=Object.keys(S.slOk).length,shown=list.slice(0,S.slN||60);
  $("#slang").innerHTML=`<p class="eyebrow">Tiếng lóng & cách nói đời thường · giọng Mỹ</p><h2 class="h2b">Slang thông dụng</h2>
  <p class="cntline"><b>${known}/${tot}</b> câu em đã thuộc</p>
  <div class="row" style="gap:8px;margin:10px 0"><input id="slQ" class="vin" style="margin:0;flex:1;min-width:0" placeholder="Tìm: chill, đói, tiền…" value="${esc(S.slQ||"")}"><button class="btn solid" id="slQuiz">🎯 Ôn nhanh</button></div>
  <div class="dmodes"><button data-sg="-1" class="${gi<0?"on":""}">Tất cả</button>${SLANG.map((g,j)=>`<button data-sg="${j}" class="${gi===j?"on":""}">${esc(g[0])} · ${g[1].length}</button>`).join("")}</div>
  ${slQ?slQuizHtml():""}
  <div style="display:grid;gap:10px">${shown.map(o=>{const x=o.x,ok=S.slOk[o.id];return `<div class="card" style="margin:0"><div class="row" style="gap:10px;align-items:flex-start">${sp(x[0])}<div style="min-width:0;flex:1"><b style="font-size:18px">${esc(x[0])}</b><div style="margin:2px 0 6px">${esc(x[1])}</div><div class="ex">${sp(x[2],"small")}<div>${esc(x[2])}<i>${esc(x[3])}</i></div></div></div><button class="chip ${ok?"g":""}" data-sk="${o.id}" title="Đánh dấu đã thuộc" aria-pressed="${ok?"true":"false"}">${ok?"✓ Thuộc":"Thuộc?"}</button></div></div>`}).join("")}</div>
  ${list.length>shown.length?`<div class="row" style="justify-content:center;margin-top:12px"><button class="btn" id="slMore">Xem thêm (${list.length-shown.length})</button></div>`:""}
  ${!list.length?`<p class="exp">Không tìm thấy câu nào.</p>`:""}`;
  const qi=$("#slQ");qi.oninput=()=>{S.slQ=qi.value;S.slN=60;save();renderSlang();const n=$("#slQ");n.focus();n.setSelectionRange(n.value.length,n.value.length)};
  document.querySelectorAll("#slang [data-sg]").forEach(b=>b.onclick=()=>{const v=+b.dataset.sg;S.slG=v<0?null:v;S.slN=60;slQ=null;save();renderSlang()});
  document.querySelectorAll("#slang [data-sk]").forEach(b=>b.onclick=()=>{const k=b.dataset.sk;if(S.slOk[k])delete S.slOk[k];else{S.slOk[k]=1;addXp(1)}save();renderSlang()});
  const m=$("#slMore");if(m)m.onclick=()=>{S.slN=(S.slN||60)+60;save();renderSlang()};
  const pool=gi<0?all:all.filter(o=>o.g===gi);
  const newQ=()=>{const pick=pool[Math.floor(Math.random()*pool.length)],opts=new Set([pick.x[0]]);let g=0;while(opts.size<3&&g<50){g++;opts.add(pool[Math.floor(Math.random()*pool.length)].x[0])}
    slQ={p:pick,o:[...opts].sort(()=>Math.random()-.5),a:null,ok:slQ?slQ.ok:0,n:slQ?slQ.n:0};renderSlang();scrollTo({top:$("#slang .slq").offsetTop-80})};
  $("#slQuiz").onclick=newQ;
  const nx=$("#slNext");if(nx)nx.onclick=newQ;const cl=$("#slClose");if(cl)cl.onclick=()=>{slQ=null;renderSlang()};
  document.querySelectorAll("#slang [data-sa]").forEach(b=>b.onclick=()=>{if(slQ.a!=null)return;slQ.a=+b.dataset.sa;slQ.n++;if(slQ.o[slQ.a]===slQ.p.x[0]){slQ.ok++;addXp(1)}speak(slQ.p.x[0]);renderSlang()});
}
function slQuizHtml(){const p=slQ.p.x;return `<div class="card slq"><div class="row" style="justify-content:space-between"><b>🎯 Câu nào có nghĩa là…</b><span class="exp" style="margin:0">Đúng ${slQ.ok}/${slQ.n}</span></div>
  <p style="font-size:18px;font-weight:700;margin:8px 0">“${esc(p[1])}”</p>
  <div class="abcl">${slQ.o.map((o,j)=>`<button data-sa="${j}" class="${slQ.a==null?"":o===p[0]?"right":j===slQ.a?"wrong":""}" ${slQ.a!=null?"disabled":""}><span class="lt">${"ABC"[j]}</span>${esc(o)}</button>`).join("")}</div>
  ${slQ.a!=null?`<p class="exp">${esc(p[2])} – ${esc(p[3])}</p>`:""}<div class="row" style="gap:8px;margin-top:8px">${slQ.a!=null?`<button class="btn solid" id="slNext">Câu tiếp →</button>`:""}<button class="btn" id="slClose">Đóng</button></div></div>`}

{t:"Mạng xã hội: lợi và hại",task:"Write a paragraph (120–150 words) about the advantages and disadvantages of social media.",o:["Câu chủ đề: mạng xã hội có cả hai mặt","Lợi ích 1–2 + ví dụ","Tác hại 1–2 + ví dụ","Câu kết: quan điểm của em"],ph:["Social media has both advantages and disadvantages.","On the one hand, it allows us to …","For example, …","On the other hand, …","In my opinion, the key is to …"],m:"Social media has both advantages and disadvantages. On the one hand, it allows us to stay in touch with friends and family who live far away. For example, I can video call my cousin in Australia for free every week. It is also a quick way to get news and learn new skills, such as cooking or English. On the other hand, many people spend too much time scrolling, which can affect their sleep and their studies. In addition, some users compare their lives with the perfect pictures they see online, and this can make them feel unhappy. In my opinion, social media is a useful tool, but the key is to use it wisely and set a time limit every day."},
{t:"Email phàn nàn",task:"You bought a blender online, but it arrived broken. Write an email to the company (120–150 words). Explain the problem and say what you want them to do.",o:["Mở đầu trang trọng + mục đích","Mua gì, khi nào, mã đơn","Vấn đề cụ thể","Yêu cầu (đổi/hoàn tiền) + kết thư"],ph:["Dear Sir or Madam,","I am writing to complain about …","I ordered … on … (order number …).","Unfortunately, when it arrived, …","I would be grateful if you could …","I look forward to hearing from you. Yours faithfully,"],m:"Dear Sir or Madam,\nI am writing to complain about a blender that I bought from your website. I ordered the BX-200 model on 3 November (order number 45821), and it was delivered last Friday.\nUnfortunately, when I opened the box, I found that the glass jug was cracked and the lid was missing. I am very disappointed because I needed it for my daughter's birthday party, and I paid extra for fast delivery.\nI would be grateful if you could send me a replacement as soon as possible or give me a full refund. I have attached two photos of the damage.\nI look forward to hearing from you.\nYours faithfully,\nNguyen Thi Lan"},
{t:"Một lần mắc lỗi",task:"Write about a time you made a mistake and what you learned (120–150 words). Use past simple, past continuous and past perfect.",o:["Bối cảnh: khi nào, đang làm gì","Lỗi xảy ra như thế nào","Hậu quả, em đã xử lý ra sao","Bài học rút ra"],ph:["A few years ago, I was … when …","I had forgotten to …","As a result, …","Since then, I have always …","This experience taught me that …"],m:"A few years ago, I was working on an important report for my manager. The deadline was nine o'clock on Monday morning. On Sunday night, while I was checking the final version, my laptop suddenly shut down. I realized that I had forgotten to save my work for almost three hours. As a result, I had to stay up all night to write everything again. I was exhausted the next day, and the report was not as good as I had hoped. However, my manager was understanding when I explained what had happened. Since then, I have always saved my files every few minutes and kept a copy online. This experience taught me that small habits can prevent big problems."},
{t:"Có nên học online?",task:"Is online learning better than learning in a classroom? Give your opinion (120–150 words).",o:["Nêu quan điểm ngay câu đầu","Lý do 1 + ví dụ","Lý do 2 + ví dụ","Thừa nhận mặt còn lại + kết"],ph:["In my view, … is better for …","The main reason is that …","Another advantage is …","Admittedly, …","All things considered, …"],m:"In my view, online learning is better for busy adults, although classrooms still have some advantages. The main reason is that online courses are flexible. People who work full-time, like me, can study late at night or during their lunch break. Another advantage is cost. Online classes are often cheaper, and learners save money and time on travel. Moreover, many lessons are recorded, so students can watch them again if they do not understand something. Admittedly, it is harder to stay motivated at home, and students cannot easily talk to their classmates. However, video calls and online groups can solve part of this problem. All things considered, I believe online learning is the more practical choice for most adults today."},
{t:"Thành phố em đang sống",task:"Describe the city or town where you live (120–150 words). What is it like? What do you like and dislike about it?",o:["Giới thiệu: tên, vị trí, quy mô","Điểm nổi bật (đồ ăn, địa điểm…)","Điều em chưa thích","Cảm nghĩ chung"],ph:["I live in …, which is …","It is famous for …","One thing I love is …","The only thing I don't like is …","Overall, …"],m:"I live in Hanoi, which is the capital of Vietnam and has a population of over eight million people. It is famous for its old streets, peaceful lakes and delicious street food. One thing I love about Hanoi is that it mixes the old and the new. You can drink coffee in a hundred-year-old building and then walk to a modern shopping mall. The people are also friendly, and there is always something to do. The only thing I don't like is the traffic. During rush hour, it can take an hour to travel just a few kilometers, and the air is often polluted. Overall, Hanoi is a lively and charming city, and I feel lucky to live here."},
{t:"Lời khuyên học tiếng Anh",task:"Write a paragraph (120–150 words) giving advice to someone who is starting to learn English.",o:["Câu chủ đề: học tiếng Anh không khó nếu đúng cách","Lời khuyên 1 + lý do","Lời khuyên 2 + lý do","Lời khuyên 3 + lời động viên"],ph:["If you are starting to learn English, …","First of all, it is important to …","This is because …","Another useful tip is to …","Most importantly, …"],m:"If you are starting to learn English, there are a few simple tips that can help you make fast progress. First of all, it is important to study a little every day instead of a lot once a week. Even twenty minutes of practice can make a big difference, because your brain remembers new words better when you see them often. Another useful tip is to listen to English that you enjoy, such as songs, cartoons or podcasts. This makes learning feel less like homework. You should also not be afraid of making mistakes when you speak, since mistakes are a natural part of learning. Most importantly, be patient with yourself. Everyone learns at a different speed, and every small step counts."},
{t:"Công việc mơ ước",task:"Describe your dream job and explain why you want it (120–150 words).",o:["Công việc mơ ước là gì","Công việc đó làm những gì","Vì sao em muốn (2 lý do)","Em cần chuẩn bị gì"],ph:["My dream job is to become …","A … usually spends their day …","I would love this job because …","To achieve this goal, I need to …"],m:"My dream job is to become a nurse in an international hospital. Nurses there take care of patients from many different countries, so they use English every day. I would love this job for two reasons. Firstly, I enjoy helping people, and nursing allows me to make a real difference when someone is sick or scared. Secondly, working in an international team would give me the chance to learn about other cultures and keep improving my English. Of course, the job can be stressful, and nurses often work long hours. To achieve this goal, I need to get a high IELTS score and take a few extra medical courses. I know it will not be easy, but I am determined to try."},
{t:"Bảo vệ môi trường nơi em sống",task:"What can people in your area do to protect the environment? Write 120–150 words.",o:["Vấn đề môi trường ở địa phương","Giải pháp cho mỗi người","Giải pháp cho chính quyền/cộng đồng","Kết: thay đổi nhỏ tạo khác biệt"],ph:["One serious problem in my area is …","To deal with this, individuals could …","Local authorities should also …","If everyone …, …","Small changes can make a big difference."],m:"One serious problem in my area is plastic waste. After weekends, the streets and the small river near my house are often full of plastic bags and bottles. To deal with this, individuals could bring their own bags when they go shopping and use refillable water bottles. Families could also separate their rubbish so that more of it can be recycled. Local authorities should also take action by putting more bins in public places and organizing clean-up days every month. In addition, shops could charge customers a small fee for plastic bags, as many countries already do. If everyone made these small changes, our neighborhood would be much cleaner and healthier. Small changes can make a big difference."}],
[
{t:"IELTS Task 2 · Đồng ý / không đồng ý",task:"Some people believe that university education should be free for everyone. To what extent do you agree or disagree? (250+ words)",o:["Mở bài: diễn đạt lại đề + quan điểm rõ ràng","Thân bài 1: lý do ủng hộ chính + ví dụ","Thân bài 2: thừa nhận quan điểm ngược + phản biện","Kết luận: nhắc lại quan điểm"],ph:["It is often argued that …","I partly/completely agree with this view because …","The main reason is that …","For instance, …","Admittedly, … However, …","In conclusion, …"],m:"It is often argued that higher education should be provided free of charge to all citizens. While I accept that this policy would be expensive, I largely agree that university tuition should be paid for by the government.\n\nThe main reason is that free education creates equal opportunities. At present, many talented students from low-income families cannot afford tuition fees, so they leave school early and take low-paid jobs. If university were free, ability rather than wealth would decide who receives a degree. This would also benefit society as a whole, because a better-educated workforce tends to be more productive and innovative. Countries such as Germany and Finland, which offer free tuition, have strong economies and high levels of social mobility.\n\nAdmittedly, free university education would place a heavy burden on public budgets, and some people may feel it is unfair for taxpayers to fund degrees that do not lead to useful jobs. However, these concerns can be reduced. Governments could limit free places to subjects that the country needs, such as medicine, engineering and teaching, or require graduates to work in the country for a few years after they finish their studies.\n\nIn conclusion, although the cost is significant, I believe that making university education free is a worthwhile investment, as it gives every young person a fair chance and strengthens the economy in the long term."},
{t:"IELTS Task 2 · Thảo luận hai quan điểm",task:"Some people think working from home is better for employees, while others believe working in an office is more effective. Discuss both views and give your own opinion. (250+ words)",o:["Mở bài: giới thiệu hai quan điểm + ý kiến của em","Thân bài 1: lợi ích làm ở nhà","Thân bài 2: lợi ích làm ở văn phòng","Kết luận: quan điểm cân bằng của em"],ph:["People have different views about …","On the one hand, supporters of … argue that …","On the other hand, those who prefer … believe that …","In my opinion, a combination of … is …","To sum up, …"],m:"People have different views about whether employees should work from home or in an office. While both options have clear benefits, I believe that a combination of the two is the most effective approach.\n\nOn the one hand, supporters of remote work argue that it improves employees' quality of life. Without a daily commute, workers save time and money and can spend more time with their families. Many people also find that they are more productive at home because there are fewer interruptions from colleagues. For example, a programmer may concentrate better in a quiet room than in a busy open-plan office.\n\nOn the other hand, those who prefer office work believe that face-to-face contact is essential for teamwork. Problems can often be solved more quickly in a short conversation than through a long chain of emails. In addition, new employees learn faster when they can observe experienced colleagues, and regular contact helps to build trust and a strong company culture.\n\nIn my opinion, a hybrid model, in which staff spend two or three days in the office and the rest at home, offers the advantages of both systems. It allows people to focus on individual tasks at home while still meeting their team regularly.\n\nTo sum up, although remote work and office work each have their merits, a flexible arrangement is likely to make employees both happier and more productive."},
{t:"IELTS Task 2 · Vấn đề và giải pháp",task:"Traffic congestion is becoming a serious problem in many big cities. What are the causes, and what can be done to solve it? (250+ words)",o:["Mở bài: nêu vấn đề + sẽ bàn nguyên nhân và giải pháp","Thân bài 1: 2 nguyên nhân chính + ví dụ","Thân bài 2: 2 giải pháp tương ứng","Kết luận"],ph:["… has become a major issue in …","There are several reasons for this.","The most significant cause is …","Another contributing factor is …","One effective solution would be to …","Governments could also …"],m:"Traffic congestion has become a major issue in many large cities around the world. This essay will examine the main causes of this problem and suggest some possible solutions.\n\nThere are two main reasons for the growing traffic problem. The most significant cause is the rapid increase in private vehicles. As incomes rise, more families can afford cars and motorbikes, and in cities such as Hanoi, millions of vehicles now compete for limited road space. Another contributing factor is poor urban planning. In many places, offices, schools and shopping centers are concentrated in the city center, so huge numbers of people travel in the same direction at the same time.\n\nHowever, there are several measures that could reduce congestion. One effective solution would be to invest in reliable and affordable public transport, such as metro lines and bus rapid transit systems. If public transport is fast and convenient, many commuters will leave their vehicles at home. Governments could also encourage companies to offer flexible working hours or remote work, which would spread journeys more evenly throughout the day. In addition, charging drivers a fee to enter the city center during peak hours has worked well in cities like Singapore and London.\n\nIn conclusion, traffic congestion is mainly caused by the rising number of private vehicles and poor planning, but it can be eased through better public transport, flexible working arrangements and congestion charges."},
{t:"IELTS Task 2 · Ưu và nhược điểm",task:"More and more people are choosing to live and work abroad. Do the advantages of this outweigh the disadvantages? (250+ words)",o:["Mở bài: diễn đạt lại + trả lời câu hỏi","Thân bài 1: nhược điểm (ngắn hơn)","Thân bài 2: ưu điểm (mạnh hơn)","Kết luận"],ph:["In recent years, a growing number of people …","There are certainly some drawbacks to …","Nevertheless, I believe the benefits are greater.","First and foremost, …","Furthermore, …","Overall, …"],m:"In recent years, a growing number of people have decided to move abroad for work. Although living in a foreign country can be challenging, I believe that the advantages of this trend outweigh the disadvantages.\n\nThere are certainly some drawbacks to working overseas. The most obvious one is loneliness. Being far from family and friends can be very difficult, especially during important holidays such as Tet. Migrants may also face language barriers and cultural differences, which can make everyday tasks like visiting a doctor or renting an apartment stressful.\n\nNevertheless, I believe the benefits are greater. First and foremost, working abroad often provides much higher salaries and better career opportunities. Many workers are able to send money home, which improves their families' living standards and supports the economy of their home country. Furthermore, living in another culture helps people to become more independent, open-minded and adaptable. They also develop valuable skills, such as speaking a second language, which they can use if they return home later. Finally, modern technology has made it much easier to stay in touch, as video calls are free and flights are more affordable than in the past.\n\nOverall, while moving abroad can bring emotional and practical difficulties, the financial, professional and personal benefits make it a positive choice for many people."},
{t:"IELTS Task 1 · Mô tả số liệu",task:"The table shows the number of visitors (in thousands) to three museums in a city in 2010, 2015 and 2020. Summarise the information by selecting and reporting the main features, and make comparisons where relevant. (150+ words)\n\nArt Museum: 120 · 150 · 90\nHistory Museum: 200 · 210 · 160\nScience Museum: 80 · 140 · 190",o:["Mở bài: diễn đạt lại đề (table shows → table compares/illustrates)","Overview: 2 xu hướng nổi bật nhất, không số liệu","Thân bài 1: Science Museum (tăng mạnh)","Thân bài 2: Art và History (tăng rồi giảm) + so sánh"],ph:["The table compares the number of …","Overall, it is clear that …","… rose steadily from … to …","… peaked at … in … before falling to …","By contrast, …","… overtook … to become …"],m:"The table compares the number of people who visited three museums in a city in 2010, 2015 and 2020.\n\nOverall, the Science Museum saw a steady rise in visitors and became the most popular museum by 2020, whereas the other two museums attracted fewer people at the end of the period than in 2015.\n\nIn 2010, the Science Museum was the least visited of the three, with only 80,000 visitors. This figure increased significantly to 140,000 in 2015 and continued to grow, reaching 190,000 in 2020. As a result, it overtook the History Museum to become the most popular attraction.\n\nThe History Museum was the most visited museum in both 2010 and 2015, with 200,000 and 210,000 visitors respectively. However, its number of visitors then dropped to 160,000 in 2020. The Art Museum followed a similar pattern. Its visitor numbers rose from 120,000 to 150,000 between 2010 and 2015, before falling sharply to 90,000 in 2020, which was the lowest figure for any museum that year."},
{t:"IELTS Task 2 · Câu hỏi hai phần",task:"Fast food is becoming more popular in many countries. Why is this happening? Is this a positive or negative development? (250+ words)",o:["Mở bài: diễn đạt lại + trả lời ngắn cả 2 câu hỏi","Thân bài 1: nguyên nhân (2 lý do)","Thân bài 2: tiêu cực hay tích cực + lý do","Kết luận"],ph:["The consumption of … has risen sharply in …","There are two main reasons for this trend.","Firstly, … Secondly, …","In my view, this is largely a negative development because …","Although …, …","In conclusion, …"],m:"The consumption of fast food has risen sharply in many parts of the world. This essay will explain why this trend is happening and argue that it is largely a negative development.\n\nThere are two main reasons why fast food has become so popular. Firstly, modern lifestyles are extremely busy. Many people work long hours and commute for a long time, so they have little time or energy to cook. Fast food restaurants offer meals that are ready in minutes, and delivery apps now bring food directly to people's homes or offices. Secondly, fast food is cheap and heavily advertised. International chains spend huge sums of money on marketing aimed at young people, making burgers and fried chicken seem fun and fashionable.\n\nIn my view, this trend is mostly negative. The main concern is public health. Fast food is usually high in fat, salt and sugar, and eating it regularly is linked to obesity, diabetes and heart disease. These illnesses not only reduce people's quality of life but also put pressure on public healthcare systems. In addition, the popularity of global chains may threaten traditional cuisines and small family-run restaurants. Although fast food can be convenient in an emergency, it should not replace home-cooked meals.\n\nIn conclusion, fast food has become popular mainly because of busy lifestyles, low prices and aggressive advertising. However, since it can seriously harm people's health and local food culture, I believe this is a negative development."}]];

let SAMPLE=null,wrBusy=false,wrShowM=false;
(window.claude&&claude.use?claude.use("sample").catch(()=>null):Promise.resolve(null)).then(s=>{SAMPLE=s;if(S&&S.view==="write")renderWrite();if(S&&S.view==="speak")renderSpeak()});
const wcount=t=>(String(t).trim().match(/[A-Za-z0-9'’-]+/g)||[]).length;
function wrToday(l){const t=new Date(),now=new Date(t.getFullYear(),t.getMonth(),t.getDate());const N=Math.max(0,Math.round((now-pd(START()))/864e5));return N%WRP[l].length}
function renderWrite(){
  S.wr=S.wr||{};S.wrF=S.wrF||{};S.wrSel=S.wrSel||{};
  const l=S.wrL!=null?S.wrL:[0,1,2,3,3][curLv()];S.wrL=l;
  const ti=wrToday(l),i=S.wrSel[l]!=null?S.wrSel[l]:ti,P=WRP[l][i],L=WRL[l],key="w"+l+"-"+i,txt=S.wr[key]||"",fb=S.wrF[key],wc=wcount(txt);
  $("#write").innerHTML=`<p class="eyebrow">Writing mỗi ngày · ${esc(L.c)} · ${esc(L.n)}</p><h2 class="h2b">Viết mỗi ngày</h2>
  <div class="seg" id="wrL" style="margin:10px 0">${WRL.map((x,j)=>`<button data-wl="${j}" class="${j===l?"on":""}">${x.c}</button>`).join("")}</div>
  <div class="row" style="gap:8px;margin-bottom:10px"><select id="wrSel" aria-label="Chọn đề" style="flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--paper);color:inherit;font:inherit">${WRP[l].map((p,j)=>`<option value="${j}" ${j===i?"selected":""}>${j===ti?"⭐ Đề hôm nay · ":""}${esc(p.t)}${S.wr["w"+l+"-"+j]?" ✓":""}</option>`).join("")}</select></div>
  <div class="card"><div class="row" style="justify-content:space-between;gap:8px"><b style="font-size:19px">${esc(P.t)}</b><span class="tag ph">${esc(L.w)}</span></div>
   <p style="white-space:pre-wrap;margin:8px 0 12px;font-weight:600">${esc(P.task)}</p>
   <b>Dàn ý</b><ol style="margin:6px 0 12px;padding-left:22px;display:grid;gap:4px">${P.o.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
   <b>Cụm từ nên dùng</b><div style="display:grid;gap:6px;margin-top:6px">${P.ph.map(x=>`<div class="row" style="gap:8px">${sp(x.replace(/…/g,""),"small")}<span>${esc(x)}</span></div>`).join("")}</div></div>
  <div class="card"><label for="wrTxt" style="font-weight:700">Bài của em</label>
   <textarea id="wrTxt" class="dta" rows="9" style="margin-top:8px" placeholder="Viết bài của em ở đây… Trang tự lưu khi em gõ.">${esc(txt)}</textarea>
   <div class="row" style="justify-content:space-between;gap:8px;margin-top:8px;flex-wrap:wrap"><span class="exp" style="margin:0" id="wrCnt">${wc} từ</span>
   <div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn" id="wrModel">${wrShowM?"Ẩn bài mẫu":"Xem bài mẫu"}</button>${SAMPLE?`<button class="btn solid" id="wrFix" ${wrBusy?"disabled":""}>${wrBusy?"Cô đang chữa…":"✨ Cô chữa bài"}</button>`:""}</div></div>
   <div id="wrFb">${fb?wrFbHtml(fb):""}</div></div>
  ${wrShowM?`<div class="card"><div class="row" style="justify-content:space-between"><b>Bài mẫu (${wcount(P.m)} từ)</b>${sp(P.m.replace(/\n+/g," "))}</div><p style="white-space:pre-wrap;line-height:1.7;margin:8px 0 0">${esc(P.m)}</p></div>`:""}
  <div class="card"><b>Mẹo viết mượt · ${esc(L.c)}</b><div style="display:grid;gap:10px;margin-top:8px">${L.tips.map(t=>`<div><b style="color:var(--blue)">${esc(t[0])}</b><div>${t[1]}</div></div>`).join("")}</div></div>
  <div class="card"><b>Tự kiểm tra trước khi nộp</b><div style="display:grid;gap:6px;margin-top:8px">${["Đủ số từ yêu cầu","Đi đúng các ý trong dàn ý","Có ít nhất 3 từ nối khác nhau","Không lặp một từ quá 3 lần","Đúng thì của động từ, có -s với he/she/it","Chữ hoa đầu câu, dấu chấm cuối câu"].map((c,j)=>`<label class="row" style="gap:8px;flex-wrap:nowrap;align-items:flex-start"><input type="checkbox" id="wrc${j}" style="margin-top:4px;flex:none"> <span>${c}</span></label>`).join("")}</div></div>`;
  document.querySelectorAll("#write [data-wl]").forEach(b=>b.onclick=()=>{S.wrL=+b.dataset.wl;wrShowM=false;save();renderWrite()});
  $("#wrSel").onchange=e=>{S.wrSel[l]=+e.target.value;wrShowM=false;save();renderWrite()};
  const ta=$("#wrTxt");ta.oninput=()=>{S.wr[key]=ta.value;$("#wrCnt").textContent=wcount(ta.value)+" từ";save()};
  $("#wrModel").onclick=()=>{wrShowM=!wrShowM;renderWrite()};
  const fx=$("#wrFix");if(fx)fx.onclick=async()=>{const t=ta.value.trim();if(wcount(t)<15){toast("Em viết ít nhất vài câu rồi cô chữa nhé.");return}
    wrBusy=true;S.wr[key]=ta.value;save();renderWrite();
    const prompt=`Bạn là giáo viên tiếng Anh giọng Mỹ, chữa bài viết cho một học viên người Việt trình độ ${L.c} (${L.n}). Giọng ấm áp, xưng "cô", gọi "em".\nĐề bài: ${P.task}\nYêu cầu độ dài: ${L.w}.\nBài của học viên:\n"""\n${t}\n"""\nHãy trả về DUY NHẤT một JSON hợp lệ theo mẫu:\n{"overall":"1–2 câu nhận xét chung bằng tiếng Việt, khích lệ, nêu điểm mạnh và điểm cần sửa nhất","score":"${l===3?"ước lượng band IELTS, ví dụ 5.5":"điểm trên thang 10, ví dụ 7/10"}","fixes":[{"wrong":"đúng nguyên văn cụm sai trong bài","right":"cách sửa","why":"giải thích rất ngắn bằng tiếng Việt"}],"natural":"bài viết lại cho mượt và tự nhiên hơn, giữ nguyên ý và độ dài gần như bài gốc, dùng từ vựng phù hợp trình độ ${L.c}","tips":["2–3 mẹo ngắn bằng tiếng Việt để lần sau viết mượt hơn"]}\nfixes tối đa 10 mục, ưu tiên lỗi ngữ pháp và cách diễn đạt chưa tự nhiên. Nếu bài lạc đề, nói rõ trong overall.`;
    try{const r=await SAMPLE.json(prompt,{modelTier:"default"});S.wrF[key]=r;addXp(5)}catch(e){toast(e&&e.code==="rate_limited"?"Cô đang bận một chút, em thử lại sau ít phút nhé.":e&&e.code==="not_granted"?"Em chưa cho phép trang hỏi Claude nên cô chưa chữa được.":"Chưa chữa được, em thử lại nhé.");if(e&&e.code==="not_granted")SAMPLE=null}

function wrFbHtml(f,lab){const fixes=Array.isArray(f.fixes)?f.fixes:[],tips=Array.isArray(f.tips)?f.tips:[];
  return `<div style="margin-top:14px;border-top:1.5px dashed var(--line);padding-top:12px">
  <div class="row" style="justify-content:space-between;gap:8px"><b style="font-size:17px">✨ Cô nhận xét</b>${f.score?`<span class="tag v">${esc(f.score)}</span>`:""}</div>
  <p style="margin:6px 0 10px">${esc(f.overall||"")}</p>
  ${fixes.length?`<b>Chỗ cần sửa</b><div style="display:grid;gap:8px;margin:6px 0 12px">${fixes.map(x=>`<div style="border-left:3px solid var(--bad);padding-left:10px"><span class="wr" style="text-decoration:line-through">${esc(x.wrong||"")}</span> → <span class="wg">${esc(x.right||"")}</span><div class="exp" style="margin:2px 0 0">${esc(x.why||"")}</div></div>`).join("")}</div>`:""}
  ${f.natural?`<div class="row" style="justify-content:space-between"><b>${lab||"Bài viết lại mượt hơn"}</b>${sp(String(f.natural).replace(/\n+/g," "))}</div><p class="dvi" style="white-space:pre-wrap;line-height:1.7">${esc(f.natural)}</p>`:""}
  ${tips.length?`<b>Lần sau em thử</b><ul style="margin:6px 0 0;padding-left:20px">${tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:""}</div>`}
