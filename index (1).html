3:[["yes","int","/jes/","vâng, có","Yes, I do.","Vâng, có."],["no","int","/noʊ/","không","No, thanks.","Không, cảm ơn."],["okay","int","/ˌoʊˈkeɪ/","được, ổn","Okay, let's go.","Được, đi thôi."],["thanks","int","/θæŋks/","cảm ơn","Thanks a lot!","Cảm ơn nhiều!"],["sure","int","/ʃʊr/","chắc chắn rồi","Sure, no problem.","Chắc chắn rồi, không vấn đề gì."],["really","int","/ˈriːəli/","thật sao?","Really? I didn't know that.","Thật sao? Mình không biết đấy."],["wow","int","/waʊ/","chà, ồ","Wow, that's beautiful!","Chà, đẹp quá!"],["oh","int","/oʊ/","ồ, ô","Oh, I see.","Ồ, mình hiểu rồi."],["oops","int","/uːps/","ối","Oops! I dropped my phone.","Ối! Mình làm rơi điện thoại."],["hey","int","/heɪ/","này, chào","Hey, how are you?","Này, bạn khỏe không?"]],
4:[["me","pron","/miː/","tôi (tân ngữ)","Can you help me?","Bạn giúp tôi được không?"],["him","pron","/hɪm/","anh ấy (tân ngữ)","I called him yesterday.","Hôm qua mình gọi cho anh ấy."],["her","pron","/hɝː/","cô ấy (tân ngữ)","I miss her a lot.","Mình nhớ cô ấy lắm."],["us","pron","/ʌs/","chúng tôi (tân ngữ)","Come with us.","Đi cùng chúng mình nhé."],["them","pron","/ðem/","họ (tân ngữ)","I visit them every Sunday.","Chủ nhật nào mình cũng thăm họ."],["it","pron","/ɪt/","nó","It's raining.","Trời đang mưa."],["myself","pron","/maɪˈself/","chính tôi","I made it myself.","Mình tự làm đấy."],["everyone","pron","/ˈevriwʌn/","mọi người","Everyone is here.","Mọi người đều có mặt."],["someone","pron","/ˈsʌmwʌn/","ai đó","Someone is at the door.","Có ai đó ở cửa."],["nothing","pron","/ˈnʌθɪŋ/","không có gì","There's nothing in the fridge.","Tủ lạnh không có gì."],["all","det","/ɑːl/","tất cả","All my friends came.","Tất cả bạn mình đều đến."],["many","det","/ˈmeni/","nhiều (đếm được)","Many people like coffee.","Nhiều người thích cà phê."],["much","det","/mʌtʃ/","nhiều (không đếm được)","I don't have much time.","Mình không có nhiều thời gian."],["a few","det","/ə fjuː/","một vài","I have a few friends here.","Mình có vài người bạn ở đây."],["every","det","/ˈevri/","mỗi, mọi","I study every day.","Mình học mỗi ngày."],["both","det","/boʊθ/","cả hai","Both my parents are teachers.","Cả bố và mẹ mình đều là giáo viên."]],
5:[["grandparents","n","/ˈɡrænperənts/","ông bà","My grandparents live in Hue.","Ông bà mình sống ở Huế."],["grandson","n","/ˈɡrænsʌn/","cháu trai (của ông bà)","Their grandson is five.","Cháu trai của ông bà năm tuổi."],["granddaughter","n","/ˈɡrændɑːtɚ/","cháu gái (của ông bà)","She has one granddaughter.","Bà có một cháu gái."],["nephew","n","/ˈnefjuː/","cháu trai (con anh chị em)","My nephew loves football.","Cháu trai mình mê bóng đá."],["niece","n","/niːs/","cháu gái (con anh chị em)","My niece is very smart.","Cháu gái mình rất thông minh."],["stepmother","n","/ˈstepmʌðɚ/","mẹ kế","His stepmother is very kind.","Mẹ kế của anh ấy rất tốt."],["stepfather","n","/ˈstepfɑːðɚ/","bố dượng","She gets along with her stepfather.","Cô ấy hợp với bố dượng."],["mother-in-law","n","/ˈmʌðɚ ɪn lɑː/","mẹ chồng / mẹ vợ","My mother-in-law cooks very well.","Mẹ chồng mình nấu ăn rất ngon."],["father-in-law","n","/ˈfɑːðɚ ɪn lɑː/","bố chồng / bố vợ","My father-in-law is a doctor.","Bố chồng mình là bác sĩ."],["son-in-law","n","/ˈsʌn ɪn lɑː/","con rể","Their son-in-law is from Hanoi.","Con rể của họ người Hà Nội."],["daughter-in-law","n","/ˈdɑːtɚ ɪn lɑː/","con dâu","She is a good daughter-in-law.","Cô ấy là một nàng dâu tốt."],["sibling","n","/ˈsɪblɪŋ/","anh chị em ruột","How many siblings do you have?","Bạn có mấy anh chị em?"],["spouse","n","/spaʊs/","vợ / chồng (trang trọng)","Please write your spouse's name.","Vui lòng ghi tên vợ/chồng."],["fiancé","n","/ˌfiːɑːnˈseɪ/","chồng sắp cưới","Her fiancé is very funny.","Chồng sắp cưới của cô ấy rất vui tính."],["adopt","v","/əˈdɑːpt/","nhận nuôi","They adopted a baby girl.","Họ nhận nuôi một bé gái."],["raise","v","/reɪz/","nuôi dạy","My grandparents raised me.","Ông bà đã nuôi mình lớn."],["generation","n","/ˌdʒenəˈreɪʃən/","thế hệ","Three generations live in this house.","Ba thế hệ sống trong ngôi nhà này."],["household","n","/ˈhaʊshoʊld/","hộ gia đình","Every household has a TV.","Hộ nào cũng có TV."],["mom","n","/mɑːm/","mẹ (thân mật)","My mom is a nurse.","Mẹ mình là y tá."],["dad","n","/dæd/","bố (thân mật)","My dad likes fishing.","Bố mình thích câu cá."],["grandma","n","/ˈɡrænmɑː/","bà (thân mật)","Grandma tells great stories.","Bà kể chuyện rất hay."],["grandpa","n","/ˈɡrænpɑː/","ông (thân mật)","Grandpa reads the newspaper every morning.","Sáng nào ông cũng đọc báo."],["oldest","adj","/ˈoʊldɪst/","lớn nhất (con cả)","I'm the oldest child.","Mình là con cả."],["youngest","adj","/ˈjʌŋɡɪst/","nhỏ nhất (con út)","My youngest sister is ten.","Em gái út của mình mười tuổi."],["look after","ph","/lʊk ˈæftɚ/","chăm sóc","She looks after her little brother.","Cô ấy trông em trai."]],
6:[["ear","n","/ɪr/","tai","My ear hurts.","Tai mình đau."],["mouth","n","/maʊθ/","miệng","Open your mouth, please.","Há miệng ra nào."],["lip","n","/lɪp/","môi","Her lips are dry.","Môi cô ấy bị khô."],["tongue","n","/tʌŋ/","lưỡi","I burned my tongue.","Mình bị bỏng lưỡi."],["neck","n","/nek/","cổ","My neck is stiff.","Cổ mình bị cứng."],["shoulder","n","/ˈʃoʊldɚ/","vai","My shoulder hurts after work.","Vai mình đau sau giờ làm."],["chest","n","/tʃest/","ngực","He has a pain in his chest.","Anh ấy bị đau ngực."],["elbow","n","/ˈelboʊ/","khuỷu tay","I hit my elbow on the door.","Mình đập khuỷu tay vào cửa."],["wrist","n","/rɪst/","cổ tay","She wears a watch on her wrist.","Cô ấy đeo đồng hồ ở cổ tay."],["finger","n","/ˈfɪŋɡɚ/","ngón tay","I cut my finger.","Mình bị đứt tay."],["thumb","n","/θʌm/","ngón tay cái","Give me a thumbs up!","Giơ ngón cái lên nào!"],["nail","n","/neɪl/","móng tay, móng chân","Don't bite your nails.","Đừng cắn móng tay."],["knee","n","/niː/","đầu gối","My knee hurts when I run.","Mình đau đầu gối khi chạy."],["ankle","n","/ˈæŋkəl/","mắt cá chân","I twisted my ankle.","Mình bị trẹo mắt cá chân."],["foot","n","/fʊt/","bàn chân (số nhiều: feet)","My feet are tired.","Chân mình mỏi."],["toe","n","/toʊ/","ngón chân","I hurt my toe.","Mình bị đau ngón chân."],["heel","n","/hiːl/","gót chân","My heel hurts in these shoes.","Đi giày này đau gót quá."],["skin","n","/skɪn/","da","She has soft skin.","Cô ấy có làn da mềm mại."],["bone","n","/boʊn/","xương","He broke a bone in his hand.","Anh ấy bị gãy xương tay."],["heart","n","/hɑːrt/","tim","Exercise is good for your heart.","Tập thể dục tốt cho tim."],["brain","n","/breɪn/","não","Sleep is important for your brain.","Giấc ngủ quan trọng với não bộ."],["blood","n","/blʌd/","máu","He gave blood at the hospital.","Anh ấy hiến máu ở bệnh viện."],["cheek","n","/tʃiːk/","má","The baby has round cheeks.","Em bé có đôi má tròn."],["chin","n","/tʃɪn/","cằm","He has a small scar on his chin.","Anh ấy có vết sẹo nhỏ ở cằm."],["forehead","n","/ˈfɔːrhed/","trán","She has a high forehead.","Cô ấy có vầng trán cao."],["eyebrow","n","/ˈaɪbraʊ/","lông mày","She raised her eyebrows.","Cô ấy nhướn mày."]],
201:[["want to","ph","/ˈwɑːnt tə/","muốn làm gì (want to + V)","I want to learn how to swim this summer.","Mình muốn học bơi vào hè này."],["prefer","ph","/prɪˈfɝː/","thích A hơn B (prefer A to B)","I prefer tea to coffee in the evening.","Buổi tối mình thích trà hơn cà phê."],["tend to","ph","/ˈtend tə/","có xu hướng, thường hay (tend to + V)","I tend to wake up early on weekdays.","Ngày thường mình hay dậy sớm."],["opt for","ph","/ˈɑːpt fɚ/","chọn (một phương án) (opt for + N)","We opted for the train because it was cheaper.","Bọn mình chọn đi tàu vì rẻ hơn."],["prioritise","ph","/praɪˈɔːrətaɪz/","ưu tiên (prioritise + N/V-ing)","This month I'm prioritising my IELTS speaking.","Tháng này mình ưu tiên phần nói IELTS."],["be inclined to","ph","/bi ɪnˈklaɪnd tə/","nghiêng về, có ý muốn (be inclined to + V)","I'm inclined to accept the job offer.","Mình đang nghiêng về nhận lời mời làm việc."]],
202:[["have time for","ph","/hæv ˈtaɪm fɚ/","có thời gian cho việc gì (have time for + N)","I don't have time for breakfast on Mondays.","Thứ Hai mình không có thời gian ăn sáng."],["have time to","ph","/hæv ˈtaɪm tə/","có thời gian để làm (have time to + V)","Do you have time to talk now?","Bây giờ bạn có thời gian nói chuyện không?"],["can afford","ph","/kən əˈfɔːrd/","đủ tiền / đủ khả năng (can afford + N / to V)","We can't afford a new car this year.","Năm nay nhà mình chưa đủ tiền mua xe mới."],["make time for","ph","/ˌmeɪk ˈtaɪm fɚ/","thu xếp thời gian cho (make time for + N)","Even when I'm busy, I make time for my family.","Dù bận, mình vẫn dành thời gian cho gia đình."],["have access to","ph","/hæv ˈækses tə/","được tiếp cận, sử dụng (have access to + N)","All students have access to the library online.","Mọi học sinh đều được dùng thư viện trực tuyến."],["be within reach","ph","/bi wɪˌðɪn ˈriːtʃ/","trong tầm tay, có thể đạt được","With more practice, band 6.0 is within reach.","Luyện thêm thì band 6.0 trong tầm tay."],["be out of reach","ph","/bi ˌaʊt əv ˈriːtʃ/","ngoài tầm với, ngoài khả năng","A house in the city center is out of reach for us.","Một căn nhà ở trung tâm thì ngoài khả năng của bọn mình."]],
203:[["find it difficult to","ph","/ˈfaɪnd ɪt ˈdɪfɪkəlt tə/","thấy khó làm gì (find it difficult to + V)","I find it difficult to understand fast speakers.","Mình thấy khó hiểu người nói nhanh."],["ask for help","ph","/ˌæsk fɚ ˈhelp/","nhờ giúp đỡ (ask someone for help)","Don't be afraid to ask your teacher for help.","Đừng ngại nhờ giáo viên giúp."],["struggle with","ph","/ˈstrʌɡəl wɪð/","vật lộn, gặp khó với (struggle with + N / struggle to V)","Many learners struggle with English pronunciation.","Nhiều người học gặp khó với phát âm tiếng Anh."],["deal with","ph","/ˈdiːl wɪð/","xử lý, đối phó với","How do you deal with stress at work?","Bạn đối phó với căng thẳng trong công việc thế nào?"],["address a problem","ph","/əˈdres ə ˈprɑːbləm/","giải quyết một vấn đề (address + a problem/an issue)","The school needs to address the problem of bullying.","Nhà trường cần giải quyết vấn đề bắt nạt."],["overcome an obstacle","ph","/ˌoʊvɚˈkʌm ən ˈɑːbstəkəl/","vượt qua trở ngại (overcome + an obstacle/a difficulty)","She overcame many obstacles to become a doctor.","Cô ấy đã vượt qua nhiều trở ngại để trở thành bác sĩ."]],
204:[["because of","ph","/bɪˈkʌz əv/","vì, do (because of + N/V-ing)","The flight was delayed because of the storm.","Chuyến bay bị hoãn vì bão."],["make someone happy","ph","/ˌmeɪk ˌsʌmwʌn ˈhæpi/","làm cho ai (vui…) (make + người/vật + adj)","Cooking for my family makes me happy.","Nấu ăn cho gia đình làm mình vui."],["lead to","ph","/ˈliːd tə/","dẫn đến (lead to + N/V-ing)","Too much screen time can lead to sleep problems.","Dùng màn hình quá nhiều có thể dẫn đến mất ngủ."],["result from","ph","/rɪˈzʌlt frəm/","là kết quả của, bắt nguồn từ (result from + N)","Many accidents result from careless driving.","Nhiều tai nạn bắt nguồn từ việc lái xe ẩu."],["result in","ph","/rɪˈzʌlt ɪn/","gây ra, dẫn đến (result in + N)","Heavy rain resulted in flooding in the city.","Mưa lớn gây ngập trong thành phố."],["contribute to","ph","/kənˈtrɪbjuːt tə/","góp phần vào (contribute to + N/V-ing)","Regular exercise contributes to better health.","Tập thể dục đều đặn góp phần cải thiện sức khỏe."],["be associated with","ph","/bi əˈsoʊʃieɪtɪd wɪð/","có liên quan đến (không khẳng định là nguyên nhân)","Fast food is often associated with weight gain.","Đồ ăn nhanh thường liên quan đến tăng cân."]],
205:[["get better","ph","/ˌɡet ˈbetɚ/","tốt lên, khá hơn","My English is getting better every week.","Tiếng Anh của mình tiến bộ hơn mỗi tuần."],["get worse","ph","/ˌɡet ˈwɝːs/","tệ đi","The traffic gets worse when it rains.","Trời mưa là giao thông tệ hơn."],["increase from A to B","ph","/ɪnˈkriːs frəm … tə …/","tăng từ A lên B","The price increased from 20,000 to 25,000 dong.","Giá tăng từ 20.000 lên 25.000 đồng."],["fall from A to B","ph","/ˈfɑːl frəm … tə …/","giảm từ A xuống B","The number of visitors fell from 500 to 300.","Lượng khách giảm từ 500 xuống 300."],["level off","ph","/ˌlevəl ˈɑːf/","chững lại, ổn định (sau khi tăng/giảm)","House prices rose quickly and then leveled off.","Giá nhà tăng nhanh rồi chững lại."],["give way to","ph","/ˌɡɪv ˈweɪ tə/","nhường chỗ cho, bị thay thế bởi (give way to + N)","Paper maps have given way to phone apps.","Bản đồ giấy đã nhường chỗ cho ứng dụng điện thoại."]],
206:[["the same as","ph","/ðə ˈseɪm əz/","giống với (the same as + N)","My phone is the same as yours.","Điện thoại mình giống của bạn."],["different from","ph","/ˈdɪfrənt frəm/","khác với (different from + N)","Life in Hanoi is very different from life in the countryside.","Cuộc sống ở Hà Nội rất khác ở quê."],["compared with","ph","/kəmˈperd wɪð/","so với (compared with + N)","Compared with last year, my speaking is much better.","So với năm ngoái, kỹ năng nói của mình khá hơn nhiều."],["unlike","ph","/ʌnˈlaɪk/","không giống như, khác với (unlike + N/đại từ)","Unlike my brother, I love vegetables.","Khác với anh mình, mình mê rau."],["outweigh","ph","/ˌaʊtˈweɪ/","có sức nặng hơn, lớn hơn (outweigh + N)","For me, the benefits of online learning outweigh the drawbacks.","Với mình, lợi ích của học trực tuyến lớn hơn bất lợi."],["be on a par with","ph","/bi ɑːn ə ˈpɑːr wɪð/","ngang bằng với (be on a par with + N)","This local brand is on a par with famous ones.","Thương hiệu nội địa này ngang với các hãng nổi tiếng."]],
207:[["learn to","ph","/ˈlɝːn tə/","học để làm được (learn to + V)","I'm learning to drive this year.","Năm nay mình đang học lái xe."],["get used to","ph","/ˌɡet ˈjuːst tə/","dần quen với (get used to + N/V-ing)","I'm getting used to getting up at six.","Mình đang dần quen với việc dậy lúc sáu giờ."],["keep up with","ph","/ˌkiːp ˈʌp wɪð/","theo kịp (keep up with + N)","It's hard to keep up with new technology.","Thật khó theo kịp công nghệ mới."],["put something into practice","ph","/ˈpʊt ˌsʌmθɪŋ ˌɪntə ˈpræktɪs/","áp dụng vào thực tế","Try to put new words into practice every day.","Hãy áp dụng từ mới vào thực tế mỗi ngày."],["develop an understanding of","ph","/dɪˈveləp ən ˌʌndɚˈstændɪŋ əv/","dần hiểu rõ về (develop an understanding of + N)","Reading the news helps me develop an understanding of the world.","Đọc tin tức giúp mình hiểu rõ hơn về thế giới."],["build on","ph","/ˈbɪld ɑːn/","phát triển tiếp dựa trên (build on + N)","Next week we will build on what we learned today.","Tuần sau mình sẽ học tiếp dựa trên bài hôm nay."]],
208:[["care about","ph","/ˈker əˌbaʊt/","quan tâm đến (care about + N)","She really cares about her students.","Cô ấy thật sự quan tâm đến học sinh."],["get on with","ph","/ˌɡet ˈɑːn wɪð/","hòa thuận với (get on with + người)","I get on well with my roommate.","Mình hòa hợp với bạn cùng phòng."],["rely on","ph","/rɪˈlaɪ ɑːn/","dựa vào, tin cậy vào (rely on + người/vật)","You can always rely on your family.","Bạn luôn có thể dựa vào gia đình."],["be responsible for","ph","/bi rɪˈspɑːnsəbəl fɚ/","chịu trách nhiệm về (be responsible for + N/V-ing)","I'm responsible for answering customer emails.","Mình phụ trách trả lời email khách hàng."],["take something for granted","ph","/ˌteɪk ˌsʌmθɪŋ fɚ ˈɡræntɪd/","coi là điều hiển nhiên, không trân trọng","Don't take your health for granted.","Đừng coi sức khỏe là điều hiển nhiên."],["take someone's needs into account","ph","/ˌteɪk ˌsʌmwʌnz ˈniːdz ˌɪntu əˈkaʊnt/","cân nhắc nhu cầu của ai","Good teachers take students' needs into account.","Giáo viên giỏi luôn cân nhắc nhu cầu của học sinh."],["look after","ph","/ˌlʊk ˈæftɚ/","chăm sóc, trông nom","My mother looks after my son when I'm at work.","Mẹ mình trông con giúp khi mình đi làm."]],
209:[["be useful for","ph","/bi ˈjuːsfəl fɚ/","hữu ích cho (be useful for + N/V-ing)","This app is useful for learning new words.","Ứng dụng này hữu ích cho việc học từ mới."],["be worth","ph","/bi ˈwɝːθ/","đáng (be worth + N/V-ing)","Hoi An is worth visiting.","Hội An rất đáng để ghé thăm."],["benefit from","ph","/ˈbenəfɪt frəm/","được hưởng lợi từ (benefit from + N/V-ing)","Children benefit from playing outside.","Trẻ em được lợi khi chơi ngoài trời."],["meet someone's needs","ph","/ˌmiːt ˌsʌmwʌnz ˈniːdz/","đáp ứng nhu cầu của ai","This course meets my needs perfectly.","Khóa học này đáp ứng đúng nhu cầu của mình."],["be effective in","ph","/bi ɪˈfektɪv ɪn/","có hiệu quả trong (be effective in + V-ing)","Shadowing is effective in improving pronunciation.","Shadowing có hiệu quả trong việc cải thiện phát âm."],["an efficient way to","ph","/ən ɪˈfɪʃənt ˈweɪ tə/","cách hiệu quả, ít tốn công sức (an efficient way to + V)","Cooking for the whole week is an efficient way to save time.","Nấu cho cả tuần là cách tiết kiệm thời gian hiệu quả."]],
210:[["I think that","ph","/aɪ ˈθɪŋk ðət/","tôi nghĩ rằng (I think (that) + mệnh đề)","I think that we should leave early.","Mình nghĩ chúng ta nên đi sớm."],["not be sure whether","ph","/nɑːt bi ˈʃʊr ˈweðɚ/","không chắc liệu (not be sure whether + mệnh đề)","I'm not sure whether she will come.","Mình không chắc cô ấy có đến không."],["seem to","ph","/ˈsiːm tə/","có vẻ như (seem to + V)","The new teacher seems to be very friendly.","Cô giáo mới có vẻ rất thân thiện."],["suggest that","ph","/səɡˈdʒest ðət/","cho thấy rằng (suggest that + mệnh đề)","The long queue suggests that the food is good.","Hàng dài cho thấy đồ ăn ngon."],["provide evidence for","ph","/prəˈvaɪd ˈevɪdəns fɚ/","đưa ra bằng chứng cho (provide evidence for + N)","The study provides evidence for the benefits of sleep.","Nghiên cứu đưa ra bằng chứng về lợi ích của giấc ngủ."],["rule out","ph","/ˌruːl ˈaʊt/","loại trừ (một khả năng) (rule out + N/V-ing)","We can't rule out the possibility of rain.","Chúng ta không thể loại trừ khả năng trời mưa."]],
301:[["fridge","n","/frɪdʒ/","tủ lạnh","Put the milk in the fridge.","Cất sữa vào tủ lạnh nhé."],["freezer","n","/ˈfriːzɚ/","ngăn đá, tủ đông","There's ice cream in the freezer.","Có kem trong ngăn đá."],["kitchen cabinet","n","/ˈkɪtʃən ˈkæbənət/","tủ bếp","The bowls are in the kitchen cabinet.","Bát ở trong tủ bếp."],["range hood","n","/ˈreɪndʒ hʊd/","máy hút mùi","Turn on the range hood when you cook.","Bật máy hút mùi khi nấu ăn."],["microwave","n","/ˈmaɪkroʊweɪv/","lò vi sóng","Heat the rice in the microwave.","Hâm cơm trong lò vi sóng."],["rice cooker","n","/ˈraɪs ˌkʊkɚ/","nồi cơm điện","Every Vietnamese kitchen has a rice cooker.","Bếp nhà người Việt nào cũng có nồi cơm điện."],["kettle","n","/ˈketəl/","ấm đun nước","I'll boil some water in the kettle.","Mình sẽ đun ít nước bằng ấm."],["stove","n","/stoʊv/","bếp nấu","Don't touch the stove. It's hot!","Đừng chạm vào bếp. Nóng đấy!"],["oven","n","/ˈʌvən/","lò nướng","The cake is in the oven.","Bánh đang ở trong lò."],["pot","n","/pɑːt/","nồi","She's making soup in a big pot.","Cô ấy đang nấu canh trong một cái nồi to."],["lid","n","/lɪd/","nắp, vung","Put the lid on the pot.","Đậy vung nồi lại."],["pan","n","/pæn/","chảo, xoong có cán","Heat some oil in a pan.","Làm nóng ít dầu trong chảo."],["frying pan","n","/ˈfraɪɪŋ pæn/","chảo rán","I fried two eggs in the frying pan.","Mình rán hai quả trứng bằng chảo."],["ladle","n","/ˈleɪdəl/","cái muôi, vá múc canh","Use the ladle to serve the soup.","Dùng muôi để múc canh."],["spatula","n","/ˈspætʃələ/","xẻng lật (chiên)","Turn the fish with a spatula.","Lật cá bằng xẻng."],["whisk","n","/wɪsk/","phới đánh trứng","Beat the eggs with a whisk.","Đánh trứng bằng phới."],["cutting board","n","/ˈkʌtɪŋ bɔːrd/","cái thớt","Cut the onions on the cutting board.","Thái hành trên thớt."],["knife","n","/naɪf/","con dao","Be careful. This knife is very sharp.","Cẩn thận nhé. Con dao này rất sắc."],["sink","n","/sɪŋk/","bồn rửa","The dirty dishes are in the sink.","Bát đĩa bẩn ở trong bồn rửa."],["faucet","n","/ˈfɔːsɪt/","vòi nước (Anh-Anh: tap)","Turn off the faucet, please.","Khóa vòi nước giúp mình nhé."],["sponge","n","/spʌndʒ/","miếng bọt biển rửa chén","I need a new sponge.","Mình cần miếng rửa chén mới."],["dish soap","n","/ˈdɪʃ soʊp/","nước rửa chén","We're out of dish soap.","Nhà mình hết nước rửa chén rồi."],["dish rack","n","/ˈdɪʃ ræk/","giá úp bát đĩa","Leave the plates on the dish rack to dry.","Để đĩa trên giá cho khô."],["dishwasher","n","/ˈdɪʃwɑːʃɚ/","máy rửa bát","Can you empty the dishwasher?","Bạn lấy bát ra khỏi máy rửa bát được không?"],["trash can","n","/ˈtræʃ kæn/","thùng rác (Anh-Anh: bin)","Throw it in the trash can.","Bỏ nó vào thùng rác."],["recycling bin","n","/riːˈsaɪklɪŋ bɪn/","thùng rác tái chế","Bottles go in the recycling bin.","Chai lọ bỏ vào thùng tái chế."],["drawer","n","/drɔːr/","ngăn kéo","The spoons are in the top drawer.","Thìa ở ngăn kéo trên cùng."],["plate","n","/pleɪt/","cái đĩa","Can you pass me a plate?","Đưa giúp mình cái đĩa được không?"],["bowl","n","/boʊl/","cái bát, tô","I eat a bowl of pho every morning.","Sáng nào mình cũng ăn một tô phở."],["cup","n","/kʌp/","cái tách, chén","Would you like a cup of tea?","Bạn uống một tách trà nhé?"],["glass","n","/ɡlæs/","cái cốc thủy tinh, ly","Can I have a glass of water?","Cho mình xin một ly nước nhé?"],["mug","n","/mʌɡ/","cốc có quai (to)","My favorite mug is blue.","Cái cốc yêu thích của mình màu xanh."],["spoon","n","/spuːn/","cái thìa, muỗng","Eat your soup with a spoon.","Ăn canh bằng thìa nhé."],["fork","n","/fɔːrk/","cái nĩa","Put the fork on the left of the plate.","Đặt nĩa bên trái đĩa."],["chopsticks","n","/ˈtʃɑːpstɪks/","đôi đũa","Can you use chopsticks?","Bạn dùng đũa được không?"]],
302:[["bed","n","/bed/","cái giường","I go to bed at eleven.","Mình đi ngủ lúc mười một giờ."],["pillow","n","/ˈpɪloʊ/","cái gối","This pillow is very soft.","Cái gối này rất mềm."],["blanket","n","/ˈblæŋkɪt/","cái chăn","It's cold. I need another blanket.","Lạnh quá. Mình cần thêm cái chăn."],["nightstand","n","/ˈnaɪtstænd/","tủ đầu giường","My phone is on the nightstand.","Điện thoại mình ở trên tủ đầu giường."],["lamp","n","/læmp/","đèn bàn, đèn ngủ","I read with the lamp on.","Mình đọc sách khi bật đèn."],["alarm clock","n","/əˈlɑːrm klɑːk/","đồng hồ báo thức","My alarm clock rings at six.","Đồng hồ báo thức của mình kêu lúc sáu giờ."],["closet","n","/ˈklɑːzɪt/","tủ quần áo (Anh-Anh: wardrobe)","Hang your jacket in the closet.","Treo áo khoác vào tủ quần áo."],["dresser","n","/ˈdresɚ/","tủ ngăn kéo đựng đồ","My T-shirts are in the dresser.","Áo phông của mình ở trong tủ ngăn kéo."],["mirror","n","/ˈmɪrɚ/","cái gương","She looked in the mirror.","Cô ấy soi gương."],["window","n","/ˈwɪndoʊ/","cửa sổ","Please open the window.","Mở cửa sổ giúp mình nhé."],["curtains","n","/ˈkɝːtənz/","rèm cửa","Close the curtains. It's too bright.","Kéo rèm lại đi. Chói quá."],["rug","n","/rʌɡ/","tấm thảm nhỏ","The cat is sleeping on the rug.","Con mèo đang ngủ trên thảm."],["poster","n","/ˈpoʊstɚ/","tranh áp phích","There's a poster on the wall.","Có một tấm áp phích trên tường."],["slippers","n","/ˈslɪpɚz/","dép đi trong nhà","Where are my slippers?","Dép của mình đâu rồi?"]],
303:[["shower","n","/ˈʃaʊɚ/","vòi hoa sen; tắm vòi sen","I take a shower every morning.","Sáng nào mình cũng tắm vòi sen."],["bathtub","n","/ˈbæθtʌb/","bồn tắm","The bathtub is full of water.","Bồn tắm đầy nước."],["shampoo","n","/ʃæmˈpuː/","dầu gội","This shampoo smells nice.","Dầu gội này thơm."],["towel","n","/ˈtaʊəl/","khăn tắm","Can I use this towel?","Mình dùng khăn này được không?"],["toilet","n","/ˈtɔɪlɪt/","bồn cầu; nhà vệ sinh","Don't forget to flush the toilet.","Đừng quên xả nước bồn cầu."],["toilet paper","n","/ˈtɔɪlɪt ˌpeɪpɚ/","giấy vệ sinh","We need more toilet paper.","Nhà mình cần thêm giấy vệ sinh."],["mirror","n","/ˈmɪrɚ/","cái gương","The mirror is foggy after a hot shower.","Gương mờ hơi nước sau khi tắm nước nóng."],["sink","n","/sɪŋk/","bồn rửa mặt","Wash your hands in the sink.","Rửa tay ở bồn rửa nhé."],["soap","n","/soʊp/","xà phòng","Wash your hands with soap.","Rửa tay bằng xà phòng."],["toothbrush","n","/ˈtuːθbrʌʃ/","bàn chải đánh răng","Change your toothbrush every three months.","Thay bàn chải ba tháng một lần."],["toothpaste","n","/ˈtuːθpeɪst/","kem đánh răng","Put a little toothpaste on your toothbrush.","Lấy một chút kem đánh răng lên bàn chải."],["bath mat","n","/ˈbæθ mæt/","thảm chùi chân phòng tắm","Stand on the bath mat after your shower.","Đứng lên thảm sau khi tắm."]],
304:[["couch","n","/kaʊtʃ/","ghế sofa (cũng nói sofa)","Let's sit on the couch and watch a movie.","Mình ngồi sofa xem phim đi."],["cushion","n","/ˈkʊʃən/","gối tựa","There are two cushions on the couch.","Có hai cái gối tựa trên sofa."],["armchair","n","/ˈɑːrmtʃer/","ghế bành","Grandpa sleeps in his armchair.","Ông ngủ trên ghế bành."],["coffee table","n","/ˈkɑːfi ˌteɪbəl/","bàn nước (thấp)","Put your cup on the coffee table.","Đặt cốc lên bàn nước nhé."],["remote control","n","/rɪˌmoʊt kənˈtroʊl/","điều khiển từ xa","Where's the remote control?","Cái điều khiển đâu rồi?"],["TV","n","/ˌtiːˈviː/","ti vi","What's on TV tonight?","Tối nay ti vi chiếu gì?"],["TV stand","n","/ˌtiːˈviː stænd/","kệ ti vi","The router is on the TV stand.","Cục phát wifi ở trên kệ ti vi."],["bookshelf","n","/ˈbʊkʃelf/","giá sách","My bookshelf is full of English books.","Giá sách của mình đầy sách tiếng Anh."],["floor lamp","n","/ˈflɔːr læmp/","đèn cây đứng","The floor lamp is next to the couch.","Đèn cây đứng cạnh sofa."],["clock","n","/klɑːk/","đồng hồ treo tường","The clock on the wall is slow.","Đồng hồ trên tường chạy chậm."],["picture frame","n","/ˈpɪktʃɚ freɪm/","khung ảnh","This picture frame has a family photo.","Khung ảnh này có ảnh gia đình."],["window","n","/ˈwɪndoʊ/","cửa sổ","The living room has a big window.","Phòng khách có cửa sổ lớn."],["plant","n","/plænt/","cây (cảnh)","Don't forget to water the plant.","Đừng quên tưới cây."],["rug","n","/rʌɡ/","tấm thảm","We bought a new rug for the living room.","Nhà mình mua thảm mới cho phòng khách."]],

function mkQuiz(id){const ws=TV[id].slice(),all=Object.values(TV).flat();const pick=ws.sort(()=>Math.random()-.5).slice(0,Math.min(10,ws.length));
  return{i:0,ok:0,qs:pick.map(w=>{const pool=(ws.length>=4?ws:all).filter(x=>x[3]!==w[3]);const ds=pool.sort(()=>Math.random()-.5).slice(0,2).map(x=>x[3]);const o=[w[3],...ds].sort(()=>Math.random()-.5);return{w,o,c:o.indexOf(w[3]),a:null}})}}

[["Em tưởng tượng câu như một gia đình. Danh từ là “người, vật” (trả lời câu hỏi: ai? cái gì?). Động từ là “việc làm” (làm gì?). Tính từ là “quần áo” khoác lên danh từ (như thế nào?). Trạng từ mô tả “cách làm” của động từ (làm thế nào?).","Nhìn đuôi từ: -tion, -ment, -ness → danh từ; -ful, -ous, -ive → tính từ; -ly → trạng từ."],
 ["Tiếng Anh cũng xếp theo thứ tự Ai – làm gì – cái gì giống tiếng Việt: Tôi ăn cơm = I eat rice. Khác ở chỗ câu tiếng Anh LUÔN phải có động từ. Tiếng Việt nói “Cô ấy vui” là đủ, còn tiếng Anh phải thêm is: She is happy.","Câu chỉ có chủ ngữ + tính từ hoặc danh từ → nhớ chèn am/is/are vào giữa."],
 ["Thì này dùng cho “thời khóa biểu” của cuộc sống: việc lặp đi lặp lại, thói quen, sự thật. Chỗ khó duy nhất: khi chủ ngữ là he/she/it thì động từ thêm s/es. Có does/doesn't rồi thì động từ quay về nguyên mẫu, vì chữ “s” đã chạy sang does.","He works → Does he work? Chữ s “nhảy” lên does, nên không nói Does he works."],
 ["Dùng cho việc đã xong, đã “đóng hồ sơ” trong quá khứ, thường có mốc rõ: yesterday, last week, in 2020, two days ago. Động từ có quy tắc thì thêm -ed, còn bất quy tắc phải học thuộc (go → went, eat → ate).","did đã mang dấu quá khứ rồi → I didn't go (không nói didn't went)."],
 ["will dùng khi em quyết định ngay lúc đang nói (trước đó chưa định), khi đoán tương lai hoặc khi hứa. Nếu đã lên kế hoạch từ trước thì người Mỹ hay dùng be going to.","Vừa nghĩ ra → will. Đã định từ trước → going to: I'm going to visit my mom this weekend."]],
[["Em nghĩ như cái phễu, đi từ rộng đến hẹp. IN cho khoảng rộng (tháng, năm, mùa, buổi sáng/chiều/tối). ON cho một ngày cụ thể (thứ, ngày tháng). AT cho điểm nhỏ nhất (giờ).","Rộng IN – vừa ON – nhỏ AT. Ngoại lệ hay gặp: at night; on Monday morning (đã có ngày cụ thể nên dùng on)."],
 ["IN là ở bên trong một không gian có ranh giới (phòng, thành phố, cái hộp). ON là nằm trên một bề mặt, chạm vào nó (bàn, tường, sàn). AT là một điểm, một địa chỉ hay nơi diễn ra hoạt động (trạm xe, cửa, trường).","Hình dung ba hình: chấm (at) – mặt phẳng (on) – cái hộp (in)."],
 ["Liên từ là “cây cầu” nối hai ý. and là thêm ý, but là ý ngược lại, so là vì vậy (kết quả đứng sau), because là bởi vì (lý do đứng sau), although là mặc dù.","Tiếng Việt nói “Mặc dù… nhưng…”, còn tiếng Anh chỉ dùng MỘT từ: Although it rained, we went out. (không thêm but)"],
 ["Diễn tả việc đang xảy ra ngay lúc này, như đang quay phim trực tiếp. Dấu hiệu: now, right now, Look!, Listen!. Thì này cũng dùng cho kế hoạch đã hẹn chắc trong tương lai gần.","Có be thì phải có V-ing, có V-ing thì phải có be: I am studying (không nói I studying)."],
 ["Như một cảnh quay chậm trong quá khứ: lúc đó việc gì đang diễn ra. Thì này hay đi cặp với quá khứ đơn: một việc dài (đang làm) bị một việc ngắn xen vào.","Việc dài → was/were + V-ing; việc ngắn chen ngang → V2. Ví dụ: I was cooking (dài) when you called (ngắn)."],
 ["Em tưởng tượng chụp một bức ảnh ở đúng một thời điểm trong tương lai: lúc đó em đang làm gì. Thì này hay đi với at this time tomorrow hoặc at 8 p.m. tonight.","Giờ cụ thể ở tương lai + hành động đang diễn ra → will be + V-ing."]],
[["Em tự hỏi: có đếm 1, 2, 3 được không? Quả trứng đếm được nên có eggs. Nước, gạo, lời khuyên, thông tin thì không đếm từng cái được, nên không có số nhiều và không đi với a/an. Muốn đếm thì thêm đơn vị: a glass of water, a piece of advice.","many / a few + danh từ đếm được số nhiều; much / a little + danh từ không đếm được. Các lỗi hay gặp: advices, informations, homeworks."],
 ["a/an nghĩa là “một cái nào đó”, người nghe chưa biết là cái nào. the nghĩa là “cái đó”, cả hai người đều đã biết là cái nào. Chọn an khi ÂM đầu là nguyên âm (không xét chữ cái).","an hour (h câm), a university (đọc /j/). Nghe âm, đừng nhìn chữ."],
 ["Đây là thì “cầu nối” giữa quá khứ và hiện tại: việc đã xảy ra nhưng kết quả còn đến bây giờ, hoặc em không nói rõ lúc nào. Còn quá khứ đơn thì có mốc rõ ràng và việc đã khép lại.","Có yesterday/last/ago → quá khứ đơn. Có for/since/ever/never/already/yet/just → hiện tại hoàn thành. since + mốc (since 2020), for + khoảng (for 5 years)."],
 ["Khi kể chuyện quá khứ có hai việc, việc nào xảy ra TRƯỚC thì lùi thêm một bậc thành had + V3. Em cứ hiểu nó là “quá khứ của quá khứ”.","Vẽ hai chấm trên trục thời gian: chấm trước → had + V3, chấm sau → V2."],
 ["Em đứng ở một mốc trong tương lai rồi nhìn lại: đến lúc đó việc đã xong. Câu thường có by + mốc thời gian.","Thấy by + thời điểm tương lai (by June, by 2030) → will have + V3."],
 ["Động từ ghép với một từ nhỏ (up, on, off, for…) sẽ ra nghĩa mới, nhiều khi không đoán được từ nghĩa từng chữ. Cách học tốt nhất là học cả cụm trong một câu ví dụ, không học rời.","Mỗi ngày học 3 cụm và tự đặt 1 câu nói về chính em."]],
[["Động từ khuyết thiếu giống “gia vị” thêm thái độ cho câu: có thể, nên, phải. Luật vàng: sau chúng luôn là động từ nguyên mẫu, không có to và không thêm s.","She can swim (không nói cans, can to swim). Riêng have to thì vẫn chia: She has to go."],
 ["Khi đoán về chuyện đã qua, em dùng modal + have + V3. Độ chắc chắn giảm dần: must have (chắc hẳn đã, khoảng 90%) → might have (có lẽ đã, khoảng 50%). can't have nghĩa là gần như chắc chắn KHÔNG. should have thì mang ý tiếc: lẽ ra nên làm mà đã không làm.","Người Mỹ nói nhanh thành must've, should've /ˈʃʊdəv/, nghe gần giống “should of”."],
 ["Thì này giống hiện tại hoàn thành nhưng nhấn mạnh quá trình kéo dài: “đã làm suốt từ đó đến giờ và vẫn đang làm”. Rất hợp để trả lời câu hỏi How long…?","I've read the book (đã đọc xong) khác với I've been reading the book (đọc mãi, chưa chắc đã xong)."],
 ["Diễn tả một việc đã kéo dài một thời gian trước một mốc trong quá khứ, thường để giải thích cái mình thấy lúc đó.","Hay đi với because: She was tired because she had been running."],
 ["Cụm 3 từ thì giữ nguyên cả cụm, không tách ra. Riêng look forward to: chữ to ở đây là giới từ, nên phía sau là V-ing.","Thử đặt một danh từ sau to: I look forward to the trip → được, vậy to là giới từ và phải dùng V-ing."]],
[["Loại 0 là sự thật luôn đúng (khoa học, thói quen). Loại 1 là chuyện thật sự có thể xảy ra trong tương lai. Điểm đặc biệt: mệnh đề If KHÔNG dùng will, dù đang nói về tương lai.","If it rains (không nói will rain), we'll stay home."],
 ["Em lùi thì để “lùi xa khỏi sự thật”. Loại 2 là tưởng tượng trái với hiện tại, nên lùi 1 bậc về quá khứ. Loại 3 là tưởng tượng trái với quá khứ (tiếc nuối), nên lùi xa hơn thành had + V3.","Trái hiện tại → lùi 1 bậc (loại 2). Trái quá khứ → lùi 2 bậc (loại 3). Loại 2 dùng were cho mọi ngôi: If I were you."],
 ["Câu bị động đưa người hoặc vật “chịu tác động” lên đầu câu khi ta không biết, không cần hoặc không muốn nói ai làm. Công thức luôn là be + V3, em chỉ cần chia be theo thì.","They built it. → It was built. Dạng này dùng rất nhiều trong IELTS Writing Task 1 (bài mô tả quy trình)."],
 ["Khi nói chung chung về cả một loại thì không dùng the: Dogs are loyal. Khi nói về cái cụ thể, đã xác định thì dùng the: The dogs next door are noisy.","Tự hỏi “cái nào?”. Trả lời được cụ thể → the; nếu chỉ là nói chung → không dùng mạo từ."],
 ["Ngữ điệu là “giai điệu” của câu. Câu hỏi Yes/No lên giọng ở cuối, như đang chờ câu trả lời. Câu hỏi Wh- và câu kể xuống giọng để kết thúc. Dấu phẩy thường là chỗ ngắt hơi ngắn.","Xuống giọng ở cuối câu kể giúp em nghe tự tin hơn khi thi Speaking."]],
[["Khi kể lại lời người khác: vì lời đó đã được nói trong quá khứ, em lùi thì một bậc và đổi “tôi” thành người cho phù hợp.","Lùi 1 bậc: is → was, will → would, can → could, have done → had done. Nếu điều đó vẫn còn đúng đến nay thì có thể không lùi."],
 ["Khi tường thuật một câu hỏi, câu không còn là câu hỏi nữa, nên trật tự trở lại như câu kể: chủ ngữ đứng trước, động từ đứng sau, và không có dấu “?”.","“Where do you live?” → He asked where I lived (bỏ do, không đảo ngữ)."],
 ["Mệnh đề quan hệ là cách gộp 2 câu thành 1 để giải thích thêm về một danh từ, giống chữ “mà / người mà” trong tiếng Việt.","Người → who, vật → which, của ai → whose, nơi chốn → where. Có dấu phẩy thì không dùng that."],
 ["Để nhấn mạnh, em đưa từ phủ định (never, rarely, not only, hardly) lên đầu câu, rồi đặt trợ động từ trước chủ ngữ giống câu hỏi. Cách này dùng trong văn trang trọng và bài Writing.","Biến phần sau thành dạng câu hỏi: I have never seen → Never have I seen."],
 ["Collocation là những “cặp đôi quen thuộc” của từ. Dịch từng chữ từ tiếng Việt rất dễ sai: “mưa to” không phải big rain mà là heavy rain.","make = tạo ra cái mới (make a cake, make a decision); do = làm một việc, nhiệm vụ (do homework, do the dishes)."]],
[["Sau các động từ đề nghị, yêu cầu như suggest, recommend, insist, động từ trong mệnh đề that giữ nguyên mẫu với mọi chủ ngữ, kể cả he/she.","Không thêm s, không chia thì: suggested that she practice (không phải practices). Phủ định: that he not be late."],
 ["wish là ước một điều trái với thực tế, nên lùi thì giống câu điều kiện. Ước cho hiện tại → dùng quá khứ đơn. Tiếc chuyện đã qua → had + V3.","Thực tế: I don't have time. → Ước: I wish I had time."],
 ["Nói mình thích làm gì hơn → would rather + V. Muốn người khác làm gì → would rather + người đó + V quá khứ (cách nói lịch sự, mềm mỏng).","I'd rather walk than take a taxi. (sau than cũng là V nguyên mẫu)"],
 ["It's time to V nghĩa là đến giờ làm gì đó rồi. It's (high) time + S + V2 nghĩa là lẽ ra phải làm từ trước, giờ đã trễ rồi, giọng hơi nhắc nhở.","Thêm high hoặc about vào thì lời thúc giục mạnh hơn."],
 ["Đây là những từ nhìn hoặc nghe na ná nhau nhưng khác loại từ hoặc khác nghĩa. Cách chắc nhất là nhớ loại từ của chúng.","Affect = Action (động từ, A–A); Effect = End result (danh từ, E–E). raise cần tân ngữ (raise your hand); rise thì không (prices rise)."],
 ["Câu chẻ dùng để làm nổi bật một phần của câu, giống cách nói “Chính … là người…” trong tiếng Việt.","It was Lan who won = Chính Lan là người thắng. What I need is a holiday = Điều tôi cần là một kỳ nghỉ."]],
[["afford đi với to + V, giống như want to, need to.","can't afford to + V."],
 ["worth là một tính từ đặc biệt: theo sau nó là V-ing hoặc danh từ.","worth a visit = worth visiting."],
 ["to ở đây là giới từ (dần quen VỚI cái gì), nên sau nó là danh từ hoặc V-ing. Đừng nhầm với used to + V, nghĩa là “đã từng” (thói quen trong quá khứ).","I used to smoke (trước đây từng hút) ≠ I'm used to working late (đã quen làm khuya)."],
 ["to trong contribute to là giới từ, nên sau nó là V-ing.","Giống look forward to, get used to: thử đặt danh từ sau to, nếu được thì dùng V-ing."],
 ["Đây là cụm cố định: responsible for (chịu trách nhiệm về).","Học chung với famous for, good for."],
 ["to chỉ con số đích đến; by chỉ phần chênh lệch.","Rất quan trọng trong Writing Task 1: rose by 20% (tăng thêm 20%) ≠ rose to 20% (tăng lên mức 20%)."],
 ["effective là làm được việc, đạt kết quả. efficient là đạt kết quả mà còn nhanh, ít tốn sức.","efficient = effective + tiết kiệm."],
 ["Trong IELTS không nên khẳng định quá mạnh. Khi chưa chắc cái này gây ra cái kia, dùng be associated with an toàn hơn cause.","Chỉ thấy hai thứ đi cùng nhau → associated with / linked to."]]
];
GR.push(
{t:"Phần 8 · Câu điều kiện hỗn hợp, đảo ngữ điều kiện & bị động nâng cao",lv:4,
 intro:"Những cấu trúc giúp câu văn linh hoạt và trang trọng hơn, cần cho band 7.0+.",
 it:[["Điều kiện hỗn hợp","If + had V3, would + V (quá khứ → hiện tại) · If + V2, would have + V3 (hiện tại → quá khứ)","If I had studied medicine, I would be a doctor now."],
  ["Đảo ngữ điều kiện","Should + S + V (loại 1) · Were + S + to V (loại 2) · Had + S + V3 (loại 3) — bỏ if","Should you need help, call me. Had I known, I would have helped."],
  ["Bị động khách quan","It is said/believed/thought that + mệnh đề · S + is said to + V / to have + V3","It is believed that the temple is 800 years old. → The temple is believed to be 800 years old."],
  ["Thể sai khiến","have/get + vật + V3 · have + người + V · get + người + to V","I had my hair cut yesterday. I got my brother to fix the bike."],
  ["Mệnh đề phân từ","V-ing (chủ động) · V3 (bị động) · Having + V3 (xong trước) — rút gọn khi hai vế cùng chủ ngữ","Feeling tired, I went to bed. Built in 1990, the bridge is still strong."]],
 q:[["If I ___ harder at school, I would have a better job now.",["studied","had studied","would study"],1,"Vế if nói về quá khứ → had studied; vế sau nói hiện tại → would have."],
  ["___ I known about the problem, I would have helped.",["If","Had","Should"],1,"Đảo ngữ loại 3: Had + S + V3."],
  ["The painting is believed ___ by a monk 300 years ago.",["to paint","to have been painted","painting"],1,"Bị động và xảy ra trước lúc nói → to have been + V3."],
  ["I need to have my car ___.",["repair","repaired","repairing"],1,"have + vật + V3."],
  ["___ by the noise, the baby started to cry.",["Waking","Woken","Having woke"],1,"Em bé bị đánh thức → V3: Woken."],
  ["___ you need more information, please contact us.",["Should","Had","Were"],0,"Đảo ngữ loại 1: Should + S + V."]]},
{t:"Phần 9 · Danh từ hóa, nói giảm nhẹ & từ nối học thuật",lv:4,
 intro:"Bộ kỹ năng làm cho bài Writing nghe học thuật, khách quan và mạch lạc.",
 it:[["Danh từ hóa","Động từ/tính từ → danh từ: decide → decision, increase → an increase, important → importance","Prices increased sharply. → There was a sharp increase in prices."],
  ["Nói giảm nhẹ (hedging)","may/might/could · tend to · It seems that · appear to · arguably · to some extent","Social media may contribute to loneliness."],
  ["Từ nối học thuật","Thêm ý: moreover, furthermore · Đối lập: however, nevertheless, whereas · Kết quả: therefore, consequently","Online learning is flexible. However, it requires self-discipline."],
  ["Nhấn mạnh với do/does/did","S + do/does/did + V nguyên mẫu","I did call you, but you didn't answer."],
  ["Mệnh đề danh từ","What/Whether/That + mệnh đề, làm chủ ngữ hoặc tân ngữ","What surprised me was the price. Whether he comes or not doesn't matter."]],
 q:[["There was a ___ in the number of tourists.",["sharply increase","sharp increase","sharp increased"],1,"Danh từ hóa: tính từ + danh từ."],
  ["Which sentence is the most academic?",["Prices went up a lot.","There was a significant rise in prices.","Prices got really high."],1,"Dùng danh từ (a rise) + tính từ trang trọng (significant)."],
  ["The city is crowded; ___, it has many job opportunities.",["therefore","however","for instance"],1,"Hai ý đối lập → however."],
  ["Which is a cautious (hedged) claim?",["Video games cause violence.","Video games may be linked to aggressive behavior.","Video games always make kids violent."],1,"may be linked to là cách nói giảm nhẹ."],
  ["I ___ lock the door. I'm sure!",["did","do locked","was"],0,"Nhấn mạnh quá khứ: did + V."],
  ["What I really want ___ a long holiday.",["are","is","be"],1,"Mệnh đề danh từ làm chủ ngữ → động từ số ít."]]},
{t:"Phần 10 · Đảo ngữ & cấu trúc nhấn mạnh nâng cao",lv:5,
 intro:"Cấu trúc của người dùng tiếng Anh thành thạo: nhấn mạnh tinh tế, giọng văn trang trọng.",
 it:[["Đảo ngữ với Only, Not until, No sooner, Little","Only when… / Not until… + trợ ĐT + S · No sooner had S V3 than… · Hardly had S V3 when… · Little did S know…","No sooner had I arrived than it started to rain. Little did she know what was coming."],
  ["Đảo ngữ với So, Such","So + adj + be/trợ ĐT + S + that… · Such + be + N + that…","So beautiful was the view that we stopped the car."],
  ["Đưa ra đầu câu (fronting)","Adj + as + S + V (mặc dù…) · trạng ngữ nơi chốn + V + S","Strange as it may seem, I enjoy exams. Into the room walked a tall man."],
  ["Giả định trang trọng","Were it not for + N · Had it not been for + N · But for + N · as if/as though + V2","Were it not for your help, I would fail. He talks as if he were the boss."]],
 q:[["No sooner ___ the house than the phone rang.",["I had left","had I left","I left"],1,"No sooner + had + S + V3 + than."],

[["Dùng khi điều kiện và kết quả ở hai thời điểm khác nhau. Ví dụ: ngày xưa không học y (quá khứ) → bây giờ không phải bác sĩ (hiện tại). Mỗi vế chia theo đúng thời gian của nó.","Xét từng vế: vế nói về quá khứ → had V3 / would have V3; vế nói về hiện tại → V2 / would V."],

 ["Dùng khi đưa tin hoặc nêu ý kiến chung mà không nói rõ ai nói. Rất hữu ích trong Writing Task 2, thay cho “people say”.","Nếu việc xảy ra trước lúc “nói” → to have + V3: He is said to have left."],

[["Văn học thuật thích dùng danh từ thay cho động từ, nên câu nghe khách quan và gọn hơn. Đây là kỹ năng nâng band Writing rõ nhất.","Động từ + trạng từ → tính từ + danh từ: increased sharply → a sharp increase."],

 ["Từ nối là “biển chỉ đường” cho người đọc. However, Therefore… đứng đầu câu và có dấu phẩy phía sau; còn whereas, although nối hai vế trong cùng một câu.","Đừng nhồi quá nhiều: mỗi đoạn 2–3 từ nối là đủ, dùng đúng quan trọng hơn dùng nhiều."],
 ["Thêm do/does/did trước động từ để nhấn mạnh “thật sự có”, thường dùng khi người khác nghi ngờ. Khi nói, em nhấn giọng vào chữ did.","Sau do/does/did, động từ về nguyên mẫu: She does love you."],
 ["Cả một mệnh đề có thể đóng vai danh từ, giống “Việc anh ấy đến hay không…” trong tiếng Việt.","Mệnh đề danh từ làm chủ ngữ → động từ chia số ít: What I need is…"]],
[["Mở rộng từ phần đảo ngữ B2: những cụm này luôn kéo theo đảo ngữ. Chú ý các cặp đi kèm: No sooner… than, Hardly… when.","Với Only when / Not until, đảo ngữ nằm ở vế SAU: Not until I left did I realise."],

 ["Người dùng tiếng Anh thành thạo sắp xếp lại câu để nhấn một ý hoặc tạo hiệu ứng. Cấu trúc Adj + as + S + V mang nghĩa “mặc dù”.","Tired as she was, she kept working = Although she was tired, she kept working."],

[["Người bản xứ không lặp lại những gì đã rõ. Câu ngắn hơn mà vẫn đủ nghĩa, nghe rất tự nhiên.","Giữ lại trợ động từ: “Have you finished?” – “Yes, I have.” (không cần nói Yes, I have finished.)"],

const GLV=[["A1","Cơ bản","#2d5ad6"],["A2","Sơ cấp","#0a8590"],["B1","Trung cấp","#138657"],["B2","Trung cao cấp · IELTS 5.5–6.5","#d23a5c"],["C1","Cao cấp · IELTS 7.0–8.0","#8a3fd1"],["C2","Thành thạo · IELTS 8.5–9.0","#b8860b"]];
function renderGrammar(){
  const el=$("#grammar");if(!S.grA)S.grA={};
  if(S.grP!=null&&GR[S.grP]){const p=GR[S.grP],L=GLV[p.lv],a=S.grA[S.grP]||(S.grA[S.grP]={}),ok=p.q.filter((q,i)=>a[i]===q[2]).length;
    el.innerHTML=`<button class="lnk" id="grBack" style="padding:0 0 8px">← Tất cả phần ngữ pháp</button><p class="eyebrow" style="color:${L[2]}">${L[0]} · ${L[1]}</p><h2 class="h2b">${esc(p.t)}</h2>
    ${p.it.map((x,ii)=>{const g=(GE[S.grP]||[])[ii];return `<div class="card grc"><b class="w" style="font-size:18px">${esc(x[0])}</b>${g?`<div class="teach">${esc(g[0])}</div>`:""}<div class="fml"><span class="tl">📐 Công thức</span>${esc(x[1])}</div><div class="ex">${sp(x[2].replace(/<[^>]+>/g,"").replace(/[↗↘✗✓→]/g," "),"small")}<div>${x[2]}</div></div>${g?`<div class="tip2">💡 <b>Mẹo nhớ:</b> ${esc(g[1])}</div>`:""}</div>`}).join("")}
    <h3 class="sect">Bài tập · ${ok}/${p.q.length} đúng</h3>
    ${p.q.map((q,i)=>`<div class="card"><p style="font-weight:700;margin:0 0 10px">${i+1}. ${esc(q[0])}</p><div class="abcl">${q[1].map((o,j)=>`<button data-gq="${i}" data-go2="${j}" class="${a[i]==null?"":j===q[2]?"right":j===a[i]?"wrong":""}" ${a[i]!=null?"disabled":""}><span class="lt">${"ABC"[j]}</span>${esc(o)}</button>`).join("")}</div>${a[i]!=null?`<p class="exp">${a[i]===q[2]?"✓ Đúng rồi! ":"✗ Chưa đúng. "}${esc(q[3])}</p>`:""}</div>`).join("")}
    <div class="row" style="gap:10px;margin-top:6px"><button class="btn" id="grReset">Làm lại bài tập</button>${S.grP<GR.length-1?`<button class="btn solid" id="grNext">Phần tiếp →</button>`:""}</div>`;
    $("#grBack").onclick=()=>{S.grP=null;save();renderGrammar();scrollTo({top:0})};
    $("#grReset").onclick=()=>{S.grA[S.grP]={};save();renderGrammar()};
    const nb=$("#grNext");if(nb)nb.onclick=()=>{S.grP++;save();renderGrammar();scrollTo({top:0})};
    document.querySelectorAll("[data-gq]").forEach(b=>b.onclick=()=>{const i=+b.dataset.gq,j=+b.dataset.go2;if(a[i]!=null)return;a[i]=j;if(j===p.q[i][2])addXp(2);save();renderGrammar()});return}
  el.innerHTML=`<p class="eyebrow">Ngữ pháp tổng hợp · 6 cấp độ · ${GR.length} phần</p><h2 class="h2b">Ngữ pháp từ A1 đến C2</h2>
  ${GLV.map((l,li)=>{const ps=GR.map((p,k)=>[p,k]).filter(x=>x[0].lv===li);return ps.length?`<h3 class="sect" style="color:${l[2]}">${l[0]} · ${l[1]}</h3><div class="tgrid">${ps.map(([p,k])=>{const a=(S.grA||{})[k]||{},ok=p.q.filter((q,i)=>a[i]===q[2]).length;return `<button class="ttile" data-gp="${k}" style="border-top:4px solid ${l[2]}"><b>${esc(p.t)}</b><small>${p.it.length} mục · bài tập ${ok}/${p.q.length}</small><div class="xbar"><i style="width:${Math.round(ok/p.q.length*100)}%"></i></div></button>`}).join("")}</div>`:""}).join("")}`;
  document.querySelectorAll("[data-gp]").forEach(b=>b.onclick=()=>{S.grP=+b.dataset.gp;save();renderGrammar();scrollTo({top:0})});
}

voc:[["hello","int","/həˈloʊ/","xin chào","Hello, I am Lan.","Xin chào, mình là Lan."],["name","n","/neɪm/","tên","My name is Minh.","Tên mình là Minh."],["I","pron","/aɪ/","tôi, mình","I am a student.","Mình là học sinh."],["they","pron","/ðeɪ/","họ","They are my friends.","Họ là bạn của mình."],["student","n","/ˈstuːdənt/","học sinh, sinh viên","She is a student.","Cô ấy là sinh viên."],["teacher","n","/ˈtiːtʃɚ/","giáo viên","He is a teacher.","Anh ấy là giáo viên."],["friend","n","/frend/","bạn bè","You are my friend.","Bạn là bạn của mình."],["happy","adj","/ˈhæpi/","vui vẻ","We are happy today.","Hôm nay chúng mình vui."],["tired","adj","/ˈtaɪɚd/","mệt","I am tired.","Mình mệt."],["from","prep","/frɑːm/","từ, đến từ","I am from Vietnam.","Mình đến từ Việt Nam."],["meet","v","/miːt/","gặp","Nice to meet you.","Rất vui được gặp bạn."],["nice","adj","/naɪs/","tốt, dễ chịu","She is very nice.","Cô ấy rất dễ mến."]],
gr:{t:"Động từ TO BE: am / is / are",e:"TO BE nghĩa là “là / thì / ở”. Nó đi theo chủ ngữ — chọn đúng dạng là xong một nửa câu tiếng Anh cơ bản. Tiếng Việt hay bỏ chữ “là” (“Mình mệt”), nhưng tiếng Anh <b>bắt buộc</b> phải có: <b>I am tired</b>, không nói “I tired”.",f:["I → am  (I'm)","He / She / It → is  (he's, she's, it's)","You / We / They → are  (you're, we're, they're)","Phủ định: thêm NOT → I'm not, isn't, aren't","Câu hỏi: đảo TO BE lên đầu → Are you a student? – Yes, I am."],s:[["I am Lan. I am from Hanoi.","Mình là Lan. Mình đến từ Hà Nội."],["She is not tired. She is happy.","Cô ấy không mệt. Cô ấy vui."],["Are they teachers? No, they aren't.","Họ là giáo viên à? Không phải."],["It is a nice day.","Hôm nay là một ngày đẹp."]]},
col:[["Nice to meet you","Rất vui được gặp bạn","Hi, I'm Minh. Nice to meet you!"],["make friends","kết bạn (không nói get friends)","It is easy to make friends at school."],["close friend","bạn thân","Lan is my close friend."],["How are you?","Bạn khỏe không?","How are you? – I'm fine, thank you."],["What's your name?","Bạn tên gì?","What's your name? – My name is Hoa."]],
q:[["She ___ a teacher.",["am","is","are"],1,"She → is."],["They ___ from Japan.",["is","am","are"],2,"They → are."],["“Tired” là loại từ gì?",["động từ","tính từ","danh từ"],1,"tired = mệt, mô tả trạng thái → tính từ."],["Câu nào đúng?",["I tired.","I am tired.","I is tired."],1,"Tiếng Anh luôn cần TO BE trước tính từ."],["Kết bạn nói là…",["get friends","do friends","make friends"],2,"Collocation chuẩn: make friends."],["Từ nào có âm /iː/ dài?",["ship","sheep","sit"],1,"sheep /ʃiːp/."]]},

{t:"Gia đình",goal:"Nói về các thành viên trong gia đình bằng tính từ sở hữu và sở hữu cách ’s.",
snd:{t:"Âm /æ/ và /e/",tip:"/æ/: mở miệng rộng, hạ hàm xuống, như nói “e” nhưng bành miệng ra (gần “a-e”). /e/: miệng mở vừa, giống “e” tiếng Việt. bad (xấu) ≠ bed (giường).",p:[["bad","bed"],["man","men"],["sad","said"],["bag","beg"],["pan","pen"],["had","head"]]},
voc:[["family","n","/ˈfæməli/","gia đình","I love my family.","Mình yêu gia đình mình."],["mother","n","/ˈmʌðɚ/","mẹ","My mother is a doctor.","Mẹ mình là bác sĩ."],["father","n","/ˈfɑːðɚ/","bố","His father is tall.","Bố anh ấy cao."],["brother","n","/ˈbrʌðɚ/","anh/em trai","I have one brother.","Mình có một anh trai."],["sister","n","/ˈsɪstɚ/","chị/em gái","Her sister is ten.","Em gái cô ấy mười tuổi."],["parents","n","/ˈperənts/","bố mẹ","My parents live in Hue.","Bố mẹ mình sống ở Huế."],["son","n","/sʌn/","con trai","Their son is a student.","Con trai họ là sinh viên."],["daughter","n","/ˈdɑːtɚ/","con gái","She has two daughters.","Cô ấy có hai con gái."],["old","adj","/oʊld/","già, cũ; … tuổi","How old are you?","Bạn bao nhiêu tuổi?"],["young","adj","/jʌŋ/","trẻ","My aunt is young.","Dì mình còn trẻ."],["love","v","/lʌv/","yêu, thương","We love our parents.","Chúng mình yêu bố mẹ."],["live","v","/lɪv/","sống","They live in Da Nang.","Họ sống ở Đà Nẵng."]],
gr:{t:"Tính từ sở hữu & sở hữu cách ’s",e:"Tính từ sở hữu đứng <b>trước danh từ</b> để nói “của ai”. Tiếng Việt nói “mẹ của tôi”, tiếng Anh đảo lại: <b>my mother</b>. Với tên người hoặc danh từ, thêm <b>’s</b>: Lan’s brother = anh trai của Lan.",f:["I → my  ·  you → your","he → his  ·  she → her  ·  it → its","we → our  ·  they → their","Tên/danh từ + ’s: Minh’s car, my mother’s phone","Số nhiều tận cùng -s chỉ thêm ’: my parents’ house"],s:[["This is my father. His name is Nam.","Đây là bố mình. Tên ông là Nam."],["Her daughter is five years old.","Con gái cô ấy năm tuổi."],["Lan's brother lives in Saigon.","Anh trai của Lan sống ở Sài Gòn."],["Our parents are teachers.","Bố mẹ chúng mình là giáo viên."]]},
col:[["immediate family","gia đình ruột (bố mẹ, anh chị em)","There are four people in my immediate family."],["extended family","đại gia đình, họ hàng","I see my extended family at Tet."],["family members","các thành viên gia đình","All my family members love music."],["close-knit family","gia đình gắn bó","We are a close-knit family."],["family tree","cây gia phả","I drew my family tree for school."],["raise a child","nuôi con","My grandparents raised me."]],
q:[["This is ___ sister. (của tôi)",["I","my","me"],1,"Trước danh từ dùng tính từ sở hữu: my."],["Nam and Hoa love ___ son.",["their","they","his"],0,"Nam and Hoa = they → their."],["Anh trai của Lan →",["brother Lan","Lan's brother","Lan brother's"],1,"Tên + ’s + danh từ."],["“Gia đình ruột” là…",["immediate family","near family","quick family"],0,"Theo sách: immediate family."],["Từ nào có âm /æ/?",["bed","men","bad"],2,"bad /bæd/."],["“Live” là loại từ gì?",["động từ","tính từ","danh từ"],0,"live = sống → động từ."]]},

{t:"Đồ vật & số nhiều",goal:"Gọi tên đồ vật, dùng a / an / the và đổi danh từ sang số nhiều.",
snd:{t:"Đuôi -s: /s/, /z/, /ɪz/",tip:"Sau âm vô thanh (p, t, k, f) đọc /s/: books. Sau âm hữu thanh và nguyên âm đọc /z/: pens. Sau s, x, sh, ch, ge đọc /ɪz/: boxes. Đừng nuốt đuôi -s — người Việt hay bỏ âm cuối!",p:[["books /s/","pens /z/"],["cats /s/","bags /z/"],["cups /s/","boxes /ɪz/"],["desks /s/","watches /ɪz/"],["maps /s/","phones /z/"],["parks /s/","pages /ɪz/"]]},
voc:[["book","n","/bʊk/","quyển sách","This is a book.","Đây là một quyển sách."],["pen","n","/pen/","bút","I have two pens.","Mình có hai cái bút."],["phone","n","/foʊn/","điện thoại","My phone is new.","Điện thoại mình mới."],["bag","n","/bæɡ/","cái túi, cặp","Her bag is red.","Túi cô ấy màu đỏ."],["table","n","/ˈteɪbəl/","cái bàn","The book is on the table.","Quyển sách ở trên bàn."],["chair","n","/tʃer/","cái ghế","We need four chairs.","Chúng ta cần bốn cái ghế."],["apple","n","/ˈæpəl/","quả táo","I eat an apple.","Mình ăn một quả táo."],["box","n","/bɑːks/","cái hộp","The boxes are heavy.","Những cái hộp nặng."],["big","adj","/bɪɡ/","to","It is a big house.","Đó là một ngôi nhà to."],["small","adj","/smɑːl/","nhỏ","I have a small car.","Mình có một chiếc xe nhỏ."],["this","det","/ðɪs/","này (số ít)","This pen is blue.","Cái bút này màu xanh."],["these","det","/ðiːz/","những … này","These apples are sweet.","Những quả táo này ngọt."]],
gr:{t:"a / an / the & danh từ số nhiều",e:"<b>a</b> + từ bắt đầu bằng phụ âm (a book), <b>an</b> + từ bắt đầu bằng nguyên âm a, e, i, o, u (an apple). Lưu ý: xét theo <b>âm</b>, không theo chữ: an hour, a university. <b>the</b> = cái đã biết, đã nhắc tới. Số nhiều: thêm -s, hoặc -es sau s, x, sh, ch, o.",f:["a + phụ âm: a pen, a chair","an + nguyên âm: an egg, an orange","the: The pen on the table is mine.","Số nhiều: book → books, box → boxes, baby → babies","Bất quy tắc: man → men, child → children, foot → feet"],s:[["I have a pen and an apple.","Mình có một cái bút và một quả táo."],["The apple is red.","Quả táo (đó) màu đỏ."],["These boxes are big.","Những cái hộp này to."],["There are three children in the room.","Có ba đứa trẻ trong phòng."]]},
col:[["take a picture","chụp ảnh (không nói do/make a picture)","Can I take a picture of you?"],["a heavy bag","cái túi nặng","This is a heavy bag."],["a new phone","điện thoại mới","I want a new phone."],["a big box","cái hộp to","Put it in the big box."],["make a phone call","gọi điện thoại","I need to make a phone call."]],
q:[["I eat ___ orange.",["a","an","the"],1,"orange bắt đầu bằng nguyên âm → an."],["Số nhiều của “box”:",["boxs","boxes","boxies"],1,"Sau x thêm -es."],["Số nhiều của “child”:",["childs","childrens","children"],2,"Bất quy tắc: children."],["“Chụp ảnh” là…",["do a picture","make a picture","take a picture"],2,"Theo sách: take a picture."],["“pens” đọc đuôi là…",["/s/","/z/","/ɪz/"],1,"n là âm hữu thanh → /z/."],["___ books are mine. (những … này)",["This","These","That"],1,"Số nhiều → these."]]},

{t:"Thói quen hằng ngày",goal:"Kể về một ngày của bạn bằng thì Hiện tại đơn và trạng từ tần suất.",
snd:{t:"Âm /θ/ và /ð/ (th)",tip:"Đặt đầu lưỡi giữa hai hàm răng rồi thổi hơi. /θ/ không rung cổ (think), /ð/ có rung cổ (this). Đừng đọc thành “t” hay “d” kiểu tiếng Việt.",p:[["think","this"],["three","that"],["thank","they"],["bath","mother"],["tooth","brother"],["month","weather"]]},
voc:[["get up","ph","/ɡet ʌp/","thức dậy","I get up at six.","Mình dậy lúc sáu giờ."],["work","v","/wɝːk/","làm việc","She works in a bank.","Cô ấy làm ở ngân hàng."],["study","v","/ˈstʌdi/","học","He studies English.","Anh ấy học tiếng Anh."],["watch","v","/wɑːtʃ/","xem","We watch TV at night.","Tối chúng mình xem TV."],["read","v","/riːd/","đọc","I read before bed.","Mình đọc trước khi ngủ."],["cook","v","/kʊk/","nấu ăn","My dad cooks dinner.","Bố mình nấu bữa tối."],["always","adv","/ˈɑːlweɪz/","luôn luôn","I always drink coffee.","Mình luôn uống cà phê."],["usually","adv","/ˈjuːʒuəli/","thường xuyên","She usually walks to work.","Cô ấy thường đi bộ đi làm."],["sometimes","adv","/ˈsʌmtaɪmz/","thỉnh thoảng","We sometimes eat out.","Thỉnh thoảng chúng mình ăn ngoài."],["never","adv","/ˈnevɚ/","không bao giờ","He never smokes.","Anh ấy không bao giờ hút thuốc."],["morning","n","/ˈmɔːrnɪŋ/","buổi sáng","I run in the morning.","Mình chạy bộ buổi sáng."],["early","adv","/ˈɝːli/","sớm","My mom gets up early.","Mẹ mình dậy sớm."]],
gr:{t:"Thì Hiện tại đơn",e:"Dùng cho <b>thói quen, sự thật, lịch trình</b>. Điểm dễ sai nhất: với He / She / It phải thêm <b>-s / -es</b> vào động từ. Trạng từ tần suất (always, usually, sometimes, never) đứng <b>trước động từ thường</b> nhưng <b>sau TO BE</b>.",f:["I / You / We / They + V: I work.","He / She / It + V-s/es: She works. He watches. He studies.","Phủ định: don't / doesn't + V → She doesn't work.","Câu hỏi: Do / Does + S + V? → Does he cook? – Yes, he does.","Vị trí: I always get up early. · She is never late."],s:[["I get up at six every morning.","Mình dậy lúc 6 giờ mỗi sáng."],["My brother doesn't like coffee.","Anh trai mình không thích cà phê."],["Do you study English every day?","Bạn có học tiếng Anh mỗi ngày không?"],["She usually cooks dinner at seven.","Cô ấy thường nấu tối lúc 7 giờ."]]},
col:[["have breakfast","ăn sáng (không nói eat breakfast cũng được, nhưng have tự nhiên hơn)","I have breakfast at seven."],["take a shower","tắm vòi sen","I take a quick shower every morning."],["do homework","làm bài tập về nhà","The kids do their homework after dinner."],["go to bed","đi ngủ","I usually go to bed at eleven."],["take a bus","đi xe buýt","She takes a bus to work."],["take a break","nghỉ giải lao","Let's take a break."]],
q:[["She ___ in a hospital.",["work","works","working"],1,"She → động từ thêm -s."],["He ___ like fish.",["don't","doesn't","isn't"],1,"He + doesn't + V."],["Câu nào đúng?",["I get always up early.","I always get up early.","Always I get up early."],1,"Trạng từ tần suất đứng trước động từ thường."],["“Tắm (vòi sen)” là…",["make a shower","take a shower","do a shower"],1,"Theo sách: take a shower."],["“always” là loại từ gì?",["tính từ","trạng từ","giới từ"],1,"Bổ nghĩa cho động từ → trạng từ."],["Từ nào có âm /ð/ (rung cổ)?",["think","three","this"],2,"this /ðɪs/."]]},

{t:"Ăn uống",goal:"Gọi món, nói về đồ ăn; phân biệt danh từ đếm được / không đếm được.",
snd:{t:"Âm /ʃ/ và /tʃ/",tip:"/ʃ/: như tiếng “suỵt”, hơi thổi liên tục (ship). /tʃ/: bật mạnh một lần, gần “ch” tiếng Việt nhưng tròn môi hơn (chip).",p:[["ship","chip"],["shoe","chew"],["sheep","cheap"],["wash","watch"],["share","chair"],["cash","catch"]]},
voc:[["rice","n","/raɪs/","cơm, gạo (không đếm được)","We eat rice every day.","Chúng mình ăn cơm mỗi ngày."],["water","n","/ˈwɑːtɚ/","nước (không đếm được)","Can I have some water?","Cho mình xin ít nước?"],["bread","n","/bred/","bánh mì (không đếm được)","I buy bread in the morning.","Mình mua bánh mì buổi sáng."],["egg","n","/eɡ/","quả trứng (đếm được)","I want two eggs.","Mình muốn hai quả trứng."],["banana","n","/bəˈnænə/","quả chuối","Bananas are cheap here.","Chuối ở đây rẻ."],["coffee","n","/ˈkɑːfi/","cà phê","Vietnamese coffee is strong.","Cà phê Việt Nam đậm."],["eat","v","/iːt/","ăn","I eat a lot of fruit.","Mình ăn nhiều trái cây."],["drink","v","/drɪŋk/","uống","Drink more water!","Uống nhiều nước hơn nhé!"],["hungry","adj","/ˈhʌŋɡri/","đói","Are you hungry?","Bạn đói không?"],["delicious","adj","/dɪˈlɪʃəs/","ngon","This pho is delicious.","Phở này ngon."],["some","det","/sʌm/","một vài, một ít","I need some eggs.","Mình cần vài quả trứng."],["any","det","/ˈeni/","nào (câu phủ định / hỏi)","Is there any milk?","Có sữa không?"]],
gr:{t:"Đếm được / không đếm được · There is / There are",e:"Danh từ <b>đếm được</b> có số nhiều (an egg, two eggs). Danh từ <b>không đếm được</b> không thêm -s và không đi với a/an (water, rice, bread, money). Dùng <b>some</b> trong câu khẳng định, <b>any</b> trong câu phủ định và câu hỏi.",f:["There is + danh từ số ít / không đếm được: There is some milk.","There are + danh từ số nhiều: There are three eggs.","How many + đếm được? → How many eggs?","How much + không đếm được? → How much water?","Không nói: a rice, two breads → nói: some rice, two pieces of bread"],s:[["There is some rice in the kitchen.","Có ít gạo trong bếp."],["There aren't any bananas.","Không có quả chuối nào."],["How much coffee do you drink?","Bạn uống bao nhiêu cà phê?"],["How many eggs do we need?","Chúng ta cần bao nhiêu quả trứng?"]]},
col:[["have lunch / have dinner","ăn trưa / ăn tối","Let's have lunch together."],["a quick snack","món ăn vặt nhanh","I grab a quick snack at 3 p.m."],["junk food","đồ ăn vặt không lành mạnh","Try not to eat junk food."],["a balanced diet","chế độ ăn cân bằng","A balanced diet keeps you healthy."],["a light meal","bữa ăn nhẹ","I want a light meal tonight."],["home-cooked meal","bữa cơm nhà nấu","Nothing beats a home-cooked meal."]],
q:[["There ___ some water in the bottle.",["is","are","be"],0,"water không đếm được → is."],["How ___ eggs do you want?",["much","many","any"],1,"eggs đếm được → many."],["Is there ___ milk?",["some","any","a"],1,"Câu hỏi → any."],["Câu nào sai?",["I want a rice.","I want some rice.","I want two eggs."],0,"rice không đếm được, không đi với a."],["“Đồ ăn vặt không lành mạnh” là…",["trash food","junk food","rubbish food"],1,"Theo sách: junk food."],["Từ nào có âm /tʃ/?",["ship","shoe","chip"],2,"chip /tʃɪp/."]]},

{t:"Miêu tả người · Tính từ & trạng từ",goal:"Miêu tả ngoại hình, tính cách và phân biệt tính từ với trạng từ.",
snd:{t:"Âm /ʌ/ và /ɑː/",tip:"/ʌ/: ngắn, giống “ă” tiếng Việt (cup). /ɑː/: dài, mở to miệng, giống “a” kéo dài (car).",p:[["cup","carp"],["hut","heart"],["much","march"],["cut","cart"],["fun","farm"],["luck","dark"]]},
voc:[["tall","adj","/tɑːl/","cao","My brother is tall.","Anh mình cao."],["short","adj","/ʃɔːrt/","thấp, ngắn","She has short hair.","Cô ấy có tóc ngắn."],["thin","adj","/θɪn/","gầy","He is thin.","Anh ấy gầy."],["strong","adj","/strɑːŋ/","khỏe","My dad is strong.","Bố mình khỏe."],["beautiful","adj","/ˈbjuːtɪfəl/","đẹp","What a beautiful smile!","Nụ cười đẹp quá!"],["kind","adj","/kaɪnd/","tốt bụng","Our teacher is kind.","Cô giáo chúng mình tốt bụng."],["funny","adj","/ˈfʌni/","vui tính, buồn cười","Tom is really funny.","Tom rất vui tính."],["hair","n","/her/","tóc (không đếm được)","She has long black hair.","Cô ấy có mái tóc đen dài."],["eye","n","/aɪ/","mắt","He has brown eyes.","Anh ấy có mắt nâu."],["quickly","adv","/ˈkwɪkli/","một cách nhanh","She walks quickly.","Cô ấy đi nhanh."],["slowly","adv","/ˈsloʊli/","một cách chậm","Please speak slowly.","Làm ơn nói chậm thôi."],["well","adv","/wel/","tốt, giỏi","He speaks English well.","Anh ấy nói tiếng Anh giỏi."]],
gr:{t:"Tính từ vs trạng từ · Nhận diện loại từ",e:"<b>Tính từ</b> mô tả <b>danh từ</b>: đứng trước danh từ (a <b>kind</b> man) hoặc sau TO BE (He is <b>kind</b>). Khác tiếng Việt: “người tốt” → “kind man”, tính từ đứng <b>trước</b>. <b>Trạng từ</b> mô tả <b>động từ</b>: thường = tính từ + <b>-ly</b> (slow → slowly).",f:["Tính từ + danh từ: a tall girl, long hair","TO BE + tính từ: She is beautiful.","Động từ + trạng từ: She sings beautifully.","Đặc biệt: good → well · fast → fast · hard → hard","Mẹo đuôi từ: -tion/-ment/-er → danh từ · -ful/-ous/-y → tính từ · -ly → trạng từ"],s:[["She is a careful driver.","Cô ấy là tài xế cẩn thận."],["She drives carefully.","Cô ấy lái xe cẩn thận."],["He is a good singer. He sings well.","Anh ấy là ca sĩ giỏi. Anh ấy hát hay."],["My mother has long black hair.","Mẹ mình có mái tóc đen dài."]]},
col:[["long hair / curly hair","tóc dài / tóc xoăn","My sister has curly hair."],["blue eyes","mắt xanh","The baby has blue eyes."],["a round face","khuôn mặt tròn","She has a round face."],["broad shoulders","vai rộng","He has broad shoulders."],["athletic build","dáng người thể thao","Swimmers have an athletic build."],["good-looking","ưa nhìn","Her boyfriend is good-looking."]],
q:[["He runs very ___.",["quick","quickly","quicker"],1,"Bổ nghĩa động từ runs → trạng từ."],["She is a ___ girl.",["beautifully","beautiful","beauty"],1,"Trước danh từ → tính từ."],["Trạng từ của “good” là…",["goodly","well","better"],1,"good → well."],["Người tốt bụng →",["man kind","kind man","kindly man"],1,"Tính từ đứng trước danh từ."],["“Vai rộng” là…",["broad shoulders","big shoulders","wide arms"],0,"Theo sách: broad shoulders."],["Từ nào có âm /ɑː/ dài?",["cup","fun","car"],2,"car /kɑːr/."]]},

{t:"Đang làm gì? · Hiện tại tiếp diễn",goal:"Nói việc đang xảy ra ngay lúc này và phân biệt với Hiện tại đơn.",
snd:{t:"Âm /v/ và /w/",tip:"/v/: răng trên chạm nhẹ môi dưới, rung cổ (very). /w/: tròn môi như “u” rồi mở ra, răng không chạm môi (we). Người Việt hay đọc /w/ thành /v/ — chú ý nhé!",p:[["vet","wet"],["vest","west"],["vine","wine"],["very","worry"],["van","when"],["visit","window"]]},
voc:[["now","adv","/naʊ/","bây giờ","I am busy now.","Bây giờ mình bận."],["today","adv","/təˈdeɪ/","hôm nay","It is raining today.","Hôm nay trời đang mưa."],["wear","v","/wer/","mặc, đeo","She is wearing a dress.","Cô ấy đang mặc váy."],["wait","v","/weɪt/","chờ đợi","I am waiting for you.","Mình đang đợi bạn."],["talk","v","/tɑːk/","nói chuyện","They are talking.","Họ đang nói chuyện."],["listen","v","/ˈlɪsən/","nghe","Listen to me!","Nghe mình nói này!"],["play","v","/pleɪ/","chơi","The kids are playing football.","Bọn trẻ đang đá bóng."],["run","v","/rʌn/","chạy","He is running in the park.","Anh ấy đang chạy trong công viên."],["rain","v","/reɪn/","mưa","It rains a lot in July.","Tháng Bảy mưa nhiều."],["busy","adj","/ˈbɪzi/","bận","Are you busy?","Bạn có bận không?"],["music","n","/ˈmjuːzɪk/","âm nhạc","I love music.","Mình yêu âm nhạc."],["at the moment","ph","/ət ðə ˈmoʊmənt/","lúc này","She is sleeping at the moment.","Lúc này cô ấy đang ngủ."]],
gr:{t:"Thì Hiện tại tiếp diễn",e:"Dùng cho việc <b>đang xảy ra lúc nói</b> (now, at the moment, Look!, Listen!). Hiện tại đơn = thói quen; Hiện tại tiếp diễn = ngay bây giờ. Một số động từ chỉ trạng thái <b>không</b> dùng -ing: like, love, know, want, need, understand.",f:["S + am / is / are + V-ing: I am reading.","Phủ định: She isn't working.  ·  Hỏi: Are you listening?","make → making (bỏ e) · run → running (gấp đôi phụ âm) · lie → lying","So sánh: I usually drink tea, but today I am drinking coffee.","Sai: I am knowing. → Đúng: I know."],s:[["Look! It is raining.","Nhìn kìa! Trời đang mưa."],["What are you doing? – I'm cooking.","Bạn đang làm gì đấy? – Mình đang nấu ăn."],["He isn't watching TV now.","Bây giờ anh ấy không xem TV."],["I want a coffee.","Mình muốn một cốc cà phê."]]},
col:[["listen to music","nghe nhạc (phải có to)","I'm listening to music."],["have fun / have a good time","vui vẻ, chơi vui","We are having a good time."],["catch the bus","bắt xe buýt","Hurry, I'm catching the bus!"],["take a rest","nghỉ ngơi","You look tired, take a rest."],["pay attention","chú ý","Please pay attention to the teacher."]],
q:[["Listen! She ___.",["sings","is singing","sing"],1,"Listen! → đang xảy ra → tiếp diễn."],["V-ing của “run” là…",["runing","running","runned"],1,"Gấp đôi n: running."],["I usually ___ tea.",["drink","am drinking","drinking"],0,"usually → thói quen → hiện tại đơn."],["Câu nào đúng?",["I am knowing him.","I know him.","I knowing him."],1,"know là động từ trạng thái."],["“Chú ý” là…",["give attention","pay attention","make attention"],1,"Theo sách: pay attention."],["Từ nào bắt đầu bằng /w/?",["very","west","visit"],1,"west /west/."]]},

{t:"Nhà cửa · Giới từ nơi chốn & thời gian",goal:"Miêu tả căn nhà và vị trí đồ vật bằng in / on / under / next to…",
snd:{t:"Âm /r/ và /l/",tip:"/l/: đầu lưỡi chạm lợi sau răng trên (light). /r/: cong lưỡi về sau, lưỡi không chạm đâu cả, môi hơi tròn (right).",p:[["right","light"],["read","lead"],["rock","lock"],["fry","fly"],["road","load"],["grass","glass"]]},
voc:[["house","n","/haʊs/","ngôi nhà","Our house is small.","Nhà chúng mình nhỏ."],["room","n","/ruːm/","căn phòng","My room is clean.","Phòng mình sạch."],["kitchen","n","/ˈkɪtʃɪn/","nhà bếp","Mom is in the kitchen.","Mẹ ở trong bếp."],["bedroom","n","/ˈbedruːm/","phòng ngủ","It has two bedrooms.","Nó có hai phòng ngủ."],["bed","n","/bed/","cái giường","The cat is on the bed.","Con mèo ở trên giường."],["door","n","/dɔːr/","cửa ra vào","Close the door, please.","Làm ơn đóng cửa."],["window","n","/ˈwɪndoʊ/","cửa sổ","Open the window.","Mở cửa sổ ra."],["in","prep","/ɪn/","trong","The keys are in my bag.","Chìa khóa ở trong túi mình."],["on","prep","/ɑːn/","trên (có tiếp xúc)","Your phone is on the table.","Điện thoại bạn ở trên bàn."],["under","prep","/ˈʌndɚ/","dưới","The dog is under the chair.","Con chó ở dưới ghế."],["next to","prep","/ˈnekst tə/","bên cạnh","The bank is next to the school.","Ngân hàng cạnh trường học."],["between","prep","/bɪˈtwiːn/","ở giữa (hai vật)","I sit between Lan and Minh.","Mình ngồi giữa Lan và Minh."]],
gr:{t:"Giới từ nơi chốn & thời gian",e:"Nơi chốn: in (trong), on (trên mặt), under (dưới), next to (cạnh), between (giữa), behind (sau), in front of (trước). Thời gian dùng quy tắc “từ lớn đến nhỏ”: <b>in</b> cho khoảng lớn, <b>on</b> cho ngày, <b>at</b> cho giờ chính xác.",f:["in + tháng / năm / mùa / buổi: in May, in 2026, in the morning","on + thứ / ngày: on Monday, on 2nd September","at + giờ / thời điểm: at 7 o'clock, at night, at noon","Nơi chốn: in the room · on the wall · at home / at school","There is a lamp next to the bed."],s:[["The cat is under the table.","Con mèo ở dưới bàn."],["I have English class on Monday at 8 p.m.","Mình có lớp tiếng Anh tối thứ Hai lúc 8 giờ."],["My birthday is in October.","Sinh nhật mình vào tháng Mười."],["The sofa is between the window and the door.","Ghế sofa nằm giữa cửa sổ và cửa ra vào."]]},
col:[["a two-bedroom apartment","căn hộ hai phòng ngủ","We rent a two-bedroom apartment."],["a spacious living room","phòng khách rộng rãi","I love our spacious living room."],["fully furnished","đầy đủ nội thất","The flat is fully furnished."],["a nice view","tầm nhìn đẹp","My room has a nice view of the river."],["housewarming party","tiệc tân gia","Come to my housewarming party!"],["feel homesick","nhớ nhà","I feel homesick when I travel."]],
q:[["I was born ___ 2001.",["on","at","in"],2,"Năm → in."],["See you ___ Friday!",["in","on","at"],1,"Thứ → on."],["The class starts ___ 7 p.m.",["at","on","in"],0,"Giờ chính xác → at."],["The cat is ___ the bed. (dưới)",["on","under","between"],1,"dưới = under."],["“Tiệc tân gia” là…",["house party","housewarming party","home party"],1,"Theo sách: housewarming party."],["Từ nào bắt đầu bằng /l/?",["right","road","light"],2,"light /laɪt/."]]},

{t:"Hôm qua · Thì Quá khứ đơn",goal:"Kể lại chuyện đã xảy ra: cuối tuần, chuyến đi, kỳ nghỉ.",
snd:{t:"Đuôi -ed: /t/, /d/, /ɪd/",tip:"Sau âm vô thanh (k, p, s, sh, ch, f) đọc /t/: worked. Sau âm hữu thanh và nguyên âm đọc /d/: played. Sau t, d đọc /ɪd/: wanted. Đừng đọc “wanted” thành “wan-tét”!",p:[["worked /t/","played /d/"],["watched /t/","lived /d/"],["stopped /t/","wanted /ɪd/"],["washed /t/","needed /ɪd/"],["cooked /t/","visited /ɪd/"],["laughed /t/","opened /d/"]]},
voc:[["yesterday","adv","/ˈjestɚdeɪ/","hôm qua","I was at home yesterday.","Hôm qua mình ở nhà."],["last","adj","/læst/","trước, vừa qua","I saw him last week.","Mình gặp anh ấy tuần trước."],["ago","adv","/əˈɡoʊ/","cách đây","Two years ago, I lived in Hanoi.","Hai năm trước mình sống ở Hà Nội."],["go → went","v","/ɡoʊ/ → /went/","đi → đã đi","We went to the beach.","Chúng mình đã đi biển."],["see → saw","v","/siː/ → /sɑː/","thấy → đã thấy","I saw a good film.","Mình đã xem một bộ phim hay."],["buy → bought","v","/baɪ/ → /bɑːt/","mua → đã mua","She bought a new bag.","Cô ấy đã mua túi mới."],["eat → ate","v","/iːt/ → /eɪt/","ăn → đã ăn","We ate seafood.","Chúng mình đã ăn hải sản."],["visit","v","/ˈvɪzɪt/","thăm","I visited my grandma.","Mình đã thăm bà."],["finish","v","/ˈfɪnɪʃ/","hoàn thành","He finished his homework.","Anh ấy đã làm xong bài tập."],["trip","n","/trɪp/","chuyến đi","The trip was fun.","Chuyến đi rất vui."],["weekend","n","/ˌwiːkˈend/","cuối tuần","How was your weekend?","Cuối tuần của bạn thế nào?"],["holiday","n","/ˈhɑːlədeɪ/","kỳ nghỉ","We had a great holiday.","Chúng mình đã có kỳ nghỉ tuyệt vời."]],
gr:{t:"Thì Quá khứ đơn",e:"Dùng cho việc <b>đã xảy ra và kết thúc</b> trong quá khứ (yesterday, last week, ago, in 2020). Tin vui: động từ quá khứ <b>giống nhau cho mọi chủ ngữ</b>, không cần thêm -s. TO BE chia was / were.",f:["TO BE: I / He / She / It → was · You / We / They → were","Có quy tắc: V + ed → play → played, study → studied, stop → stopped","Bất quy tắc phải học thuộc: go–went, see–saw, have–had, buy–bought, eat–ate","Phủ định: didn't + V nguyên mẫu → I didn't go.","Câu hỏi: Did + S + V? → Did you see it? – Yes, I did."],s:[["I went to Da Lat last weekend.","Cuối tuần trước mình đi Đà Lạt."],["The weather was cold.","Thời tiết lạnh."],["We didn't eat at the hotel.","Chúng mình không ăn ở khách sạn."],["Did you take many pictures?","Bạn có chụp nhiều ảnh không?"]]},
col:[["take a trip","đi một chuyến","We took a trip to Ha Long Bay."],["have a good time","có khoảng thời gian vui vẻ","Did you have a good time?"],["pay someone a visit","ghé thăm ai","I paid my grandma a visit."],["catch a cold","bị cảm lạnh","I caught a cold last week."],["break a promise","thất hứa","He broke his promise."],["take a test","làm bài kiểm tra","I took a test yesterday."]],
q:[["I ___ to school yesterday.",["go","went","goed"],1,"go → went (bất quy tắc)."],["She didn't ___ the film.",["saw","see","seen"],1,"Sau didn't dùng V nguyên mẫu."],["They ___ at home last night.",["was","were","are"],1,"They → were."],["“wanted” đọc đuôi -ed là…",["/t/","/d/","/ɪd/"],2,"Sau t → /ɪd/."],["“Bị cảm lạnh” là…",["get a cold","catch a cold","take a cold"],1,"Theo sách: catch a cold."],["___ you have a good weekend?",["Do","Did","Were"],1,"Câu hỏi quá khứ: Did + S + V."]]},

{t:"Kế hoạch tương lai · will & be going to",goal:"Nói về dự định, lời hứa và dự đoán; làm quen với trọng âm từ.",
snd:{t:"Trọng âm từ (word stress)",tip:"Từ hai âm tiết: danh từ và tính từ thường nhấn âm <b>đầu</b> (HAP-py, TA-ble), động từ thường nhấn âm <b>sau</b> (de-CIDE, be-GIN). Chữ in hoa là âm tiết đọc mạnh, cao và dài hơn. Bấm nghe và nhại theo.",p:[["HAP-py","de-CIDE"],["TA-ble","be-GIN"],["TEACH-er","for-GET"],["MO-ther","re-PEAT"],["WIN-dow","in-VITE"],["PRES-ent (n)","pre-SENT (v)"]]},
voc:[["tomorrow","adv","/təˈmɑːroʊ/","ngày mai","See you tomorrow!","Hẹn gặp ngày mai!"],["next","adj","/nekst/","tới, kế tiếp","I'm moving next month.","Tháng sau mình chuyển nhà."],["plan","n","/plæn/","kế hoạch","What are your plans?","Bạn có kế hoạch gì?"],["travel","v","/ˈtrævəl/","đi du lịch","I want to travel to Japan.","Mình muốn đi Nhật."],["learn","v","/lɝːn/","học (kỹ năng)","I'm going to learn to swim.","Mình sẽ học bơi."],["hope","v","/hoʊp/","hy vọng","I hope it will be sunny.","Mình hy vọng trời sẽ nắng."],["decide","v","/dɪˈsaɪd/","quyết định","I decided to study English.","Mình quyết định học tiếng Anh."],["future","n","/ˈfjuːtʃɚ/","tương lai","Think about your future.","Hãy nghĩ về tương lai."],["soon","adv","/suːn/","sớm, chẳng bao lâu","I'll call you soon.","Mình sẽ gọi bạn sớm."],["maybe","adv","/ˈmeɪbi/","có lẽ","Maybe it will rain.","Có lẽ trời sẽ mưa."],["ticket","n","/ˈtɪkɪt/","vé","I bought two tickets.","Mình đã mua hai vé."],["together","adv","/təˈɡeðɚ/","cùng nhau","Let's go together.","Cùng đi nhé."]],
gr:{t:"will và be going to",e:"<b>will</b>: quyết định <b>ngay lúc nói</b>, lời hứa, dự đoán theo cảm nghĩ. <b>be going to</b>: kế hoạch <b>đã định trước</b>, hoặc dự đoán có dấu hiệu rõ ràng. Cả hai đều theo sau là V nguyên mẫu.",f:["S + will + V: I'll help you. (quyết định / lời hứa)","Phủ định: won't = will not → I won't be late.","S + am/is/are going to + V: I'm going to visit Hue next week. (đã lên kế hoạch)","Dấu hiệu: Look at the clouds! It's going to rain.","Câu hỏi: Will you come? · Are you going to travel?"],s:[["The phone is ringing. – I'll get it!","Điện thoại reo kìa. – Để mình nghe!"],["I'm going to study English every day.","Mình sẽ học tiếng Anh mỗi ngày (đã quyết)."],["I promise I won't forget.","Mình hứa sẽ không quên."],["Look at the sky. It's going to rain.","Nhìn trời kìa. Sắp mưa rồi."]]},
col:[["make a plan","lập kế hoạch","Let's make a plan for the weekend."],["make a decision","đưa ra quyết định","It's time to make a decision."],["have an opportunity","có cơ hội","I hope to have an opportunity to travel."],["take a class","tham gia một lớp học","I'm going to take a cooking class."],["take care of","chăm sóc","Take care of yourself!"],["take a taxi","đi taxi","We'll take a taxi to the airport."]],
q:[["“Ôi, quên ví rồi!” – “Không sao, mình ___ trả.”",["will pay","am going to pay","pay"],0,"Quyết định ngay lúc nói → will."],["We ___ visit Hue next week. (đã đặt vé)",["will","are going to","going to"],1,"Kế hoạch đã định → be going to."],["She ___ be late. (sẽ không)",["willn't","won't","don't"],1,"will not = won't."],["“Đưa ra quyết định” là…",["do a decision","make a decision","take decision"],1,"Collocation: make a decision."],["Động từ “decide” nhấn âm ở…",["âm tiết đầu","âm tiết thứ hai"],1,"de-CIDE."],["Look at those clouds! It ___ rain.",["will","is going to","goes to"],1,"Có dấu hiệu rõ → be going to."]]}
