voc:[["countryside","n","/ˈkʌntrisaɪd/","nông thôn","I grew up in the countryside.","Mình lớn lên ở nông thôn."],["population","n","/ˌpɑːpjəˈleɪʃən/","dân số","Hanoi has a large population.","Hà Nội có dân số đông."],["resident","n","/ˈrezɪdənt/","cư dân","Local residents complained about the noise.","Cư dân địa phương phàn nàn về tiếng ồn."],["apartment","n","/əˈpɑːrtmənt/","căn hộ","We live in a small apartment.","Bọn mình sống trong một căn hộ nhỏ."],["rent","n","/rent/","tiền thuê nhà","The rent is too high.","Tiền thuê nhà cao quá."],["landlord","n","/ˈlændlɔːrd/","chủ nhà (cho thuê)","My landlord is very kind.","Chủ nhà mình rất tốt."],["neighbor","n","/ˈneɪbɚ/","hàng xóm","My neighbors are friendly.","Hàng xóm mình thân thiện."],["noisy","adj","/ˈnɔɪzi/","ồn ào","The street is noisy at night.","Con phố ồn ào vào ban đêm."],["peaceful","adj","/ˈpiːsfəl/","yên bình","Life in the village is peaceful.","Cuộc sống ở làng rất yên bình."],["traffic jam","n","/ˈtræfɪk dʒæm/","tắc đường","I was late because of a traffic jam.","Mình trễ vì tắc đường."],["rush hour","n","/ˈrʌʃ aʊɚ/","giờ cao điểm","Avoid driving during rush hour.","Tránh lái xe giờ cao điểm."],["commute","v","/kəˈmjuːt/","đi lại (đi làm hằng ngày)","I commute an hour every day.","Mỗi ngày mình đi làm mất một tiếng."],["facilities","n","/fəˈsɪlətiz/","cơ sở vật chất, tiện ích","The city has good medical facilities.","Thành phố có cơ sở y tế tốt."],["modern","adj","/ˈmɑːdɚn/","hiện đại","They live in a modern building.","Họ sống trong một tòa nhà hiện đại."],["skyscraper","n","/ˈskaɪskreɪpɚ/","nhà chọc trời","New York is famous for its skyscrapers.","New York nổi tiếng với nhà chọc trời."],["suburb","n","/ˈsʌbɝːb/","ngoại ô","They moved to the suburbs.","Họ chuyển ra ngoại ô."],["downtown","adv","/ˌdaʊnˈtaʊn/","ở/đến trung tâm thành phố","Let's go downtown tonight.","Tối nay mình ra trung tâm đi."],["cost of living","ph","/ˌkɔːst əv ˈlɪvɪŋ/","chi phí sinh hoạt","The cost of living is rising.","Chi phí sinh hoạt đang tăng."],["expensive","adj","/ɪkˈspensɪv/","đắt","Houses in the city are expensive.","Nhà ở thành phố đắt."],["affordable","adj","/əˈfɔːrdəbəl/","giá phải chăng","We need more affordable housing.","Chúng ta cần thêm nhà ở giá phải chăng."],["lively","adj","/ˈlaɪvli/","sôi động","The night market is very lively.","Chợ đêm rất sôi động."],["quiet","adj","/ˈkwaɪət/","yên tĩnh","I prefer a quiet neighborhood.","Mình thích khu phố yên tĩnh."],["public space","ph","/ˌpʌblɪk ˈspeɪs/","không gian công cộng","Cities need more public spaces.","Thành phố cần thêm không gian công cộng."],["move","v","/muːv/","chuyển nhà","We moved to Da Nang last year.","Năm ngoái nhà mình chuyển vào Đà Nẵng."],["community","n","/kəˈmjuːnəti/","cộng đồng","The village has a strong community.","Ngôi làng có tinh thần cộng đồng mạnh."],["safe","adj","/seɪf/","an toàn","Is this area safe at night?","Khu này ban đêm có an toàn không?"],["housing","n","/ˈhaʊzɪŋ/","nhà ở","Housing is a big problem for young people.","Nhà ở là vấn đề lớn với người trẻ."],["urban","adj","/ˈɝːbən/","thuộc đô thị","Urban areas are growing fast.","Khu đô thị đang phát triển nhanh."],["rural","adj","/ˈrʊrəl/","thuộc nông thôn","Rural life is slower.","Cuộc sống nông thôn chậm hơn."],["nightlife","n","/ˈnaɪtlaɪf/","cuộc sống về đêm","Saigon has great nightlife.","Sài Gòn có cuộc sống về đêm sôi động."]],
gr:{t:"used to / be used to / get used to",e:"Ba cấu trúc rất dễ nhầm. <b>used to + V</b>: thói quen hoặc trạng thái <b>trong quá khứ</b>, nay không còn. <b>be used to + V-ing</b>: <b>đã quen</b> với việc gì. <b>get used to + V-ing</b>: <b>dần quen</b> với việc gì.",f:["used to + V → I used to live in the countryside.","didn't use to + V · Did you use to + V? → Did you use to walk to school?","be used to + N/V-ing → I'm used to the noise. I'm used to getting up early.","get used to + N/V-ing → I'm getting used to living in a big city.","Mẹo: thấy be / get trước used to → phía sau là V-ing."],s:[["I used to live in a quiet village.","Mình từng sống ở một ngôi làng yên tĩnh."],["Now I'm used to the noise of the city.","Giờ mình đã quen với tiếng ồn thành phố."],["It took me a year to get used to the traffic.","Mình mất một năm để quen với giao thông."],["Did you use to take the bus to school?","Hồi trước bạn có đi xe buýt đến trường không?"]]},
col:[["get stuck in traffic","bị kẹt xe","I got stuck in traffic for an hour."],["pay the rent","trả tiền thuê nhà","We pay the rent on the first of every month."],["move to the city","chuyển lên thành phố","Many young people move to the city."],["high cost of living","chi phí sinh hoạt cao","Big cities have a high cost of living."],["the downtown area","khu trung tâm","Our office is in the downtown area."],["a sense of community","tinh thần cộng đồng","Villages have a strong sense of community."]],
q:[["I ___ play football every afternoon when I was a kid.",["used to","am used to","get used to"],0,"Thói quen quá khứ → used to + V."],["I'm used to ___ in a noisy city.",["live","living","lived"],1,"be used to + V-ing."],["She is getting used to ___ on the right.",["drive","driving","drove"],1,"get used to + V-ing."],["“Bị kẹt xe” là…",["get stuck in traffic","get traffic","have a traffic"],0,"get stuck in traffic."],["Từ nào có âm /eɪ/?",["let","get","late"],2,"late /leɪt/."],["Khu ngoại ô là…",["suburb","downtown","skyscraper"],0,"suburb."]]},
{t:"Mua sắm & quảng cáo",goal:"Nói về thói quen mua sắm và quảng cáo; so sánh nâng cao với much / far và the more…, the more….",
snd:{t:"Âm /k/ và /ɡ/",tip:"/k/ không rung cổ, bật hơi mạnh ở đầu từ (coat). /ɡ/ rung cổ, bật hơi nhẹ (goat). Ở cuối từ, nguyên âm trước /ɡ/ đọc dài hơn: back /bæk/ – bag /bæɡ/. Đừng nuốt âm cuối nhé.",p:[["coat","goat"],["cap","gap"],["back","bag"],["card","guard"],["class","glass"],["curl","girl"]]},
voc:[["advertisement","n","/ˌædvɚˈtaɪzmənt/","quảng cáo (bài, tờ, đoạn)","I saw an advertisement for a new phone.","Mình thấy một quảng cáo điện thoại mới."],["advertise","v","/ˈædvɚtaɪz/","quảng cáo","Many companies advertise on social media.","Nhiều công ty quảng cáo trên mạng xã hội."],["brand","n","/brænd/","thương hiệu","What brand is your phone?","Điện thoại của bạn hiệu gì?"],["product","n","/ˈprɑːdʌkt/","sản phẩm","This shop sells local products.","Cửa hàng này bán sản phẩm địa phương."],["discount","n","/ˈdɪskaʊnt/","sự giảm giá","They gave me a twenty percent discount.","Họ giảm giá cho mình hai mươi phần trăm."],["bargain","n","/ˈbɑːrɡɪn/","món hời","This jacket was a real bargain.","Chiếc áo khoác này đúng là món hời."],["refund","n","/ˈriːfʌnd/","tiền hoàn lại","Can I get a refund?","Tôi có được hoàn tiền không?"],["shopaholic","n","/ˌʃɑːpəˈhɑːlɪk/","người nghiện mua sắm","My sister is a real shopaholic.","Chị mình đúng là người nghiện mua sắm."],["consumer","n","/kənˈsuːmɚ/","người tiêu dùng","Consumers want cheap but good products.","Người tiêu dùng muốn sản phẩm rẻ mà tốt."],["quality","n","/ˈkwɑːləti/","chất lượng","The quality of this bag is excellent.","Chất lượng chiếc túi này rất tốt."],["overpriced","adj","/ˌoʊvɚˈpraɪst/","đắt quá mức","Food at the airport is overpriced.","Đồ ăn ở sân bay đắt quá mức."],["compare","v","/kəmˈper/","so sánh","I always compare prices before I buy.","Mình luôn so sánh giá trước khi mua."],["shopping mall","n","/ˈʃɑːpɪŋ mɑːl/","trung tâm thương mại","The new shopping mall is huge.","Trung tâm thương mại mới rất rộng."],["online shopping","ph","/ˌɑːnlaɪn ˈʃɑːpɪŋ/","mua sắm trực tuyến","Online shopping saves a lot of time.","Mua sắm trực tuyến tiết kiệm nhiều thời gian."],["deliver","v","/dɪˈlɪvɚ/","giao (hàng)","They deliver for free in Hanoi.","Họ giao hàng miễn phí ở Hà Nội."],["delivery","n","/dɪˈlɪvəri/","sự giao hàng","Delivery usually takes two days.","Giao hàng thường mất hai ngày."],["return","v","/rɪˈtɝːn/","trả lại (hàng)","You can return it within seven days.","Bạn có thể trả lại trong vòng bảy ngày."],["exchange","v","/ɪksˈtʃeɪndʒ/","đổi (hàng)","Can I exchange this shirt for a bigger size?","Tôi đổi áo này lấy cỡ lớn hơn được không?"],["commercial","n","/kəˈmɝːʃəl/","quảng cáo trên TV, radio","This commercial is really funny.","Đoạn quảng cáo này buồn cười thật."],["slogan","n","/ˈsloʊɡən/","khẩu hiệu","A good slogan is short and easy to remember.","Khẩu hiệu hay thì ngắn và dễ nhớ."],["persuade","v","/pɚˈsweɪd/","thuyết phục","Ads try to persuade us to buy more.","Quảng cáo cố thuyết phục chúng ta mua nhiều hơn."],["attract","v","/əˈtrækt/","thu hút","Big sales attract many customers.","Các đợt giảm giá lớn thu hút nhiều khách hàng."],["loyalty card","n","/ˈlɔɪəlti kɑːrd/","thẻ khách hàng thân thiết","I use my loyalty card to collect points.","Mình dùng thẻ thành viên để tích điểm."],["voucher","n","/ˈvaʊtʃɚ/","phiếu mua hàng, phiếu giảm giá","I got a free voucher for my birthday.","Mình được tặng một phiếu mua hàng dịp sinh nhật."],["reasonable","adj","/ˈriːzənəbəl/","(giá) hợp lý","The prices here are very reasonable.","Giá ở đây rất hợp lý."],["luxury","adj","/ˈlʌkʃɚi/","sang trọng, xa xỉ","She only buys luxury brands.","Cô ấy chỉ mua hàng hiệu xa xỉ."],["second-hand","adj","/ˌsekəndˈhænd/","đồ cũ, đã qua sử dụng","I bought a second-hand bike.","Mình mua một chiếc xe đạp cũ."],["line up","ph","/ˌlaɪn ˈʌp/","xếp hàng","People lined up to buy the new phone.","Mọi người xếp hàng mua điện thoại mới."],["slightly","adv","/ˈslaɪtli/","hơi, một chút","This one is slightly cheaper.","Cái này rẻ hơn một chút."],["significantly","adv","/sɪɡˈnɪfɪkəntli/","đáng kể","Prices have risen significantly this year.","Năm nay giá tăng đáng kể."]],
gr:{t:"So sánh nâng cao",e:"Ở Ngày 11 em đã học so sánh hơn. Hôm nay nâng cấp: <b>much / far / a lot</b> + so sánh hơn để nhấn mạnh (hơn nhiều), <b>slightly / a bit</b> + so sánh hơn (hơn một chút), <b>the + so sánh hơn…, the + so sánh hơn…</b> (càng… càng…) và <b>so sánh kép</b> (higher and higher). Không dùng <b>very</b> trước so sánh hơn. Cấu trúc này rất hữu ích cho IELTS Writing Task 1.",f:["much / far / a lot + so sánh hơn → Online shopping is much more convenient than going to the mall.","slightly / a bit + so sánh hơn → This brand is slightly cheaper.","The + so sánh hơn + S + V, the + so sánh hơn + S + V → The more you buy, the more you spend.","So sánh kép: adj-er and adj-er / more and more + adj → Prices are getting higher and higher.","not as + adj + as (kém hơn) → Second-hand clothes are not as expensive as new ones."],s:[["The cheaper the product, the lower the quality.","Sản phẩm càng rẻ thì chất lượng càng thấp."],["Shopping online is far more convenient than going to the mall.","Mua sắm trực tuyến tiện hơn nhiều so với đi trung tâm thương mại."],["More and more people are buying second-hand clothes.","Ngày càng nhiều người mua quần áo cũ."],["This phone is slightly more expensive, but its quality is much better.","Điện thoại này đắt hơn một chút nhưng chất lượng tốt hơn nhiều."]]},
col:[["go shopping","đi mua sắm","We go shopping every Saturday."],["get a discount","được giảm giá","Students get a ten percent discount."],["ask for a refund","yêu cầu hoàn tiền","The shoes broke, so I asked for a refund."],["a well-known brand","thương hiệu nổi tiếng","It's a well-known brand in Vietnam."],["shop around","dạo xem nhiều nơi để so giá","It's smart to shop around before you buy a laptop."],["value for money","đáng đồng tiền","This restaurant is great value for money."]],
q:[["The more you practice, the ___ you become.",["good","better","best"],1,"The + so sánh hơn…, the + so sánh hơn…"],["This bag is ___ more expensive than that one.",["very","much","most"],1,"Nhấn mạnh so sánh hơn: much / far / a lot (không dùng very)."],["Prices are getting ___.",["high and high","higher and higher","more high"],1,"So sánh kép: higher and higher."],["“Yêu cầu hoàn tiền” là…",["ask for a refund","ask a return","want a discount"],0,"ask for a refund."],["Từ nào bắt đầu bằng âm /ɡ/?",["coat","goat","cap"],1,"goat /ɡoʊt/."],["Người mua và dùng hàng hóa gọi là…",["consumer","brand","slogan"],0,"consumer = người tiêu dùng."]]},

{t:"Thể thao",goal:"Nói về các môn thể thao và trận đấu; dùng must / might / can't để suy đoán.",
snd:{t:"Âm /dʒ/ và /j/",tip:"/dʒ/: đầu lưỡi chạm nướu trên rồi bật mạnh, rung cổ (jet). /j/: lưỡi không chạm nướu, đọc mềm như “i” hoặc “d” miền Nam (yet). Người Việt hay đọc yes thành “dét”, nhớ đọc mềm như “iét” nhé.",p:[["jet","yet"],["jam","yam"],["joke","yolk"],["juice","use"],["jeer","year"],["gel","yell"]]},
voc:[["athlete","n","/ˈæθliːt/","vận động viên","She is a professional athlete.","Cô ấy là vận động viên chuyên nghiệp."],["champion","n","/ˈtʃæmpiən/","nhà vô địch","He is the world champion.","Anh ấy là nhà vô địch thế giới."],["coach","n","/koʊtʃ/","huấn luyện viên","Our coach is very strict.","Huấn luyện viên của bọn mình rất nghiêm."],["competition","n","/ˌkɑːmpəˈtɪʃən/","cuộc thi","She won a swimming competition.","Cô ấy thắng một cuộc thi bơi."],["compete","v","/kəmˈpiːt/","thi đấu, cạnh tranh","Eight teams will compete next week.","Tám đội sẽ thi đấu vào tuần sau."],["tournament","n","/ˈtɝːnəmənt/","giải đấu","Our school held a football tournament.","Trường mình tổ chức một giải bóng đá."],["match","n","/mætʃ/","trận đấu","Did you watch the match last night?","Tối qua bạn có xem trận đấu không?"],["score","v","/skɔːr/","ghi bàn, ghi điểm","He scored two goals.","Anh ấy ghi hai bàn."],["referee","n","/ˌrefəˈriː/","trọng tài","The referee stopped the game.","Trọng tài dừng trận đấu."],["opponent","n","/əˈpoʊnənt/","đối thủ","Our opponent was very strong.","Đối thủ của bọn mình rất mạnh."],["stadium","n","/ˈsteɪdiəm/","sân vận động","The stadium was full of fans.","Sân vận động chật kín cổ động viên."],["supporter","n","/səˈpɔːrtɚ/","cổ động viên","The supporters sang all night.","Cổ động viên hát suốt đêm."],["medal","n","/ˈmedəl/","huy chương","She won a gold medal.","Cô ấy giành huy chương vàng."],["win → won","v","/wɪn/ → /wʌn/","thắng → đã thắng","Vietnam won the game.","Việt Nam đã thắng trận."],["beat → beat","v","/biːt/ → /biːt/","đánh bại → đã đánh bại","We beat the best team in the city.","Bọn mình đã đánh bại đội mạnh nhất thành phố."],["draw","n","/drɑː/","trận hòa","The match ended in a draw.","Trận đấu kết thúc với tỉ số hòa."],["injured","adj","/ˈɪndʒɚd/","bị thương","He was injured in the first half.","Anh ấy bị thương ở hiệp một."],["training","n","/ˈtreɪnɪŋ/","sự tập luyện","Training starts at six a.m.","Buổi tập bắt đầu lúc sáu giờ sáng."],["professional","adj","/prəˈfeʃənəl/","chuyên nghiệp","He wants to be a professional player.","Cậu ấy muốn thành cầu thủ chuyên nghiệp."],["amateur","adj","/ˈæmətʃɚ/","nghiệp dư","I play in an amateur team.","Mình chơi trong một đội nghiệp dư."],["badminton","n","/ˈbædmɪntən/","cầu lông","Badminton is popular in Vietnam.","Cầu lông rất phổ biến ở Việt Nam."],["table tennis","n","/ˈteɪbəl ˌtenɪs/","bóng bàn","My dad plays table tennis after work.","Bố mình chơi bóng bàn sau giờ làm."],["volleyball","n","/ˈvɑːlibɑːl/","bóng chuyền","We played volleyball on the beach.","Bọn mình chơi bóng chuyền trên bãi biển."],["marathon","n","/ˈmerəθɑːn/","cuộc chạy marathon","She ran her first marathon last year.","Năm ngoái cô ấy chạy marathon lần đầu."],["cheer","v","/tʃɪr/","cổ vũ, reo hò","Thousands of fans cheered for the team.","Hàng nghìn người hâm mộ cổ vũ cho đội."],["warm up","ph","/ˌwɔːrm ˈʌp/","khởi động","Always warm up before you run.","Luôn khởi động trước khi chạy."],["might","v","/maɪt/","có thể, có lẽ (khoảng 50%)","We might win the match tomorrow.","Mai bọn mình có thể thắng trận."],["likely","adj","/ˈlaɪkli/","có khả năng xảy ra","It's likely to rain during the match.","Có khả năng trời mưa trong trận đấu."],["possibly","adv","/ˈpɑːsəbli/","có thể là","He is possibly the best player in the team.","Anh ấy có thể là cầu thủ giỏi nhất đội."],["certainly","adv","/ˈsɝːtənli/","chắc chắn","She will certainly win a medal.","Cô ấy chắc chắn sẽ giành huy chương."]],
gr:{t:"Động từ khuyết thiếu chỉ suy đoán: must / might / may / can't",e:"Khi <b>đoán</b> về hiện tại, em chọn động từ theo độ chắc chắn: <b>must</b> (chắc chắn đúng, khoảng 90%), <b>may / might / could</b> (có thể, khoảng 50%), <b>can't</b> (chắc chắn không đúng). Sau chúng là V nguyên mẫu; với tính từ hay danh từ thì dùng <b>be</b>. Lưu ý: phủ định của must khi suy đoán là <b>can't</b>, không phải mustn't.",f:["must + V / must be → He trains every day. He must be very fit.","may / might / could + V → They might win the match.","can't + V / can't be → She can't be tired. She just woke up.","may not / might not → It might not rain this afternoon.","Đang diễn ra: must / might be + V-ing → The fans are shouting. Our team must be winning."],s:[["He has won three medals. He must be a great athlete.","Anh ấy đã giành ba huy chương. Chắc hẳn anh ấy là vận động viên giỏi."],["Our team might win if we play well.","Đội mình có thể thắng nếu chơi tốt."],["That can't be the coach. He looks too young.","Đó không thể là huấn luyện viên được. Anh ấy trông trẻ quá."],["The stadium is full. It must be an important match.","Sân vận động kín chỗ. Chắc hẳn đây là trận quan trọng."]]},
col:[["play a sport","chơi một môn thể thao","Do you play any sports?"],["win a match","thắng một trận","Our team won the match two to one."],["break a record","phá kỷ lục","She broke the national record."],["join a club","tham gia câu lạc bộ","I joined a badminton club last year."],["keep in shape","giữ dáng","I go jogging to keep in shape."],["lose a game","thua một trận","We lost the game, but we had fun."]],
q:[["He trains six hours a day. He ___ be very strong.",["must","can't","mustn't"],0,"Chắc chắn đúng → must be."],["She ___ be at the gym. I just saw her at home.",["must","might","can't"],2,"Chắc chắn không đúng → can't be."],["Take an umbrella. It ___ rain later.",["might","must","can't"],0,"Có thể xảy ra (khoảng 50%) → might."],["“Phá kỷ lục” là…",["break a record","win a record","beat a record book"],0,"break a record."],["Từ nào bắt đầu bằng âm /j/?",["jet","yet","jam"],1,"yet /jet/."],["Người điều khiển trận đấu là…",["referee","coach","supporter"],0,"referee = trọng tài."]]},

{t:"Âm nhạc & giải trí",goal:"Nói về sở thích âm nhạc và giải trí; phân biệt stop / remember / forget / try + V-ing và + to V.",
snd:{t:"Âm /n/ và /ŋ/ cuối từ",tip:"/n/: đầu lưỡi chạm nướu trên (sin). /ŋ/: cuống lưỡi nâng lên chạm vòm mềm, đầu lưỡi để yên, giống “ng” tiếng Việt (sing). Đuôi -ing luôn kết thúc bằng /ŋ/, đừng đọc thành “in”.",p:[["sin","sing"],["thin","thing"],["win","wing"],["ran","rang"],["sun","sung"],["ban","bang"]]},
voc:[["musician","n","/mjuːˈzɪʃən/","nhạc sĩ, nhạc công","My uncle is a musician.","Chú mình là nhạc công."],["singer","n","/ˈsɪŋɚ/","ca sĩ","She is my favorite singer.","Cô ấy là ca sĩ mình thích nhất."],["band","n","/bænd/","ban nhạc","They started a band in college.","Họ lập một ban nhạc hồi đại học."],["concert","n","/ˈkɑːnsɚt/","buổi hòa nhạc","The concert starts at eight.","Buổi hòa nhạc bắt đầu lúc tám giờ."],["album","n","/ˈælbəm/","album nhạc","Their new album is amazing.","Album mới của họ tuyệt lắm."],["lyrics","n","/ˈlɪrɪks/","lời bài hát","I learn English through song lyrics.","Mình học tiếng Anh qua lời bài hát."],["rhythm","n","/ˈrɪðəm/","nhịp điệu","This song has a great rhythm.","Bài hát này có nhịp điệu rất hay."],["instrument","n","/ˈɪnstrəmənt/","nhạc cụ","Can you play an instrument?","Bạn chơi được nhạc cụ nào không?"],["guitar","n","/ɡɪˈtɑːr/","đàn ghi-ta","He plays the guitar very well.","Anh ấy chơi ghi-ta rất hay."],["piano","n","/piˈænoʊ/","đàn piano","My daughter is learning the piano.","Con gái mình đang học piano."],["drum","n","/drʌm/","cái trống","The drums are too loud.","Tiếng trống to quá."],["genre","n","/ˈʒɑːnrə/","thể loại","What genre of music do you like?","Bạn thích thể loại nhạc nào?"],["classical","adj","/ˈklæsɪkəl/","cổ điển","I listen to classical music when I study.","Mình nghe nhạc cổ điển khi học."],["audience","n","/ˈɑːdiəns/","khán giả","The audience loved the show.","Khán giả rất thích buổi biểu diễn."],["perform","v","/pɚˈfɔːrm/","biểu diễn","The band will perform in Hanoi next month.","Tháng sau ban nhạc sẽ biểu diễn ở Hà Nội."],["performance","n","/pɚˈfɔːrməns/","buổi biểu diễn, màn trình diễn","Her performance was fantastic.","Màn trình diễn của cô ấy thật tuyệt."],["stage","n","/steɪdʒ/","sân khấu","The singer walked onto the stage.","Ca sĩ bước lên sân khấu."],["talented","adj","/ˈtæləntɪd/","có tài năng","She is a very talented dancer.","Cô ấy là vũ công rất tài năng."],["entertainment","n","/ˌentɚˈteɪnmənt/","sự giải trí","Television is my main entertainment.","Ti vi là thú giải trí chính của mình."],["karaoke","n","/ˌkeriˈoʊki/","hát karaoke","We sing karaoke every Friday night.","Tối thứ Sáu nào bọn mình cũng đi hát karaoke."],["headphones","n","/ˈhedfoʊnz/","tai nghe","I always wear headphones on the bus.","Mình luôn đeo tai nghe trên xe buýt."],["playlist","n","/ˈpleɪlɪst/","danh sách phát","I made a playlist for running.","Mình tạo một danh sách nhạc để chạy bộ."],["stream","v","/striːm/","phát trực tuyến","I stream music on my phone.","Mình nghe nhạc trực tuyến trên điện thoại."],["hit","n","/hɪt/","bài hát ăn khách","This song was a big hit in 2020.","Bài này từng là bản hit lớn năm 2020."],["tune","n","/tuːn/","giai điệu","I can't get this tune out of my head.","Giai điệu này cứ lởn vởn trong đầu mình."],["volume","n","/ˈvɑːljuːm/","âm lượng","Please turn down the volume.","Làm ơn vặn nhỏ âm lượng."],["catchy","adj","/ˈkætʃi/","bắt tai, dễ nhớ","The chorus is really catchy.","Đoạn điệp khúc rất bắt tai."],["relaxing","adj","/rɪˈlæksɪŋ/","thư giãn, êm dịu","Jazz is relaxing after a long day.","Nhạc jazz rất thư giãn sau một ngày dài."],["regret","v","/rɪˈɡret/","hối tiếc","I regret not learning the piano.","Mình tiếc vì đã không học piano."],["go on","ph","/ˌɡoʊ ˈɑːn/","tiếp tục","The band went on playing in the rain.","Ban nhạc tiếp tục chơi dưới mưa."]],
gr:{t:"V-ing hay to V: động từ đổi nghĩa",e:"Ở Ngày 15 em đã học động từ đi với V-ing hoặc to V. Hôm nay là nhóm khó hơn: <b>stop, remember, forget, try, regret, go on</b> đi được với cả hai nhưng <b>nghĩa khác nhau</b>. Mẹo nhớ: <b>to V</b> thường hướng về việc <b>sắp làm</b>, còn <b>V-ing</b> nói về việc <b>đã làm hoặc đang làm</b>.",f:["stop + V-ing (ngừng hẳn) · stop + to V (dừng lại để làm việc khác) → I stopped playing the guitar. · I stopped to buy a ticket.","remember / forget + to V (nhớ / quên phải làm) · + V-ing (nhớ / quên đã làm) → Remember to turn off the music. · I remember singing this song as a child.","try + to V (cố gắng) · try + V-ing (thử làm xem sao) → I tried to sing the high note. · Try listening to slower songs.","regret + V-ing (tiếc đã làm) · regret + to V (lấy làm tiếc phải báo) → I regret not learning the piano.","go on + V-ing (tiếp tục cùng việc) · go on + to V (chuyển sang việc khác) → The band went on playing after the rain."],s:[["I'll never forget seeing my favorite band live.","Mình sẽ không bao giờ quên lần xem ban nhạc yêu thích biểu diễn trực tiếp."],["Remember to bring your headphones.","Nhớ mang theo tai nghe nhé."],["If you can't sleep, try listening to relaxing music.","Nếu không ngủ được, thử nghe nhạc thư giãn xem."],["She stopped playing the piano when she was fifteen.","Cô ấy bỏ chơi piano năm mười lăm tuổi."]]},
col:[["play an instrument","chơi một nhạc cụ","Can you play an instrument?"],["go to a concert","đi xem hòa nhạc","We went to a concert last weekend."],["turn up the volume","vặn to âm lượng","Please turn up the volume a little."],["have a talent for","có năng khiếu về","She has a talent for music."],["a live performance","buổi biểu diễn trực tiếp","Nothing beats a live performance."],["a catchy song","bài hát bắt tai","This is such a catchy song!"]],
q:[["I stopped ___ coffee because I couldn't sleep.",["to drink","drinking","drink"],1,"Ngừng hẳn một việc → stop + V-ing."],["Remember ___ the door when you leave.",["locking","to lock","lock"],1,"Nhớ phải làm (việc sắp làm) → remember + to V."],["I'll never forget ___ that concert.",["seeing","to see","see"],0,"Không quên việc đã làm → forget + V-ing."],["Can't sleep? Try ___ to soft music.",["to listen","listening","listened"],1,"Thử làm xem sao → try + V-ing."],["Từ nào kết thúc bằng âm /ŋ/?",["sin","win","sing"],2,"sing /sɪŋ/."],["“Vặn to âm lượng” là…",["turn up the volume","turn on the volume","open the volume"],0,"turn up the volume."]]},

{t:"Ôn tập tuần · Ngày 25–30",goal:"Ôn lại ngữ pháp và phát âm của Ngày 25–30, học 30 từ nối giúp câu trả lời dài và mạch lạc hơn.",
snd:{t:"Ôn tập các cặp âm trong tuần",tip:"Ôn 6 cặp âm của tuần: /k/–/ɡ/ (Ngày 28), /dʒ/–/j/ (29), /n/–/ŋ/ (30), /ʌ/–/ɑː/ (25), /ʊ/–/uː/ (26), /eɪ/–/e/ (27). Đọc mỗi cặp 3 lần, rồi chơi <b>Nghe & chọn</b> bên dưới. Sai cặp nào thì mở lại ngày đó để luyện thêm.",p:[["coat","goat"],["jet","yet"],["sin","sing"],["cut","cot"],["full","fool"],["late","let"]]},
voc:[["in addition","ph","/ɪn əˈdɪʃən/","ngoài ra, thêm vào đó","In addition, the hotel has a pool.","Ngoài ra, khách sạn còn có hồ bơi."],["besides","adv","/bɪˈsaɪdz/","bên cạnh đó, vả lại","I'm too tired. Besides, it's raining.","Mình mệt quá. Vả lại trời đang mưa."],["moreover","adv","/mɔːrˈoʊvɚ/","hơn nữa (trang trọng)","The flat is cheap. Moreover, it's near my office.","Căn hộ rẻ. Hơn nữa, nó gần văn phòng mình."],["on the other hand","ph","/ɑːn ði ˈʌðɚ hænd/","mặt khác","City life is exciting. On the other hand, it's stressful.","Sống ở thành phố sôi động. Mặt khác, nó căng thẳng."],["whereas","conj","/werˈæz/","trong khi (đối lập)","I love tea, whereas my husband prefers coffee.","Mình thích trà, trong khi chồng mình thích cà phê."],["even though","conj","/ˈiːvən ðoʊ/","mặc dù","Even though I was tired, I finished my homework.","Mặc dù mệt, mình vẫn làm xong bài tập."],["consequently","adv","/ˈkɑːnsəkwentli/","do đó, vì vậy","He didn't study. Consequently, he failed.","Cậu ấy không học. Do đó, cậu ấy trượt."],["as a result","ph","/æz ə rɪˈzʌlt/","kết quả là","It rained all day. As a result, the match was canceled.","Trời mưa cả ngày. Kết quả là trận đấu bị hủy."],["so that","conj","/ˈsoʊ ðət/","để mà","I save money so that I can travel.","Mình tiết kiệm tiền để có thể đi du lịch."],["in order to","ph","/ɪn ˈɔːrdɚ tə/","để (làm gì)","I get up early in order to exercise.","Mình dậy sớm để tập thể dục."],["such as","ph","/ˈsʌtʃ æz/","chẳng hạn như","I like sports such as tennis and swimming.","Mình thích các môn như quần vợt và bơi."],["for instance","ph","/fɚ ˈɪnstəns/","ví dụ như","Many jobs, for instance nursing, are stressful.","Nhiều nghề, ví dụ như y tá, rất căng thẳng."],["in fact","ph","/ɪn ˈfækt/","thực tế là","It's not expensive. In fact, it's quite cheap.","Nó không đắt. Thực tế là khá rẻ."],["to be honest","ph","/tə bi ˈɑːnɪst/","thật lòng mà nói","To be honest, I don't like horror movies.","Thật lòng mà nói, mình không thích phim kinh dị."],["as far as I know","ph","/æz ˌfɑːr æz aɪ ˈnoʊ/","theo như tôi biết","As far as I know, the shop opens at nine.","Theo như mình biết, cửa hàng mở lúc chín giờ."],["generally speaking","ph","/ˌdʒenərəli ˈspiːkɪŋ/","nói chung","Generally speaking, people here are friendly.","Nói chung, người ở đây thân thiện."],["on the whole","ph","/ɑːn ðə ˈhoʊl/","nhìn chung","On the whole, I enjoyed the trip.","Nhìn chung, mình thích chuyến đi."],["overall","adv","/ˌoʊvɚˈɑːl/","tổng thể, nhìn chung","Overall, it was a good year.","Nhìn chung, đó là một năm tốt đẹp."],["apart from","prep","/əˈpɑːrt frəm/","ngoài… ra","Apart from rice, we also grow corn.","Ngoài lúa, bọn mình còn trồng ngô."],["instead of","prep","/ɪnˈsted əv/","thay vì","I walk instead of taking the bus.","Mình đi bộ thay vì đi xe buýt."],["first of all","ph","/ˌfɝːst əv ˈɑːl/","trước hết","First of all, let me introduce myself.","Trước hết, để mình tự giới thiệu."],["after that","ph","/ˈæftɚ ðæt/","sau đó","We had lunch. After that, we went shopping.","Bọn mình ăn trưa. Sau đó đi mua sắm."],["eventually","adv","/ɪˈventʃuəli/","cuối cùng (sau một thời gian)","Eventually, she found a job she loved.","Cuối cùng cô ấy cũng tìm được công việc mình yêu thích."],["meanwhile","adv","/ˈmiːnwaɪl/","trong lúc đó","I cooked dinner. Meanwhile, my son did his homework.","Mình nấu cơm. Trong lúc đó, con trai mình làm bài tập."],["as soon as","conj","/æz ˈsuːn æz/","ngay khi","Call me as soon as you arrive.","Gọi cho mình ngay khi bạn đến nơi."],["until","conj","/ənˈtɪl/","cho đến khi","Wait here until I come back.","Đợi ở đây cho đến khi mình quay lại."],["I mean","ph","/aɪ ˈmiːn/","ý tôi là","It's far. I mean, it takes two hours to get there.","Xa lắm. Ý mình là mất hai tiếng mới tới."],["that's why","ph","/ˈðæts waɪ/","đó là lý do","I love the sea. That's why I live in Da Nang.","Mình mê biển. Đó là lý do mình sống ở Đà Nẵng."],["as long as","conj","/æz ˈlɑːŋ æz/","miễn là","You can borrow my bike as long as you return it.","Bạn có thể mượn xe miễn là trả lại."],["otherwise","adv","/ˈʌðɚwaɪz/","nếu không thì","Hurry up, otherwise we'll be late.","Nhanh lên, nếu không thì bọn mình sẽ trễ."]],
gr:{t:"Ôn tập ngữ pháp tuần (Ngày 25–30)",e:"Tuần này em đã học 6 điểm ngữ pháp. Đọc to từng công thức và câu ví dụ, rồi làm 12 câu ôn tập ở phần cuối. Câu nào sai, em mở lại ngày tương ứng để ôn nhé. Dùng thêm các <b>từ nối</b> hôm nay để ghép các ý thành câu dài, mạch lạc hơn.",f:["Mệnh đề quan hệ (25): who / which / that / where / whose → The teacher who taught me was very patient.","Quá khứ hoàn thành (26): had + V3 → When we arrived, the train had left.","used to / be used to / get used to (27) → I used to live in a village. Now I'm used to the noise.","So sánh nâng cao (28): much / far + so sánh hơn · the more…, the more… → The more you read, the better you write.","Suy đoán (29): must / might / can't (be) → He must be tired. That can't be true.","V-ing / to V đổi nghĩa (30): stop, remember, forget, try → Remember to call me. I remember meeting her."],s:[["Even though the tickets were expensive, the concert was worth every penny.","Mặc dù vé đắt, buổi hòa nhạc rất đáng tiền."],["I used to hate sports; however, now I'm used to jogging every morning.","Mình từng ghét thể thao; tuy nhiên giờ mình đã quen chạy bộ mỗi sáng."],["The more I practice, the more confident I feel. That's why I study every day.","Càng luyện mình càng tự tin. Đó là lý do mình học mỗi ngày."],["She must be very tired because she had worked all night.","Chắc hẳn cô ấy rất mệt vì đã làm việc cả đêm."]]},
col:[["make a comparison","so sánh","Let me make a comparison between the two phones."],["give a reason","đưa ra lý do","Always give a reason for your answer."],["give an example","đưa ra ví dụ","Can you give an example?"],["sum up","tóm lại","To sum up, I prefer city life."],["change the subject","đổi chủ đề","Sorry, can I change the subject?"],["get to the point","vào thẳng vấn đề","Please get to the point."]],
q:[["That's the girl ___ brother plays in a band.",["who","whose","which"],1,"Sở hữu → whose (Ngày 25)."],["When I got to the station, the train ___.",["left","had left","has left"],1,"Việc xảy ra trước → had + V3 (Ngày 26)."],["I'm not used to ___ up so early.",["get","getting","got"],1,"be used to + V-ing (Ngày 27)."],["The ___ you sleep, the more tired you feel.",["less","least","little"],0,"The + so sánh hơn…, the + so sánh hơn… (Ngày 28)."],["This phone is ___ cheaper than that one.",["very","far","most"],1,"Nhấn mạnh so sánh hơn: far / much (Ngày 28)."],["He's been running for hours. He ___ be exhausted.",["must","can't","mustn't"],0,"Suy đoán chắc chắn → must (Ngày 29)."],["She ___ be at home. Her car isn't there.",["must","can't","should"],1,"Chắc chắn không → can't (Ngày 29)."],["Don't forget ___ your passport!",["bringing","to bring","bring"],1,"Quên phải làm → forget + to V (Ngày 30)."],["I stopped ___ a coffee on my way to work.",["buying","to buy","buy"],1,"Dừng lại để làm việc khác → stop + to V (Ngày 30)."],["___ it was raining, they kept playing.",["Because","Even though","So that"],1,"Hai ý trái ngược → Even though."],["I study hard ___ I can pass the IELTS test.",["so that","even though","otherwise"],0,"Chỉ mục đích → so that."],["Từ nào kết thúc bằng âm /ŋ/?",["thin","thing","sun"],1,"thing /θɪŋ/."]]},

{t:"Phim ảnh & sách",goal:"Kể về bộ phim, cuốn sách yêu thích; dùng câu tường thuật để kể lại lời người khác.",
snd:{t:"Âm /ɔːr/ và /ɝː/ (giọng Mỹ)",tip:"/ɔːr/: tròn môi như “o” dài rồi cong lưỡi (short, born). /ɝː/: môi không tròn, miệng mở vừa như “ơ” rồi cong lưỡi (shirt, burn). Cả hai đều có âm r, chỉ khác hình dáng môi.",p:[["short","shirt"],["born","burn"],["ward","word"],["form","firm"],["torn","turn"],["cord","curd"]]},
voc:[["novel","n","/ˈnɑːvəl/","tiểu thuyết","I'm reading a novel about a small village.","Mình đang đọc một cuốn tiểu thuyết về một ngôi làng nhỏ."],["author","n","/ˈɑːθɚ/","tác giả","Who is the author of this book?","Tác giả cuốn sách này là ai?"],["character","n","/ˈkerəktɚ/","nhân vật","The main character is a young doctor.","Nhân vật chính là một bác sĩ trẻ."],["plot","n","/plɑːt/","cốt truyện","The plot is easy to follow.","Cốt truyện dễ theo dõi."],["ending","n","/ˈendɪŋ/","đoạn kết","I didn't expect that ending.","Mình không ngờ đoạn kết như vậy."],["director","n","/dəˈrektɚ/","đạo diễn","The director won an award for this film.","Đạo diễn đoạt giải nhờ bộ phim này."],["actor","n","/ˈæktɚ/","nam diễn viên","He is a famous actor.","Anh ấy là một nam diễn viên nổi tiếng."],["actress","n","/ˈæktrəs/","nữ diễn viên","The actress cried in every scene.","Nữ diễn viên khóc trong mọi cảnh."],["movie theater","n","/ˈmuːvi ˌθiːətɚ/","rạp chiếu phim","Let's meet at the movie theater at seven.","Bảy giờ gặp nhau ở rạp chiếu phim nhé."],["comedy","n","/ˈkɑːmədi/","phim hài","I need a comedy to cheer me up.","Mình cần một bộ phim hài cho vui lên."],["horror movie","n","/ˈhɔːrɚ ˌmuːvi/","phim kinh dị","I can't watch horror movies alone.","Mình không dám xem phim kinh dị một mình."],["documentary","n","/ˌdɑːkjəˈmentɚi/","phim tài liệu","We watched a documentary about the ocean.","Bọn mình xem một phim tài liệu về đại dương."],["cartoon","n","/kɑːrˈtuːn/","phim hoạt hình","My kids watch cartoons on Sunday mornings.","Các con mình xem hoạt hình vào sáng Chủ nhật."],["series","n","/ˈsɪriːz/","loạt phim, bộ phim nhiều tập","This series has five seasons.","Bộ phim này có năm phần."],["episode","n","/ˈepəsoʊd/","tập phim","I watched three episodes last night.","Tối qua mình xem ba tập."],["critic","n","/ˈkrɪtɪk/","nhà phê bình","The critics loved the new film.","Giới phê bình rất thích bộ phim mới."],["bestseller","n","/ˌbestˈselɚ/","sách bán chạy nhất","Her first book became a bestseller.","Cuốn sách đầu tay của cô ấy thành sách bán chạy."],["chapter","n","/ˈtʃæptɚ/","chương (sách)","I read one chapter before bed.","Mình đọc một chương trước khi ngủ."],["fiction","n","/ˈfɪkʃən/","truyện hư cấu","I prefer fiction to real stories.","Mình thích truyện hư cấu hơn chuyện có thật."],["biography","n","/baɪˈɑːɡrəfi/","tiểu sử","I'm reading a biography of a famous scientist.","Mình đang đọc tiểu sử một nhà khoa học nổi tiếng."],["scene","n","/siːn/","cảnh (phim)","The last scene made me cry.","Cảnh cuối làm mình khóc."],["subtitles","n","/ˈsʌbtaɪtəlz/","phụ đề","I watch movies with English subtitles.","Mình xem phim có phụ đề tiếng Anh."],["trailer","n","/ˈtreɪlɚ/","đoạn giới thiệu phim","The trailer looks amazing.","Đoạn giới thiệu trông tuyệt quá."],["scary","adj","/ˈskeri/","đáng sợ","The movie was so scary.","Bộ phim đáng sợ lắm."],["touching","adj","/ˈtʌtʃɪŋ/","cảm động","It's a touching story about a family.","Đó là một câu chuyện cảm động về một gia đình."],["realistic","adj","/ˌriːəˈlɪstɪk/","chân thực","The characters are very realistic.","Các nhân vật rất chân thực."],["romantic","adj","/roʊˈmæntɪk/","lãng mạn","We watched a romantic movie together.","Bọn mình cùng xem một bộ phim lãng mạn."],["say → said","v","/seɪ/ → /sed/","nói → đã nói","She said the book was boring.","Cô ấy nói cuốn sách chán."],["tell → told","v","/tel/ → /toʊld/","kể, bảo → đã bảo","He told me the ending was sad.","Anh ấy bảo mình là đoạn kết buồn."],["ask","v","/æsk/","hỏi","She asked me if I liked the film.","Cô ấy hỏi mình có thích bộ phim không."]],
gr:{t:"Câu tường thuật cơ bản",e:"Dùng khi <b>kể lại lời người khác</b>. Với said / told, em <b>lùi thì một bậc</b> và đổi đại từ, trạng từ cho phù hợp. Nhớ: <b>tell</b> luôn có người nghe phía sau (told me), còn <b>say</b> thì không cần (said that…).",f:["Hiện tại đơn → Quá khứ đơn: “I love this book.” → She said (that) she loved that book.","Hiện tại tiếp diễn → Quá khứ tiếp diễn: “I'm watching a movie.” → He said he was watching a movie.","will → would · can → could: “I will lend you the book.” → She told me she would lend me the book.","Đổi từ: now → then · today → that day · tomorrow → the next day · here → there","say (that) + mệnh đề · tell + người + (that) + mệnh đề → He told me the ending was sad."],s:[["My friend said the movie was really scary.","Bạn mình nói bộ phim rất đáng sợ."],["The teacher told us she would recommend a good novel.","Cô giáo nói với bọn mình là cô sẽ giới thiệu một cuốn tiểu thuyết hay."],["He said he was reading a biography of a famous scientist.","Anh ấy nói anh ấy đang đọc tiểu sử một nhà khoa học nổi tiếng."],["She told me she couldn't watch horror movies alone.","Cô ấy bảo mình là cô ấy không thể xem phim kinh dị một mình."]]},
col:[["watch a movie","xem phim","Let's watch a movie tonight."],["read a novel","đọc tiểu thuyết","I read a novel every month."],["be based on","dựa trên","The film is based on a famous book."],["play the main character","đóng vai chính","Who plays the main character?"],["a happy ending","kết thúc có hậu","I love movies with a happy ending."],["turn on the subtitles","bật phụ đề","I turn on the English subtitles to learn new words."]],
q:[["“I love this movie,” she said. → She said she ___ that movie.",["loves","loved","is loving"],1,"Lùi thì: love → loved."],["“I will call you,” he said. → He said he ___ call me.",["will","would","can"],1,"will → would."],["She ___ me that the book was boring.",["said","told","says"],1,"tell + người nghe → told me."],["“I'm reading,” Lan said. → Lan said she ___ reading.",["is","was","were"],1,"Hiện tại tiếp diễn → quá khứ tiếp diễn: was reading."],["Từ nào có âm /ɝː/?",["short","born","shirt"],2,"shirt /ʃɝːt/."],["Dòng chữ dịch hiện dưới màn hình phim gọi là…",["subtitles","trailer","chapter"],0,"subtitles = phụ đề."]]},

{t:"Tiền bạc & tiết kiệm",goal:"Nói về chi tiêu, tiết kiệm và vay mượn; phối hợp thì đúng trong câu có hai mệnh đề.",
snd:{t:"Âm /aɪ/ và /eɪ/",tip:"/aɪ/: mở miệng “a” rồi trượt lên “i” (buy, line). /eɪ/: bắt đầu từ “e” rồi trượt lên “i” (bay, lane). Đọc sai sẽ đổi nghĩa: buy (mua) ≠ bay (vịnh).",p:[["buy","bay"],["lie","lay"],["mine","main"],["line","lane"],["bike","bake"],["pie","pay"]]},
voc:[["income","n","/ˈɪnkʌm/","thu nhập","My monthly income is not very high.","Thu nhập hằng tháng của mình không cao lắm."],["expense","n","/ɪkˈspens/","khoản chi tiêu","Rent is my biggest expense.","Tiền nhà là khoản chi lớn nhất của mình."],["savings","n","/ˈseɪvɪŋz/","tiền tiết kiệm","I used my savings to buy a motorbike.","Mình dùng tiền tiết kiệm để mua xe máy."],["bank account","n","/ˈbæŋk əˌkaʊnt/","tài khoản ngân hàng","My salary goes into my bank account.","Lương mình được chuyển vào tài khoản ngân hàng."],["deposit","v","/dɪˈpɑːzɪt/","gửi (tiền vào ngân hàng)","I deposit some money every month.","Tháng nào mình cũng gửi một ít tiền."],["withdraw","v","/wɪðˈdrɑː/","rút (tiền)","I need to withdraw some cash.","Mình cần rút một ít tiền mặt."],["ATM","n","/ˌeɪ tiː ˈem/","cây rút tiền","Is there an ATM near here?","Gần đây có cây rút tiền không?"],["loan","n","/loʊn/","khoản vay","They got a loan to buy a house.","Họ vay tiền để mua nhà."],["debt","n","/det/","khoản nợ","He has no debt now.","Giờ anh ấy không còn nợ."],["borrow","v","/ˈbɑːroʊ/","mượn, vay","Can I borrow some money?","Mình mượn ít tiền được không?"],["lend","v","/lend/","cho mượn, cho vay","My brother lent me five million dong.","Anh mình cho mình vay năm triệu đồng."],["owe","v","/oʊ/","nợ","I owe you a coffee.","Mình nợ bạn một ly cà phê."],["interest","n","/ˈɪntrəst/","tiền lãi","The bank pays five percent interest.","Ngân hàng trả lãi năm phần trăm."],["insurance","n","/ɪnˈʃʊrəns/","bảo hiểm","Health insurance is very important.","Bảo hiểm y tế rất quan trọng."],["investment","n","/ɪnˈvestmənt/","khoản đầu tư","Learning English is a good investment.","Học tiếng Anh là một khoản đầu tư tốt."],["wealthy","adj","/ˈwelθi/","giàu có","They come from a wealthy family.","Họ xuất thân từ một gia đình giàu có."],["pocket money","n","/ˈpɑːkɪt ˌmʌni/","tiền tiêu vặt","I gave my son some pocket money.","Mình cho con trai ít tiền tiêu vặt."],["coin","n","/kɔɪn/","đồng xu","I keep coins in a jar.","Mình bỏ tiền xu vào một cái lọ."],["banknote","n","/ˈbæŋknoʊt/","tiền giấy","This banknote is very old.","Tờ tiền này rất cũ."],["piggy bank","n","/ˈpɪɡi bæŋk/","con lợn đất (ống tiết kiệm)","My daughter saves coins in her piggy bank.","Con gái mình bỏ xu vào lợn đất."],["financial","adj","/faɪˈnænʃəl/","thuộc về tài chính","They are having financial problems.","Họ đang gặp khó khăn tài chính."],["cost → cost","v","/kɑːst/ → /kɑːst/","có giá → đã có giá","How much did your phone cost?","Điện thoại của bạn giá bao nhiêu?"],["charity","n","/ˈtʃerəti/","tổ chức từ thiện; việc từ thiện","She gives money to charity every year.","Năm nào cô ấy cũng làm từ thiện."],["donate","v","/ˈdoʊneɪt/","quyên góp","We donated old clothes to poor families.","Bọn mình quyên góp quần áo cũ cho các gia đình nghèo."],["pay back","ph","/ˌpeɪ ˈbæk/","trả lại (tiền đã vay)","I'll pay you back next week.","Tuần sau mình sẽ trả lại bạn."],["transfer","v","/trænsˈfɝː/","chuyển (tiền)","Can you transfer the money to my account?","Bạn chuyển tiền vào tài khoản của mình được không?"],["e-wallet","n","/ˈiː ˌwɑːlɪt/","ví điện tử","I pay for coffee with my e-wallet.","Mình trả tiền cà phê bằng ví điện tử."],["cashless","adj","/ˈkæʃləs/","không dùng tiền mặt","Vietnam is becoming a cashless society.","Việt Nam đang dần trở thành xã hội không tiền mặt."],["tip","n","/tɪp/","tiền boa","We left a small tip for the waiter.","Bọn mình để lại ít tiền boa cho phục vụ."],["by the time","ph","/baɪ ðə ˈtaɪm/","vào lúc mà, trước khi","By the time I got paid, I had spent everything.","Đến lúc nhận lương thì mình đã tiêu hết sạch."]],
gr:{t:"Phối hợp thì",e:"Trong câu có hai mệnh đề, thì của hai vế phải <b>khớp về thời gian</b>. Quy tắc quan trọng nhất: sau <b>when, as soon as, before, after, until</b> mà nói về tương lai thì dùng <b>hiện tại đơn</b>, không dùng will. Khi kể chuyện quá khứ, giữ các vế ở thì quá khứ.",f:["Tương lai: will + V … when / as soon as / until + hiện tại đơn → I'll buy a car when I have enough money.","Quá khứ: QKĐ … when + QKĐ (hai việc nối tiếp) → When I got my salary, I paid the rent.","QKTD … when + QKĐ (việc đang làm bị xen ngang) → I was shopping when my card stopped working.","QKHT … before / by the time + QKĐ → By the time I got to the shop, it had closed.","Hiện tại hoàn thành … since + QKĐ → I have saved a lot since I started this job."],s:[["I'll pay you back as soon as I get my salary.","Mình sẽ trả lại bạn ngay khi nhận lương."],["By the time I was twenty-five, I had paid off all my debts.","Đến năm 25 tuổi, mình đã trả hết nợ."],["I have saved ten million dong since I started using a budget app.","Mình đã tiết kiệm được mười triệu đồng kể từ khi dùng ứng dụng quản lý chi tiêu."],["I was paying at the checkout when I realized I had left my wallet at home.","Mình đang thanh toán ở quầy thì nhận ra đã để quên ví ở nhà."]]},
col:[["open a bank account","mở tài khoản ngân hàng","I opened a bank account when I started work."],["take out a loan","vay tiền (ngân hàng)","They took out a loan to buy a house."],["pay off a debt","trả hết nợ","It took him three years to pay off his debt."],["save for a rainy day","tiết kiệm phòng khi khó khăn","My grandma always tells me to save for a rainy day."],["spend money on","tiêu tiền vào","I spend too much money on coffee."],["live within your means","sống trong khả năng tài chính","Try to live within your means."]],
q:[["I'll call you when I ___ home.",["will get","get","got"],1,"Sau when nói về tương lai → hiện tại đơn."],["By the time we arrived, the bank ___.",["closed","had closed","has closed"],1,"Xảy ra trước một mốc quá khứ → had + V3."],["I ___ a lot of money since I moved to Hanoi.",["spent","have spent","spend"],1,"since + mốc quá khứ → hiện tại hoàn thành."],["She was shopping when she ___ her old friend.",["meets","met","was meeting"],1,"Việc xen ngang → quá khứ đơn."],["Từ nào có âm /eɪ/?",["buy","pie","pay"],2,"pay /peɪ/."],["Số tiền em nợ người khác gọi là…",["debt","income","savings"],0,"debt = khoản nợ."]]},

{t:"Thời trang",goal:"Miêu tả cách ăn mặc và xu hướng thời trang; chia động từ đúng theo chủ ngữ.",
snd:{t:"Âm /m/ và /n/ cuối từ",tip:"Người Việt hay đọc lẫn âm cuối. /m/: hai môi khép lại ở cuối từ (some, team). /n/: môi mở, đầu lưỡi chạm nướu trên (sun, teen). Giữ khẩu hình đến hết từ để người nghe phân biệt được.",p:[["some","sun"],["team","teen"],["dime","dine"],["came","cane"],["gum","gun"],["seem","seen"]]},
voc:[["fashion","n","/ˈfæʃən/","thời trang","She works in the fashion industry.","Cô ấy làm trong ngành thời trang."],["fashionable","adj","/ˈfæʃənəbəl/","hợp thời trang","Her clothes are always fashionable.","Quần áo của cô ấy lúc nào cũng hợp mốt."],["trend","n","/trend/","xu hướng","This is the latest trend in Korea.","Đây là xu hướng mới nhất ở Hàn Quốc."],["trendy","adj","/ˈtrendi/","sành điệu, theo mốt","We went to a trendy café.","Bọn mình đến một quán cà phê sành điệu."],["style","n","/staɪl/","phong cách","I like her style.","Mình thích phong cách của cô ấy."],["stylish","adj","/ˈstaɪlɪʃ/","đẹp, có phong cách","He always looks stylish.","Anh ấy lúc nào trông cũng phong cách."],["outfit","n","/ˈaʊtfɪt/","bộ trang phục","I need a new outfit for the party.","Mình cần một bộ đồ mới cho bữa tiệc."],["jeans","n","/dʒiːnz/","quần bò, quần jeans","These jeans are too long.","Chiếc quần jeans này dài quá."],["T-shirt","n","/ˈtiː ʃɝːt/","áo phông","I wear a T-shirt when it's hot.","Mình mặc áo phông khi trời nóng."],["jacket","n","/ˈdʒækɪt/","áo khoác","Take a jacket. It's cold outside.","Mang áo khoác nhé. Ngoài trời lạnh."],["sweater","n","/ˈswetɚ/","áo len","My grandma knitted this sweater.","Bà mình đan chiếc áo len này."],["sneakers","n","/ˈsniːkɚz/","giày thể thao","I wear sneakers every day.","Ngày nào mình cũng đi giày thể thao."],["boots","n","/buːts/","giày bốt","She bought a pair of black boots.","Cô ấy mua một đôi bốt đen."],["scarf","n","/skɑːrf/","khăn quàng cổ","Wear a scarf in winter.","Mùa đông nhớ quàng khăn."],["belt","n","/belt/","thắt lưng","This belt is made of leather.","Chiếc thắt lưng này làm bằng da."],["jewelry","n","/ˈdʒuːəlri/","đồ trang sức","She doesn't wear much jewelry.","Cô ấy không đeo nhiều trang sức."],["earrings","n","/ˈɪrɪŋz/","bông tai","My mom gave me gold earrings.","Mẹ tặng mình đôi bông tai vàng."],["uniform","n","/ˈjuːnəfɔːrm/","đồng phục","Nurses wear a white uniform.","Y tá mặc đồng phục trắng."],["designer","n","/dɪˈzaɪnɚ/","nhà thiết kế","She wants to be a fashion designer.","Cô ấy muốn thành nhà thiết kế thời trang."],["suit","n","/suːt/","bộ com-lê","He wore a suit to the interview.","Anh ấy mặc com-lê đi phỏng vấn."],["go with","ph","/ˈɡoʊ wɪð/","hợp với, đi cùng","Does this bag go with my dress?","Cái túi này có hợp với váy của mình không?"],["loose","adj","/luːs/","rộng, thùng thình","I like loose clothes in summer.","Mùa hè mình thích mặc đồ rộng."],["tight","adj","/taɪt/","chật, bó","These shoes are too tight.","Đôi giày này chật quá."],["casual","adj","/ˈkæʒuəl/","thường ngày, thoải mái","I wear casual clothes on weekends.","Cuối tuần mình mặc đồ thường ngày."],["formal","adj","/ˈfɔːrməl/","trang trọng","You need formal clothes for the wedding.","Bạn cần mặc đồ trang trọng đi đám cưới."],["old-fashioned","adj","/ˌoʊldˈfæʃənd/","lỗi thời","My dad thinks my style is old-fashioned.","Bố mình nghĩ phong cách của mình lỗi thời."],["pattern","n","/ˈpætɚn/","họa tiết, hoa văn","I love this flower pattern.","Mình thích họa tiết hoa này."],["cotton","n","/ˈkɑːtən/","vải cotton, vải bông","Cotton shirts are cool in summer.","Áo cotton mặc mùa hè rất mát."],["try on","ph","/ˌtraɪ ˈɑːn/","mặc thử","Can I try on this dress?","Tôi mặc thử chiếc váy này được không?"],["dress up","ph","/ˌdres ˈʌp/","ăn mặc đẹp, diện","We dressed up for the party.","Bọn mình diện đồ đẹp đi dự tiệc."]],
gr:{t:"Hòa hợp chủ ngữ – động từ",e:"Động từ phải <b>hợp với chủ ngữ</b>: chủ ngữ số ít → động từ số ít (is, has, V-s); chủ ngữ số nhiều → động từ số nhiều (are, have, V). Bẫy hay gặp: danh từ luôn ở dạng số nhiều (jeans, clothes, glasses), các từ everyone / each, và cụm có giới từ chen giữa. Đây là lỗi bị trừ điểm nhiều trong IELTS Writing.",f:["Danh từ luôn số nhiều: jeans, trousers, clothes, glasses, shorts → My jeans are too tight.","a pair of + N số nhiều → động từ số ít: A pair of sneakers costs a lot.","everyone / everybody / each / every + N → động từ số ít: Everyone wears a uniform at my school.","Chủ ngữ + cụm giới từ: chia theo danh từ chính → The color of these shoes is beautiful.","The number of + N → số ít · A number of + N → số nhiều: The number of online shops is growing."],s:[["My new jeans are a bit too tight.","Chiếc quần jeans mới của mình hơi chật."],["Everyone in my office dresses casually on Fridays.","Thứ Sáu ai ở văn phòng mình cũng ăn mặc thoải mái."],["A pair of good boots lasts for years.","Một đôi bốt tốt dùng được nhiều năm."],["The number of people who buy clothes online is increasing.","Số người mua quần áo trên mạng đang tăng."]]},
col:[["follow fashion trends","chạy theo xu hướng thời trang","Young people often follow fashion trends."],["be in fashion","đang thịnh hành","Wide jeans are in fashion again."],["go out of fashion","lỗi mốt","Some styles never go out of fashion."],["a sense of style","gu thời trang","My sister has a great sense of style."],["dress code","quy định trang phục","The dress code at work is formal."],["look good on","hợp với ai, mặc lên đẹp","That color looks good on you."]],
q:[["My jeans ___ too long.",["is","are","be"],1,"jeans luôn số nhiều → are."],["Everyone ___ a uniform at my school.",["wear","wears","are wearing"],1,"Everyone → động từ số ít: wears."],["The color of these shoes ___ lovely.",["is","are","were"],0,"Danh từ chính là the color (số ít) → is."],["A pair of sneakers ___ about a million dong.",["cost","costs","are costing"],1,"a pair of + N → động từ số ít."],["Từ nào kết thúc bằng âm /m/?",["teen","seen","team"],2,"team /tiːm/."],["“Mặc thử” quần áo là…",["try on","dress up","go with"],0,"try on = mặc thử."]]}

  <div class="meta"><span class="pill">${fd(p.a)} → ${p.b?fd(p.b):"ngày thi"}</span><span class="pill">${esc(p.d)}</span><span class="pill">${esc(p.lv)}</span><span class="pill">${esc(p.tm)}</span></div>
  <p style="margin:0">${esc(p.goal)}</p><dl>${p.f.map(f=>`<dt>${esc(f[0])}</dt><dd>${esc(f[1])}</dd>`).join("")}</dl>
  <div class="ms"><b>Cột mốc (${dn}/${p.ms.length})</b>${p.ms.map((m,j)=>`<label><input type="checkbox" id="ms-${k}-${j}" data-ms="${k}-${j}" ${S.ms[k+"-"+j]?"checked":""}><span>${esc(m)}</span></label>`).join("")}</div></div>`}).join("")}
  <div class="card"><b>Tài liệu dùng xuyên suốt</b><ul style="margin:6px 0 0;padding-left:20px"><li>App này (10 ngày nền tảng) và bài cô gửi mỗi tối</li><li>Sách <i>Sơ đồ tư duy ngữ pháp tiếng Anh</i> (HALO) — ngữ pháp và phát âm</li><li><i>1000 English Collocations</i> — cụm từ tự nhiên cho Speaking và Writing</li><li>BBC Learning English · 6 Minute English — luyện nghe hằng ngày</li><li>Bộ <i>Cambridge IELTS</i> 15–19 — đề thi chính thức để luyện từ giai đoạn 3</li></ul></div>`;
}
function hero(){
  const PH=phases();
  const t=new Date(),now=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  const N=Math.max(1,Math.round((now-pd(START()))/864e5)+1);
  const ex=pd(/^\d{4}-\d{2}-\d{2}$/.test(S.exam||"")?S.exam:"2027-06-15");const left=Math.max(0,Math.round((ex-now)/864e5));
  const ph=PH.findIndex(p=>!p.skip&&now>=pd(p.a)&&now<=(p.b?pd(p.b):ex));const nx=D.findIndex((d,i)=>!S.done.includes(i));
  const h=t.getHours(),hi=h<11?"Chào buổi sáng":h<14?"Chào buổi trưa":h<18?"Chào buổi chiều":"Chào buổi tối";
  $("#hero").innerHTML=`<div style="position:relative;z-index:1"><div class="eb">${ph>=0?"Giai đoạn "+(ph+1)+" · "+esc(PH[ph].n):"Lộ trình IELTS"}</div><h1>${hi}, em! Hôm nay mình học ngày ${N} nhé.</h1><p>${nx>=0?"Bài tiếp theo trong app: <b>Ngày "+(nx+1)+" · "+esc(D[nx].t)+"</b>. Mỗi bài có 30 từ mới và 10 phút shadowing.":"Em đã học xong 10 bài trong app. Học tiếp theo bài cô gửi mỗi tối nhé!"}</p><div class="row" style="gap:8px"><button class="go" id="heroGo">${nx>=0?"Học tiếp Ngày "+(nx+1)+" →":"Xem lộ trình →"}</button><button class="go ghost" id="heroSh">🎧 Shadowing hôm nay</button></div></div>
  <div class="stats"><div class="stat"><div class="sv">${N}</div><div class="sl">ngày học</div></div><div class="stat"><div class="sv">${S.done.length}/${D.length}</div><div class="sl">bài trong app đã xong</div></div><div class="stat"><div class="sv">${left}</div><div class="sl">ngày đến kỳ thi</div></div></div>`;
  $("#heroSh").onclick=()=>{S.view="lesson";go(nx>=0?nx:S.day,SECS.findIndex(x=>x[0]==="sh"))};
  $("#heroGo").onclick=()=>{if(nx>=0){S.view="lesson";go(nx,0);document.querySelector("#lesson").scrollIntoView()}else{S.view="road";save();render()}};
}
document.addEventListener("click",e=>{const b=e.target.closest("#lv [data-go],#vocab [data-go]");if(!b)return;S.view=b.dataset.go;if(S.view==="grammar")S.grP=b.closest("#vocab")?GR.findIndex(p=>p.t.startsWith("Bổ trợ")):null;save();render();scrollTo({top:0})});
function render(){
  const VIEWS=["home","lesson","shlib","flash","road","ipa","lv","test","vocab","grammar","dict","pic","num","slang","write","speak"];const v=VIEWS.includes(S.view)?S.view:"home";S.view=v;
  ["home","lv","ipa","shlib","road","flash","test","vocab","grammar","dict","pic","num","slang","write","speak"].forEach(id=>$("#"+id).hidden=v!==id);
  $("#lesson").hidden=v!=="lesson";$("#days").hidden=v!=="lesson";$("#prog").hidden=v!=="lesson";
  if(v!=="shlib")$("#shlib").innerHTML="";if(v!=="lesson")$("#sec").innerHTML="";
  const tabOf={home:"vHome",lesson:"vLesson",shlib:"vSh",flash:"vFlash",road:"vRoad",ipa:"vHome",lv:"vHome",test:"vHome",vocab:"vFlash",grammar:"vLesson",dict:"vSh",pic:"vFlash",num:"vHome",slang:"vFlash",write:"vLesson",speak:"vSh"};
  document.querySelectorAll(".tabbar button").forEach(b=>{b.classList.toggle("on",b.id===tabOf[v]);b.setAttribute("aria-current",b.id===tabOf[v]?"page":"false")});
  xpChip();shStop();
  if(v==="home"){renderHome();return}
  if(v==="road"){renderRoad();bind();return}
  if(v==="lv"){renderLv();return}
  if(v==="ipa"){renderIpa();return}
  if(v==="shlib"){renderShLib();return}
  if(v==="flash"){renderFlash();return}
  if(v==="test"){renderTest();return}
  if(v==="vocab"){renderVocab();return}
  if(v==="grammar"){renderGrammar();return}
  if(v==="dict"){renderDict();return}
  if(v==="pic"){renderPic();return}
  if(v==="num"){renderNum();return}
  if(v==="slang"){renderSlang();return}
  if(v==="write"){renderWrite();return}
  if(v==="speak"){renderSpeak();return}
  const d=D[S.day];
  $("#title").textContent=`Ngày ${S.day+1} · ${d.t}`;$("#goal").textContent="Mục tiêu: "+d.goal;
  days();tt();
  $("#sec").innerHTML=R[SECS[S.sec][0]](d,S.day);
  $("#prev").disabled=S.day===0&&S.sec===0;
  $("#next").textContent=S.sec===SECS.length-1?"Ngày tiếp →":"Phần tiếp →";
  resetTimer();bind();
}
let tm=null,left=0;
function resetTimer(){clearInterval(tm);tm=null;left=SECS[S.sec][2]*60;showT();$("#tbtn").textContent="Bắt đầu hẹn giờ";$("#tlabel").textContent=`Phần ${S.sec+1}/${SECS.length}: ${SECS[S.sec][1]}`}
function showT(){$("#clock").textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0")}
function markSec(){const k=S.day+"";S.secDone[k]=S.secDone[k]||[];if(!S.secDone[k].includes(S.sec)){S.secDone[k].push(S.sec);addXp(10)}save();tt()}
$("#tbtn").onclick=()=>{
  if(tm){clearInterval(tm);tm=null;$("#tbtn").textContent="Tiếp tục";return}
  $("#tbtn").textContent="Tạm dừng";
  tm=setInterval(()=>{left--;showT();if(left<=0){clearInterval(tm);tm=null;markSec();toast("Hết giờ phần này! Bấm “Phần tiếp” để học tiếp.");$("#tbtn").textContent="Xong ✓"}},1000);
};
function go(day,sec){S.day=day;S.sec=sec;save();render();const b=document.querySelector("#days .on");if(b){const st=b.parentNode;st.scrollLeft=b.offsetLeft-st.clientWidth/2+b.clientWidth/2}const L=document.querySelector("#lesson");if(L&&!L.hidden)L.scrollIntoView()}
$("#next").onclick=()=>{markSec();if(S.sec<SECS.length-1)go(S.day,S.sec+1);else if(S.day<D.length-1)go(S.day+1,0);else toast("Em đã học hết 10 ngày! Cô sẽ gửi thêm bài mới.")};
$("#prev").onclick=()=>{if(S.sec>0)go(S.day,S.sec-1);else if(S.day>0)go(S.day-1,SECS.length-1)};
$("#days").onclick=e=>{const b=e.target.closest("[data-day]");if(b){S.view="lesson";go(+b.dataset.day,0)}};
$("#vLesson").onclick=()=>{S.view="lesson";save();render();scrollTo({top:0})};
$("#vHome").onclick=$("#brandHome").onclick=()=>{S.view="home";save();render();scrollTo({top:0})};
$("#vFlash").onclick=()=>{tvQ=null;S.view="vocab";save();render();scrollTo({top:0})};
$("#vRoad").onclick=()=>{S.view="road";save();render();scrollTo({top:0})};
const SHI=SECS.findIndex(x=>x[0]==="sh");
$("#vSh").onclick=()=>{S.view="shlib";save();render();scrollTo({top:0})};
$("#vIpa").onclick=()=>{S.view="ipa";save();render();scrollTo({top:0})};
$("#vLv").onclick=()=>{S.view="lv";save();render();scrollTo({top:0})};
$("#tt").onclick=e=>{const b=e.target.closest("[data-sec]");if(b)go(S.day,+b.dataset.sec)};
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-say]");if(b){speak(b.dataset.say);return}
  const m=e.target.closest(".hide .mean");if(m)m.style.filter="none";
});
let unsubs=[];const onF=h=>unsubs.push(DIC.onFinal(h)),onSt=h=>unsubs.push(DIC.onState(h));
function bind(){
  unsubs.forEach(f=>{try{f()}catch(e){}});unsubs=[];
  const d=D[S.day];
  document.querySelectorAll("[data-retest]").forEach(b=>b.onclick=()=>{S.view="test";save();render();scrollTo({top:0})});
  const exI=$("#exam");if(exI)exI.onchange=()=>{if(/^\d{4}-\d{2}-\d{2}$/.test(exI.value)){S.exam=exI.value;if(S.prof)S.prof.exam=exI.value;save();render()}};
  document.querySelectorAll("[data-ms]").forEach(c=>c.onchange=()=>{S.ms[c.dataset.ms]=c.checked;save();renderRoad();bind()});
  const rs=$("#shRate");if(rs)rs.onclick=e=>{const b=e.target.closest("[data-r]");if(!b)return;S.shRate=+b.dataset.r;save();rs.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b))};
  const sa=$("#shAuto");if(sa)sa.onclick=()=>{if(sa.textContent.startsWith("■"))shStop();else shAuto()};
  const sall=$("#shAll");if(sall)sall.onclick=()=>{shStop();sayP(CURSH.map(l=>plain(l[0])).join(". "),S.shRate).catch(()=>{})};
  document.querySelectorAll("[data-shk]").forEach(b=>b.onclick=()=>{shStop();sayP(plain(CURSH[+b.dataset.shk][0]),S.shRate).catch(()=>{})});
  if(DIC&&document.querySelector("[data-mick]")){let k=-1,txt="";
    onF(({text})=>{if(k<0)return;txt+=" "+text;const c=document.querySelector('.shc[data-k="'+k+'"] .st');if(!c)return;const a=plain(CURSH[k][0]).toLowerCase().replace(/[^a-z' ]/g,"").split(/\s+/).filter(Boolean),h=txt.toLowerCase().replace(/[^a-z' ]/g,"").split(/\s+/);const pc=Math.round(a.filter(w=>h.includes(w)).length/a.length*100);c.textContent=`Cô nghe: “${txt.trim()}” — khớp ${pc}%`+(pc>=80?" 👏":" · thử lại nhé")});
    onSt(({state})=>{document.querySelectorAll("[data-mick]").forEach(b=>b.textContent=(state==="listening"&&+b.dataset.mick===k)?"■ Dừng":"🎤 Nói thử")});
    document.querySelectorAll("[data-mick]").forEach(b=>b.onclick=()=>{if(b.textContent.startsWith("■")){DIC.stop().catch(()=>{});return}k=+b.dataset.mick;txt="";DIC.start().catch(err=>{if(err&&err.code==="not_granted")document.querySelectorAll("[data-mick]").forEach(x=>x.remove())})});
  }
  const f=$("#flip");if(f)f.onclick=()=>{S.hide=!S.hide;save();render()};
  const vf=$("#vf");if(vf)vf.onclick=e=>{const b=e.target.closest("[data-vf]");if(!b)return;S.vf=b.dataset.vf;save();render()};
  const n=$("#notes");if(n)n.oninput=()=>{S.notes[S.day]=n.value;save()};
  const pl=$("#play");
  if(pl){let cur=null;pl.onclick=()=>{const p=d.snd.p[Math.floor(Math.random()*d.snd.p.length)];const k=Math.random()<.5?0:1;cur=p[k];speak(cur);$("#gres").textContent="";$("#gopts").innerHTML=p.map(w=>`<button data-g="${esc(w)}">${esc(w)}${pipa(w)}</button>`).join("");$("#gopts").onclick=e=>{const g=e.target.closest("[data-g]");if(!g)return;const ok=g.dataset.g===cur;g.classList.add(ok?"right":"wrong");$("#gres").textContent=ok?"Chính xác! Bấm Phát để chơi tiếp.":"Chưa đúng — từ vừa đọc là “"+cur+"”. Nghe lại nhé.";if(!ok)speak(cur)}}}
  const mic=$("#mic");
  if(mic&&DIC){let txt="";const tgt=d.gr.s[0][0];
    onF(({text})=>{txt+=" "+text;const a=tgt.toLowerCase().replace(/[^a-z' ]/g,"").split(/\s+/).filter(Boolean),h=txt.toLowerCase().replace(/[^a-z' ]/g,"").split(/\s+/);const hit=a.filter(w=>h.includes(w)).length;const pc=Math.round(hit/a.length*100);$("#heard").textContent=`Cô nghe: “${txt.trim()}” — khớp ${pc}%`+(pc>=80?" 👏":" · thử lại chậm hơn nhé")});
    onSt(({state})=>{mic.textContent=state==="listening"?"■ Dừng":"🎤 Bấm và nói"});
    mic.onclick=()=>{if(mic.textContent.startsWith("■")){DIC.stop().catch(()=>{});return}txt="";DIC.start().catch(err=>{if(err&&err.code==="not_granted")mic.remove()})};
  }
  document.querySelectorAll(".q").forEach(q=>{q.onclick=e=>{const b=e.target.closest("[data-o]");if(!b||q.dataset.a)return;const k=+q.dataset.q,qq=d.q[k],j=+b.dataset.o;q.dataset.a=j===qq[2]?"1":"0";if(j===qq[2])addXp(5);q.querySelectorAll("[data-o]")[qq[2]].classList.add("right");if(j!==qq[2])b.classList.add("wrong");q.querySelector(".exp").textContent=(j===qq[2]?"✓ Đúng! ":"✗ Chưa đúng. ")+qq[3];const all=[...document.querySelectorAll(".q")];const got=all.filter(x=>x.dataset.a==="1").length;if(all.every(x=>x.dataset.a)){S.scores[S.day]=got;save();$("#score").textContent=`Điểm: ${got}/${all.length} `+(got===all.length?"— Xuất sắc!":got>=4?"— Tốt lắm!":"— Ôn lại phần ngữ pháp nhé")}else $("#score").textContent=`Điểm: ${got}/${all.length}`}});
  const fin=$("#finish");if(fin)fin.onclick=()=>{if(!S.done.includes(S.day)){S.done.push(S.day);addXp(30)}markSec();save();toast("Tuyệt vời! Em đã xong ngày "+(S.day+1)+". Mai học tiếp nhé!");if(S.day<D.length-1)setTimeout(()=>go(S.day+1,0),1200);else render()};
}
if(S.day>=D.length)S.day=0;if(S.sec>=SECS.length)S.sec=0;if(!S.ms)S.ms={};S.act=S.act||{};S.shp=S.shp||{};S.fk=S.fk||{};S.xp=S.xp||0;S.view="home";
render();
}
</script>

<script>
{
/* Bài tối: thêm bài mới vào đầu danh sách EVE */
const EVE=[

];
const css=document.createElement("style");
css.textContent=".eve .evl{display:grid;gap:10px;margin-top:12px}.eve a{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);border:1.5px solid var(--grid);background:var(--paper);border-radius:18px;padding:14px 16px;min-height:64px}.eve a:hover{border-color:var(--line)}.eve .en{width:48px;height:48px;flex:none;border-radius:14px;background:var(--red-soft);color:var(--red);display:grid;place-items:center;font:800 13px/1.1 var(--f-head);text-align:center}.eve .en b{font-size:19px;display:block;color:var(--red)}.eve .et b{display:block;font:700 16px/1.3 var(--f-head)}.eve .et small{color:var(--mut);font-size:13px}.eve .go2{margin-left:auto;color:var(--blue);font-weight:700;white-space:nowrap}";
document.head.appendChild(css);
const html=()=>'<p class="eyebrow">Bài tối</p><h3 class="ph3">Bài cô gửi mỗi tối</h3><p class="sub">Bài giao tiếp 60 phút theo giáo trình A1–A2. Bấm vào bài để mở.</p><div class="evl">'+EVE.map(e=>'<a href="'+e.u+'" target="_blank" rel="noopener"><span class="en">Ngày<b>'+e.d+'</b></span><span class="et"><b>'+e.t+'</b><small>'+e.s+'</small></span><span class="go2">Mở →</span></a>').join('')+'</div>';
